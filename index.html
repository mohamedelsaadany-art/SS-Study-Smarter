RADIAL PULSE\n130/min\nAPICAL PULSE\n150/min\nRHYTHM\nIrregular\n• DIAGNOSTIC KEYWORDS\nPalpitation with BP 220/110 + radial\n130 but apical 150 = a pulse deficit\nof 20 + irregular rhythm\nATRIAL FIBRILLATION\n• REVISE\nCardiovascular System → Disorders of\nCardiac Rhythm · Hypertension\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 39\nPALPITATION + BP 220/110 WITH A PULSE\nDEFICIT\nCASE 39\nPulse deficit\nRate versus rhythm control\nCHA₂DS₂-VASc scoring\nAtrial flutter — regular, no pulse deficit\nMultiple ectopics — would not sustain a\ndeficit of 20\nVentricular tachycardia — regular and\nbroad complex\nWhat is the diagnosis, and why?\nWHY\n1\nAtrial fibrillation\nApical 150 but radial only 130 — a pulse deficit →\nbeats too weak to reach the wrist = atrial fibrillation\nIrregular rhythm → irregularly irregular, with no P\nwaves\nBP 220/110 → long-standing hypertension is the\nsubstrate for atrial stretch\nConscious and lying flat → haemodynamically stable,\nso no emergency cardioversion\n2 What further investigations?\nECG\nEchocardiography — transthoracic and\ntransoesophageal\nElectrolytes and thyroid function tests\n3 Plan of management in this emergency?\nControl the blood pressure\nThen either rate or rhythm control, after checking the\ntransoesophageal echo for intracardiac thrombus\n4 Further plan after stabilization?\nRate and rhythm control medication\nCalculate the CHA₂DS₂-VASc score for the decision on\nanticoagulation\nHere the score is 1 (hypertension only) →\nanticoagulation is considered but not recommended\nC congestive heart failure · H hypertension · A₂ age ≥75 ·\nD diabetes · S₂ prior stroke, TIA or embolism · V vascular\ndisease · A age 65–74 · Sc sex category (female)", "questions": ["What is the diagnosis, and why?", "What further investigations?", "Plan of management in this emergency?", "Further plan after stabilization?"], "topic": "c6", "sys": "CARD"}, {"id": "c5", "kw": "Sudden fast palpitation with dyspnea + ECG supraventricular tachycardia + BP 80/50", "dx": "Supraventricular tachycardia with haemodynamic instability", "case": 23, "sheet": "Cardiology · DEPBOOK CASE 29\n• CASE\nA 45-year-old male presented with\nshortness of breath and fast palpitation\nthat developed suddenly one hour prior\nto presentation.\nOn examination BP was 80/50. ECG\nrevealed supraventricular tachycardia,\nfor which he received intravenous\nadenosine and a rhythm strip was\nrecorded from lead V2.\nBLOOD\nPRESSURE\n80/50\nONSET\nSudden, 1\nhour ago\nECG\nSupraventricular\ntachycardia\n• DIAGNOSTIC KEYWORDS\nSudden fast palpitation with dyspnea\n+ ECG supraventricular tachycardia\n+ BP 80/50\nSUPRAVENTRICULAR\nTACHYCARDIA WITH\nHAEMODYNAMIC INSTABILITY\n• REVISE\nCardiovascular System → Disorders of\nCardiac Rhythm\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Cardiology Cases Page 23\nSUDDEN FAST PALPITATION + HYPOTENSION CASE 23\nSupraventricular tachycardia\nVagal manoeuvres\nAdenosine and verapamil\nWhat is the diagnosis, and why?\nWHY\n1\nSupraventricular tachycardia, haemodynamically\nunstable\nFast palpitation of sudden onset one hour ago → a\nparoxysmal arrhythmia\nECG shows supraventricular tachycardia → the circuit\nis above the ventricles\nBP 80/50 → haemodynamically unstable\nShortness of breath with the palpitation → the rate is\nalready compromising cardiac output\n2 Role of carotid sinus massage as first aid?\nCarotid sinus massage is always the first aid procedure\nfor patients with SVT, but its role is variable\n3 Acute management of this case?\nHaemodynamically unstable → synchronized DC\ncardioversion\nStable → IV adenosine 6 mg bolus; repeat after 2\nminutes up to 12 mg, and a further 12 mg dose after\nanother 2 minutes\nAdenosine failed or contraindicated, as in bronchial\nasthma → IV verapamil\n4 Three possible causes for this rapid palpitation?\nIschemic heart disease · cardiomyopathy ·\nthyrotoxicosis\n5 First choice drug for maintenance therapy?\nCalcium channel blockers — verapamil, diltiazem\nAtrial fibrillation — irregular, no clear circuit\nVentricular tachycardia — broad complex\nSinus tachycardia — gradual onset, no sudden start", "questions": ["What is the diagnosis, and why?", "Role of carotid sinus massage as first aid?", "Acute management of this case?", "Three possible causes for this rapid palpitation?", "First choice drug for maintenance therapy?"], "topic": "c6", "sys": "CARD"}, {"id": "c6", "kw": "Sudden palpitations and fluttering + pulse 195/min + narrow complex tachycardia with absent P wave + BP 90/60", "dx": "Paroxysmal supraventricular tachycardia (AV nodal re-entry)", "case": 24, "sheet": "Cardiology · DEPBOOK CASE 30\n• CASE\nA 28-year-old previously healthy female\nis brought to the emergency department\ncomplaining of sudden onset of\npalpitations and a \"fluttering\" sensation\nin her chest. She quickly became short of\nbreath and light-headed.\nExamination: temperature 37.0°C, pulse\nrate 195/min, respiratory rate 20/min,\nblood pressure 90/60 mm Hg. Lungs\nunremarkable; cardiac examination\nsignificant only for tachycardia. Her\nelectrocardiogram revealed narrow\ncomplex tachycardia with absent P\nwave.\nTEMPERATURE\n37.0°C\nPULSE\n195/min\nRESP. RATE\n20/min\nBLOOD PRESSURE\n90/60\n• DIAGNOSTIC KEYWORDS\nSudden palpitations and fluttering +\npulse 195/min + narrow complex\ntachycardia with absent P wave +\nBP 90/60\nPAROXYSMAL\nSUPRAVENTRICULAR\nTACHYCARDIA (AV NODAL RE-ENTRY)\n• REVISE\nCardiovascular System → Disorders of\nCardiac Rhythm\n• ANSWER\nStudy Smarter Cardiology Cases Page 24\nSUDDEN PALPITATIONS + NARROW COMPLEX\nTACHYCARDIA\nCASE 24\nAV nodal re-entry tachycardia\nPre-excitation and WPW\nRadiofrequency ablation\nWhat is the diagnosis, and why?\nWHY\n1\nParoxysmal supraventricular tachycardia (PSVT)\nHeart rate between 160 and 250/min, with sudden\nonset and offset, hypotension and syncope; some\npatients are asymptomatic\nSudden onset palpitations and fluttering →\nparoxysmal onset, not gradual\nPulse 195/min → within the 160–250/min range of PSVT\nNarrow complex with absent P wave →\nsupraventricular origin, AV nodal re-entry\nBP 90/60 and light-headed → the rate is too fast for\nadequate ventricular filling\n2 Epidemiology of this condition?\nAV nodal re-entry tachycardia (AVNRT) commonly\npresents in the third or fourth decade of life, in patients\nwithout underlying heart disease\nSeventy percent of patients are women\n3 Pathogenesis?\nThe AV node is divided into two pathways with differing\nconduction speeds and refractory periods\nA timed atrial complex is blocked in one pathway and\nconducted down the other to the ventricles; as it goes,\nthe blocked pathway recovers, so the impulse travels\nback up to the atria — the reentrant circuit\nThe circuit may instead use an accessory pathway —\nshort PR with a slurred QRS upstroke is WPW\nsyndrome\n4 Treatment of her condition?\nControl of the attack will eventually correct her blood\npressure\nStop the attack — Valsalva and carotid massage\nPharmacologic — IV verapamil, a beta-blocker, class Ia\n(quinidine, disopyramide)\nRadiofrequency ablation when medical treatment is not\ntolerated, or with high-risk features — accessory\npathway refractory period <250 ms, multiple pathways\nPrevention — reassurance, avoid stimulants, continuous\nverapamil or beta-blockers", "questions": ["What is the diagnosis, and why?", "Epidemiology of this condition?", "Pathogenesis?", "Treatment of her condition?"], "topic": "c6", "sys": "CARD"}, {"id": "c7", "kw": "Recurrent palpitation lasting 10–60 min, terminating spontaneously + normal between attacks + Holter narrow QRS 150/min with short PR after a premature atrial impulse", "dx": "Paroxysmal supraventricular tachycardia — AV nodal reentrant tachycardia", "case": 25, "sheet": "Cardiology · DEPBOOK CASE 31\n• CASE\nA 28-year-old woman presents with\nrecurrent attacks of palpitation,\nassociated with dizziness, chest pain and\nnear syncope. The attacks last 10 to 60\nminutes and terminate spontaneously. In\nbetween the attacks she was completely\nnormal.\nOn examination, cardiac, chest and\nabdomen are normal. Resting ECG and\nechocardiography are normal, while\nHolter ECG shows regular narrow QRS\ntachyarrhythmia 150 beat/min, short P-R\ninterval, preceded by a premature atrial\nimpulse.\nATTACK\nDURATION\n10 – 60\nmin\nBETWEEN\nATTACKS\nCompletely\nnormal\nHOLTER\nNarrow\nQRS,\n150/min\n• DIAGNOSTIC KEYWORDS\nRecurrent palpitation lasting 10–60\nmin, terminating spontaneously +\nnormal between attacks + Holter\nnarrow QRS 150/min with short PR\nafter a premature atrial impulse\nPAROXYSMAL\nSUPRAVENTRICULAR\nTACHYCARDIA — AV NODAL\nREENTRANT TACHYCARDIA\n• REVISE\nCardiovascular System → Disorders of\nCardiac Rhythm\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Cardiology Cases Page 25\nRECURRENT SELF-TERMINATING PALPITATION CASE 25\nParoxysmal SVT\nHolter monitoring\nRadiofrequency catheter ablation\nWhat is the diagnosis, and why?\nWHY\n1\nParoxysmal supraventricular tachycardia, AV nodal\nreentrant tachycardia\nAVNRT may occur in healthy young individuals, and\noccurs most commonly in women\nAttacks last 10–60 min and terminate spontaneously\n→ paroxysmal, self-limiting arrhythmia\nCompletely normal between attacks, normal resting\nECG and echo → no structural heart disease\nRegular narrow QRS at 150/min with a short PR\ninterval → AV nodal reentry\nPreceded by a premature atrial impulse → the trigger\nthat sets up the reentrant circuit\nHow to manage this condition?\nACUTE ATTACK\nDEFINITIVE\n2\nCalcium channel blockers — verapamil, diltiazem\nor beta-blockers — metoprolol, esmolol\nElectrophysiologic studies are generally performed in\ncombination with radiofrequency catheter ablation\nConsider ablation for any patient with symptomatic\nPSVT in whom long-term medical treatment is not\neffectively tolerated or desired\nRadiofrequency catheter ablation is more than 90%\neffective in curing paroxysmal supraventricular\ntachycardia\nAtrial fibrillation — irregular, not regular narrow QRS\nAnxiety or panic attack — no arrhythmia on Holter\nPhaeochromocytoma — sustained hypertension, sweating,\nheadache", "questions": ["What is the diagnosis, and why?", "How to manage this condition?"], "topic": "c6", "sys": "CARD"}, {"id": "c8", "kw": "Cardiac arrest in a young athlete + ventricular fibrillation + structurally normal heart on echo + no previous history", "dx": "Ventricular fibrillation arrest in an athlete with a structurally normal heart", "case": 29, "sheet": "Cardiology · DEPBOOK CASE 35\n• CASE\nA 22-year-old athletic man was admitted\ndirectly to ICU after suffering a cardiac\narrest at a local gym. Fortunately,\nautomated defibrillation had been\navailable. The defibrillator had diagnosed\nventricular fibrillation and had\nadministered a DC shock.\nThe patient was not known to have any\nprevious medical history and had been\nwell recently. Trans-thoracic\nechocardiography in ICU showed a\nstructurally normal heart but with\ndepressed systolic function, presumed\nconsequent upon the arrest.\nRHYTHM\nVentricular\nfibrillation\nTREATMENT\nDC shock\nECHO\nStructurally\nnormal\n• DIAGNOSTIC KEYWORDS\nCardiac arrest in a young athlete +\nventricular fibrillation + structurally\nnormal heart on echo + no previous\nhistory\nVENTRICULAR FIBRILLATION\nARREST IN AN ATHLETE WITH A\nSTRUCTURALLY NORMAL HEART\n• REVISE\nCardiovascular System → Cardiac Muscle\nDisease · Disorders of Cardiac Rhythm\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 29\nCARDIAC ARREST IN A YOUNG ATHLETE CASE 29\nSudden cardiac death in the young\nHypertrophic cardiomyopathy\nPre-participation screening\nAthlete's heart — asymptomatic\nphysiological change, not a cause of\narrest\nCommotio cordis — needs a blow to the\nchest\nWhat is the diagnosis, and why?\nWHY\n1\nVentricular fibrillation cardiac arrest in an athlete with\na structurally normal heart\nAthlete's heart is a constellation of structural and\nfunctional changes in people who train >1 h most days.\nThe changes are asymptomatic; signs include\nbradycardia, a systolic murmur and extra heart sounds\nCardiac arrest during exercise in a young man →\npoints to an inherited or electrical cause\nRhythm was ventricular fibrillation → a primary\narrhythmic event\nEcho shows a structurally normal heart → favours an\nelectrical cause over cardiomyopathy\nDepressed systolic function → presumed consequent\nupon the arrest itself, not the cause\n2 Probable causes of cardiac arrest in this athletic man?\nHypertrophic cardiomyopathy\nWolff-Parkinson-White syndrome\nCoronary artery anomalies · myocarditis\nArrhythmogenic right ventricular dysplasia · Marfan\nsyndrome\nBrugada syndrome — sudden death with an ECG\npattern of incomplete right bundle branch block and ST\nelevations in the anterior precordial leads\nDrug-induced arrhythmias or stimulant use — pre-workout supplements, anabolic steroids, recreational\ndrugs\nHow to screen a young athlete starting a sporting career?\nHISTORY\nEXAMINATION AND TESTS\n3\nExcessive unexpected fatigue, shortness of breath, near\nsyncope or chest pain with exercise\nFamily history of sudden cardiovascular arrest,\nhypertrophic cardiomyopathy, Marfan syndrome; drug\nhistory — drugs predisposing to long QT\nBP and cardiac auscultation supine and standing;\nstigmata of Marfan syndrome\nSelected testing — ECG, Holter, stress ECG,\nechocardiography", "questions": ["What is the diagnosis, and why?", "Probable causes of cardiac arrest in this athletic man?", "How to screen a young athlete starting a sporting career?"], "topic": "c12", "sys": "CARD"}, {"id": "c9", "kw": "Sore throat 2 weeks before + migratory joint pain + apical pansystolic murmur + pulse out of proportion to fever", "dx": "Acute rheumatic fever with carditis", "case": 18, "sheet": "Cardiology · DEPBOOK CASE 24\n• CASE\nA 15-year-old girl presents with a 3-week\nhistory of joints pain. The pain initially\nbegan in her legs. That pain resolved\nspontaneously, and then she experienced\npain in her knees followed by her wrists.\nShe recalls having a sore throat 2 weeks\nbefore her symptoms began.\nVital signs: temperature 38°C, pulse 130\nbpm, respiratory rate 12/minute, blood\npressure 110/70. Physical examination\nshows active arthritis in the wrist joint.\nAuscultation reveals a 2/6 blowing\npansystolic murmur best at the apex\nradiating to the axilla.\nTEMPERATURE\n38°C\nPULSE\n130 bpm\nRESP. RATE\n12/min\nBLOOD PRESSURE\n110/70\n• DIAGNOSTIC KEYWORDS\nSore throat 2 weeks before +\nmigratory joint pain + apical\npansystolic murmur + pulse out of\nproportion to fever\nACUTE RHEUMATIC FEVER WITH\nCARDITIS\n• REVISE\nCardiovascular System → Rheumatic Fever\n• ANSWER\nStudy Smarter Cardiology Cases Page 18\nMIGRATORY JOINT PAIN + APICAL PANSYSTOLIC\nMURMUR\nCASE 18\nJones criteria\nTreatment of acute rheumatic fever\nSecondary prophylaxis\nWhat is the diagnosis, and why?\nWHY\n1\nAcute rheumatic fever\nJones criteria — two major, or one major and two minor,\nplus laboratory evidence of recent group A beta\nhaemolytic streptococcal infection. Here: 2 major\n(fleeting arthritis; carditis) + 1 minor (fever)\nSore throat 2 weeks before → antecedent group A\nstreptococcal pharyngitis\nLegs → knees → wrists, each resolving → fleeting\n(migratory) arthritis — major criterion\nApical pansystolic murmur to the axilla → carditis with\nmitral regurgitation — major criterion\nPulse 130 with a temperature of only 38°C →\ntachycardia out of proportion to fever = carditis\n2 What is the cause of her condition?\nAn immune-mediated condition occurring 2 to 4 weeks\nafter untreated streptococcal pharyngitis, in 3% of\npatients\nEvidence of recent group A strep infection — raised ASO\ntitre, positive throat culture or rapid antigen test, or\nrecent scarlet fever\nHow would you treat her?\nCARDITIS\nTHE STREPTOCOCCAL INFECTION\nPROPHYLAXIS AGAINST RECURRENCE\n3\nAcute rheumatic fever is a self-limiting condition\nCarditis without heart failure → aspirin\nPrednisone 0.5–2 mg/kg/day orally, up to 60 mg/day, in\nsevere carditis (heart failure) instead of aspirin\nPhenoxymethyl penicillin 500 mg 12-hourly for 10 days\nafter sensitivity test\nOral phenoxymethyl penicillin 500 mg until the patient\nis 18 to 20 years of age, or\nBenzathine penicillin G 1.2 million units monthly IM\nPenicillin allergy → a sulphonamide or erythromycin\nAgainst infective endocarditis — erythromycin or\namoxicillin before dental, genitourinary and other\ninvasive procedures", "questions": ["What is the diagnosis, and why?", "What is the cause of her condition?", "How would you treat her?"], "topic": "c7", "sys": "CARD"}, {"id": "c10", "kw": "Young woman + atypical chest pain and palpitation + mid systolic click over the mitral area", "dx": "Mitral valve prolapse", "case": 31, "sheet": "Cardiology · DEPBOOK CASE 37\n• CASE\nA 30-year-old woman presented to the\noutpatient clinic complaining of infrequent\natypical chest pain and palpitation.\nOn examination: pulse rate 90/min with\ninfrequent irregularity, blood pressure\n120/70 mm Hg. Cardiac examination\nrevealed a mid systolic click over the\nmitral area.\nPULSE\n90/min,\ninfrequently\nirregular\nBLOOD\nPRESSURE\n120/70\nKEY SIGN\nMid\nsystolic\nclick\n• DIAGNOSTIC KEYWORDS\nYoung woman + atypical chest pain\nand palpitation + mid systolic click\nover the mitral area\nMITRAL VALVE PROLAPSE\n• REVISE\nCardiovascular System → Diseases of the\nHeart Valves\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 31\nATYPICAL CHEST PAIN + MID-SYSTOLIC CLICK CASE 31\nMitral valve prolapse\nEchocardiographic criteria\nPrognosis and complications\nMitral regurgitation — pansystolic\nmurmur, not an isolated click\nIschemic chest pain — exertional and\npredictable\nAnxiety disorder — no click on\nauscultation\nWhat is the diagnosis, and why?\nWHY\n1\nMitral valve prolapse (MVP)\nBillowing of the mitral leaflets into the left atrium\nduring systole; commonest cause idiopathic\nmyxomatous degeneration. Usually benign\nMid systolic click over the mitral area → the classic sign\nof mitral valve prolapse\nA click with no murmur after it → prolapse without\nsignificant mitral regurgitation\nInfrequent pulse irregularity → the atrial or ventricular\npremature beats that go with it\nNormal blood pressure, otherwise normal examination\n→ no haemodynamic complication yet\nHow will you confirm it?\nECHOCARDIOGRAPHIC CRITERIA\nADDITIONAL TESTS\n2\nClassic MVP — parasternal long-axis view shows more\nthan 2 mm superior displacement of the mitral leaflets\ninto the left atrium during systole, with leaflet thickness\nat least 5 mm\nNon-classic MVP — displacement more than 2 mm, with\nmaximal leaflet thickness below 5 mm\nAlso leaflet thickening, redundancy, annular dilatation,\nchordal elongation — thickened (>5 mm) redundant\nleaflets mean more extensive myxomatous\ndegeneration\nECG — often normal, may show non-specific ST-T\nchanges or arrhythmias; Holter if palpitations are\nsignificant\n3 What is the prognosis?\nExcellent in the absence of significant regurgitation;\nmost patients are asymptomatic\nSymptomatic patients present with complications —\nprogression to mitral regurgitation; infective\nendocarditis, stroke or arrhythmia (atrial premature\nbeats, paroxysmal atrial tachycardia, AF, ventricular\npremature beats, complex ventricular ectopy)\nSudden death occurs in <1%, most often from ruptured\nchordae tendineae and a flail mitral leaflet. Death due to\nventricular arrhythmia is rare", "questions": ["What is the diagnosis, and why?", "How will you confirm it?", "What is the prognosis?"], "topic": "c13", "sys": "CARD"}, {"id": "c11", "kw": "Rheumatic fever at 14 + fever 38.4°C + apical systolic murmur to the axilla + splenomegaly + change in urine colour", "dx": "Infective endocarditis on rheumatic mitral regurgitation with left heart failure", "case": 6, "sheet": "Cardiology · DEPBOOK CASE 12\n• CASE\nA 28-year-old woman presents to the\nemergency room complaining of\npalpitations, severe shortness of breath\nand cough. She also reports change of\nthe color of her urine. She has a history of\nrheumatic fever at the age of 14 years.\nOn examination heart rate 130 bpm and\nregular, temperature 38.4°C. Jugular\nvenous pressure normal, no peripheral\nedema. Abdomen: a just palpable spleen.\nChest: bilateral inspiratory crackles in the\nlower lung fields. Cardiac: apical impulse\nnon displaced, a muffled S1, and high-pitched systolic murmur at the apex\npropagating to the axilla.\nHEART RATE\n130 bpm, regular\nBLOOD PRESSURE\n120/70\nTEMPERATURE\n38.4°C\nSPO₂\n90% on air\n• DIAGNOSTIC KEYWORDS\nRheumatic fever at 14 + fever 38.4°C\n+ apical systolic murmur to the\naxilla + splenomegaly + change in\nurine colour\nINFECTIVE ENDOCARDITIS ON\nRHEUMATIC MITRAL\nREGURGITATION WITH LEFT\nHEART FAILURE\n• REVISE\nCardiovascular System → Infective\nEndocarditis · Diseases of the Heart Valves\n• ANSWER\nStudy Smarter Cardiology Cases Page 6\nFEVER + APICAL SYSTOLIC MURMUR AFTER\nRHEUMATIC FEVER\nCASE 6\nInfective endocarditis — diagnosis\nMitral regurgitation\nIndications for valve replacement\nWhat is the diagnosis, and why?\nWHY\n1\nRheumatic heart disease → mitral regurgitation, with\nleft sided heart failure; the precipitating factor is\ninfective endocarditis\nRheumatic fever at 14 + apical systolic murmur to the\naxilla → rheumatic mitral regurgitation\nFever 38.4°C + splenomegaly → infective endocarditis\non the damaged valve\nChange in the colour of the urine → haematuria from\nimmune complex glomerulonephritis\nBasal crackles + SpO₂ 90% → left-sided heart failure\n2 Four most important investigations, and why?\nBlood culture — 3 sets before antibiotics, for the\ncausative organism\nEchocardiography — transthoracic then\ntransoesophageal: demonstrate the vegetations, assess\nthe mitral valve, systolic and/or diastolic impairment of\nthe ventricles\nUrine analysis — detects glomerulonephritis\n(haematuria, proteinuria), a sign of immune complex\ndeposition\nECG — ventricular enlargement, conduction\nabnormalities in perivalvular extension\nWhat is the treatment?\nINFECTIVE ENDOCARDITIS\nHEART FAILURE\nVALVE REPLACEMENT IN NATIVE VALVE ENDOCARDITIS\n3\nCultures first, then empiric benzyl penicillin +\ngentamicin; change according to culture and sensitivity\nFurosemide ± thiazide and spironolactone; nitrates;\nACEi or ARBs\nCongestive heart failure refractory to medical therapy ·\nfungal endocarditis\nPersistent sepsis after 72 hours of appropriate\nantibiotics\nRecurrent septic emboli, especially after 2 weeks of\nantibiotics\nConduction disturbances caused by a septal abscess", "questions": ["What is the diagnosis, and why?", "Four most important investigations, and why?", "What is the treatment?"], "topic": "c8", "sys": "CARD"}, {"id": "c12", "kw": "IV drug user + fever 3 weeks + tricuspid pansystolic murmur + lung microabscesses + S. aureus bacteraemia + two vegetations", "dx": "Acute right-sided infective endocarditis", "case": 7, "sheet": "Cardiology · DEPBOOK CASE 13\n• CASE\nA 28-year-old man presented to the\nemergency department with high fever\nfor 3 weeks. He complained of malaise\nand poor appetite. There was no previous\nhistory of heart disease or rheumatic\nfever. He is a smoker and an intravenous\ndrug user.\nOn examination temperature 39.5°C, pulse\n120 bpm, blood pressure 100/60 mm Hg.\nCardiac examination revealed a\npansystolic murmur in the tricuspid area,\nsplenomegaly.\nTEMPERATURE\n39.5°C\nPULSE\n120 bpm\nBLOOD\nPRESSURE\n100/60\nLABORATORY\n↓ Haemoglobin 7 g/dL\n↑ WBC 17.5 ×10⁹/L\n↑ ESR 110 mm/h · CRP 280 mg/L\nNormal: Creatinine 1.0 · Chest X-ray · ECG sinus\ntachycardia\n• DIAGNOSTIC KEYWORDS\nIV drug user + fever 3 weeks +\ntricuspid pansystolic murmur + lung\nmicroabscesses + S. aureus\nbacteraemia + two vegetations\nACUTE RIGHT-SIDED INFECTIVE\nENDOCARDITIS\nEcho: two vegetations, severe tricuspid\nregurgitation. CT chest: microabscesses in\nboth lung bases. Cultures: S. aureus.\n• REVISE\nCardiovascular System → Infective\nEndocarditis\n• ANSWER\nStudy Smarter Cardiology Cases Page 7\nPROLONGED FEVER IN AN IV DRUG USER +\nTRICUSPID MURMUR\nCASE 7\nAcute versus subacute endocarditis\nRisk of embolization\nIndications for valve surgery\nWhat is the diagnosis, and why?\nWHY\n1\nAcute infective endocarditis of right sided affection —\nacute IE is a much more aggressive disease\nIn right-sided IE from intravenous drug abuse,\nvegetations of S. aureus, H. influenzae and fungi\nembolize far more readily than those of S. viridans\nVegetations larger than 10 mm, mobile or prolapsing,\ncarry a high rate of embolization; one that grows\nduring therapy raises that risk further, with persisting\nbacteraemia\nIV drug user + fever for 3 weeks → endocarditis until\nproven otherwise\nPansystolic murmur in the tricuspid area → right-sided\nvalve affection\nMicroabscesses in both lung bases → septic emboli\nwent to the lungs, confirming right side\nS. aureus with a 3-week aggressive course → the\nacute, not subacute, type\nCriteria for failure of medical treatment, and further steps?\nFAILURE OF MEDICAL TREATMENT\nMANAGEMENT STEPS\n2\nPersistence of bacteraemia with high fever\nHeart failure, valve dysfunction, perivalvular or\nmyocardial abscess formation\nAn unstable valve becoming detached from the valve\nring\nMore than one embolic episode with persistent\nvegetations on TEE, or vegetations >1 cm\nRenal failure · high ESR and CRP\nStart antibiotics as soon as possible to minimize\nvalvular damage\n3 to 5 sets of blood cultures within 60–90 minutes, then\ninfuse the appropriate regimen\nEmpiric IV aimed at S. aureus — vancomycin +\ngentamicin\nProgressive despite proper antibiotics → valvular\nsurgery", "questions": ["What is the diagnosis, and why?", "Criteria for failure of medical treatment, and further steps?"], "topic": "c8", "sys": "CARD"}, {"id": "c13", "kw": "Wisdom tooth extraction 2 months before + fever and night sweats + 4/6 holosystolic murmur to the axilla + petechiae", "dx": "Infective endocarditis following bacteraemia from a dental procedure", "case": 16, "sheet": "Cardiology · DEPBOOK CASE 22\n• CASE\nA 22-year-old woman presents with\nfatigue, shortness of breath, and loss of\nappetite. Her symptoms had started 2\nweeks ago and have progressively\nworsened. She has had a fever for the\npast 3 days and night sweats. Her past\nmedical history is unremarkable except for\na wisdom tooth extraction\napproximately 2 months before she came\nto the clinic.\nOn examination: temperature 38.6°C,\nheart rate 120/min, respiratory rate\n24/min, BP 110/85 mm Hg. She has a 4/6\nholosystolic murmur that radiates to the\nleft axilla. Skin examination reveals\nscattered petechiae on her extremities.\nTEMPERATURE\n38.6°C\nHEART RATE\n120/min\nBLOOD\nPRESSURE\n110/85\n• DIAGNOSTIC KEYWORDS\nWisdom tooth extraction 2 months\nbefore + fever and night sweats +\n4/6 holosystolic murmur to the axilla\n+ petechiae\nINFECTIVE ENDOCARDITIS\nFOLLOWING BACTERAEMIA FROM\nA DENTAL PROCEDURE\n• REVISE\nCardiovascular System → Infective\nEndocarditis\n• ANSWER\nStudy Smarter Cardiology Cases Page 16\nFEVER + APICAL MURMUR AFTER DENTAL\nEXTRACTION\nCASE 16\nClinical picture of endocarditis\nCausative organisms\nComplications\nWhat is the diagnosis, and why?\nWHY\n1\nInfective endocarditis, following bacteraemia from her\ndental procedure\nWisdom tooth extraction 2 months before → the portal\nof entry for the bacteraemia\n4/6 holosystolic murmur to the left axilla → mitral\nregurgitation from valve vegetation\nScattered petechiae with fever and night sweats →\nembolic / immune lesions of a subacute infection\n2 Common clinical findings on examination?\nFever, cachexia, anaemia, clubbing, splenomegaly,\nsystemic embolisation\nSkin petechiae, splinter haemorrhage, rash · fundus Roth\nspots · cardiac new murmur, wide pulse pressure,\ntachycardia, heart failure\n3 Risk factors for this condition?\nMitral valve prolapse, bicuspid aortic valve, rheumatic\nvalve disease, prior endocarditis, prosthetic valve,\npacemaker or implanted device, IV drug abuse. Rare in\ncyanotic congenital disease and ASD\n4 Most common pathogens?\nStreptococci, especially S. viridans — 50%, the most\nprobable after tooth extraction\nStaph. aureus 20% (IV drug use, acute IE) ·\nEnterococcus 10% (genitourinary) · HACEK 5% · culture\nnegative 5%\n5 Most appropriate investigations?\nBlood cultures — three separate sets, separate\nvenipunctures, over 24 hours\nTransoesophageal echo, preferred over transthoracic,\nfor vegetations. CBC for anaemia; metabolic panel and\nurinalysis — immune complex GN is common\n6 Possible complications?\nCardiac — valvular damage, heart failure, intracardiac\nabscess, pericarditis\nNeurologic — meningitis, embolic stroke, cerebral\nhaemorrhage, brain abscess · renal — infarction,\nglomerulonephritis · bone — osteomyelitis", "questions": ["What is the diagnosis, and why?", "Common clinical findings on examination?", "Risk factors for this condition?", "Most common pathogens?", "Most appropriate investigations?", "Possible complications?"], "topic": "c8", "sys": "CARD"}, {"id": "c14", "kw": "Fever + toxic look + clubbing + apical pansystolic and aortic early diastolic murmurs + massive cerebral infarction despite anticoagulation", "dx": "Infective endocarditis complicating chronic rheumatic valvular heart disease", "case": 17, "sheet": "Cardiology · DEPBOOK CASE 23\n• CASE\nA 35 year old male presented to the ER\nwith fever and sudden onset of left sided\nweakness and hemi-hypoesthesia. On\nexamination his pulse was irregular and\nhe was on anticoagulation for atrial\nfibrillation.\nBP 140/70 mmHg, temperature 38.7 with\na toxic look. Peripheral pulsations were\nintact with 1st degree clubbing. Cardiac\nexamination revealed muffled 1st and 2nd\nsounds with pansystolic murmur over the\napex radiating to the axilla and early\ndiastolic murmur over the aortic area.\nBrain CT scan showed massive right\nfrontoparietal infarction.\nBLOOD\nPRESSURE\n140/70\nTEMPERATURE\n38.7°C\nPULSE\nIrregular\n• DIAGNOSTIC KEYWORDS\nFever + toxic look + clubbing + apical\npansystolic and aortic early diastolic\nmurmurs + massive cerebral\ninfarction despite anticoagulation\nINFECTIVE ENDOCARDITIS\nCOMPLICATING CHRONIC\nRHEUMATIC VALVULAR HEART\nDISEASE\n• REVISE\nCardiovascular System → Infective\nEndocarditis · Diseases of the Heart Valves\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Cardiology Cases Page 17\nFEVER + SUDDEN HEMIPARESIS IN ATRIAL\nFIBRILLATION\nCASE 17\nEndocarditis on rheumatic valves\nSystemic embolization\nAnticoagulation in endocarditis\nWhat is the diagnosis, and why?\nWHY\n1\nInfective endocarditis complicating chronic rheumatic\nvalvular heart disease\nFever 38.7 + toxic look + clubbing → infective\nendocarditis\nApical pansystolic + aortic early diastolic murmurs →\nchronic rheumatic multivalvular disease\nSudden hemiparesis with massive frontoparietal\ninfarction → systemic embolization from vegetations\nEmbolized while on anticoagulation → a septic\nembolus, not a simple thrombus\n2 Two important investigations to prove your diagnosis?\nBlood culture — three separate sets, each from a\nseparate venipuncture, obtained over 24 hours\nTransthoracic and transoesophageal\nechocardiography — to prove the presence of\nvegetations\n3 Would you continue anticoagulation?\nNo — discontinue it, for two reasons:\nTo avoid haemorrhagic transformation of the infarction,\ngiven its large size\nTo avoid the risk of haemorrhage from mycotic\naneurysms complicating infective endocarditis\nCardioembolic stroke from AF alone — no fever, clubbing or new\nmurmurs\nBrain abscess — CT shows infarction, not a ring lesion\nCerebral vasculitis — no valve findings", "questions": ["What is the diagnosis, and why?", "Two important investigations to prove your diagnosis?", "Would you continue anticoagulation?"], "topic": "c8", "sys": "CARD"}, {"id": "c15", "kw": "Young man + flu-like illness one week before + sharp pain worse on deep breath + friction rub + ST elevation in all leads with normal enzymes", "dx": "Acute viral pericarditis", "case": 15, "sheet": "Cardiology · DEPBOOK CASE 21\n• CASE\nA 24-year-old medical student had\nsudden onset of substernal pain with\nradiation to his shoulders and neck. He\ndescribes the pain as sharp especially if\nhe takes a deep breath. The patient also\nnoted fever with flu-like symptoms one\nweek before.\nPhysical examination: pulse 120, blood\npressure 110/70. Cardiac: friction rub\nover the precordium best heard along the\nleft sternal border with the patient sitting\nup and leaning forward.\nPULSE\n120 bpm\nBLOOD PRESSURE\n110/70\nLABORATORY\nNormal: CBC · Urine analysis · Blood chemistry ·\nCardiac enzymes\n• DIAGNOSTIC KEYWORDS\nYoung man + flu-like illness one week\nbefore + sharp pain worse on deep\nbreath + friction rub + ST elevation\nin all leads with normal enzymes\nACUTE VIRAL PERICARDITIS\nECG: elevated ST segment in all ECG leads.\n• REVISE\nCardiovascular System → Pericardial\nDiseases\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Cardiology Cases Page 15\nPLEURITIC CHEST PAIN + PERICARDIAL FRICTION\nRUB\nCASE 15\nAcute pericarditis — causes\nPericarditis versus myocardial infarction\non ECG\nTreatment of pericarditis\nWhat is the diagnosis, and why?\nWHY\n1\nViral pericarditis\nSharp pain on deep breath, to the shoulders and neck\n→ pericardial pain\nFriction rub best heard sitting up and leaning forward\n→ pericarditis\nST elevation in all leads with normal enzymes →\npericarditis, not infarction\nFlu-like illness one week before → viral aetiology\n2 Mention 3 other etiological causes.\nRenal failure\nTransmural myocardial infarction\nCollagen vascular disease — SLE, rheumatoid\nAcute rheumatic fever\n3 Treatment of this particular patient?\nTreatment of the cause\nBed rest\nNSAIDs and/or corticosteroids\nSTEMI — ST elevation is regional with reciprocal depression;\nenzymes raised\nPulmonary embolism — pleuritic pain but hypoxia, no rub\nPleurisy or pneumonia — chest signs, rub is pleural not\nprecordial\nAortic dissection — tearing pain to the back, unequal pulses", "questions": ["What is the diagnosis, and why?", "Mention 3 other etiological causes.", "Treatment of this particular patient?"], "topic": "c11", "sys": "CARD"}, {"id": "c16", "kw": "Pericarditic pain relieved by sitting up + past tuberculosis + big heart with CLEAR lungs + hypotension with raised JVP + electrical alternans", "dx": "Cardiac tamponade (effusive-constrictive, tuberculous)", "case": 274, "sheet": "Acute Internal Medicine · DEPBOOK CASE 280\n• CASE\nA 35-year-old man complains of\ndyspnea and substernal chest pain,\naggravated by inspiration and relieved\nby sitting up. The patient has had a\nhistory of tuberculosis.\nChest X-ray shows an enlarged\ncardiac silhouette. Lung fields are\nclear. The patient develops\nhypotension and jugular venous\ndistension; there is an inward\nmovement of the jugular pulse\nsynchronous with the pulse of the\ncarotid artery. The ECG shows\nelectrical alternans.\nCHEST X-RAY\nEnlarged\ncardiac\nsilhouette\nLUNG\nFIELDS\nClear\nECG\nElectrical\nalternans\n• DIAGNOSTIC KEYWORDS\nPericarditic pain relieved by sitting\nup + past tuberculosis + big\nheart with CLEAR lungs +\nhypotension with raised JVP +\nelectrical alternans\nCARDIAC TAMPONADE\n(EFFUSIVE-CONSTRICTIVE,\nTUBERCULOUS)\n• REVISE\nCardiology → Pericardial Effusion and\nCardiac Tamponade\n• ANSWER\nStudy Smarter Acute Internal Medicine Cases Page 274\nELECTRICAL ALTERNANS AFTER TUBERCULOSIS CASE 4\nEcho signs of impending tamponade\nPericardial fluid analysis in TB\nPericardiocentesis, window and\npericardiectomy\nWhat is the diagnosis, and why?\nWHY\n1\nCardiac tamponade, or a tamponade-like picture due to\neffusive-constrictive pericarditis — pericardial fluid under\nincreased pressure impedes diastolic filling, reducing\ncardiac output and causing hypotension\nThe chest pain is most likely due to pericarditis; an\nenlarged cardiac silhouette without pulmonary congestion\nsuggests pericardial effusion\nEnlarged heart with CLEAR lung fields → heart failure\nwould congest the lungs; a big quiet heart is fluid\naround it, not in it\nInward jugular pulse timed with the carotid → a sharp x-descent — raised right atrial pressure exaggerates atrial\nrelaxation during ventricular systole\nElectrical alternans → the heart swinging within a large\neffusion\nPrevious tuberculosis → the likely etiology, and it changes\nthe treatment\n2 What is the next step in evaluating this patient?\nEchocardiography — to diagnose the pericardial effusion\n(an echo-free space) and detect signs of impending\ncardiac tamponade\nIt assesses (i) quantity and quality of pericardial fluid, (ii)\ncollapse of cardiac chambers, (iii) respiratory variation of\nthe ventricular diameters, and (iv) inferior vena cava\ncollapsibility\n3 How to treat this condition?\nEcho-guided pericardiocentesis — therapeutic to relieve\nthe tamponade and diagnostic for fluid analysis\nA tuberculous etiology is suggested by a lymphocyte-rich\nexudate, adenosine deaminase activity > 40 U/L, and PCR\nor BACTEC for TB in the pericardial fluid\nSurgical pericardial window if pericardiocentesis fails\nbecause of a thick pericardium\nFour antituberculous drugs — rifampin, isoniazid,\npyrazinamide and ethambutol, + steroids if given early, to\nreduce pericardial fibrosis\nPericardiectomy if late, with a constrictive pericardium", "questions": ["What is the diagnosis, and why?", "What is the next step in evaluating this patient?", "How to treat this condition?"], "topic": "c9", "sys": "CARD"}, {"id": "c17", "kw": "Young man + syncope after exercise + holosystolic murmur at the mitral area to the axilla + LVH on ECG with a normal blood pressure", "dx": "Hypertrophic cardiomyopathy with dynamic outflow obstruction", "case": 30, "sheet": "Cardiology · DEPBOOK CASE 36\n• CASE\nA 30-year-old man presented to the\nemergency department complaining of\ndizziness and presyncope with\nsubsequent fall to the floor. Three weeks\nago, he reported a syncope following\nphysical exercise.\nOn examination, pulse 80/min, blood\npressure 130/80 mmHg. The abdomen\nand lungs were normal. There were no\nabnormal heart sounds and a grade 3/4\nholosystolic murmur was heard over the\nmitral area radiating to the left axilla.\nThe ECG observed signs of left\nventricular hypertrophy.\nPULSE\n80/min\nBLOOD\nPRESSURE\n130/80\nECG\nLeft\nventricular\nhypertrophy\n• DIAGNOSTIC KEYWORDS\nYoung man + syncope after exercise\n+ holosystolic murmur at the mitral\narea to the axilla + LVH on ECG with\na normal blood pressure\nHYPERTROPHIC\nCARDIOMYOPATHY WITH\nDYNAMIC OUTFLOW\nOBSTRUCTION\n• REVISE\nCardiovascular System → Cardiac Muscle\nDisease\n• ANSWER\nStudy Smarter Cardiology Cases Page 30\nPRESYNCOPE + HOLOSYSTOLIC MURMUR WITH\nLVH\nCASE 30\nHypertrophic cardiomyopathy\nSystolic anterior motion\nDrugs to avoid in HCM\nWhat is the diagnosis, and why?\nWHY\n1\nHypertrophic cardiomyopathy (HCM)\nA genetic disease defined by increased left ventricular\nwall thickness, particularly the septum, not explained by\nloading conditions. Caused by mutation in cardiac\nsarcomere protein genes, most often autosomal\ndominant. It is the leading cause of sudden cardiac\ndeath in preadolescent and adolescent children\nSyncope following physical exercise → dynamic LV\noutflow obstruction, or an arrhythmia such as VF\nHolosystolic murmur at the mitral area to the axilla →\nmitral regurgitation from systolic anterior motion\nLVH on ECG with a normal blood pressure →\nhypertrophy that is not from pressure loading\n2 How do you proceed to reach the diagnosis?\nEchocardiography — pronounced left ventricular\nhypertrophy with dynamic obstruction to the LV\noutflow, and calculates the gradient. Mitral\nregurgitation may be present secondary to systolic\nanterior mitral motion\nMost patients have abnormal diastolic function,\nimpairing filling despite a normal or small cavity\nHolter ECG to exclude significant arrhythmias. First-degree relatives need periodic cardiac screening\nSteps in management?\nMEDICAL\nSURGICAL AND CATHETER-BASED\nCAVEATS\n3\nBeta-blockers (negative inotropes) — decrease heart\nrate, contractility and myocardial stress, and relieve\noutflow obstruction during exercise. Alternative: calcium\nchannel blockers\nAntiarrhythmics — amiodarone, disopyramide (rarely)\nMyomectomy · mitral valve replacement · pacemaker ·\ncatheter septal ablation · ICD for VT/VF · heart\ntransplantation\nAvoid nitrates and sympathomimetic amines (except\nwith coronary disease), avoid digitalis, diuretics with\ncaution", "questions": ["What is the diagnosis, and why?", "How do you proceed to reach the diagnosis?", "Steps in management?"], "topic": "c14", "sys": "CARD"}], "bundle": "days/d2.json"}, "3": {"day": 3, "topics": "Iron deficiency · Hemolytic anemia · Pancytopenia & aplastic · B12 & bleeding · Thrombocytopenia & ITP · Thrombophilia · Polycythemia · Transfusion", "essays": [{"id": "e1", "q": "Investigations of iron deficiency anemia", "years": "2012–2015 · 2017 · 2020 · June 2021 · Nov 2021", "src": "Haem P2", "recent": false, "topic": "h1", "sys": "HEMA", "answer": "<h3>What are the investigations of IDA? <span class=\"src\">Haem P2<\/span><\/h3><div class=\"pillrow\"><span class=\"pill num\">1. Is it iron deficiency?<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Test<\/th><th>Finding<\/th><\/tr><\/thead><tbody><tr><td>CBC<\/td><td>Hypochromic microcytic anemia · low absolute reticulocyte count<\/td><\/tr><tr><td>Iron studies<\/td><td>↓ serum iron · ↑ TIBC · ↓ transferrin saturation · ↓ ferritin<\/td><\/tr><tr><td>Bone marrow iron stain<\/td><td>Absent iron stores. The gold standard, but not done routinely<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill num\">2. Which microcytic anemia is it?<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Cause<\/th><th>Iron<\/th><th>TIBC<\/th><th>Sat.<\/th><th>Ferritin<\/th><th>Key finding<\/th><\/tr><\/thead><tbody><tr><td>Iron deficiency<\/td><td>↓<\/td><td>↑<\/td><td>↓<\/td><td>↓<\/td><td>Source of blood loss<\/td><\/tr><tr><td>Chronic inflammation<\/td><td>↓<\/td><td>↓<\/td><td>↓<\/td><td>N or ↑<\/td><td>Chronic infection, inflammation, malignancy<\/td><\/tr><tr><td>Thalassemia<\/td><td>N or ↑<\/td><td>N<\/td><td>N or ↑<\/td><td>N or ↑<\/td><td>↑ HbA2 / HbF on electrophoresis; target cells<\/td><\/tr><tr><td>Sideroblastic anemia<\/td><td>↑<\/td><td>N<\/td><td>↑<\/td><td>↑<\/td><td>Ring sideroblasts on marrow iron stain<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What are the investigations of IDA? (Haem P2)\n1. IS IT IRON DEFICIENCY?\nTest | Finding\nCBC | Hypochromic microcytic anemia · low absolute reticulocyte count\nIron studies | ↓ serum iron · ↑ TIBC · ↓ transferrin saturation · ↓ ferritin\nBone marrow iron stain | Absent iron stores. The gold standard, but not done routinely\n2. WHICH MICROCYTIC ANEMIA IS IT?\nCause | Iron | TIBC | Sat. | Ferritin | Key finding\nIron deficiency | ↓ | ↑ | ↓ | ↓ | Source of blood loss\nChronic inflammation | ↓ | ↓ | ↓ | N or ↑ | Chronic infection, inflammation, malignancy\nThalassemia | N or ↑ | N | N or ↑ | N or ↑ | ↑ HbA2 / HbF on electrophoresis; target cells\nSideroblastic anemia | ↑ | N | ↑ | ↑ | Ring sideroblasts on marrow iron stain"}, {"id": "e2", "q": "Causes of thrombocytopenia", "years": "2012–2015 · 2017 · 2019 · 2020 · 2021", "src": "Haem P8", "recent": false, "topic": "h5", "sys": "HEMA", "answer": "<h3>What are the causes of thrombocytopenia? <span class=\"src\">Haem P8<\/span><\/h3><div class=\"pillrow\"><span class=\"pill num\">1. Failure of production<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Group<\/th><th>Causes<\/th><\/tr><\/thead><tbody><tr><td>Selective megakaryocyte depression<\/td><td>Drugs · chemicals · alcohol · infection<\/td><\/tr><tr><td>Part of generalized marrow failure<\/td><td>Aplastic anemia · marrow infiltration (leukemia, lymphoma, carcinoma, myelofibrosis) · myelodysplastic syndrome · megaloblastic anemia<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill num\">2. Increased destruction<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Group<\/th><th>Causes<\/th><\/tr><\/thead><tbody><tr><td>Immune<\/td><td>Primary immune thrombocytopenia — ITP. Secondary: SLE · antiphospholipid syndrome · CLL · Hodgkin lymphoma. Drug-induced: quinine · heparin (HIT) · carbamazepine · ceftriaxone · ibuprofen · co-trimoxazole · rifampicin · procainamide · digitalis. Infection: HIV · HCV · EBV · CMV · rubella · hepatitis<\/td><\/tr><tr><td>Non-immune consumption<\/td><td>DIC · TTP · HUS · sepsis<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill num\">3. Sequestration and 4. dilution<\/span><\/div><ul><li>Hypersplenism from any cause of splenomegaly<\/li><li>Massive transfusion of stored blood<\/li><\/ul><div class=\"strip\">Low platelets with an otherwise normal CBC, a normal blood film and no splenomegaly means ITP.<\/div>", "text": "What are the causes of thrombocytopenia? (Haem P8)\n1. FAILURE OF PRODUCTION\nGroup | Causes\nSelective megakaryocyte depression | Drugs · chemicals · alcohol · infection\nPart of generalized marrow failure | Aplastic anemia · marrow infiltration (leukemia, lymphoma, carcinoma, myelofibrosis) · myelodysplastic syndrome · megaloblastic anemia\n2. INCREASED DESTRUCTION\nGroup | Causes\nImmune | Primary immune thrombocytopenia — ITP. Secondary: SLE · antiphospholipid syndrome · CLL · Hodgkin lymphoma. Drug-induced: quinine · heparin (HIT) · carbamazepine · ceftriaxone · ibuprofen · co-trimoxazole · rifampicin · procainamide · digitalis. Infection: HIV · HCV · EBV · CMV · rubella · hepatitis\nNon-immune consumption | DIC · TTP · HUS · sepsis\n3. SEQUESTRATION AND 4. DILUTION\n- Hypersplenism from any cause of splenomegaly\n- Massive transfusion of stored blood\nLow platelets with an otherwise normal CBC, a normal blood film and no splenomegaly means ITP."}, {"id": "e3", "q": "Investigations of hemolytic anemia", "years": "2012–2015 (twice) · 2019 · 2020 · 2021", "src": "Haem P4", "recent": false, "topic": "h2", "sys": "HEMA", "answer": "<h3>What are the investigations of hemolytic anemia? <span class=\"src\">Haem P4<\/span><\/h3><div class=\"strip\">Answer two questions: is there hemolysis, and what is the cause?<\/div><div class=\"pillrow\"><span class=\"pill num\">1. Is there hemolysis?<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Test<\/th><th>Finding<\/th><\/tr><\/thead><tbody><tr><td>CBC and reticulocytes<\/td><td>Reticulocytosis. Usually a normochromic normocytic anemia; may be macrocytic with marked reticulocytosis or folate lack, and microcytic in thalassemia or with urinary iron loss<\/td><\/tr><tr><td>Biochemistry<\/td><td>↑ indirect bilirubin · ↑ LDH · ↑ fecal stercobilinogen · ↑ urinary urobilinogen<\/td><\/tr><tr><td>Intravascular hemolysis<\/td><td>Hemoglobinemia · hemoglobinuria · hemosiderinuria · ↓ haptoglobin<\/td><\/tr><tr><td>Bone marrow<\/td><td>Hypercellular and normoblastic<\/td><\/tr><tr><td>Confirmation<\/td><td>Cr51-labelled red cells confirm a shortened red-cell life span<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What are the investigations of hemolytic anemia? (Haem P4)\nAnswer two questions: is there hemolysis, and what is the cause?\n1. IS THERE HEMOLYSIS?\nTest | Finding\nCBC and reticulocytes | Reticulocytosis. Usually a normochromic normocytic anemia; may be macrocytic with marked reticulocytosis or folate lack, and microcytic in thalassemia or with urinary iron loss\nBiochemistry | ↑ indirect bilirubin · ↑ LDH · ↑ fecal stercobilinogen · ↑ urinary urobilinogen\nIntravascular hemolysis | Hemoglobinemia · hemoglobinuria · hemosiderinuria · ↓ haptoglobin\nBone marrow | Hypercellular and normoblastic\nConfirmation | Cr51-labelled red cells confirm a shortened red-cell life span"}, {"id": "e4", "q": "Causes and investigations of pancytopenia", "years": "2012–2015 · 2022 · 2024 (twice)", "src": "Haem P5 · Symptomatology P75", "recent": false, "topic": "h3", "sys": "HEMA", "answer": "<h3>What are the causes of pancytopenia? <span class=\"src\">Haem P5<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Group<\/th><th>Causes<\/th><\/tr><\/thead><tbody><tr><td>Hypocellular marrow — marrow failure<\/td><td>Aplastic anemia. Reversible marrow suppression: cytotoxic chemotherapy or radiotherapy · overwhelming sepsis · acute viral infection<\/td><\/tr><tr><td>Cellular or infiltrated marrow<\/td><td>Ineffective hematopoiesis: megaloblastic anemia · MDS. Marrow infiltration (myelophthisis): myelofibrosis · leukemia or lymphoma · metastatic carcinoma · granulomas · Gaucher disease · osteopetrosis · marrow necrosis<\/td><\/tr><tr><td>Peripheral destruction or pooling<\/td><td>Hypersplenism · autoimmune · PNH<\/td><\/tr><\/tbody><\/table><\/div><h3>What are the investigations of pancytopenia? <span class=\"src\">Haem P5<\/span><\/h3><div class=\"pillrow\"><span class=\"pill num\">1. CBC and blood film<\/span><\/div><ul><li>Assess the depth of the cytopenias<\/li><li>Blasts → leukemia<\/li><li>Hypersegmented neutrophils with oval macrocytes → megaloblastic anemia<\/li><li>Leukoerythroblastic picture with tear-drop cells and nucleated RBCs → infiltration<\/li><li>Dysplastic forms → MDS<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">2. Reticulocyte count<\/span><\/div><ul><li>Low → production failure<\/li><li>High → peripheral destruction<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">3. Marrow aspirate and trephine biopsy<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Marrow<\/th><th>Diagnosis<\/th><\/tr><\/thead><tbody><tr><td>Hypocellular with increased fat spaces and no abnormal cells<\/td><td>Aplastic anemia<\/td><\/tr><tr><td>Hypercellular megaloblastic<\/td><td>B12 or folate deficiency<\/td><\/tr><tr><td>Infiltrated or fibrosed<\/td><td>Myelophthisis<\/td><\/tr><tr><td>Dysplastic<\/td><td>MDS<\/td><\/tr><tr><td>Hypercellular with normal maturation<\/td><td>Look outside the marrow, e.g. hypersplenism<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill num\">4. Further tests according to the cause<\/span><\/div><ul><li>Serum B12 and folate — red-cell folate is more accurate<\/li><li>LFTs and spleen size on ultrasound<\/li><li>Viral screen: hepatitis, HIV<\/li><li>ANA<\/li><li>Flow cytometry for CD55 and CD59<\/li><li>Drug, chemical and irradiation history<\/li><\/ul>", "text": "What are the causes of pancytopenia? (Haem P5)\nGroup | Causes\nHypocellular marrow — marrow failure | Aplastic anemia. Reversible marrow suppression: cytotoxic chemotherapy or radiotherapy · overwhelming sepsis · acute viral infection\nCellular or infiltrated marrow | Ineffective hematopoiesis: megaloblastic anemia · MDS. Marrow infiltration (myelophthisis): myelofibrosis · leukemia or lymphoma · metastatic carcinoma · granulomas · Gaucher disease · osteopetrosis · marrow necrosis\nPeripheral destruction or pooling | Hypersplenism · autoimmune · PNH\n\nWhat are the investigations of pancytopenia? (Haem P5)\n1. CBC AND BLOOD FILM\n- Assess the depth of the cytopenias\n- Blasts → leukemia\n- Hypersegmented neutrophils with oval macrocytes → megaloblastic anemia\n- Leukoerythroblastic picture with tear-drop cells and nucleated RBCs → infiltration\n- Dysplastic forms → MDS\n2. RETICULOCYTE COUNT\n- Low → production failure\n- High → peripheral destruction\n3. MARROW ASPIRATE AND TREPHINE BIOPSY\nMarrow | Diagnosis\nHypocellular with increased fat spaces and no abnormal cells | Aplastic anemia\nHypercellular megaloblastic | B12 or folate deficiency\nInfiltrated or fibrosed | Myelophthisis\nDysplastic | MDS\nHypercellular with normal maturation | Look outside the marrow, e.g. hypersplenism\n4. FURTHER TESTS ACCORDING TO THE CAUSE\n- Serum B12 and folate — red-cell folate is more accurate\n- LFTs and spleen size on ultrasound\n- Viral screen: hepatitis, HIV\n- ANA\n- Flow cytometry for CD55 and CD59\n- Drug, chemical and irradiation history"}, {"id": "e5", "q": "Etiology of iron deficiency anemia", "years": "2012–2015 · 2020", "src": "Haem P1", "recent": false, "topic": "h1", "sys": "HEMA", "answer": "<h3>What are the causes of IDA? <span class=\"src\">Haem P1<\/span><\/h3><div class=\"strip\">Increased loss is the commonest cause in adults.<\/div><div class=\"pillrow\"><span class=\"pill\">1. Increased loss<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Source<\/th><th>Causes<\/th><\/tr><\/thead><tbody><tr><td>GIT<\/td><td>Peptic ulcer and NSAIDs · varices · arteriovenous malformation · hemorrhoids · carcinoma · hookworm (Ancylostoma, Necator)<\/td><\/tr><tr><td>Orificial<\/td><td>Menorrhagia — may be underestimated by the patient · bleeding per rectum<\/td><\/tr><tr><td>Other<\/td><td>Hemorrhagic blood disease, e.g. thrombocytopenia · chronic hemoglobinuria · pulmonary hemosiderosis<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill\">2. Decreased intake<\/span><\/div><ul><li>Infants · elderly · famine<\/li><li>Bioavailability: heme &gt; Fe²⁺ &gt; Fe³⁺<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">3. Decreased absorption<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Mechanism<\/th><th>Causes<\/th><\/tr><\/thead><tbody><tr><td>Low gastric acid<\/td><td>Gastrectomy · vagotomy · pernicious anemia · PPIs · H2 blockers · antacids · bariatric surgery<\/td><\/tr><tr><td>Intestinal disease<\/td><td>Celiac disease · Crohn's disease<\/td><\/tr><tr><td>Inhibitors<\/td><td>Phytates · tannins · calcium-rich food<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill\">4. Increased requirement<\/span><\/div><ul><li>Pregnancy and lactation · child-bearing years · growth spurts in children and adolescents<\/li><\/ul>", "text": "What are the causes of IDA? (Haem P1)\nIncreased loss is the commonest cause in adults.\n1. INCREASED LOSS\nSource | Causes\nGIT | Peptic ulcer and NSAIDs · varices · arteriovenous malformation · hemorrhoids · carcinoma · hookworm (Ancylostoma, Necator)\nOrificial | Menorrhagia — may be underestimated by the patient · bleeding per rectum\nOther | Hemorrhagic blood disease, e.g. thrombocytopenia · chronic hemoglobinuria · pulmonary hemosiderosis\n2. DECREASED INTAKE\n- Infants · elderly · famine\n- Bioavailability: heme > Fe²⁺ > Fe³⁺\n3. DECREASED ABSORPTION\nMechanism | Causes\nLow gastric acid | Gastrectomy · vagotomy · pernicious anemia · PPIs · H2 blockers · antacids · bariatric surgery\nIntestinal disease | Celiac disease · Crohn's disease\nInhibitors | Phytates · tannins · calcium-rich food\n4. INCREASED REQUIREMENT\n- Pregnancy and lactation · child-bearing years · growth spurts in children and adolescents"}, {"id": "e6", "q": "Treatment of ITP", "years": "2012–2015 · 2016 · 2022", "src": "Haem P9", "recent": false, "topic": "h5", "sys": "HEMA", "answer": "<h3>What is the treatment of ITP? <span class=\"src\">Haem P9<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Situation<\/th><th>Action<\/th><\/tr><\/thead><tbody><tr><td>Observe<\/td><td>Platelets above 30,000/cmm with no bleeding → observe at regular intervals<\/td><\/tr><tr><td>Treat<\/td><td>Treat if there is bleeding or the platelets are below 20,000/cmm<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Line<\/th><th>Treatment<\/th><\/tr><\/thead><tbody><tr><td>1. Steroids<\/td><td>Prednisone 0.5–1 mg/kg orally, or dexamethasone 40 mg daily for 4 days. Response 70–80%, often not maintained; taper slowly after remission<\/td><\/tr><tr><td>2. IV immunoglobulin<\/td><td>400 mg/kg/day for 5 days. The fastest agent — for severe bleeding or to cover surgery<\/td><\/tr><tr><td>3. Splenectomy<\/td><td>For steroid resistance or relapse on withdrawal. Response 65–75%. Vaccinate against pneumococcus, H. influenzae b and meningococcus at least 2 weeks beforehand<\/td><\/tr><tr><td>4. TPO receptor agonists<\/td><td>Romiplostim · eltrombopag. Must be continued to maintain the platelet count<\/td><\/tr><tr><td>5. Immunosuppression<\/td><td>For refractory disease: rituximab · azathioprine · mycophenolate · cyclophosphamide · vincristine<\/td><\/tr><tr><td>6. Platelet transfusion<\/td><td>Only for life-threatening bleeding, such as intracranial hemorrhage<\/td><\/tr><\/tbody><\/table><\/div><div class=\"strip\">In childhood acute ITP spontaneous remission is the rule; fewer than 10% become chronic.<\/div>", "text": "What is the treatment of ITP? (Haem P9)\nSituation | Action\nObserve | Platelets above 30,000/cmm with no bleeding → observe at regular intervals\nTreat | Treat if there is bleeding or the platelets are below 20,000/cmm\nLine | Treatment\n1. Steroids | Prednisone 0.5–1 mg/kg orally, or dexamethasone 40 mg daily for 4 days. Response 70–80%, often not maintained; taper slowly after remission\n2. IV immunoglobulin | 400 mg/kg/day for 5 days. The fastest agent — for severe bleeding or to cover surgery\n3. Splenectomy | For steroid resistance or relapse on withdrawal. Response 65–75%. Vaccinate against pneumococcus, H. influenzae b and meningococcus at least 2 weeks beforehand\n4. TPO receptor agonists | Romiplostim · eltrombopag. Must be continued to maintain the platelet count\n5. Immunosuppression | For refractory disease: rituximab · azathioprine · mycophenolate · cyclophosphamide · vincristine\n6. Platelet transfusion | Only for life-threatening bleeding, such as intracranial hemorrhage\nIn childhood acute ITP spontaneous remission is the rule; fewer than 10% become chronic."}, {"id": "e7", "q": "Complications and indications of blood transfusion", "years": "2015 · 2020 · 2021", "src": "Haem P12", "recent": false, "topic": "h8", "sys": "HEMA", "answer": "<h3>What are the complications of blood transfusion? <span class=\"src\">Haem P12<\/span><\/h3><div class=\"pillrow\"><span class=\"pill\">Immediate — immunological<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Reaction<\/th><th>Detail<\/th><\/tr><\/thead><tbody><tr><td>Acute hemolytic<\/td><td>ABO incompatibility, usually a clerical error. Fever · rigors · loin pain · flushing · dyspnea · hypotension or shock · hemoglobinuria · AKI · DIC. Under anesthesia: hypotension, wound oozing, dark urine<\/td><\/tr><tr><td>Febrile non-hemolytic<\/td><td>The commonest. Recipient anti-HLA antibodies against donor leukocytes; a temperature rise of at least 1 °C with chills. Investigate as hemolysis, because fever occurs in both<\/td><\/tr><tr><td>Allergic / urticarial<\/td><td>Usually mild. Anaphylaxis in IgA deficiency → washed cells and IgA-deficient plasma<\/td><\/tr><tr><td>TRALI<\/td><td>Donor anti-HLA or antigranulocyte antibodies → non-cardiogenic pulmonary edema<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill\">Immediate — non-immunological<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Reaction<\/th><th>Detail<\/th><\/tr><\/thead><tbody><tr><td>Bacterial contamination<\/td><td>High fever · rigors · profound hypotension · vomiting · diarrhea. Platelets carry the highest risk; Yersinia can grow in refrigerated red cells<\/td><\/tr><tr><td>TACO<\/td><td>Volume overload in a susceptible heart or kidney: hypertension · raised JVP · crackles · gallop. Stop the transfusion and treat as heart failure; diuretics are used<\/td><\/tr><tr><td>Other<\/td><td>Complications of massive transfusion · air embolism · thrombophlebitis<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill\">Delayed<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Reaction<\/th><th>Detail<\/th><\/tr><\/thead><tbody><tr><td>Delayed hemolytic<\/td><td>Anamnestic antibody response, usually 1–4 weeks later; often silent. Fall in Hb · slight fever · jaundice · ↑ LDH and bilirubin · positive DAT<\/td><\/tr><tr><td>Alloimmunization<\/td><td>To red-cell or HLA/platelet antigens → platelet refractoriness. Manage with HLA-matched platelets and leukodepleted products<\/td><\/tr><tr><td>Post-transfusion purpura<\/td><td>Severe thrombocytopenia 4–14 days after transfusion. Treat with high-dose IVIG; further platelet or red-cell transfusion makes it worse<\/td><\/tr><tr><td>Transfusion-associated GVHD<\/td><td>A delayed immunological complication<\/td><\/tr><tr><td>Transmitted infection<\/td><td>HBV · HCV · HIV-1 and HIV-2 · HTLV · CMV · syphilis · malaria. Residual risk relates to the window period<\/td><\/tr><tr><td>Iron overload<\/td><td>Especially in chronically transfused patients such as thalassemia: endocrine, hepatic and cardiac damage. Needs chelation<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What are the complications of blood transfusion? (Haem P12)\nIMMEDIATE — IMMUNOLOGICAL\nReaction | Detail\nAcute hemolytic | ABO incompatibility, usually a clerical error. Fever · rigors · loin pain · flushing · dyspnea · hypotension or shock · hemoglobinuria · AKI · DIC. Under anesthesia: hypotension, wound oozing, dark urine\nFebrile non-hemolytic | The commonest. Recipient anti-HLA antibodies against donor leukocytes; a temperature rise of at least 1 °C with chills. Investigate as hemolysis, because fever occurs in both\nAllergic / urticarial | Usually mild. Anaphylaxis in IgA deficiency → washed cells and IgA-deficient plasma\nTRALI | Donor anti-HLA or antigranulocyte antibodies → non-cardiogenic pulmonary edema\nIMMEDIATE — NON-IMMUNOLOGICAL\nReaction | Detail\nBacterial contamination | High fever · rigors · profound hypotension · vomiting · diarrhea. Platelets carry the highest risk; Yersinia can grow in refrigerated red cells\nTACO | Volume overload in a susceptible heart or kidney: hypertension · raised JVP · crackles · gallop. Stop the transfusion and treat as heart failure; diuretics are used\nOther | Complications of massive transfusion · air embolism · thrombophlebitis\nDELAYED\nReaction | Detail\nDelayed hemolytic | Anamnestic antibody response, usually 1–4 weeks later; often silent. Fall in Hb · slight fever · jaundice · ↑ LDH and bilirubin · positive DAT\nAlloimmunization | To red-cell or HLA/platelet antigens → platelet refractoriness. Manage with HLA-matched platelets and leukodepleted products\nPost-transfusion purpura | Severe thrombocytopenia 4–14 days after transfusion. Treat with high-dose IVIG; further platelet or red-cell transfusion makes it worse\nTransfusion-associated GVHD | A delayed immunological complication\nTransmitted infection | HBV · HCV · HIV-1 and HIV-2 · HTLV · CMV · syphilis · malaria. Residual risk relates to the window period\nIron overload | Especially in chronically transfused patients such as thalassemia: endocrine, hepatic and cardiac damage. Needs chelation"}, {"id": "e8", "q": "Diagnostic criteria of ITP", "years": "2025 — first time", "src": "Haem P8–9", "recent": true, "topic": "h5", "sys": "HEMA", "answer": "<h3>What are the diagnostic criteria and phases? <span class=\"src\">Haem P8<\/span><\/h3><ol><li>Isolated thrombocytopenia — the rest of the CBC and the blood film are normal<\/li><li>No clinically apparent associated condition — no SLE, antiphospholipid syndrome or CLL; if present it is secondary immune thrombocytopenia<\/li><\/ol><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Phase<\/th><th>Duration<\/th><\/tr><\/thead><tbody><tr><td>Newly diagnosed<\/td><td>Up to 3 months<\/td><\/tr><tr><td>Persistent<\/td><td>3–12 months<\/td><\/tr><tr><td>Chronic<\/td><td>More than 12 months<\/td><\/tr><\/tbody><\/table><\/div><h3>What is the diagnosis of ITP? <span class=\"src\">Haem P9<\/span><\/h3><div class=\"strip\">The diagnosis is one of exclusion.<\/div><div class=\"pillrow\"><span class=\"pill num\">1. Confirm true thrombocytopenia<\/span><\/div><ul><li>Repeat the platelet count in citrate<\/li><li>Exclude pseudothrombocytopenia from EDTA-induced platelet clumping<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">2. Exclude secondary causes<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Group<\/th><th>What to look for<\/th><\/tr><\/thead><tbody><tr><td>Drugs<\/td><td>A full drug history<\/td><\/tr><tr><td>Infections<\/td><td>HIV · HCV · H. pylori<\/td><\/tr><tr><td>Autoimmune disease<\/td><td>SLE · autoimmune thyroid disease<\/td><\/tr><tr><td>Consumptive disorders<\/td><td>TTP · HUS — look for schistocytes<\/td><\/tr><tr><td>Marrow disease<\/td><td>Leukemia · MDS<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill num\">3. Antiplatelet antibody assays<\/span><\/div><ul><li>No established role in diagnosis<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">4. When is bone marrow examination needed?<\/span><\/div><ol><li>An atypical picture<\/li><li>Age over 60 years<\/li><li>Poor response to treatment<\/li><li>Relapse<\/li><li>Before splenectomy<\/li><\/ol>", "text": "What are the diagnostic criteria and phases? (Haem P8)\n1. Isolated thrombocytopenia — the rest of the CBC and the blood film are normal\n2. No clinically apparent associated condition — no SLE, antiphospholipid syndrome or CLL; if present it is secondary immune thrombocytopenia\nPhase | Duration\nNewly diagnosed | Up to 3 months\nPersistent | 3–12 months\nChronic | More than 12 months\n\nWhat is the diagnosis of ITP? (Haem P9)\nThe diagnosis is one of exclusion.\n1. CONFIRM TRUE THROMBOCYTOPENIA\n- Repeat the platelet count in citrate\n- Exclude pseudothrombocytopenia from EDTA-induced platelet clumping\n2. EXCLUDE SECONDARY CAUSES\nGroup | What to look for\nDrugs | A full drug history\nInfections | HIV · HCV · H. pylori\nAutoimmune disease | SLE · autoimmune thyroid disease\nConsumptive disorders | TTP · HUS — look for schistocytes\nMarrow disease | Leukemia · MDS\n3. ANTIPLATELET ANTIBODY ASSAYS\n- No established role in diagnosis\n4. WHEN IS BONE MARROW EXAMINATION NEEDED?\n1. An atypical picture\n2. Age over 60 years\n3. Poor response to treatment\n4. Relapse\n5. Before splenectomy"}], "cases": [{"id": "c1", "kw": "Red glazed tongue, angular stomatitis, flat nails + Hb 6.0 with MCV 69 + platelets 600 + no bleeding reported + age 69", "dx": "Severe iron deficiency anemia", "case": 203, "sheet": "Hematology · DEPBOOK CASE 209\n• CASE\nA 69-year-old woman was admitted with\nfatigue over the past several months. She\nclaimed she had been healthy her entire life.\nProblems began 3 months ago with\ndecreased appetite and progressive\nfatigue. She denies bleeding from any\norifice.\nExamination: pallor of mucous membranes,\nthe tongue is red and glazed, angular\nstomatitis, and the nails are flat.\nTONGUE\nRed, glazed\nNAILS\nFlat\nBLEEDING\nDenied\nLABORATORY\n↓ Hb 6.0 g/dL, HCT 18.2% (41–53)\n↓ MCV 69 fL (80–96)\n↑ Platelets 600 × 10³/dL\nNormal: WBC 5 × 10³/dL with a normal differential\ncount\n• DIAGNOSTIC KEYWORDS\nRed glazed tongue, angular stomatitis,\nflat nails + Hb 6.0 with MCV 69 +\nplatelets 600 + no bleeding reported\n+ age 69\nSEVERE IRON DEFICIENCY ANEMIA\n• REVISE\nHematology → Anemia → Iron Deficiency\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hematology Cases Page 203\nA RED GLAZED TONGUE AND FLAT NAILS AT\nSIXTY-NINE\nCASE 1\nMorphologic classification of anemia\nIron studies and what each means\nWhen IDA demands endoscopy\nWhat is the diagnosis, and why?\nWHY\n1\nSevere iron deficiency anemia (IDA)\nMCV 69 — a microcytic anemia → this is the key to\nthe question — a low MCV cannot be B12 or folate\ndeficiency, which are macrocytic\nAngular stomatitis, red glazed tongue, flat nails →\nseen in both B12 and iron deficiency, though angular\nstomatitis is more a sign of iron deficiency; flat nails\nare platonychia, the stage before frank koilonychia\nPlatelets 600 → reactive thrombocytosis, which is\nassociated with IDA\nShe denies bleeding, yet is profoundly iron deficient\nat 69 → occult gastrointestinal loss until proved\notherwise\nWhat would be your first diagnostic step in evaluating\nthis patient's anemia?\n2\nSerum iron, ferritin, total iron binding capacity,\ntransferrin saturation\nReticulocyte count and stool analysis for occult blood\nUpper endoscopy and colonoscopy are mandatory\nhere — IDA in a high-risk group (males,\npostmenopausal females) requires endoscopy to\nexclude GI malignancy\nWhat are the major morphologic classifications of\nanemia based on RBC volume? Give three examples of\neach.\n3\nMicrocytic (MCV < 80 fL) — iron deficiency anemia,\nthalassemia, anemia of chronic disease\nMacrocytic (MCV > 96 fL) — vitamin B12 or folate\ndeficiency, alcohol, hypothyroidism, and reticulocytosis\nNormocytic (normal MCV) — acute blood loss,\naplastic anemia, hemolytic anemia except\nthalassemia, renal failure, bone marrow infiltration\nB12 or folate deficiency — macrocytic — MCV would be high\nThalassemia trait — microcytic but normal iron and high RBC\ncount\nAnemia of chronic disease — ferritin normal or high, TIBC low", "questions": ["What is the diagnosis, and why?", "What would be your first diagnostic step in evaluating this patient's anemia?", "What are the major morphologic classifications of anemia based on RBC volume? Give three examples of each."], "topic": "h1", "sys": "HEMA"}, {"id": "c2", "kw": "Farmer + microcytic anemia Hb 4.8, MCV 62.9 + eosinophilia 10% + occult blood positive + slender reddish worms in the duodenum", "dx": "Iron deficiency anemia from hookworm infestation", "case": 204, "sheet": "Hematology · DEPBOOK CASE 210\n• CASE\nA 26-year-old farmer was admitted with\nworsening fatigue. Examination was\nunremarkable apart from signs of anemia.\nOccult blood in stool was positive; stool culture\nshowed no pathogen.\nAbdominal ultrasonography and colonoscopy\nwere normal. Upper GI endoscopy showed\nmultiple mucosal erosions with slow oozing of\nblood and several small slender reddish worms\nin the duodenum.\nOCCUPATION\nFarmer\nSTOOL OCCULT\nBLOOD\nPositive\nDUODENUM\nSlender\nreddish\nworms\nLABORATORY\n↓ Hb 4.8 g/dL, HCT 15.6%\n↓ MCV 62.9 fL (78–100)\n↑ Eosinophils 10% (1–6)\nNormal: WBC 9.02 × 10³/dL; abdominal\nultrasonography and colonoscopy\n• DIAGNOSTIC KEYWORDS\nFarmer + microcytic anemia Hb 4.8, MCV\n62.9 + eosinophilia 10% + occult blood\npositive + slender reddish worms in the\nduodenum\nIRON DEFICIENCY ANEMIA FROM\nHOOKWORM INFESTATION\n• REVISE\nHematology → Anemia → Iron Deficiency\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hematology Cases Page 204\nWORMS IN THE DUODENUM OF A YOUNG\nFARMER\nCASE 2\nHookworm life cycle and eggs\nAnemia with eosinophilia\nAnthelminthic regimens\nWhat is the diagnosis, and why?\nWHY\n1\nIron deficiency anemia with eosinophilia due to\nparasitic infestation — hookworm, Ancylostoma\nduodenale\nHookworm is one of the commonest parasites in\nthe world and is usually associated with\neosinophilia. The characteristic shape of the egg\non microscopic stool examination is diagnostic\nSlender reddish worms in the duodenum with\noozing erosions → the worms are seen directly,\nand they feed by attaching to mucosa and\ndrawing blood\nEosinophilia 10% → anemia plus eosinophilia\nshould turn you to parasites before anything\nelse\nMCV 62.9 with Hb 4.8 → severe iron deficiency\nfrom chronic occult blood loss\nA farmer — barefoot soil exposure → the route\nof larval entry through the skin\n2 What is the treatment?\nMebendazole 100 mg orally twice daily for 3\ndays, or 500 mg orally as a single dose; give a\nsecond course if not cured in 3–4 weeks\nOr albendazole 400 mg/day orally as a one-time\ndose\nOral iron supplementation\nPeptic ulcer bleeding — no eosinophilia, no worms seen\nCeliac disease — malabsorptive, endoscopy shows villous\natrophy\nColonic malignancy — colonoscopy was normal here", "questions": ["What is the diagnosis, and why?", "What is the treatment?"], "topic": "h1", "sys": "HEMA"}, {"id": "c3", "kw": "Microcytic anemia since childhood + MCV 62.7 but ferritin 200 — NORMAL iron + years of self-prescribed iron without response + consanguinity + no transfusion, no bone pain", "dx": "Beta thalassemia trait", "case": 216, "sheet": "Hematology · DEPBOOK CASE 222\n• CASE\nA 19-year-old Egyptian female\nfrom El Menia presents for\nevaluation of anemia, 7 months\npregnant. No bleeding or episodic\nbone pain, and no\nhepatosplenomegaly or\nlymphadenopathy. No previous\ntransfusion, but repeated oral iron\nintake by herself for mild anemia\nsince childhood. Positive\nconsanguinity.\nPREGNANCY\n7\nmonths\nFERRITIN\n200\nng/dL —\nnormal\nPARENTS\nConsanguineous\nLABORATORY\n↓ Hb 8.8 g/dL, MCV 62.7 fL\n– Leukocytes 5,400/µL, platelets\n251,000/µL (both normal)\n• DIAGNOSTIC KEYWORDS\nMicrocytic anemia since\nchildhood + MCV 62.7 but\nferritin 200 — NORMAL iron\n+ years of self-prescribed\niron without response +\nconsanguinity + no\ntransfusion, no bone pain\nBETA THALASSEMIA TRAIT\n• REVISE\nHematology → Hemoglobinopathies\n→ Thalassemia\n• ANSWER\nStudy Smarter Hematology Cases Page 216\nYEARS OF IRON FOR AN ANEMIA THAT WAS\nNEVER IRON\nCASE 14\nHbA2 and HbF in beta trait\nAlpha versus beta thalassemia\ntrait\nThe Mentzer index\nWhat is the diagnosis, and why?\nWHY\n1\nThe classic presentation of thalassemia trait — she was\nmisdiagnosed as iron deficient and received iron preparations\nwithout ever having her iron status investigated, and it is\nnormal in most cases of thalassemia trait\nFerritin 200 with an MCV of 62.7 → a microcytic anemia with\nnormal iron stores is not iron deficiency — this pairing\nmakes the diagnosis\nAnemia since childhood, no response to years of iron, with\nconsanguinity → a lifelong inherited defect, not an acquired\ndeficiency\nNo bone pain, no transfusion, no organomegaly → trait, not\nthalassemia major or intermedia\nWhat would support a diagnosis of beta thalassemia trait rather\nthan simple iron deficiency?\n2\nA consistent finding in carriers of beta thalassemia is\nmicrocytic anemia with an ELEVATED RBC count, and a\nsmear showing microcytic hypochromic red cells and target\ncells. Iron deficiency is instead associated with an increased\nred cell distribution width (RDW) and a decreased RBC\ncount\nConfirmation is by hemoglobin electrophoresis — in beta\nthalassemia trait an increased HbA2, ranging 3.5% to 7%\n(mean 5%), with HbF 1% to 3%, raised in about 50% of\npatients\nWhat is her possible diagnosis if her Hb electrophoresis and iron\nprofile were normal?\n3\nAlpha thalassemia trait, from a deletion of 2 alpha globin\ngenes — a mild hypochromic microcytic anemia in an\nasymptomatic or minimally symptomatic individual.\nElectrophoresis is typically NORMAL, unlike the raised HbA2\nof beta thalassemia; confirmed by genetic studies of alpha\nglobin gene mutations\nIs there a simple index to differentiate between iron deficiency and\nthalassemia?\n4\nThe Mentzer Index = MCV divided by the RBC count. In iron\ndeficiency the marrow cannot produce as many red cells and\nthey are small, so RBC count and MCV are both low and the\nindex is greater than 13. In thalassemia, a disorder of globin\nsynthesis, the RBC count is normal but the cells are smaller, so\nthe index is less than 13", "questions": ["What is the diagnosis, and why?", "What would support a diagnosis of beta thalassemia trait rather than simple iron deficiency?", "What is her possible diagnosis if her Hb electrophoresis and iron profile were normal?", "Is there a simple index to differentiate between iron deficiency and thalassemia?"], "topic": "h1", "sys": "HEMA"}, {"id": "c4", "kw": "Episodic hemolysis since age 4, triggered by infection + dark urine, jaundice, splenomegaly + reticulocytes 10% + Heinz bodies + male, with an affected uncle", "dx": "Hereditary chronic hemolytic anemia — G6PD deficiency", "case": 206, "sheet": "Hematology · DEPBOOK CASE 212\n• CASE\nAn 18-year-old boy presented with\nvomiting and crampy right upper\nabdominal pain for two days, with\ndark-coloured urine and pallor. The\ncondition was recurrent, infrequently,\nfrom the age of 4 years, mainly after\ninfection. He received his first blood\ntransfusion at that time.\nExamination: pallor, jaundice and\nsplenomegaly. His uncle had a similar\ncondition.\nONSET\nAge 4,\nafter\ninfections\nSPLEEN\nEnlarged\nFAMILY\nUncle\naffected\nLABORATORY\n↓ Hb 7.8 g/dL, RBC 2.9 × 10⁶/dL\n↑ Reticulocytes 10% (0.5–2)\n+ Heinz bodies in peripheral blood\nNormal: WBC 6 × 10³/dL, platelets 342 ×\n10³/dL\n• DIAGNOSTIC KEYWORDS\nEpisodic hemolysis since age 4,\ntriggered by infection + dark\nurine, jaundice, splenomegaly +\nreticulocytes 10% + Heinz bodies\n+ male, with an affected uncle\nHEREDITARY CHRONIC\nHEMOLYTIC ANEMIA — G6PD\nDEFICIENCY\n• REVISE\nHematology → Hemolytic Anemias\n• ANSWER\nStudy Smarter Hematology Cases Page 206\nDARK URINE AFTER INFECTION, SINCE THE AGE\nOF FOUR\nCASE 4\nG6PD: triggers and drug list\nHeinz bodies and bite cells\nQuantitative G6PD assay timing\nWhat is the diagnosis, and why?\nWHY\n1\nA hereditary chronic hemolytic anemia running from age\n4 to 18 — either G6PD deficiency, hereditary\nspherocytosis or a hemoglobinopathy. Being male with a\nsimilar condition in the family supports a sex-linked\ncondition, so G6PD deficiency\nMale, with an affected uncle → the inheritance pattern\nis the discriminator — an affected uncle on the mother's\nside fits an X-linked condition, passing through carrier\nmothers to sons\nHeinz bodies → denatured hemoglobin inclusions — the\nhallmark of oxidative red cell damage\nAttacks follow infection → infection is a classic oxidative\ntrigger\nDark urine with reticulocytes 10% → hemoglobinuria\nfrom intravascular hemolysis, with brisk marrow response\n2 What are the trigger factors for this anemia?\nInfections, bacterial or viral\nDrugs — antibiotics, especially sulfonamides, NSAIDs, and\nquinidine\nFava beans (broad beans) — the classic trigger, causing\nfavism\n3 What are the investigations needed?\nEvidence of hemolysis — reticulocytosis, raised indirect\nbilirubin, low haptoglobin, raised LDH, urine analysis for\nhemoglobinuria\nQuantitative G6PD assay, in units of enzyme per gram of\nhemoglobin — normal 5.5–8.8 at 25°C, 8.0–13.5 at 37°C\nAbdominal ultrasonography to detect gallstones and the\nsize of the spleen\n4 What is the treatment?\nThe most effective management is to prevent hemolysis by\navoiding oxidative stress — identification and\ndiscontinuation of the precipitating agent is critical\nPatients must avoid fava beans and certain drugs such as\nsulfonamides\nSpontaneous recovery from hemolytic crises is the usual\noutcome. In acute severe hemolysis, blood transfusion\nmay be needed, and folic acid is given", "questions": ["What is the diagnosis, and why?", "What are the trigger factors for this anemia?", "What are the investigations needed?", "What is the treatment?"], "topic": "h2", "sys": "HEMA"}, {"id": "c5", "kw": "Recurrent jaundice with bony and abdominal pain + severe pain barely touched by opioid + reticulocytes 5% with indirect hyperbilirubinemia + consanguinity with two affected siblings", "dx": "Sickle cell anemia in vaso-occlusive crisis", "case": 207, "sheet": "Hematology · DEPBOOK CASE 213\n• CASE\nA 15-year-old female came with recurrent\njaundice for the last 6 months, with\nepisodes of bony and abdominal pain\nassociated with fever. She presented with\nbony aches, received meperidine 75 mg IM\nan hour after arrival and every 3 hours\nthereafter, and reported minimal pain relief.\nExamination showed jaundice. Family\nhistory reveals positive consanguinity; her\nbrother and sister also have a similar\ncondition.\nPAIN RELIEF\nMinimal on\nopioid\nFAMILY\nBrother and\nsister\nPARENTS\nConsangu
