C KEYWORDS\nThree days of worsening left lower\nquadrant pain + fever 38°C +\nrebound tenderness localised to the\nLLQ + no free air, occult blood\nnegative\nACUTE SIGMOID DIVERTICULITIS,\nCOMPLICATED BY LOCALIZED\nPERITONITIS\n• REVISE\nGastroenterology → Major Manifestations\n(abdominal pain, GIT bleeding)\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 85\nLEFT ILIAC FOSSA PAIN WITH FEVER AND\nREBOUND\nCASE 17\nCauses of left iliac fossa pain\nComplicated versus uncomplicated\ndiverticulitis\nWhen CT rather than colonoscopy\nWhat is the diagnosis, and why?\nWHY\n1\nAcute sigmoid diverticulitis\nDiverticulitis is inflammation of one or more diverticulae.\nFecal material or undigested food collects in a\ndiverticulum causing obstruction, then erosion of the\ndiverticular wall, resulting in inflammation, focal\nnecrosis and perforation\nPain and tenderness fixed in the left lower quadrant →\nthe sigmoid — the segment where diverticula are\ncommonest\nFever 38°C with a neutrophil leukocytosis → an\ninfective inflammatory process, not simple diverticulosis\nRebound tenderness confined to the LLQ → localized\nperitonitis — the inflammation has reached the parietal\nperitoneum\nDiarrhea first, then difficult evacuation → mucosal\nirritation followed by inflammatory narrowing of the\nsigmoid\nNo pneumoperitoneum, occult blood negative, Hb\nnormal → no free perforation, and it argues against\ncarcinoma and ischemic colitis\n2 What is the most appropriate next step?\nCT scan of the abdomen — it confirms the diagnosis\nand excludes a pericolic abscess or other complications\nsuch as fistula formation\nColonoscopy is not recommended during the acute\nepisode — increased risk of perforation\n3 Describe treatment outlines in this case.\nTreatment depends on whether the disease is\ncomplicated or uncomplicated. This case is complicated\n— localized peritonitis with a possible pericolic abscess\n— so admission for intravenous antibiotics and follow\nup is recommended\nAbscess ≥ 4 cm → CT-guided drainage together with\nparenteral antibiotics\nIn selected uncomplicated cases, oral antibiotics may be\nused — for example ciprofloxacin (or trimethoprim-sulfamethoxazole) plus metronidazole for 7–10 days\nCases complicated by perforation → emergency\nsurgery", "questions": ["What is the diagnosis, and why?", "What is the most appropriate next step?", "Describe treatment outlines in this case."], "topic": "g3", "sys": "GI"}, {"id": "c9", "kw": "Age 68 + left iliac fossa pain with low-grade fever for 3 days + altered bowel habits, constipation and bloating + no signs of peritonitis + raised WBC and CRP", "dx": "Acute uncomplicated sigmoid diverticulitis", "case": 96, "sheet": "Gastroenterology · DEPBOOK CASE 102\n• CASE\nA 68-year-old male presents to the\nemergency department with left lower\nquadrant abdominal pain, low-grade\nfever, and altered bowel habits for the\npast three days. He reports occasional\nconstipation and bloating.\nOn examination, he has localized\ntenderness over the left iliac fossa\nwithout signs of peritonitis. Blood tests\nshow mild leukocytosis and elevated\nCRP. Based on his clinical presentation, a\ndiagnosis of sigmoid diverticulitis is\nmade.\nDURATION\n3 days\nFEVER\nLow grade\nLIF\nTender, no\nperitonism\nCRP\nElevated\nLABORATORY\n↑ WBC — mild leukocytosis\n↑ CRP elevated\n• DIAGNOSTIC KEYWORDS\nAge 68 + left iliac fossa pain with\nlow-grade fever for 3 days + altered\nbowel habits, constipation and\nbloating + no signs of peritonitis +\nraised WBC and CRP\nACUTE UNCOMPLICATED SIGMOID\nDIVERTICULITIS\n• REVISE\nGastroenterology → Major Manifestations\n(abdominal pain, GIT bleeding)\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Gastroenterology Cases Page 96\nUNCOMPLICATED DIVERTICULITIS AND HOW TO\nSTOP IT RECURRING\nCASE 28\nDiverticular disease: formation and risk\nfactors\nComplicated versus uncomplicated\ndiverticulitis\nDietary fibre and colonic transit\nWhat is the diagnosis, and why?\nWHY\n1\nAcute sigmoid diverticulitis, and on these findings the\nuncomplicated form\nPain and tenderness localised to the left iliac fossa →\nthe sigmoid colon, where diverticula are commonest in\nWestern populations\nLow-grade fever with a mild leukocytosis and raised\nCRP → an inflammatory and infective process, but a\ncontained one\nNo signs of peritonitis → the inflammation has not\nperforated freely — this is what makes it uncomplicated\nA background of constipation and bloating → the low-fibre, high-pressure colon in which diverticula form\nAltered bowel habit over only 3 days → acute\ninflammation rather than the months-long change of a\ncarcinoma\nList two complications of diverticulitis that may require\nsurgical intervention?\nOTHER POTENTIAL COMPLICATIONS\n2\nPerforation with peritonitis\nFistula formation — for example a colovesical fistula\nLarge abscess not suitable for percutaneous drainage\nBowel obstruction\nRecurrent diverticulitis with strictures\nIdentify two key lifestyle modifications that can help\nprevent recurrent diverticular disease episodes?\nADDITIONAL MEASURES\n3\nIncrease dietary fiber — fruits, vegetables, whole grains\nRegular physical activity to support bowel health\nAdequate hydration\nWeight loss\nAvoiding smoking\nColorectal carcinoma — months of altered habit, weight loss,\nanemia\nIschemic colitis — bloody diarrhea, vascular risk factors\nIrritable bowel syndrome — no fever, no leukocytosis, no CRP\nrise", "questions": ["What is the diagnosis, and why?", "List two complications of diverticulitis that may require surgical intervention?", "Identify two key lifestyle modifications that can help prevent recurrent diverticular disease episodes?"], "topic": "g3", "sys": "GI"}, {"id": "c10", "kw": "Pregnant at 30 weeks + known ileal Crohn's + 2 weeks of fever and constant RUQ pain to the back + bowel habit unchanged + bandemia but normal LFTs and urine", "dx": "Febrile right upper quadrant pain in pregnancy — a differential to be imaged", "case": 78, "sheet": "Gastroenterology · DEPBOOK CASE 84\n• CASE\nA 34-year-old gravid woman with a\nhistory of ileal Crohn's disease presented\nat 30 weeks' gestation with a 2-week\nhistory of fever up to 38.6°C, right upper\nquadrant pain, nausea but no vomiting.\nRight upper quadrant pain was constant\nand radiated to her back. She did not\nexperience any changes in her bowel\nhabits. On examination, she had a gravid\nabdomen with normal bowel sounds and\nsignificant tenderness on palpation of the\nright upper quadrant.\nGESTATION\n30 weeks\nTEMPERATURE\nup to\n38.6°C\nBOWEL\nHABIT\nUnchanged\nLABORATORY\n↑ WBC 12 × 10⁹/L (75% neutrophils, 12%\nbands)\nNormal: Urinalysis and culture, liver function,\nmetabolic profile\n• DIAGNOSTIC KEYWORDS\nPregnant at 30 weeks + known ileal\nCrohn's + 2 weeks of fever and\nconstant RUQ pain to the back +\nbowel habit unchanged + bandemia\nbut normal LFTs and urine\nFEBRILE RIGHT UPPER QUADRANT\nPAIN IN PREGNANCY — A\nDIFFERENTIAL TO BE IMAGED\n• REVISE\nGastroenterology → Inflammatory Bowel\nDisease\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 78\nFEVER AND RIGHT UPPER QUADRANT PAIN AT 30\nWEEKS IN CROHN'S\nCASE 10\nCrohn's disease: transmural\ncomplications\nIBD in pregnancy and the MDT\napproach\nImaging safety in pregnancy\nWhat is the diagnosis, and why?\nWHY\n1\nA febrile intra-abdominal process in a pregnant\nwoman with Crohn's disease — the differential\nincludes Crohn's flare, intra-abdominal abscess,\ncholecystitis and appendicitis\nTwo weeks of fever with a bandemia → a suppurative\nprocess, not a simple flare\nPain constant, radiating to the back → retroperitoneal\nor biliary, not the colic of obstruction\nBowel habit unchanged → argues against a\nstraightforward luminal Crohn's flare\nUrinalysis, culture and LFTs normal → pyelonephritis\nexcluded, biliary obstruction unlikely\nThe gravid uterus displaces the appendix upward →\nappendicitis can present in the RUQ at 30 weeks\nDiscuss the differential diagnosis\nCROHN'S RELATED\nOBSTETRIC\nOTHER\n2\nFlare; stricture or obstruction (adhesions,\ninflammatory); perforation (rare, but serious); abscess;\nfistula; short bowel syndrome if there is a history of\nresection\nPreterm labor, placental abruption, round ligament\npain, uterine rupture (rare, especially with prior uterine\nsurgery)\nAppendicitis — location altered by pregnancy —\ncholecystitis, pancreatitis, UTI or pyelonephritis\nManagement requires an MDT: gastroenterologist,\ngynecologist and surgeon\n3 How to reach your diagnosis?\nCT scan is the \"gold standard\" diagnostic study for this\ndifferential\nBut radiation risk is greatest at 8–15 weeks'\ngestation, and high doses still pose a risk through the\nsecond and third trimesters — reduced IQ, increased\ncancer risk in adulthood, and increased genetic risk to\nfuture generations\nMR study is the safer choice in this case", "questions": ["What is the diagnosis, and why?", "Discuss the differential diagnosis", "How to reach your diagnosis?"], "topic": "g3", "sys": "GI"}, {"id": "c11", "kw": "Type 2 diabetic + metformin already stopped + 2 weeks of watery nocturnal diarrhea + ciprofloxacin 6 weeks earlier + many fecal leukocytes + afebrile with normal vitals", "dx": "Clostridioides difficile infection — antibiotic-associated colitis", "case": 82, "sheet": "Gastroenterology · DEPBOOK CASE 88\n• CASE\nA 54-year-old female presents with a 2\nweeks history of watery diarrhea\nwithout fever. The patient reports passing\n6 to 8 watery stools daily. She has\nnocturnal diarrhea. There is nausea but\nno vomiting. Patient is diabetic (type 2),\nand treatment was switched recently\nfrom metformin to insulin.\nApproximately 6 weeks before the onset\nof diarrhea, she received a course of\nciprofloxacin for a urinary tract infection.\nOn examination: Vital signs are normal\nand abdominal examination shows mild\nnon specific tenderness.\nLABORATORY\n↑ Stool leukocytes — many (an\ninflammatory diarrhea)\nNormal: Vital signs, temperature\n• DIAGNOSTIC KEYWORDS\nType 2 diabetic + metformin already\nstopped + 2 weeks of watery\nnocturnal diarrhea + ciprofloxacin 6\nweeks earlier + many fecal\nleukocytes + afebrile with normal\nvitals\nCLOSTRIDIOIDES DIFFICILE\nINFECTION — ANTIBIOTIC-ASSOCIATED COLITIS\n• REVISE\nGastroenterology → Diarrhea\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 82\nWATERY NOCTURNAL DIARRHEA SIX WEEKS\nAFTER CIPROFLOXACIN\nCASE 14\nC. difficile: diagnosis and treatment\nDiabetic diarrhea and autonomic\nneuropathy\nInflammatory versus non-inflammatory\ndiarrhea\nWhat is the diagnosis, and why?\nWHY\n1\nClostridium difficile infection (CDI) —\npseudomembranous or antibiotic-associated colitis\nAntibiotic exposure within the preceding weeks →\nciprofloxacin disrupts the colonic flora; CDI risk persists\nfor up to 3 months after the course\nMany fecal leukocytes → an inflammatory diarrhea —\nthis excludes the osmotic and secretory causes\nDiarrhea persists at night → organic, not functional or\ndiabetic-autonomic\nDiarrhea although metformin has been replaced by\ninsulin → the commonest drug cause of diarrhea in a\ndiabetic is no longer being taken\nDiabetes itself → an immunocompromising comorbidity\nthat raises CDI risk\nWhat are the causes of diarrhea related to diabetes\nmellitus, and what is the most likely diagnosis?\nCAUSES RELATED TO DIABETES\nMOST LIKELY HERE\n2\nAutonomic neuropathy affecting GIT motility\nSmall intestinal bacterial overgrowth\nMetformin induced diarrhea\nCeliac disease (autoimmune) in type 1 diabetes mellitus\nCertain dietary sweeteners\nSignificant watery diarrhea including nocturnal\ndiarrhea with increased fecal leukocytes indicates an\ninfectious cause. With the history of antibiotic use, C.\ndifficile infection is the most likely\n3 What are the investigations needed for diagnosis?\nGlutamate dehydrogenase (GDH) and nucleic acid\namplification testing (NAAT) have the higher sensitivity\nfor diagnosing CDI\nIf not available, send three sequential stool samples for\nELISA-based C. difficile enterotoxins — combining the\nthree gives a sensitivity of about 95%\nSigmoidoscopy is not routine — the colonic mucosa is\nvery edematous and friable and the risk of perforation is\nhigh. When done, 2–10 mm raised yellow nodules or a\nvisible pseudomembrane is pathognomonic", "questions": ["What is the diagnosis, and why?", "What are the causes of diarrhea related to diabetes mellitus, and what is the most likely diagnosis?", "What are the investigations needed for diagnosis?"], "topic": "g4", "sys": "GI"}, {"id": "c12", "kw": "One month of bloody diarrhea, day and night + fever and 5 kg weight loss + aphthous ulcers and a perianal fissure + pelvic irradiation 9 years ago + antibiotic 3 months ago", "dx": "Chronic inflammatory (colitic) diarrhea — a differential, not one answer", "case": 74, "sheet": "Gastroenterology · DEPBOOK CASE 80\n• CASE\nA 50-year-old man reports a 1-month\nhistory of bloody diarrhea throughout\nthe day and night. He notes decreased\nappetite, nausea and vomiting,\nintermittent fever, and a 5 kg weight\nloss. There are no rashes, joint aches, or\neye symptoms. He has a history of\nprostate cancer treated with radiation\ntherapy 9 years ago. A screening\ncolonoscopy 6 years ago was normal. He\ntook an antibiotic 3 months ago after a\ntooth extraction.\nPhysical exam is notable for pallor,\naphthous ulcers, diffuse abdominal\ntenderness without masses; perianal\nexam is notable for a small fissure and\ntwo external hemorrhoids; rectal exam is\nnotable for guaiac-positive liquid stool.\n• DIAGNOSTIC KEYWORDS\nOne month of bloody diarrhea, day\nand night + fever and 5 kg weight\nloss + aphthous ulcers and a perianal\nfissure + pelvic irradiation 9 years\nago + antibiotic 3 months ago\nCHRONIC INFLAMMATORY\n(COLITIC) DIARRHEA — A\nDIFFERENTIAL, NOT ONE ANSWER\n• REVISE\nGastroenterology → Diarrhea /\nInflammatory Bowel Disease\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 74\nBLOODY DIARRHEA AFTER PELVIC IRRADIATION\nAND ANTIBIOTICS\nCASE 6\nClassification of diarrhea by mechanism\nIBD: ulcerative colitis versus Crohn's\ncolitis\nFecal calprotectin and stool studies\nWhat is the diagnosis, and why?\nWHY\n1\nChronic bloody diarrhea with systemic symptoms — an\ninflammatory (colitic) diarrhea that must be worked\nup, not labelled\nBlood in the stool with fever and weight loss →\ninflammatory diarrhea — mucosal damage, not an\nosmotic or secretory process\nDiarrhea continues at night → organic disease;\nfunctional diarrhea spares sleep\nAphthous ulcers and a perianal fissure → raise Crohn's\nspecifically\nPelvic radiation 9 years ago → radiation proctocolitis\ncan appear years later\nAntibiotic 3 months ago → puts C. difficile firmly on the\nlist\n2 Discuss the differential diagnosis?\nChronic inflammatory bowel disease — ulcerative colitis\nand Crohn's colitis\nInfectious colitis — especially C. difficile, given the\nrecent antibiotic\nRadiation colitis — he had pelvic irradiation\nIschemic colitis or colorectal cancer\nHow would you proceed for diagnosis?\nLABORATORY\nENDOSCOPIC EVALUATION\n3\nCBC, LFTs, serum albumin, coagulation profile, ESR or\nCRP\nStool analysis for fecal leukocytes, ova and parasites;\nstool cultures. Fecal calprotectin supports a diagnosis\nof IBD\nC. difficile testing — mandatory here because antibiotics\nwere used in the prior 3 months: a cytotoxic assay or,\nmore specifically, NAAT\nSigmoidoscopy or colonoscopy is indicated in all\npatients with chronic bloody diarrhea — it separates\nIBD, infectious, ischemic and radiation colitis from cancer.\nBiopsy all abnormal regions\nEnteroscopy and MRI enterography when those are not\ndiagnostic and small bowel pathology is still suspected", "questions": ["What is the diagnosis, and why?", "Discuss the differential diagnosis?", "How would you proceed for diagnosis?"], "topic": "g4", "sys": "GI"}, {"id": "c13", "kw": "Chronic watery diarrhea > 4 weeks + non-bloody, non-fatty + nocturnal stools + 5 kg weight loss + insidious onset", "dx": "Chronic watery diarrhea, organic — cause still to be determined", "case": 75, "sheet": "Gastroenterology · DEPBOOK CASE 81\n• CASE\nA 61-year-old woman reports a 3-month\nhistory of watery diarrhea. Her\nsymptoms started insidiously without a\nclear precipitant. She describes 4–7\nbowel movements each day and at night,\nassociated with mild, diffuse abdominal\ndiscomfort. She has experienced a 5 kg\nweight loss.\nDURATION\n3 months\nSTOOLS\n4–7 / day\nand at\nnight\nWEIGHT\n− 5 kg\n• DIAGNOSTIC KEYWORDS\nChronic watery diarrhea > 4 weeks +\nnon-bloody, non-fatty + nocturnal\nstools + 5 kg weight loss + insidious\nonset\nCHRONIC WATERY DIARRHEA,\nORGANIC — CAUSE STILL TO BE\nDETERMINED\n• REVISE\nGastroenterology → Diarrhea\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 75\nTHREE MONTHS OF WATERY DIARRHEA, DAY\nAND NIGHT\nCASE 7\nOsmotic, secretory, functional and\ninflammatory diarrhea\nStool osmotic gap and the fasting test\nMicroscopic colitis\nWhat is the diagnosis, and why?\nWHY\n1\nChronic watery diarrhea — lasting more than 4 weeks,\nwith non-bloody, non-fatty stools\nMore than 4 weeks of watery stool → chronic — acute\ngastroenteritis is out\nWatery, not bloody and not greasy → neither\ninflammatory nor fatty diarrhea\nWakes her at night, with 5 kg weight loss → organic\ndisease, not functional\nAge 61, insidious onset → microscopic colitis, a\nsecretory cause or a tumour must be excluded\n2 What is the differential diagnosis of this case?\na. Osmotic — poorly absorbed substances: lactose\nintolerance, Mg-containing antacids or laxatives. Stops\nwith fasting; high osmotic gap (> 125 mOsm/kg)\nb. Secretory — no response to fasting, normal osmotic\ngap. Mostly non-inflammatory: chronic secretory\ninfection, medications, bile acid malabsorption,\nmicroscopic colitis, vasculitis, stimulant laxatives,\nendocrinopathies, tumors (VIPomas)\nc. Functional — a motility disorder without structural\ncause, by ROME IV\nd. Inflammatory diarrhea is classically not in this group\n— it has blood, mucosal damage and systemic signs.\nMicroscopic colitis is the exception, watery but\ninflammatory on histology\nDiscuss how would you approach the diagnosis of such\ncase?\nLABORATORY\nENDOSCOPY AND IMAGING\n3\nOsmotic gap. Stool — fecal fat quantitative and\nqualitative, microscopy, culture, C. difficile, calprotectin\nCBC, CRP, ESR, metabolic panel; celiac serology;\nhormonal assay (TSH, VIP, gastrin); lactose breath test;\nurinary 5-HIAA\nColonoscopy with biopsy; upper endoscopy with\nduodenal biopsy for celiac\nCapsule endoscopy and enteroscopy if small bowel\npathology is suspected; ultrasound, CT or MRI\nenterography", "questions": ["What is the diagnosis, and why?", "What is the differential diagnosis of this case?", "Discuss how would you approach the diagnosis of such case?"], "topic": "g4", "sys": "GI"}, {"id": "c14", "kw": "Greasy, foul-smelling stools + bloating and flatulence + 4 kg weight loss + epigastric and RUQ tenderness + iron deficiency anemia", "dx": "Steatorrhea from fat malabsorption — cause still to be found", "case": 76, "sheet": "Gastroenterology · DEPBOOK CASE 82\n• CASE\nA 49-year-old woman presents with\nseveral weeks of diarrhea described as 2–\n5 semi-formed stools per day that are\nnon-bloody, greasy, and foul-smelling.\nShe is constantly \"gassy\" and bloated\nand notes a decreased appetite, mild\nfatigue, and a 4 kg weight loss over the\npast 2–3 months.\nPhysical exam is notable for a thin,\nanxious woman whose abdomen is\ndistended with mild epigastric and right\nupper quadrant tenderness.\nLABORATORY\n↓ Iron-deficiency anemia (on laboratory\nstudies)\n• DIAGNOSTIC KEYWORDS\nGreasy, foul-smelling stools +\nbloating and flatulence + 4 kg weight\nloss + epigastric and RUQ\ntenderness + iron deficiency anemia\nSTEATORRHEA FROM FAT\nMALABSORPTION — CAUSE STILL\nTO BE FOUND\n• REVISE\nGastroenterology → Malabsorption\nSyndrome\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 76\nGREASY FOUL-SMELLING STOOLS WITH IRON\nDEFICIENCY\nCASE 8\nMechanisms of malabsorption\nFecal elastase and stool fat testing\nCeliac disease and SIBO\nChronic pancreatitis — epigastric pain\nto the back, low fecal elastase,\ncalcification\nCeliac disease — positive serology,\nvillous atrophy on duodenal biopsy\nGiardiasis — cysts on stool microscopy,\nresponds to metronidazole\nWhat is the diagnosis, and why?\nWHY\n1\nSteatorrhea — fatty, greasy, foul smelling stools due to\nfat malabsorption, with weight loss\nCaused by pancreatic insufficiency (chronic pancreatitis,\ntumors, cystic fibrosis), a small intestinal mucosal\ndisorder (celiac, giardiasis, tropical sprue, Whipple's,\nSIBO, short bowel), bile salt deficiency (cholestasis,\ncirrhosis, ileal disease), or lymphatic obstruction\n(lymphoma, lymphangiectasia)\nStools are greasy and foul smelling → undigested fat\n— the definition of steatorrhea\nNon-bloody, semi-formed, only 2–5 a day → not an\ninflammatory or a high-volume secretory diarrhea\nBloating and constant flatulence → unabsorbed\nsubstrate fermented by colonic bacteria\nWeight loss with a thin, distended abdomen → calories\nare being lost in the stool\nIron deficiency anemia → a duodenal absorptive defect\n— iron is absorbed in duodenum and upper jejunum\nDiscuss how would you approach the diagnosis and the\npossible management?\nSTOOL\nBLOOD AND BREATH\nIMAGING AND ENDOSCOPY\n2\nSystematic assessment to identify and treat the\nunderlying cause — steatorrhea is a finding, not a\ndiagnosis\nOva and parasites\nStool fat — qualitative by Sudan stain, or 72-hour\nquantitative\nFecal elastase for exocrine pancreatic insufficiency\nLFTs, vitamin levels, celiac serology\nBreath test for SIBO\nAbdominal ultrasound or CT for pancreas, liver and\nsmall intestine; MRCP or ERCP for biliary obstruction\nUpper endoscopy and biopsy for celiac, tropical sprue or\nWhipple disease\nColonoscopy for ileal pathology such as Crohn's disease", "questions": ["What is the diagnosis, and why?", "Discuss how would you approach the diagnosis and the possible management?"], "topic": "g4", "sys": "GI"}, {"id": "c15", "kw": "Six years of large volume, frothy, greasy, foul-smelling stools with undigested food + no blood or mucus + short stature and delayed puberty + pallor, angular stomatitis and cheilitis", "dx": "Small bowel diarrhea with malabsorption and its nutritional consequences", "case": 79, "sheet": "Gastroenterology · DEPBOOK CASE 85\n• CASE\nA 16-year-old boy presents complaining\nof diarrhea for 6 years. He passes 4–5\nlarge volume stools daily, which are\nfrothy, greasy and foul smelling, and\ncontain undigested food material. The\nstools show no visible blood, mucus or\npus. He has postprandial abdominal\nbloating, generalized weakness and easy\nfatigability but no abdominal pain, fever\nor joint pains. His parents mentioned that\nhe is not growing well.\nOn examination: Height 150 cm, weight\n32 kg, BMI 14.2. Normal blood sugar level.\nHe is pale with angular stomatitis and\ncheilitis and no apparent secondary\nsexual characters.\nHEIGHT / WEIGHT\n150 cm / 32 kg\nBMI\n14.2\nPUBERTY\nNo secondary\nsexual characters\nSTOOLS\n4–5 large volume\n/ day\n• DIAGNOSTIC KEYWORDS\nSix years of large volume, frothy,\ngreasy, foul-smelling stools with\nundigested food + no blood or\nmucus + short stature and delayed\npuberty + pallor, angular stomatitis\nand cheilitis\nSMALL BOWEL DIARRHEA WITH\nMALABSORPTION AND ITS\nNUTRITIONAL CONSEQUENCES\n• REVISE\nGastroenterology → Malabsorption\nSyndrome\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 79\nSIX YEARS OF BULKY STOOLS IN A BOY WHO\nSTOPPED GROWING\nCASE 11\nMechanisms of malabsorption\nCeliac disease: serology and biopsy\nD-xylose, breath tests and fecal\nelastase\nWhat is the diagnosis, and why?\nWHY\n1\nSmall bowel diarrhea associated with malabsorption\nLarge volume, frothy, greasy, foul smelling stool with\nundigested material → the signature of small bowel\n(malabsorptive) diarrhea, not colonic\nNo blood, mucus or pus, and no pain or fever → not an\ninflammatory or colonic process\nHeight 150 cm, BMI 14.2, no secondary sexual\ncharacters → six years of malabsorbed calories →\nshort stature and delayed puberty\nPallor, angular stomatitis and cheilitis → iron and B-complex deficiency — the mouth records what the gut\nfailed to absorb\n2 Enumerate other possible causes?\nCeliac disease\nSmall intestinal bacterial overgrowth\nParasitic infestations\nCrohn's disease\nLactose intolerance\nChronic pancreatitis\nWhat are the investigations suggested to reach the\ndiagnosis of this condition?\nSTOOL AND BLOOD\nFUNCTIONAL TESTS\nENDOSCOPY AND IMAGING\n3\nStool analysis — fat content, parasites such as Giardia,\npus and blood indicating inflammation. CBC for anemia\nIgA anti-endomysial and anti-transglutaminase\nantibodies for celiac disease\nDeficient nutrients — serum albumin, iron, calcium,\nvitamin B₁₂\n5-hour urinary D-xylose excretion; lactose hydrogen\nbreath test\nFecal elastase — low means exocrine pancreatic\ninsufficiency; secretin test\nUpper endoscopy with jejunal biopsy; capsule\nendoscopy for small bowel beyond the gastroscope\nCT or MR enterography for bowel wall edema, strictures\nor fistulae. Intestinal ultrasound has a promising role", "questions": ["What is the diagnosis, and why?", "Enumerate other possible causes?", "What are the investigations suggested to reach the diagnosis of this condition?"], "topic": "g4", "sys": "GI"}, {"id": "c16", "kw": "Two months of fever with night sweats + 9 kg weight loss + watery diarrhea and right iliac fossa pain + ESR 110 and albumin 2.1 + thickened bowel loops with enlarged mesenteric nodes on CT", "dx": "Tuberculous enteritis (ileocecal tuberculosis)", "case": 83, "sheet": "Gastroenterology · DEPBOOK CASE 89\n• CASE\nA 32-year-old female has a 2 months\nhistory of fever, night sweats, watery\ndiarrhea, a 9 kg loss of weight, malaise\nand abdominal pain mainly in the right\niliac fossa.\nOn examination: pallor with a diffusely\ntender abdomen. Contrast-enhanced CT\nshowed thickening of bowel loops and\nenlarged mesenteric lymph nodes.\nLABORATORY\n↓ Hb 9.2 g/dL (12–15)\n↑ ESR 110 mm/hour (< 20)\n↓ Serum albumin 2.1 g/dL (3.5–5.2)\n• DIAGNOSTIC KEYWORDS\nTwo months of fever with night\nsweats + 9 kg weight loss + watery\ndiarrhea and right iliac fossa pain +\nESR 110 and albumin 2.1 +\nthickened bowel loops with\nenlarged mesenteric nodes on CT\nTUBERCULOUS ENTERITIS\n(ILEOCECAL TUBERCULOSIS)\n• REVISE\nGastroenterology → Inflammatory Bowel\nDisease (TB enteritis)\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 83\nNIGHT SWEATS, WASTING AND A THICKENED\nILEOCECAL REGION\nCASE 15\nIntestinal tuberculosis versus Crohn's\nCauses of right iliac fossa pain\nESR and the inflammatory work up\nCrohn's disease — perianal disease and\nskip lesions; no caseation\nIntestinal lymphoma — bulkier nodes,\nno caseating granulomas on biopsy\nYersinia enterocolitica — acute and\nself-limiting\nWhat is the diagnosis, and why?\nWHY\n1\nTuberculous enteritis should be considered — fever,\nnight sweating, diarrhea, pallor and a diffusely tender\nabdomen together with thickened bowel loops and\nenlarged mesenteric lymph nodes on CT\nGastrointestinal TB is often difficult to differentiate from\nother intestinal inflammatory lesions. The differential\nincludes Crohn's disease and intestinal lymphoma\nFever with night sweats over two months → the\nconstitutional pattern of tuberculosis\n9 kg weight loss and albumin 2.1 g/dL → a chronic\nconsumptive, protein-losing illness\nPain localised to the right iliac fossa → the ileocecal\nregion — the site TB favours\nESR 110 mm/hour → an extreme acute phase response,\ntypical of TB, lymphoma or abscess\nEnlarged mesenteric lymph nodes with thickened loops\n→ nodal involvement is far more typical of TB than of\nCrohn's\n2 Explain the sources of infection for this conditi   try { const u = new URL(ex.bundle, location.href).href; if (!tries.includes(u)) tries.push(u); } catch (e) {}

      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .finally(() => clearTimeout(timer))
      .catch(e => { ex._err = (e && e.name === "AbortError") ? "timed out" : String((e && e.message) || e); if (i + 1 < tries.length) return attempt(i + 1); throw e; });

    + "Be short and exam-focused. Start any sentence that is not based on the material with 'Beyond the board:'. "
    + "First, tell me in a few lines what my answer missed or got wrong compared with the material. Then wait for my follow-up questions.\n\n";
  if (PARTS[S.part].kind === "essay") {
    const base = head + "EXAM QUESTION: " + it.q + "\n\nMY ANSWER: " + clip(S.ans[it.id] || "(left blank)", 500)
      + "\n\nBOARD ANSWER (" + it.src + "):\n";
    return base + clip(it.text, Math.max(600, 3000 - base.length));
  }
  const qa = it.questions.map((q, k) => (k + 1) + ". " + q + "\n   My answer: " + clip(S.ans[it.id + "_" + k] || "(left blank)", 250)).join("\n");
  const base = head + "CASE KEYWORDS: " + it.kw + "\n\nTHE CASES BOOK'S QUESTIONS AND MY ANSWERS:\n" + qa
    + "\n\nBOOK DIAGNOSIS: " + it.dx + "\n\nCASES BOOK SHEET (P" + it.case + ", text taken from a PDF, so some lines may be out of order):\n";
  return base + clip(it.sheet, Math.max(500, 3200 - base.length));
}

function fmtReply(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/Beyond the board:/g, '<span class="beyond">Beyond the board:</span>');
}

function chatErr(code) {
  return ({
    rate_limited: "Too many questions right now, or your Claude usage limit was reached. Try again in a little while.",
    session_expired: "Your Claude sign-in expired. Sign in to claude.ai again, then ask.",
    refused: "Claude would not answer that. Try asking it differently.",
    empty_completion: "No answer came back. Try rephrasing the question.",
    prompt_too_large: "This chat got too long. Start a new chat.",
  })[code] || "The answer was interrupted. Try again.";
}

function renderChat(it) {
  const box = document.getElementById("chatBox");
  if (!box) return;
  if (chatState !== "ready") {
    // the in-page chat can't run here: open a new chat in Claude or ChatGPT with the material already in it
    const q = encodeURIComponent(askPrompt(it)), src = PARTS[S.part].kind === "essay" ? "board" : "cases book";
    box.hidden = false;
    box.innerHTML = `<div class="chat">
        <div class="chathead"><span class="pill">Ask AI about this question</span></div>
        <p class="aicap">Opens a new chat with this question, your answer and the ${src} answer already in it.</p>
        <div class="btns">
          <a class="btn primary" href="https://claude.ai/new?q=${q}" target="_blank" rel="noopener noreferrer">Ask Claude ↗</a>
          <a class="btn primary" href="https://chatgpt.com/?q=${q}" target="_blank" rel="noopener noreferrer">Ask ChatGPT ↗</a>
          <button class="btn" id="copyAI" type="button">Copy</button>
        </div>
        <textarea id="aiText" class="short" readonly hidden aria-label="Text to paste into an AI app"></textarea>
        <p class="aicap" id="aiMsg">Claude needs a free claude.ai account · ChatGPT usually works without one · Copy is for any other app.</p>
      </div>`;
    document.getElementById("copyAI").addEventListener("click", () => {
      const text = rulesFor(it) + "\n\nMY QUESTION: ", out = document.getElementById("aiText"), msg = document.getElementById("aiMsg");
      // show the text at once (some app views never answer a clipboard request), then try copying it
      out.value = text; out.hidden = false; out.focus(); out.select();
      msg.textContent = "If it didn't copy by itself, select all the text in the box and copy it. Then paste it into your AI app and type your question at the end.";
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(
          () => { msg.textContent = "Copied. Open your AI app, paste, and type your question at the end."; }, () => {});
        else document.execCommand && document.execCommand("copy");
      } catch (e) {}
    });
    return;
  }
  const c = chatOf(it.id), busy = !!c.ctl;
  const bubbles = c.turns.map(t => `<div class="msg ${t.role === "user" ? "you" : "claude"}">${t.role === "user" ? esc(t.content) : fmtReply(t.content)}</div>`).join("")
    + (c.pending ? `<div class="msg claude${c.pending.text ? "" : " wait"}" id="pending">${c.pending.text ? fmtReply(c.pending.text) : "Thinking…"}</div>` : "");
  box.hidden = false;
  box.innerHTML = `<div class="chat">
      <div class="chathead"><span class="pill">Ask about this question</span>${c.turns.length && !busy ? `<button class="btn" id="newChat" type="button">New chat</button>` : ""}</div>
      ${bubbles ? `<div class="msgs">${bubbles}</div>` : ""}
      ${c.err ? `<p class="chaterr">${esc(c.err)}</p>` : ""}
      <form class="ask" id="askForm">
        <textarea id="askInput" rows="2" aria-label="Your question to Claude" placeholder="${PARTS[S.part].kind === "essay" ? "e.g. What did my answer miss?" : "e.g. Why this and not the other options?"}" ${busy ? "disabled" : ""}>${esc(c.draft)}</textarea>
        ${busy ? `<button class="btn" id="stopChat" type="button">Stop</button>` : `<button class="btn primary" type="submit">Ask</button>`}
      </form>
      <p class="aicap">Answers are written by ${AI_NAME} from the material above. <span class="beyond">Beyond the board</span> marks anything not taken from it.</p>
    </div>`;
  const input = document.getElementById("askInput");
  input.addEventListener("input", () => { c.draft = input.value; });
  input.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(it); } });
  document.getElementById("askForm").addEventListener("submit", ev => { ev.preventDefault(); send(it); });
  const stop = document.getElementById("stopChat"); if (stop) stop.addEventListener("click", () => c.ctl && c.ctl.abort());
  const nc = document.getElementById("newChat"); if (nc) nc.addEventListener("click", () => { c.turns = []; c.err = ""; renderChat(it); });
}

async function send(it) {
  const c = chatOf(it.id), q = c.draft.trim();
  if (!q || c.ctl || !(sampleFn || CHAT_URL)) return;
  c.turns.push({role: "user", content: q}); c.draft = ""; c.err = ""; c.pending = {text: ""}; c.ctl = new AbortController();
  const day = DAY.day, here = () => PAGE === "day" && DAY.day === day && S.view === "q" && itemAt(S.part, S.pos).id === it.id;
  renderChat(it);
  if (CHAT_URL) return sendRemote(it, c, here);
  try {
    const turns = [{role: "user", content: rulesFor(it)}, ...c.turns.slice(-10)];
    const r = await sampleFn(turns, {cache: false, signal: c.ctl.signal, onText: ({text}) => {
      c.pending.text = text; const el = document.getElementById("pending");
      if (el && here()) { el.classList.remove("wait"); el.innerHTML = fmtReply(text); }
    }});
    c.turns.push({role: "assistant", content: r.text});
    if (r.truncated) c.err = "The answer was cut short. Ask for less at a time.";
  } catch (e) {
    const code = e && e.code;
    if (e && e.text && code !== "refused") c.turns.push({role: "assistant", content: e.text});
    if (code === "not_granted") chatState = "declined";
    else if (["sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) chatState = "disabled";
    else if (code !== "cancelled") c.err = chatErr(code);
  } finally {
    c.pending = null; c.ctl = null;
    if (here()) renderChat(it);
  }
}

async function sendRemote(it, c, here) {
  try {
    const r = await fetch(CHAT_URL, {method: "POST", headers: {"Content-Type": "application/json"}, signal: c.ctl.signal,
      body: JSON.stringify({material: rulesFor(it), turns: c.turns.slice(-10)})});
    const data = await r.json().catch(() => ({}));
    if (r.ok && data.text) c.turns.push({role: "assistant", content: data.text});
    else c.err = data.error === "rate_limited" ? "Too many questions right now. Wait a minute, then ask again."
      : data.error === "too_long" ? "This chat got too long. Start a new chat." : "The answer didn't come through. Try again.";
  } catch (e) {
    if (!(e && e.name === "AbortError")) c.err = "No connection to the chat. Check your internet and try again.";
  } finally {
    c.pending = null; c.ctl = null;
    if (here()) renderChat(it);
  }
}

function renderPartEnd() {

function renderResults() {
  const rows = [];
  DAY.essays.forEach((it, i) => { const m = S.mark[it.id]; if (m !== 1) rows.push({p: 1, i, tag: m === 0.5 ? "part" : "bad", t: m === 0.5 ? "Partly" : m === 0 ? "Missed" : "Not marked", text: it.q, where: it.src}); });
  DAY.cases.forEach((it, i) => { const m = S.mark[it.id]; if (m !== 1) rows.push({p: 2, i, tag: m === 0.5 ? "part" : "bad", t: m === 0.5 ? "Partly" : m === 0 ? "Missed" : "Not marked", text: it.dx, where: "P" + it.case}); });
  const list = p => rows.filter(r => r.p === p).map(r => `<li><span class="tag ${r.tag}">${r.t}</span><span>${esc(r.text)}</span><span class="where2">${esc(r.where)}</span></li>`).join("");
  const total = scoreOf(1) + scoreOf(2), max = DAY.essays.length + DAY.cases.length;
  const tile = p => `<div class="card"><span class="pill">${PARTS[p].label} · ${PARTS[p].name}</span>
      <div class="score ${grade(p)}">${scoreOf(p)} / ${PARTS[p].items.length}</div>
      <p class="muted">${fmt(S.used[p])} used of ${S.limit[p]}:00</p></div>`;
  const miss1 = rows.some(r => r.p === 1), miss2 = rows.some(r => r.p === 2);
  app.innerHTML = `${topnav("day")}<section class="intro"><div class="titlepill">DAY ${DAY.day} RESULTS</div>
      <p class="topics">${total} / ${max} · ${Math.round(100 * total / max)}%</p></section>
    <div class="scores">${tile(1)}${tile(2)}</div>
    ${miss1 ? `<h2 class="sec">Essays to revise</h2><ul class="revise">${list(1)}</ul>` : ""}
    ${miss2 ? `<h2 class="sec">Cases to revise</h2><ul class="revise">${list(2)}</ul>` : ""}
    <div class="nav">
      ${miss1 ? `<button class="btn primary" data-retry="1">Retry missed essays</button>` : ""}
      ${miss2 ? `<button class="btn primary" data-retry="2">Retry missed cases</button>` : ""}
      <button class="btn" id="menu">Exam menu</button>
    </div>`;
  app.querySelectorAll("[data-retry]").forEach(b => b.addEventListener("click", () => {
    const p = +b.dataset.retry, idx = rows.filter(r => r.p === p).map(r => r.i);
    idx.forEach(i => {
      const id = PARTS[p].items[i].id;
      Object.keys(S.ans).forEach(k => { if (k === id || k.startsWith(id + "_")) delete S.ans[k]; });
      delete S.mark[id]; delete S.shown[id];
    });
    S.queue[p] = idx; S.done[p] = false; S.used[p] = 0; S.limit[p] = Math.max(1, idx.length * PARTS[p].perItem);
    S.part = p; S.pos = 0; S.view = "q"; save(); render(); window.scrollTo(0, 0);
  }));
  document.getElementById("menu").addEventListener("click", () => { S.view = "start"; save(); render(); });
  wireNav();
}

/* ---------- camp home · my progress · backup ---------- */
const campDay = n => CAMP.days.find(d => d.n === n);
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDate(iso) { const [y, m, d] = iso.split("-").map(Number); return DOW[new Date(y, m - 1, d).getDay()] + " " + d + " " + MON[m - 1]; }
function todayISO() { const t = new Date(); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); }
const pct = (s, m) => m ? Math.round(100 * s / m) : null;
const gradeOf = r => r === null ? "" : r >= 75 ? "good" : r >= 50 ? "part" : "bad";

function topnav(active) {
  const t = (id, label) => `<button class="tab" data-nav="${id}" aria-current="${active === id ? "page" : "false"}">${label}</button>`;
  return `<nav class="tabs">${t("home", "Camp days")}${t("progress", "My progress")}${active === "day" ? `<span class="tab here" aria-current="page">Day ${DAY.day}</span>` : ""}<span class="navend">${themeBtn()}</span></nav>`;
}
function wireNav() { app.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => go(b.dataset.nav))); }

function statsOf(n) {
  const ex = EXAMS[n], st = readState(n);
  if (!ex || !st) return null;
  const part = items => { const m = items.filter(it => st.mark[it.id] !== undefined); return {n: items.length, marked: m.length, score: m.reduce((t, it) => t + st.mark[it.id], 0)}; };
  const e = part(ex.essays), c = part(ex.cases);
  return {n, st, ex, e, c, marked: e.marked + c.marked, score: e.score + c.score, total: e.n + c.n,
    started: e.marked + c.marked > 0 || st.used[1] > 0 || st.used[2] > 0, finished: !!(st.done[1] && st.done[2])};
}

function renderHome() {
  const today = todayISO(), td = CAMP.days.find(d => d.date === today);
  const row = d => {
    const s = d.ready ? statsOf(d.n) : null, r = s ? pct(s.score, s.marked) : null;
    const state = !d.ready ? `<span class="state soon">Opens soon</span>`
      : s && s.finished ? `<span class="state ${gradeOf(r)}">Done · ${r}%</span>`
      : s && s.started ? `<span class="state prog">${s.marked} / ${s.total} marked</span>`
      : `<span class="state open">Start</span>`;
    return `<li><button class="dayrow${d.date === today ? " today" : ""}" ${d.ready ? `data-day="${d.n}"` : "disabled"}>
      <span class="dn">Day ${d.n}</span><span class="dd">${fmtDate(d.date)}</span><span class="dl">${esc(d.label)}</span>${state}</button></li>`;
  };
  const rounds = [["1", "Round 1"], ["2", "Round 2"], ["3", "Round 3"], ["4", "Round 4"], ["final", "Last day"]];
  const groups = rounds.map(([k, name]) => {
    const ds = CAMP.days.filter(d => d.round === k);
    if (!ds.length) return "";
    const span = fmtDate(ds[0].date) + (ds.length > 1 ? " – " + fmtDate(ds[ds.length - 1].date) : "");
    return `<section><h2 class="sec">${name} <span class="muted small">${span}</span></h2><ul class="days">${ds.map(row).join("")}</ul></section>`;
  }).join("");
  const banner = td
    ? `<div class="todaybar"><span>Today is <b>Day ${td.n}</b> · ${esc(td.label)}</span>${td.ready ? `<button class="btn primary" data-day="${td.n}">Open Day ${td.n}</button>` : `<span class="muted">Opens soon</span>`}</div>`
    : today < CAMP.start ? `<div class="todaybar"><span>The camp starts ${fmtDate(CAMP.start)}</span></div>` : "";
  app.innerHTML = `${topnav("home")}
    <section class="intro"><div class="titlepill">IM CAMP EXAMS</div>
      <p class="topics">${fmtDate(CAMP.start)} – ${fmtDate(CAMP.days[CAMP.days.length - 1].date)} · final exam ${fmtDate(CAMP.exam)}</p></section>
    ${banner}${groups}`;
  wireNav();
  app.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => go("day", +b.dataset.day)));
}

function chartSVG(points) {  // points: [{label, v (0–100) or null}]
  const bw = 34, gap = 16, h = 140, top = 22, left = 34, W = left + points.length * (bw + gap) + 4, H = top + h + 30;
  const y = v => top + h * (1 - v / 100);
  let s = "";
  for (const g of [0, 50, 75, 100]) s += `<line class="grid" x1="${left - 4}" x2="${W}" y1="${y(g)}" y2="${y(g)}"/><text class="ax" x="${left - 8}" y="${y(g) + 4}" text-anchor="end">${g}</text>`;
  points.forEach((p, i) => {
    const x = left + i * (bw + gap) + gap / 2;
    if (p.v !== null) s += `<rect class="b ${gradeOf(p.v)}" x="${x}" y="${y(p.v)}" width="${bw}" height="${Math.max(1, h * p.v / 100)}" rx="4"/>`
      + `<text class="val" x="${x + bw / 2}" y="${y(p.v) - 6}" text-anchor="middle">${p.v}%</text>`;
    s += `<text class="ax" x="${x + bw / 2}" y="${top + h + 18}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Score per day">${s}</svg></div>`;
}

function breakdown(all, keyOfItem, nameOf) {
  const acc = {};
  all.forEach(s => [...s.ex.essays, ...s.ex.cases].forEach(it => {
    const m = s.st.mark[it.id]; if (m === undefined) return;
    const k = keyOfItem(it); (acc[k] = acc[k] || {score: 0, n: 0}); acc[k].score += m; acc[k].n++;
  }));
  return Object.entries(acc).map(([k, v]) => ({name: nameOf(k), ...v, r: pct(v.score, v.n)})).sort((a, b) => a.r - b.r);
}

function renderProgress() {
  const all = CAMP.days.filter(d => d.ready).map(d => statsOf(d.n)).filter(s => s && s.started);
  const sum = (f) => all.reduce((t, s) => t + f(s), 0);
  const marked = sum(s => s.marked), score = sum(s => s.score);
  const eM = sum(s => s.e.marked), eS = sum(s => s.e.score), cM = sum(s => s.c.marked), cS = sum(s => s.c.score);
  const finished = all.filter(s => s.finished).length, ready = CAMP.days.filter(d => d.ready).length;
  const tile = (label, big, sub, cls) => `<div class="card tile"><span class="pill">${label}</span><div class="score ${cls || ""}">${big}</div><p class="muted">${sub}</p></div>`;
  const R = pct(score, marked), rE = pct(eS, eM), rC = pct(cS, cM);
  const today = CAMP.days.find(d => d.date === todayISO() && d.ready) || CAMP.days.find(d => d.ready);
  let body;
  if (!marked) {
    body = `<div class="card empty"><h2>No marked answers yet</h2>

  } else {
    const days = CAMP.days.filter(d => d.ready).map(d => { const s = statsOf(d.n); return {label: "Day " + d.n, v: s && s.marked ? pct(s.score, s.marked) : null}; });
    const bars = rows => `<ul class="bk">${rows.map(r => `<li><span class="bkname">${esc(r.name)}</span>
        <span class="bkbar"><span class="${gradeOf(r.r)}" style="width:${r.r}%"></span></span><span class="bknum">${r.r}% <span class="muted">· ${r.score} / ${r.n}</span></span></li>`).join("")}</ul>`;
    const topics = breakdown(all, it => it.topic, k => CAMP.topics[k] || k);

    const rev = all.map(s => {

      }).join("")}</ul>`;
    }).join("");
    body = `<div class="tiles">
        ${tile("Overall", R + "%", `${score} / ${marked} points`, gradeOf(R))}
        ${tile("Essays", rE === null ? "–" : rE + "%", `${eS} / ${eM} points`, gradeOf(rE))}
        ${tile("Cases", rC === null ? "–" : rC + "%", `${cS} / ${cM} points`, gradeOf(rC))}
        ${tile("Days finished", `${finished} / ${CAMP.days.length}`, `${ready} open so far`)}
      </div>
      <h2 class="sec">Score per day</h2>${chartSVG(days)}
      <h2 class="sec">By topic <span class="muted small">weakest first</span></h2>${bars(topics)}
      ${systems.length > 1 ? `<h2 class="sec">By system <span class="muted small">weakest first</span></h2>${bars(systems)}` : ""}
      ${rev ? `<h2 class="sec">To revise</h2>${rev}` : ""}`;
  }
  app.innerHTML = `${topnav("progress")}

      <p id="restoreMsg"></p>

  wireNav();
  app.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => go("day", +b.dataset.day)));
  document.getElementById("copyCode").addEventListener("click", () => {
    const code = backupCode(), out = document.getElementById("codeOut"), msg = document.getElementById("copyMsg");
    out.value = code; out.hidden = false;
    const fallback = () => { out.focus(); out.select(); msg.textContent = "Select the code above and copy it."; };
    try { navigator.clipboard.writeText(code).then(() => { msg.textContent = "Copied. Paste it under Restore on your other device."; }, fallback); } catch (e) { fallback(); }

    if (!code.trim()) { msg.textContent = "Paste a progress code first."; return; }
    const box = document.getElementById("restoreBox");
    box.innerHTML = `<div class="confirm"><span>This replaces the progress on this device.</span>
      <button class="btn" id="restoreYes">Restore</button><button class="btn ghost" id="restoreNo">Cancel</button></div>`;
    document.getElementById("restoreNo").addEventListener("click", renderProgress);
    document.getElementById("restoreYes").addEventListener("click", () => {
      try { const n = restoreCode(code); go("progress"); document.getElementById("restoreMsg").textContent = `Restored ${n} day${n === 1 ? "" : "s"}.`; }
      catch (e) { renderProgress(); document.getElementById("restoreMsg").textContent = "That code didn't work. Copy the whole code again and paste it here."; }
    });
  });
}

function backupCode() {
  const days = {};
  CAMP.days.forEach(d => { try { const raw = localStorage.getItem(keyOf(d.n)); if (raw) days[d.n] = JSON.parse(raw); } catch (e) {} });
  return "IMCAMP1-" + btoa(unescape(encodeURIComponent(JSON.stringify({v: 1, days}))));
}
function restoreCode(code) {
  const m = code.trim().match(/^IMCAMP1-([A-Za-z0-9+/=\s]+)$/);
  if (!m) throw new Error("not a progress code");
  const obj = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/\s+/g, "")))));
  if (!obj || obj.v !== 1 || typeof obj.days !== "object") throw new Error("not a progress code");
  let n = 0;
  Object.entries(obj.days).forEach(([d, st]) => { if (EXAMS[d] && st && st.ans) { localStorage.setItem(keyOf(d), JSON.stringify(st)); n++; } });
  return n;
}

let tick = 0;
setInterval(() => {
  if (PAGE !== "day" || S.view !== "q" || S.done[S.part] || document.hidden) return;
  S.used[S.part]++;
  const t = document.getElementById("timer");
  if (t) t.outerHTML = timerHTML();
  if (++tick % 5 === 0) save();
}, 1000);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

render();
</script>
