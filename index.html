done?\nAbdominal ultrasound to confirm ascites\nDiagnostic paracentesis to analyse the ascitic fluid —\nan ascitic PMN count > 250 cells/mm³ is diagnostic for\nSBP. Gram staining and culture are needed to assess\nthe effect of covering antibiotic therapy\nRenal function to exclude hepatorenal syndrome\nCT abdomen if secondary peritonitis is suspected or the\npresentation is atypical\n3 What is the cause of shifting dullness and fever?\nAccumulation of free fluid in the abdomen (ascites) is\nthe cause of the shifting dullness\nSBP is the cause of the fever — but sepsis from other\nsources (urinary tract, chest) and hepatocellular\ncarcinoma should also be considered", "questions": ["What is the diagnosis, and why?", "What further investigations should be done?", "What is the cause of shifting dullness and fever?"], "topic": "p3", "sys": "HEP"}, {"id": "c8", "kw": "Known cirrhosis + two days of fever and abdominal discomfort + ascites with shifting dullness + ascitic PMN count 500 cells/mm³ + Na 130 with albumin 2.5", "dx": "Spontaneous bacterial peritonitis", "case": 121, "sheet": "Hepatology · DEPBOOK CASE 127\n• CASE\nA 48-year-old man with HCV and\nalcohol-related cirrhosis hospitalized\nwith a two-day history of fever and\nabdominal discomfort. His temperature is\n38°C.\nHe has abdominal distension with\nshifting dullness and a small, reducible\numbilical hernia is noted.\nTEMPERATURE\n38°C\nASCITIC PMN\n500\ncells/mm³\nUMBILICAL\nHERNIA\nSmall,\nreducible\nLABORATORY\n↓ Sodium 130 mEq/L (135–145)\n↓ Albumin 2.5 g/dL (3.5–5.2)\n↑ ALT 75 U/L (< 40)\n↓ Ascitic albumin 1 g/dL (SAAG 1.5 —\nportal hypertensive)\n• DIAGNOSTIC KEYWORDS\nKnown cirrhosis + two days of fever\nand abdominal discomfort + ascites\nwith shifting dullness + ascitic PMN\ncount 500 cells/mm³ + Na 130 with\nalbumin 2.5\nSPONTANEOUS BACTERIAL\nPERITONITIS\n• REVISE\nHepatobiliary System & Pancreas → Ascites\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 121\nFIVE HUNDRED NEUTROPHILS IN THE ASCITIC\nFLUID\nCASE 23\nSBP: diagnosis, treatment, prophylaxis\nAlbumin infusion to protect the kidney\nSAAG in ascitic fluid\nWhat is the diagnosis, and why?\nWHY\n1\nSpontaneous bacterial peritonitis (SBP) — confirmed\nby an ascitic PMN count ≥ 250/mm³ in the absence of a\nsurgical infection and in the presence of cirrhosis\nAscitic PMN 500, twice the threshold → the diagnosis\nis made on the fluid, not on the fever\nFever with abdominal discomfort in a known cirrhotic\n→ the classic, and often the only, clinical clue\nNo surgical source — no perforation, no abscess →\nthis is spontaneous, not secondary, peritonitis\nSerum albumin 2.5 with ascitic albumin 1 → a SAAG\nof 1.5 confirms the ascites is portal hypertensive\nSodium 130 → dilutional hyponatremia of advanced\ncirrhosis — a marker of poor prognosis\nWhich are the most appropriate next steps in managing\nthis patient?\n2\nBegin empirical IV antibiotics immediately — typically\ncefotaxime 2 g IV every 8 hours or ceftriaxone. Oral\nfluoroquinolones (e.g. ofloxacin) can be used in stable\npatients without renal dysfunction or vomiting\nAlbumin infusion — 1.5 g/kg on day 1 and 1 g/kg on\nday 3 — is indicated to prevent renal impairment\nRecurrence of SBP is common, so long term antibiotic\nprophylaxis is recommended — norfloxacin or\nciprofloxacin\nHernia repair should be delayed until the ascites is\ncontrolled\nSecondary peritonitis — multiple organisms, low glucose, high\nLDH; needs CT\nHepatorenal syndrome — no fever, no raised PMN count\nStrangulated umbilical hernia — irreducible and tender — his\nreduces", "questions": ["What is the diagnosis, and why?", "Which are the most appropriate next steps in managing this patient?"], "topic": "p3", "sys": "HEP"}, {"id": "c9", "kw": "HCV cirrhosis with refractory ascites and oliguria + creatinine climbing 1.5 → 1.8 over 6 weeks + no fever, no infection, no bleeding + ascitic neutrophils only 120", "dx": "Hepatorenal syndrome", "case": 122, "sheet": "Hepatology · DEPBOOK CASE 128\n• CASE\nA 45-year-old man with HCV related\nliver cirrhosis is admitted with refractory\nascites, oliguria, and failure to thrive. No\nfever, jaundice, edema or\nencephalopathy.\nBlood and urine cultures are negative.\nNasogastric lavage is negative for blood.\nASCITIC\nNEUTROPHILS\n120 /mm³\nCULTURES\nNegative\nNG LAVAGE\nNo blood\nLABORATORY\n↑ BUN 18 → 25 mg/dL over 6 weeks (7–\n20)\n↑ Creatinine 1.5 → 1.8 mg/dL (0.6–1.2)\n• DIAGNOSTIC KEYWORDS\nHCV cirrhosis with refractory ascites\nand oliguria + creatinine climbing\n1.5 → 1.8 over 6 weeks + no fever,\nno infection, no bleeding + ascitic\nneutrophils only 120\nHEPATORENAL SYNDROME\n• REVISE\nHepatobiliary System & Pancreas →\nHepatorenal Syndrome\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 122\nCREATININE CREEPING UP WITH REFRACTORY\nASCITES\nCASE 24\nHRS diagnostic criteria\nTerlipressin, midodrine and octreotide\nTransplantation as definitive therapy\nWhat is the diagnosis, and why?\nWHY\n1\nHepatorenal syndrome (HRS) — a functional renal\nfailure in patients with advanced liver disease\nDiagnostic criteria: cirrhosis with ascites; rising serum\ncreatinine with no improvement after plasma\nexpansion and diuretic withdrawal for 2 consecutive\ndays; absence of shock or nephrotoxins; and absence\nof structural kidney disease\nCirrhosis with refractory ascites → the setting in which\nHRS arises — extreme splanchnic vasodilatation\nCreatinine rising progressively over 6 weeks → a\nsteady functional decline, not an acute insult\nAscitic neutrophils 120, below 250, cultures negative\n→ SBP is excluded — infection is the commonest\nprecipitant and must be ruled out\nNG lavage negative for blood → no GI bleed causing\npre-renal failure\nNo shock, no nephrotoxic drugs → acute tubular\nnecrosis is excluded — the kidneys are structurally\nnormal\n2 What is the best next step in managing this patient?\nStart vasopressor therapy — terlipressin, or midodrine\nand octreotide\nExpand the intravascular volume with IV albumin for 2\ndays\nRenal replacement therapy may be needed in refractory\ncases as a bridge to transplantation\nFor refractory HRS, liver transplant referral is\nrecommended — it treats the liver, and the kidney\nfollows\nPrerenal azotemia — creatinine falls once volume is expanded\nAcute tubular necrosis — muddy brown casts, recent shock or\nnephrotoxin\nGlomerulonephritis — proteinuria, haematuria and casts", "questions": ["What is the diagnosis, and why?", "What is the best next step in managing this patient?"], "topic": "p3", "sys": "HEP"}, {"id": "c10", "kw": "30 paracetamol tablets a day for 3 days + jaundice with a tender liver + ALT 3,440 + bilirubin 24.5 + normal albumin with INR 1.4", "dx": "Acetaminophen-induced liver injury", "case": 108, "sheet": "Hepatology · DEPBOOK CASE 114\n• CASE\nA 28-year-old male comes complaining of\n5 days of nausea, vomiting, diffuse\nabdominal pain, muscle aches, anorexia\nand fever up to 38°C. He has no\nsignificant past or family history and\ndenies drug abuse. He takes no\nmedications routinely, but he has been\ntaking acetaminophen, approximately 30\ntablets per day for 3 days for tennis\nelbow.\nExamination: temperature 37.8°C, pulse 98\nbpm, BP 120/75. He has jaundice. Chest\nand heart are clear. The liver is slightly\ntender. No abdominal distention or\nperipheral edema.\nLABORATORY\n↑ ALT 3,440, AST 2,705 U/L (< 40)\n↑ Bilirubin 24.5, direct 18.2 mg/dL (< 1.2)\n↑ Alkaline phosphatase 349 IU/L (40–129)\n↑ INR 1.4 (< 1.2)\nNormal: CBC, creatinine 1.1 mg/dL, serum\nalbumin 4.0 g/dL\n• DIAGNOSTIC KEYWORDS\n30 paracetamol tablets a day for 3\ndays + jaundice with a tender liver +\nALT 3,440 + bilirubin 24.5 + normal\nalbumin with INR 1.4\nACETAMINOPHEN-INDUCED LIVER\nINJURY\n• REVISE\nHepatobiliary System & Pancreas → Drug\nInduced Liver Injury\n• ANSWER\nStudy Smarter Hepatology Cases Page 108\nTHIRTY PARACETAMOL TABLETS A DAY FOR\nTENNIS ELBOW\nCASE 10\nParacetamol toxicity and NAC\nCauses of ALT above 1,000\nKing's College criteria\nWhat is the diagnosis, and why?\nWHY\n1\nDrug induced liver injury (DILI), mostly due to\nacetaminophen\nThe degree and pattern of transaminase elevation gives\nthe clue. Levels above 1,000 IU/L are seen in conditions\nproducing extensive hepatic necrosis — drug induced\nliver injury, acute hepatitis A, ischemia (shock liver),\nautoimmune hepatitis and Wilson's disease\n30 tablets a day for 3 days → far above the maximum\ndaily dose — a staggered supratherapeutic ingestion\nALT 3,440 → massive hepatocellular necrosis, not a\ncholestatic or infiltrative picture\nNormal albumin with only mildly raised INR → the\ninjury is acute — albumin has a long half-life and has\nnot had time to fall\nJaundice with a tender liver and no ascites or edema\n→ acute hepatocyte injury without established chronic\ndisease\nTaken for pain, not in overdose intent → therapeutic\nmisadventure causes as much damage as deliberate\noverdose\n2 What is the most important immediate diagnostic test?\nSerum acetaminophen level.\nThe markedly elevated transaminases and bilirubin with\na normal albumin are consistent with acute viral\nhepatitis or acute drug induced liver injury\nObtaining the serum acetaminophen level and knowing\nthe time of his last ingestion together establish\nacetaminophen-related liver damage and the possible\nneed for N-acetylcysteine, which acts as an effective\nantidote", "questions": ["What is the diagnosis, and why?", "What is the most important immediate diagnostic test?"], "topic": "p5", "sys": "HEP"}, {"id": "c11", "kw": "Young woman + jaundice with confusion and flapping tremor + ALT 3,565 with INR 2.3 + ANA 1:160 + viral markers, copper studies and paracetamol level all negative", "dx": "Acute liver failure due to autoimmune hepatitis", "case": 116, "sheet": "Hepatology · DEPBOOK CASE 122\n• CASE\nA 22-year-old female presents with\njaundice, abdominal pain and confusion.\nShe was unable to give any further history\nbut her parents denied any previous ill\nhealth, medications or depression.\nExamination: afebrile, pulse 95 bpm, BP\n100/50, chest clear. She was jaundiced;\nabdomen revealed 5 cm tender\nhepatomegaly and ascites. Flapping\ntremors were present and her Glasgow\ncoma scale was 13/15.\nGLASGOW\nCOMA SCALE\n13/15\nFLAPPING\nTREMOR\nPresent\nTEMPERATURE\nAfebrile\nLABORATORY\n↑ ALT 3,565 U/L, ALP 410 (< 40 / 40–130)\n↑ INR 2.3 (< 1.2)\n↑ ESR > 100 mm/h (< 20)\n+ ANA 1:160\nNormal: Hb 10 g/dL, WCC 11, platelets 186 ×\n10⁹/L; viral markers, AMA and ASMA negative;\nceruloplasmin and urinary copper normal;\nparacetamol undetectable\n• DIAGNOSTIC KEYWORDS\nYoung woman + jaundice with\nconfusion and flapping tremor +\nALT 3,565 with INR 2.3 + ANA 1:160\n+ viral markers, copper studies and\nparacetamol level all negative\nACUTE LIVER FAILURE DUE TO\nAUTOIMMUNE HEPATITIS\n• REVISE\nHepatobiliary System & Pancreas → Acute\n(Fulminant) Hepatic Failure\n• ANSWER\nStudy Smarter Hepatology Cases Page 116\nCONFUSION AND FLAPPING WITH AN INR OF 2.3 CASE 18\nAcute liver failure: definition and causes\nHepatic encephalopathy grading\nTransjugular liver biopsy\nWhat is the diagnosis, and why?\nWHY\n1\nAcute liver failure — clinical encephalopathy and\nlaboratory coagulopathy without pre-existing liver\ndisease — and the most likely cause is autoimmune\nhepatitis (AIH)\nCauses of acute liver failure to work through: acute viral\nhepatitis, drug-induced liver injury (paracetamol, INH),\nautoimmune hepatitis, Wilson's disease, and Budd-Chiari syndrome\nConfirm with other serologic markers of AIH, an elevated\nserum IgG, and liver biopsy — postponed until the\ncoagulopathy is corrected, or done by the transjugular\napproach if urgent. Histology shows interface hepatitis\nand a predominantly lymphoplasmacytic infiltrate\nFlapping tremor with GCS 13/15 → hepatic\nencephalopathy — the clinical half of acute liver failure\nINR 2.3 → coagulopathy — the laboratory half; clotting\nfactors are made in the liver\nNo previous ill health or medication → no pre-existing\nliver disease — so this is acute failure, not\ndecompensated chronic\nALT 3,565 with ANA 1:160 → massive necrosis with an\nautoimmune marker\nCeruloplasmin and urinary copper normal → Wilson's\ndisease excluded\nParacetamol undetectable, viral markers negative →\nthe negatives are what make the diagnosis here", "questions": ["What is the diagnosis, and why?"], "topic": "p5", "sys": "HEP"}, {"id": "c12", "kw": "HCV antibodies found incidentally on blood donation + completely normal liver enzymes and synthetic function + PCR 20,800 IU/mL, genotype 4 + normal ultrasound + HBsAg negative", "dx": "Chronic HCV infection, genotype 4, no cirrhosis — treatment naive", "case": 99, "sheet": "Hepatology · DEPBOOK CASE 105\n• CASE\nA 44-year-old Egyptian male patient\ndiscovered accidentally to have HCV\nantibodies during blood donation.\nAbdominal ultrasound was normal.\nHCV PCR\n20,800\nIU/mL\nGENOTYPE\n4\nHBSAG\nNegative\nLABORATORY\nNormal: ALT 17, AST 15 U/L, bilirubin 0.9 (direct\n0.3) mg/dL, albumin 4.5 g/dL, PC 100% (INR 1),\nCBC, creatinine, ultrasound\n• DIAGNOSTIC KEYWORDS\nHCV antibodies found incidentally on\nblood donation + completely normal\nliver enzymes and synthetic function\n+ PCR 20,800 IU/mL, genotype 4 +\nnormal ultrasound + HBsAg negative\nCHRONIC HCV INFECTION,\nGENOTYPE 4, NO CIRRHOSIS —\nTREATMENT NAIVE\n• REVISE\nHepatobiliary System & Pancreas → Chronic\nHepatitis\n• ANSWER\nStudy Smarter Hepatology Cases Page 99\nHCV ANTIBODIES FOUND WHILE DONATING\nBLOOD\nCASE 1\nChronic HCV: genotypes and DAA\nregimens\nSVR12 and the endpoint of therapy\nWho needs post-SVR surveillance\nWhat is the diagnosis, and why?\nWHY\n1\nChronic HCV infection, genotype 4, treatment naive,\nwith no evidence of cirrhosis\nAntibody positive and PCR 20,800 IU/mL → a\ndetectable viral load means ongoing infection —\nantibody alone cannot separate current from cleared\ninfection\nALT 17 and AST 15 are normal → normal enzymes do\nnot exclude chronic HCV, and they are not a reason to\nwithhold treatment\nAlbumin 4.5, PC 100%, normal ultrasound → synthetic\nfunction preserved and no coarse texture or\nsplenomegaly — no cirrhosis\nHBsAg negative → no co-infection to change the\nregimen\n2 Is this patient candidate for treatment?\nYes — all patients with HCV infection must be\nconsidered for therapy, including treatment-naive\npatients and those who failed to achieve SVR previously\nWhat are the goals and endpoints for treatment?\nGOAL — CURE THE INFECTION\nENDPOINT\n3\nPrevent the complications of HCV-related liver and\nextra-hepatic disease: necro-inflammation, fibrosis,\ncirrhosis, decompensation, HCC; improve quality of life;\nprevent transmission\nUndetectable HCV RNA by a sensitive assay (detection\nlimit ≤ 15 IU/mL) at 12 weeks (SVR12) or 24 weeks\n(SVR24) after the end of treatment\n4 What is the recommended drug regimen for this patient?\nFor genotype 4, treatment naive, no cirrhosis or\ncompensated Child-Pugh A:\nSofosbuvir 400 + velpatasvir 100 mg — one tablet daily\nGlecaprevir 300 + pibrentasvir 120 mg — three tablets\ndaily with food\nSofosbuvir 400 + ledipasvir 90 mg — one tablet daily\nGrazoprevir 100 + elbasvir 50 mg — one tablet daily", "questions": ["What is the diagnosis, and why?", "Is this patient candidate for treatment?", "What are the goals and endpoints for treatment?", "What is the recommended drug regimen for this patient?"], "topic": "p6", "sys": "HEP"}, {"id": "c13", "kw": "Young woman with vitiligo and hypothyroidism + jaundice and arthralgia + ALT 480 with IgG 2,200 + viral serology negative", "dx": "Autoimmune hepatitis", "case": 101, "sheet": "Hepatology · DEPBOOK CASE 107\n• CASE\nA 30-year-old female with vitiligo and\nhypothyroidism presents with jaundice,\narthralgia, and elevated IgG (2,200\nmg/dL).\nShe presented to the hepatology clinic for\nelevated liver enzymes with ALT 480 U/L\nand negative viral serology.\nLABORATORY\n↑ ALT 480 U/L (< 40)\n↑ IgG 2,200 mg/dL (700–1,600)\nNormal: Viral serology — negative\n• DIAGNOSTIC KEYWORDS\nYoung woman with vitiligo and\nhypothyroidism + jaundice and\narthralgia + ALT 480 with IgG 2,200\n+ viral serology negative\nAUTOIMMUNE HEPATITIS\n• REVISE\nHepatobiliary System & Pancreas → Chronic\nHepatitis\n• ANSWER\nStudy Smarter Hepatology Cases Page 101\nJAUNDICE AND A HIGH IGG IN A WOMAN WITH\nVITILIGO\nCASE 3\nAutoimmune hepatitis: antibodies and\nhistology\nInterface hepatitis\nSteroid and azathioprine regimens\nWhat is the diagnosis, and why?\nWHY\n1\nAutoimmune hepatitis (AIH)\nVitiligo and hypothyroidism already present → an\nautoimmune diathesis — these diseases cluster\nIgG 2,200 mg/dL with ALT 480 and jaundice →\npolyclonal hypergammaglobulinemia with a hepatitic,\nnot cholestatic, injury\nNegative viral serology, no recent drugs, no pruritus →\nexcludes viral hepatitis, and argues against drug injury\nand PBC\n2 What is your differential diagnosis?\nAutoimmune hepatitis (AIH), drug-induced liver injury,\nand primary biliary cholangitis\nElevated IgG and the autoimmune disease history\nstrongly favour AIH\nNegative viral serology excludes viral hepatitis; no\nrecent drugs argues against DILI\nNo pruritus and AMA negativity make PBC unlikely\n3 What are the confirmatory tests for diagnosis?\nANA / ASMA — positive in 80% of AIH; also anti-LKM\nand anti-SLA/LP\nLiver biopsy shows interface hepatitis — inflammatory\ncells at the portal-parenchymal junction —\npathognomonic for AIH\nWhat are the possible complications and initial treatment\nlines?\nCOMPLICATIONS\nINITIAL TREATMENT\n4\nOf the disease — cirrhosis or HCC. Of the treatment —\nsteroid-induced osteoporosis; bone density monitoring\nand calcium / vitamin D mitigate it\nPrednisone 40–60 mg/day by body weight, then 20\nmg/day maintenance\nAzathioprine to maintain the steroid effect and allow\nearly withdrawal\nBudesonide may replace prednisone, combined with\nazathioprine\nContinue despite normal liver function; monitor for\nrelapse", "questions": ["What is the diagnosis, and why?", "What is your differential diagnosis?", "What are the confirmatory tests for diagnosis?", "What are the possible complications and initial treatment lines?"], "topic": "p6", "sys": "HEP"}, {"id": "c14", "kw": "HCV cured two years ago + palpable purpura of both legs + facial puffiness, edema and oliguria + creatinine 2.4 + no ascites, no liver cell failure", "dx": "HCV-associated cryoglobulinemia with renal involvement", "case": 102, "sheet": "Hepatology · DEPBOOK CASE 108\n• CASE\nA 54-year-old female, known to have\nchronic HCV, was treated with direct\nacting anti-virals and achieved sustained\nviral response (SVR) two years ago.\nShe complained of progressive palpable\npurpura of both lower limbs along with\nlower limb edema, facial puffiness and\noliguria. BP is 150/95. Chest and cardiac\nexaminations were normal. There was no\nclinical evidence of ascites or\nmanifestation of liver cell failure.\nBLOOD\nPRESSURE\n150/95\nSKIN\nPalpable\npurpura\nURINE\nOliguria\nLABORATORY\n↓ Hb 10 g/dL (12–15)\n↑ Creatinine 2.4 mg/dL, urea 85 (0.6–1.2 /\n15–40)\n↑ INR 1.4 (< 1.2)\nNormal: Serum albumin 3.5 g/dL, chest and\ncardiac examination\n• DIAGNOSTIC KEYWORDS\nHCV cured two years ago +\npalpable purpura of both legs +\nfacial puffiness, edema and oliguria\n+ creatinine 2.4 + no ascites, no\nliver cell failure\nHCV-ASSOCIATED\nCRYOGLOBULINEMIA WITH RENAL\nINVOLVEMENT\n• REVISE\nHepatobiliary System & Pancreas → Chronic\nHepatitis\n• ANSWER\nStudy Smarter Hepatology Cases Page 102\nPURPURA AND RENAL FAILURE TWO YEARS\nAFTER HCV CURE\nCASE 4\nExtrahepatic manifestations of HCV\nMixed cryoglobulinemia and MPGN\nRituximab and plasma exchange\nWhat is the diagnosis, and why?\nWHY\n1\nRenal affection secondary to HCV with\ncryoglobulinemia — one of the extra-hepatic\nmanifestations of HCV infection\nPalpable purpura, not a flat rash → a small vessel\nvasculitis — immune complexes in the vessel wall\nFacial puffiness, leg edema and oliguria with creatinine\n2.4 → a nephritic picture — the kidney is the second\nvasculitic target\nKnown HCV → HCV drives mixed cryoglobulinemia\nand membranoproliferative glomerulonephritis\nNo ascites and no liver cell failure → this is not\nhepatorenal syndrome — the liver is not failing\nSVR achieved two years ago → extrahepatic\nmanifestations usually need a positive PCR, but a few\ncases are reported after SVR\nHow to approach this case and how to treat?\nHCV CAN DRIVE THESE AUTOIMMUNE DISEASES\nAPPROACH TO DIAGNOSIS\nTREATMENT\n2\nMixed cryoglobulinemia; membranoproliferative\nglomerulonephritis; autoimmune thyroiditis;\nlymphoproliferative disorders\nUrine analysis, albumin/creatinine ratio\nRaised rheumatoid factor with low complement C4 —\nclassic\nRepeat HCV PCR to confirm the SVR still holds\nAbdominal ultrasound for liver texture, ascites, and both\nkidneys\nRenal biopsy — cryoglobulinemic glomerulonephritis\nAntiviral therapy if the PCR is raised, with\ncorticosteroids and immunosuppression\nPlasma exchange and rituximab, a monoclonal\nantibody binding CD20 on B cells", "questions": ["What is the diagnosis, and why?", "How to approach this case and how to treat?"], "topic": "p6", "sys": "HEP"}, {"id": "c15", "kw": "Five days of fatigue, anorexia and dark urine + tender enlarged liver + ALT 278 with direct hyperbilirubinemia + leucopenia with relative lymphocytosis + HBsAg positive", "dx": "Acute viral hepatitis", "case": 103, "sheet": "Hepatology · DEPBOOK CASE 109\n• CASE\nA 33-year-old male presents with\ngeneralized fatigue, anorexia, dull\naching right hypochondrial pain and\ndark urine for 5 days. There is no past or\nfamily history of liver disease and no\ndrug intake during the last 6 months.\nOn examination he is fully conscious with\na tinge of jaundice; the liver was tender\nand felt 4 fingers below the costal\nmargin. Abdominal ultrasound was\nnormal apart from mild\nhepatosplenomegaly.\nLABORATORY\n↑ ALT 278, AST 211 U/L (< 40)\n↑ Bilirubin 2.3, direct 1.9 mg/dL (< 1.2)\n↓ WBC 3.2 — relative lymphocytosis (4–\n11)\n+ Hepatitis B sAg positive\nNormal: ALP, GGT, albumin, creatinine, INR,\nfasting blood sugar, lipid profile\n• DIAGNOSTIC KEYWORDS\nFive days of fatigue, anorexia and\ndark urine + tender enlarged liver +\nALT 278 with direct\nhyperbilirubinemia + leucopenia\nwith relative lymphocytosis +\nHBsAg positive\nACUTE VIRAL HEPATITIS\n• REVISE\nHepatobiliary System & Pancreas → Acute\nViral Hepatitis\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 103\nFIVE DAYS OF DARK URINE WITH A TENDER\nLIVER\nCASE 5\nHepatitis B serology and its windows\nAcute versus chronic HBV\nWhen acute HBV needs antivirals\nWhat is the diagnosis, and why?\nWHY\n1\nAcute viral hepatitis\nShort 5-day prodrome of fatigue, anorexia and dark\nurine → an acute insult, not chronic disease\nTender hepatomegaly → the acutely inflamed, stretched\nliver capsule — chronic disease is not tender\nDirect hyperbilirubinemia with dark urine →\nconjugated bilirubin is water soluble and spills into urine\nLeucopenia with relative lymphocytosis → the\nhaematological pattern of a viral illness\nNormal INR and albumin → synthetic function is still\nintact — this is not acute liver failure\nHBsAg positive with no drug history → points to\nhepatitis B, though HBsAg alone cannot date the\ninfection\n2 What further investigations do you recommend?\nHepatitis markers — HAV IgM, HBeAg, HBc Ab IgM,\nHBeAb, HBV PCR, HCV PCR, EBV IgM and CMV IgM\nIf HAV IgM, HCV PCR, EBV IgM and CMV IgM are\nnegative while HBsAg, HBeAg, HBc Ab IgM and HBV\nPCR are positive, the diagnosis of acute hepatitis B is\nconfirmed\n3 Is this patient candidate for starting antiviral therapy?\nNo — not routinely. More than 95% of adults with acute\nHBV hepatitis require no specific treatment because they\nrecover fully and spontaneously\nAntivirals are recommended in high risk cases — acute\nliver failure (encephalopathy and coagulopathy with INR\n≥ 1.5) or a protracted course\nChronicity is defined by persistence of HBsAg beyond 6\nmonths\nChronic HBV flare — HBcAb IgM negative, long-standing HBsAg\nAcute hepatitis A — HAV IgM positive, HBsAg negative\nDrug-induced injury — he has taken nothing for 6 months", "questions": ["What is the diagnosis, and why?", "What further investigations do you recommend?", "Is this patient candidate for starting antiviral therapy?"], "topic": "p6", "sys": "HEP"}, {"id": "c16", "kw": "HBV found incidentally on blood donation + normal liver enzymes + HBsAg and HBeAb positive, HBeAg negative + HBV DNA 700 IU/mL + normal ultrasound", "dx": "HBeAg-negative inactive chronic HBV infection", "case": 104, "sheet": "Hepatology · DEPBOOK CASE 110\n• CASE\nA 44-year-old male patient accidentally\ndiscovered to be infected with HBV\nduring blood donation.\nAbdominal ultrasound was normal.\nHBSAG /\nHBEAB\nPositive\nHBEAG /\nHBCAB IGM /\nHBSAB\nNegative\nHBV PCR\n700 IU/mL\nLABORATORY\nNormal: ALT 17, AST 15 U/L, bilirubin total 0.9\n(direct 0.3) mg/dL, abdominal ultrasound\n• DIAGNOSTIC KEYWORDS\nHBV found incidentally on blood\ndonation + normal liver enzymes +\nHBsAg and HBeAb positive, HBeAg\nnegative + HBV DNA 700 IU/mL +\nnormal ultrasound\nHBEAG-NEGATIVE INACTIVE\nCHRONIC HBV INFECTION\n• REVISE\nHepatobiliary System & Pancreas → Chronic\nHepatitis\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 104\nHBSAG POSITIVE WITH NORMAL ENZYMES AND\nA LOW VIRAL LOAD\nCASE 6\nPhases of chronic HBV infection\nThe 2,000 IU/mL threshold\nFibroscan and HCC screening\nWhat is the diagnosis, and why?\nWHY\n1\nHBeAg-negative inactive chronic HBV infection — the\nold terminology was inactive carrier\nNormal liver enzymes → no ongoing necro-inflammation\nHBsAg positive with HBeAb positive and HBeAg\nnegative → e-antigen seroconversion has already\nhappened\nHBV DNA 700 IU/mL — below 2,000 → the threshold\nthat separates inactive infection from active hepatitis\nHBcAb IgM negative → not an acute infection\nHBsAb negative → he has not cleared the surface\nantigen — he is infected, not immune\n2 Is this patient candidate for treatment in this phase?\nNo. The inactive phase of HBeAg-negative chronic HBV\ninfection does not need treatment\nBut treat anyway if he is high risk — cirrhosis, family\nhistory of HCC, or extrahepatic manifestations — or if he\nis going to receive immunosuppressive drugs, even\nwhen the typical treatment indications are not fulfilled\n3 What is the next step?\nFollow up clinically and by laboratory investigations —\nliver enzymes, CBC and HBV DNA — together with\nabdominal ultrasonography every 3–6 months\nHCC screening every 6 months in the high risk group\nTransient elastography (fibroscan) has a role in\nassessing the degree of liver affection by determining\nthe degree of fibrosis\nActive HBeAg-negative hepatitis — DNA > 2,000 with raised\nALT\nAcute hepatitis B — HBcAb IgM positive, high enzymes\nResolved infection — HBsAg negative, HBsAb positive", "questions": ["What is the diagnosis, and why?", "Is this patient candidate for treatment in this phase?", "What is the next step?"], "topic": "p6", "sys": "HEP"}, {"id": "c17", "kw": "Raised ALT and AST + HBsAg and HBeAb positive, HBeAg negative + HBV DNA 22,100 IU/mL + AFP negative and normal ultrasound", "dx": "Active HBeAg-negative chronic hepatitis B", "case": 105, "sheet": "Hepatology · DEPBOOK CASE 111\n• CASE\nA 42-year-old female patient presented to\nthe outpatient clinic with elevated liver\nenzymes.\nAbdominal ultrasound was normal.\nHBSAG /\nHBEAB /\nHBCAB IGG\nPositive\nHBEAG /\nHBSAB /\nHCV AB\nNegative\nHBV DNA\n22,100\nIU/mL\nLABORATORY\n↑ ALT 115, AST 123 U/L (< 40)\n↑ Bilirubin 2.0, direct 0.9 mg/dL (< 1.2)\nNormal: AFP negative, abdominal ultrasound\n• DIAGNOSTIC KEYWORDS\nRaised ALT and AST + HBsAg and\nHBeAb positive, HBeAg negative +\nHBV DNA 22,100 IU/mL + AFP\nnegative and normal ultrasound\nACTIVE HBEAG-NEGATIVE\nCHRONIC HEPATITIS B\n• REVISE\nHepatobiliary System & Pancreas → Chronic\nHepatitis\n• ANSWER\nStudy Smarter Hepatology Cases Page 105\nRAISED ENZYMES WITH HBV DNA ABOVE\nTWENTY THOUSAND\nCASE 7\nTreatment indications in chronic HBV\nTenofovir and entecavir\nAPRI, FIB-4 and fibroscan\nWhat is the diagnosis, and why?\nWHY\n1\nActive HBeAg-negative chronic hepatitis B\nALT 115 and AST 123 → active necro-inflammation —\nthis is hepatitis, not quiet infection\nHBV DNA 22,100 — well above 2,000 IU/mL → active\nviral replication\nHBeAg negative with HBeAb positive → replication\ncontinues despite e-antigen seroconversion — a pre-core mutant\nHBcAb IgG positive, IgM not raised → established\nchronic, not acute, infection\nRaised enzymes plus DNA above threshold → both\ncriteria met — this is the combination that mandates\ntreatment\n2 Is this patient candidate for treatment in this phase?\nYes. Treatment is indicated in HBeAg-negative patients\nwith HBV DNA > 2,000 IU/mL, ALT persistently above\nnormal, and/or at least moderate necro-inflammation\nor fibrosis by biopsy or non-invasive assessment\n(fibroscan, APRI, FIB-4)\nHigh risk patients — cirrhosis, family history of HCC, on\nimmunosuppressive therapy — should be treated\nirrespective of these criteria\nWhat are the recommended drugs you will prescribe to\ntreat this patient?\n3\nA potent nucleoside analogue with a high barrier to\nresistance, long term, is the treatment of choice\nregardless of the severity of liver disease\nPreferred regimens: tenofovir or entecavir as\nmonotherapy\nLamivudine, telbivudine and adefovir are not\nrecommended first line — higher drug resistance and\ninferior response\n4 What is the main end point for treatment?\nLong-term suppression of HBV DNA is the main\nendpoint of all current strategies\nHBsAg loss, with or without anti-HBs seroconversion, is\nthe optimal endpoint — it indicates profound\nsuppression of both viral replication and viral protein\nexpression", "questions": ["What is the diagnosis, and why?", "Is this patient candidate for treatment in this phase?", "What are the recommended drugs you will prescribe to treat this patient?", "What is the main end point for treatment?"], "topic": "p6", "sys": "HEP"}, {"id": "c18", "kw": "Teenager + 4 days of fever, anorexia and vomiting + tea-coloured urine and jaundice + tender hepatomegaly + ALT 2,650 + no drug history", "dx": "Acute viral hepatitis, most likely hepatitis A", "case": 106, "sheet": "Hepatology · DEPBOOK CASE 112\n• CASE\nA 17-year-old male presented with 4\ndays of fever, anorexia, vomiting and\nright hypochondrial pain not related to\nmeals. His mother noticed tea-coloured\nurine on the last day. No history of drug\nintake or previous illnesses.\nOn examination: he was jaundiced, with\nright hypochondrial tenderness and\nhepatomegaly 5 cm below the costal\nmargin. No splenomegaly or ascites.\nTEMPERATURE\n38°C\nPULSE\n120 bpm\nBLOOD\nPRESSURE\nNormal\nLABORATORY\n↑ ALT 2,650, AST 2,320 U/L (< 40)\n↑ Bilirubin 5.0, indirect 2.2 mg/dL (< 1.2)\n• DIAGNOSTIC KEYWORDS\nTeenager + 4 days of fever, anorexia\nand vomiting + tea-coloured urine\nand jaundice + tender hepatomegaly\n+ ALT 2,650 + no drug history\nACUTE VIRAL HEPATITIS, MOST\nLIKELY HEPATITIS A\n• REVISE\nHepatobiliary System & Pancreas → Acute\nViral Hepatitis\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 106\nA TEENAGER WITH TEA-COLOURED URINE AND\nALT OF 2650\nCASE 8\nHepatitis A: transmission and course\nCauses of ALT above 1,000\nSupportive management and\nvaccination\nWhat is the diagnosis, and why?\nWHY\n1\nAcute viral hepatitis, most likely hepatitis A\nAge 17 → HAV is the classic hepatitis of children and\nyoung adults in endemic areas\nFour days of fever, anorexia and vomiting before the\njaundice → the typical prodrome of acute viral hepatitis\nALT 2,650 — far above 1,000 → extensive\nhepatocellular necrosis\nAbsence of drug exposure → removes drug-induced\ninjury, the main alternative at this enzyme level\nTender hepatomegaly with no splenomegaly or ascites\n→ acute inflammation without established chronic liver\ndisease\nWhat further tests would you recommend to confirm the\ndiagnosis?\n2\nAnti-HAV IgM is recommended to confirm the diagnosis\nIf HAV IgM is negative, investigate the other causes of\nviral hepatitis — HBsAg, HBc IgM, HCV antibodies and\nPCR, HEV IgM, EBV IgM, CMV IgM\n3 What is the treatment?\nHAV infection is self limiting — treatment is supportive:\nbed rest, adequate hydration, symptomatic treatment\nHospitalization is rarely required unless complications\narise\nNo antiviral treatment is needed\nPatients should avoid hepatotoxic drugs and alcohol\nuntil full recovery\nDrug-induced liver injury — he takes nothing at all\nAcute hepatitis B — HBsAg and HBc IgM would be positive\nAutoimmune hepatitis — raised IgG, ANA/ASMA positive", "questions": ["What is the diagnosis, and why?", "What further tests would you recommend to confirm the diagnosis?", "What is the treatment?"], "topic": "p6", "sys": "HEP"}, {"id": "c19", "kw": "Young man + jaundice 2 weeks after travel to a HAV-endemic region + ALT 480 with AST 390 + moderate alcohol intake only", "dx": "Acute hepatitis A infection", "case": 129, "sheet": "Hepatology · DEPBOOK CASE 135\n• CASE\nA 25-year-old male presents with\njaundice, fatigue, and right upper\nquadrant pain 2 weeks after traveling to\na hepatitis A-endemic region.\nHe drinks 10–12 units of alcohol/week.\nTRAVEL\nHAV-endemic\nregion\nINCUBATION\n2 weeks\nALCOHOL\n10–12\nunits/week\nLABORATORY\n↑ ALT 480, AST 390 U/L (< 40 — note AST :\nALT < 1)\n↑ Total bilirubin 3.8 mg/dL (< 1.2)\n• DIAGNOSTIC KEYWORDS\nYoung man + jaundice 2 weeks after\ntravel to a HAV-endemic region +\nALT 480 with AST 390 + moderate\nalcohol intake only\nACUTE HEPATITIS A INFECTION\n• REVISE\nHepatobiliary System & Pancreas → Acute\nViral Hepatitis\n• ANSWER\nStudy Smarter Hepatology Cases Page 129\nJAUNDICE TWO WEEKS AFTER TRAVELLING CASE 31\nHepatitis A and E: faecal-oral routes\nAST : ALT ratio in alcoholic liver disease\nPost-exposure prophylaxis for contacts\nWhat is the diagnosis, and why?\nWHY\n1\nAcute hepatitis A virus (HAV) infection\nTravel to an endemic region 2 weeks before → fits the\nHAV incubation period, with faecal-oral transmission\nthrough street food or contaminated water\nALT 480 > AST 390 → an AST : ALT ratio below 1 — a\nviral, not alcoholic, pattern\nAlcohol only 10–12 units a week → moderate intake\ndoes not produce this, and alcoholic hepatitis needs\nAST : ALT above 2:1\nAcute onset in a young, previously well man → an\nacute infectious hepatitis rather than chronic disease\n2 Mention three differential diagnoses for the condition?\nAcute hepatitis A (HAV) infection — most likely.\nPresence in an endemic area carries an increased risk of\nfaecal-oral transmission through street food or\ncontaminated water\nHepatitis E virus (HEV) infection\nAlcoholic hepatitis — less likely. Moderate alcohol use,\nacute onset, and the lack of an AST : ALT ratio above\n2:1 make this less likely\n3 What are the most important investigations?\nIgM anti-HAV to confirm acute HAV\nAbdominal ultrasound to rule out biliary obstruction\n4 Outline management plan for the patient.\nSupportive care — hydration, antiemetics, avoid alcohol\nand hepatotoxic drugs\nMonitor for acute liver failure — check INR, glucose and\nmental status\nPrevent transmission — HAV vaccine or\nimmunoglobulin for close contacts", "questions": ["What is the diagnosis, and why?", "Mention three differential diagnoses for the condition?", "What are the most important investigations?", "Outline management plan for the patient."], "topic": "p6", "sys": "HEP"}, {"id": "c20", "kw": "Pregnant at 32 weeks + jaundice and dark urine + untreated water + ALT 1,200 with INR 1.8 + IgM anti-HEV positive", "dx": "Acute hepatitis E in the third trimester", "case": 131, "sheet": "Hepatology · DEPBOOK CASE 137\n• CASE\nA 28-year-old pregnant female (32\nweeks) presents with jaundice, dark\nurine, and right upper quadrant pain\nafter consuming untreated water.\nGESTATION\n32 weeks\nEXPOSURE\nUntreated\nwater\nIGM ANTI-HEV\nPositive\nLABORATORY\n↑ ALT 1,200 U/L (< 40)\n↑ INR 1.8 (< 1.2 — severe hepatitis)\n• DIAGNOSTIC KEYWORDS\nPregnant at 32 weeks + jaundice\nand dark urine + untreated water +\nALT 1,200 with INR 1.8 + IgM anti-HEV positive\nACUTE HEPATITIS E IN THE THIRD\nTRIMESTER\n• REVISE\nHepatobiliary System & Pancreas → Liver\nDiseases With Pregnancy\n• ANSWER\nStudy Smarter Hepatology Cases Page 131\nHEPATITIS AT THIRTY-TWO WEEKS OF\nPREGNANCY\nCASE 33\nHepatitis E in pregnancy\nIntrahepatic cholestasis of pregnancy\nHELLP syndrome\nWhat is the diagnosis, and why?\nWHY\n1\nAcute hepatitis E virus (HEV) infection\nIgM anti-HEV positive → confirms acute infection — the\ndiagnosis is already made\nUntreated water → the faecal-oral route by which HEV\nspreads\nALT 1,200 with jaundice and dark urine → acute\nhepatocellular necrosis with conjugated bilirubin spilling\ninto urine\nINR 1.8 → an INR above 1.5 indicates severe hepatitis\nand the threat of liver failure\nThird trimester of pregnancy → HEV is far more\ndangerous here — which is why the INR matters so\nmuch\n2 List three differential diagnoses.\na. Acute hepatitis E (HEV) infection — most likely\nb. Intrahepatic cholestasis of pregnancy (ICP), which\npresents with pruritus, normal INR, and elevated bile\nacids\nc. HELLP syndrome, which manifests with hypertension,\nproteinuria and hemolysis\n3 What are the key investigations?\nIgM anti-HEV confirms acute infection\nCoagulation profile — an INR > 1.5 indicates severe\nhepatitis\nFetal ultrasound to assess growth and placental\ninsufficiency\nWhat are the maternal and fetal management outlines?\nMATERNAL\nFETAL\nPREVENTION\n4\nSupportive care — IV fluids, vitamin K supplementation,\nand monitoring for encephalopathy\nDaily kick counts, biweekly ultrasounds, and early\ndelivery if the mother deteriorates\nBoil water, hygiene education, and the HEV vaccine\nwhere available", "questions": ["What is the diagnosis, and why?", "List three differential diagnoses.", "What are the key investigations?", "What are the maternal and fetal management outlines?"], "topic": "p6", "sys": "HEP"}], "bundle": "days/d4.json"}, "5": {"day": 5, "topics": "Jaundice, ALP & PBC · Glomerular disease · AKI & dialysis · Chronic kidney disease · Electrolytes · Acid–base", "essays": [{"id": "e1", "q": "Etiology of acute renal failure (AKI)", "years": "2012–2015 · 2018 · 2020 · 2021 · 2023", "src": "Neph P6", "recent": false, "topic": "n3", "sys": "NEPH", "answer": "<h3>What are the causes of AKI? <span class=\"src\">Neph P6<\/span><\/h3><div class=\"tree\"><span class=\"node\">AKI<\/span><div class=\"branches\"><div class=\"grp\"><span class=\"pill\">1. Pre-renal — decreased renal perfusion<\/span><ul><li>Hemorrhage or dehydration<\/li><li>Severe vomiting or diarrhea<\/li><li>Reduced cardiac output<\/li><li>Burns and third-space loss<\/li><li>Hepatorenal syndrome<\/li><\/ul><\/div><div class=\"grp\"><span class=\"pill\">2. Renal — intrinsic<\/span><ul><li>ATN — the most common intrinsic cause<\/li><li>Glomerulonephritis<\/li><li>Acute interstitial nephritis<\/li><li>Papillary necrosis<\/li><li>Renal vascular occlusion<\/li><\/ul><\/div><div class=\"grp\"><span class=\"pill\">3. Post-renal<\/span><ul><li>Bilateral ureteric obstruction, or obstruction of a single functioning kidney<\/li><li>Stones · tumors · prostatic enlargement<\/li><\/ul><\/div><\/div><\/div>", "text": "What are the causes of AKI? (Neph P6)\nAKI\n1. PRE-RENAL — DECREASED RENAL PERFUSION\n- Hemorrhage or dehydration\n- Severe vomiting or diarrhea\n- Reduced cardiac output\n- Burns and third-space loss\n- Hepatorenal syndrome\n2. RENAL — INTRINSIC\n- ATN — the most common intrinsic cause\n- Glomerulonephritis\n- Acute interstitial nephritis\n- Papillary necrosis\n- Renal vascular occlusion\n3. POST-RENAL\n- Bilateral ureteric obstruction, or obstruction of a single functioning kidney\n- Stones · tumors · prostatic enlargement"}, {"id": "e2", "q": "Stages of chronic kidney disease", "years": "2016 · 2019 · 2020 · 2022", "src": "Neph P8", "recent": false, "topic": "n4", "sys": "NEPH", "answer": "<h3>What are the stages of CKD? <span class=\"src\">Neph P8<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Stage<\/th><th>GFR (mL/min/1.73 m²)<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>I<\/td><td>≥90<\/td><td>Kidney damage with a normal or increased GFR<\/td><\/tr><tr><td>II<\/td><td>60–89<\/td><td>Mild ↓ GFR<\/td><\/tr><tr><td>III<\/td><td>30–59<\/td><td>Moderate ↓ GFR<\/td><\/tr><tr><td>IV<\/td><td>15–29<\/td><td>Severe ↓ GFR<\/td><\/tr><tr><td>V<\/td><td>&lt;15<\/td><td>Kidney failure<\/td><\/tr><\/tbody><\/table><\/div><div class=\"strip\">Stages I and II require evidence of structural or functional kidney damage.<\/div>", "text": "What are the stages of CKD? (Neph P8)\nStage | GFR (mL/min/1.73 m²) | Description\nI | ≥90 | Kidney damage with a normal or increased GFR\nII | 60–89 | Mild ↓ GFR\nIII | 30–59 | Moderate ↓ GFR\nIV | 15–29 | Severe ↓ GFR\nV | <15 | Kidney failure\nStages I and II require evidence of structural or functional kidney damage."}, {"id": "e3", "q": "Causes of nephrotic syndrome", "years": "2012–2015 · 2016 · 2017 · 2021", "src": "Neph P4", "recent": false, "topic": "n2", "sys": "NEPH", "answer": "<h3>What are the causes of nephrotic syndrome? <span class=\"src\">Neph P4<\/span><\/h3><div class=\"pillrow\"><span class=\"pill\">Primary glomerular disease<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Age<\/th><th>Causes in order<\/th><\/tr><\/thead><tbody><tr><td>Children<\/td><td>Minimal change disease — commonest · FSGS · mesangial proliferative GN · membranous GN · MPGN<\/td><\/tr><tr><td>Adults<\/td><td>FSGS — commonest · membranous GN · minimal change disease · mesangial proliferative GN · MPGN<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill\">Secondary causes<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Group<\/th><th>Causes<\/th><\/tr><\/thead><tbody><tr><td>Systemic<\/td><td>Diabetes mellitus · amyloidosis · SLE · vasculitic and immunological diseases<\/td><\/tr><tr><td>Drugs<\/td><td>NSAIDs · captopril<\/td><\/tr><tr><td>Malignancy<\/td><td>Lymphoma or leukemia · solid tumors · multiple myeloma<\/td><\/tr><tr><td>Infections<\/td><td>Post-streptococcal GN · bacterial endocarditis · HBV and HCV · malaria · schistosomiasis<\/td><\/tr><tr><td>Others<\/td><td>Pre-eclampsia · transplant rejection · accelerated hypertension · obesity and sleep apnea · reflux nephropathy<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What are the causes of nephrotic syndrome? (Neph P4)\nPRIMARY GLOMERULAR DISEASE\nAge | Causes in order\nChildren | Minimal change disease — commonest · FSGS · mesangial proliferative GN · membranous GN · MPGN\nAdults | FSGS — commonest · membranous GN · minimal change disease · mesangial proliferative GN · MPGN\nSECONDARY CAUSES\nGroup | Causes\nSystemic | Diabetes mellitus · amyloidosis · SLE · vasculitic and immunological diseases\nDrugs | NSAIDs · captopril\nMalignancy | Lymphoma or leukemia · solid tumors · multiple myeloma\nInfections | Post-streptococcal GN · bacterial endocarditis · HBV and HCV · malaria · schistosomiasis\nOthers | Pre-eclampsia · transplant rejection · accelerated hypertension · obesity and sleep apnea · reflux nephropathy"}, {"id": "e4", "q": "Nephrotic syndrome – clinical picture & complications", "years": "2012–2015 · 2018 · 2019 · 2022", "src": "Neph P4", "recent": false, "topic": "n2", "sys": "NEPH", "answer": "<h3>What is the clinical picture, and what are the complications? <span class=\"src\">Neph P4<\/span><\/h3><div class=\"pillrow\"><span class=\"pill\">Clinical picture<\/span><\/div><ul><li>Morning periorbital puffiness<\/li><li>Evening ankle edema<\/li><li>Soft, pitting, generalized edema<\/li><li>May progress to ascites, pleural effusion and, rarely, pericardial effusion<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Complications<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Complication<\/th><th>Mechanism<\/th><\/tr><\/thead><tbody><tr><td>Hyperlipidemia<\/td><td>Accelerated atherosclerosis with an increased risk of myocardial infarction<\/td><\/tr><tr><td>Infection<\/td><td>Loss of IgG and factor B<\/td><\/tr><tr><td>Hypercoagulability<\/td><td>Loss of antithrombin III → renal vein thrombosis and embolic events<\/td><\/tr><tr><td>AKI<\/td><td>Hypovolemia · renal vein thrombosis · interstitial edema<\/td><\/tr><tr><td>Protein-calorie malnutrition<\/td><td>Continued urinary protein loss<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What is the clinical picture, and what are the complications? (Neph P4)\nCLINICAL PICTURE\n- Morning periorbital puffiness\n- Evening ankle edema\n- Soft, pitting, generalized edema\n- May progress to ascites, pleural effusion and, rarely, pericardial effusion\nCOMPLICATIONS\nComplication | Mechanism\nHyperlipidemia | Accelerated atherosclerosis with an increased risk of myocardial infarction\nInfection | Loss of IgG and factor B\nHypercoagulability | Loss of antithrombin III → renal vein thrombosis and embolic events\nAKI | Hypovolemia · renal vein thrombosis · interstitial edema\nProtein-calorie malnutrition | Continued urinary protein loss"}, {"id": "e5", "q": "Indications of dialysis", "years": "2012–2015 · 2020 · 2021", "src": "Neph P7–8", "recent": false, "topic": "n3", "sys": "NEPH", "answer": "<h3>What are the indications for dialysis in ARF? <span class=\"src\">Neph P7<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Group<\/th><th>Indication<\/th><\/tr><\/thead><tbody><tr><td>Laboratory values<\/td><td>Creatinine above 9–10 mg/dL · K⁺ above 6 mEq/L · HCO₃⁻ below 12 mEq/L<\/td><\/tr><tr><td>Rapid deterioration<\/td><td>Creatinine rising by more than 1 mg/day · K⁺ rising by more than 0.8 mEq/day<\/td><\/tr><tr><td>Clinical<\/td><td>Uremic encephalopathy · pericarditis · convulsions · severe acidosis<\/td><\/tr><\/tbody><\/table><\/div><h3>What are the indications for dialysis in CKD? <span class=\"src\">Neph P8<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Group<\/th><th>Indication<\/th><\/tr><\/thead><tbody><tr><td>1. Symptomatic uremia<\/td><td>Persistent nausea and vomiting · pericarditis · encephalopathy · severe pruritus or neuropathy<\/td><\/tr><tr><td>2. Refractory fluid overload<\/td><td>Pulmonary edema · uncontrolled hypertension<\/td><\/tr><tr><td>3. Severe metabolic disturbance<\/td><td>Refractory hyperkalemia · severe metabolic acidosis<\/td><\/tr><tr><td>4. Advanced renal failure<\/td><td>A very low GFR with symptoms or complications<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What are the indications for dialysis in ARF? (Neph P7)\nGroup | Indication\nLaboratory values | Creatinine above 9–10 mg/dL · K⁺ above 6 mEq/L · HCO₃⁻ below 12 mEq/L\nRapid deterioration | Creatinine rising by more than 1 mg/day · K⁺ rising by more than 0.8 mEq/day\nClinical | Uremic encephalopathy · pericarditis · convulsions · severe acidosis\n\nWhat are the indications for dialysis in CKD? (Neph P8)\nGroup | Indication\n1. Symptomatic uremia | Persistent nausea and vomiting · pericarditis · encephalopathy · severe pruritus or neuropathy\n2. Refractory fluid overload | Pulmonary edema · uncontrolled hypertension\n3. Severe metabolic disturbance | Refractory hyperkalemia · severe metabolic acidosis\n4. Advanced renal failure | A very low GFR with symptoms or complications"}, {"id": "e6", "q": "Causes of jaundice", "years": "2012–2015", "src": "Hep P20 · Symptomatology P35–39", "recent": false, "topic": "p7", "sys": "NEPH", "answer": "", "text": "(Hep P20)\nJ AUN D ICE : D E FIN ITION & CAUS ES\nJaundice: yellow discoloration of the skin and mucosa due to serum bilirubin > 2–3 mg/dL. It is a sign, not a disease.\nCauses of jaundice\nPrehepatic (predominantly\nunconjugated)\nHemolysis\nOther causes\nHepatic (mixed)\nHepatocellular Intrahepatic cholestasis\nExcretion defects\nPosthepatic (obstructive /\npredominantly conjugated)\nStudy Smarter Hepatology · Past Papers Page 20\nHereditary spherocytosis\nSickle cell disease\nG6PD deficiency\nImmune hemolysis\nMalaria\nIneffective erythropoiesis\nHematoma resorption\nMassive transfusion\nGilbert syndrome\nCrigler–Najjar syndrome\nViral hepatitis\nAlcohol\nDrugs\nAutoimmune hepatitis\nCirrhosis\nPBC\nPSC\nOCPs / anabolic steroids\nPregnancy\nSepsis\nLymphoma\nDubin–Johnson syndrome\nRotor syndrome\nCBD stones\nCancer of head of pancreas\nCholangiocarcinoma\nBiliary strictures\nPancreatitis\nExternal compression"}, {"id": "e7", "q": "Causes of metabolic acidosis", "years": "2016 · 2019 · 2020", "src": "Neph P10", "recent": false, "topic": "n6", "sys": "NEPH", "answer": "<h3>What are the causes of metabolic acidosis? <span class=\"src\">Neph P10<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Mechanism<\/th><th>Causes<\/th><\/tr><\/thead><tbody><tr><td>1. Increased acid production<\/td><td>Diabetic ketoacidosis · starvation and alcoholic ketoacidosis · lactic acidosis · salicylate toxicity<\/td><\/tr><tr><td>2. Decreased acid excretion<\/td><td>Advanced renal failure<\/td><\/tr><tr><td>3. Loss of bicarbonate<\/td><td>Severe diarrhea · intestinal or pancreatic fistula · urinary diversion · renal tubular acidosis<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What are the causes of metabolic acidosis? (Neph P10)\nMechanism | Causes\n1. Increased acid production | Diabetic ketoacidosis · starvation and alcoholic ketoacidosis · lactic acidosis · salicylate toxicity\n2. Decreased acid excretion | Advanced renal failure\n3. Loss of bicarbonate | Severe diarrhea · intestinal or pancreatic fistula · urinary diversion · renal tubular acidosis"}, {"id": "e8", "q": "Diagnostic criteria of AKI", "years": "2025 — first time", "src": "Neph P6", "recent": true, "topic": "n3", "sys": "NEPH", "answer": "<h3>What are the diagnostic criteria of AKI? <span class=\"src\">Neph P6<\/span><\/h3><p>AKI is present if any one of the following occurs:<\/p><ol><li>Serum creatinine rises by at least 0.3 mg/dL within 48 hours<\/li><li>Serum creatinine rises to at least 1.5 times baseline within 7 days<\/li><li>Urine output below 0.5 mL/kg/hour for at least 6 hours<\/li><\/ol>", "text": "What are the diagnostic criteria of AKI? (Neph P6)\nAKI is present if any one of the following occurs:\n1. Serum creatinine rises by at least 0.3 mg/dL within 48 hours\n2. Serum creatinine rises to at least 1.5 times baseline within 7 days\n3. Urine output below 0.5 mL/kg/hour for at least 6 hours"}], "cases": [{"id": "c1", "kw": "Middle-aged woman + 8 months of pruritus + xanthelasmas and scratch marks + clubbing + ALP 640 and GGT 230 with direct hyperbilirubinemia + hepatosplenomegaly and ascites", "dx": "Primary biliary cholangitis with cirrhosis", "case": 110, "sheet": "Hepatology · DEPBOOK CASE 116\n• CASE\nA 62-year-old female was referred with\nan 8 months history of pruritus. She had\nloose motions for the past 4 weeks and\nfelt generally tired. There was no loss of\nweight or appetite and no abdominal\npain.\nExamination: mildly jaundiced with\nclubbing of her fingers. No\nlymphadenopathy. BP 170/60. Skin was\ndry and pigmented with scratch marks\nall over her body together with bilateral\nxanthelasmas. Abdomen revealed\nhepatomegaly, spleen 3 fingers below\nthe costal margin, distended with shifting\ndullness.\nLABORATORY\n↑ Alkaline phosphatase 640 U/L (40–130)\n↑ GGT 230 U/L (< 50)\n↑ Bilirubin 3.8, direct 3.0 mg/dL (< 1.2)\n↓ Serum albumin 2 g/dL, PT 15 s (3.5–5.2 /\n11–13)\n• DIAGNOSTIC KEYWORDS\nMiddle-aged woman + 8 months of\npruritus + xanthelasmas and\nscratch marks + clubbing + ALP\n640 and GGT 230 with direct\nhyperbilirubinemia +\nhepatosplenomegaly and ascites\nPRIMARY BILIARY CHOLANGITIS\nWITH CIRRHOSIS\n• REVISE\nHepatobiliary System & Pancreas →\nPrimary Biliary Cirrhosis\n• ANSWER\nStudy Smarter Hepatology Cases Page 110\nEIGHT MONTHS OF ITCHING WITH\nXANTHELASMAS\nCASE 12\nPBC: AMA-M2 and diagnostic criteria\nUDCA and obeticholic acid\nManaging cholestatic pruritus\nWhat is the diagnosis, and why?\nWHY\n1\nPrimary biliary cholangiopathy (previously known as\nprimary biliary cirrhosis)\nPruritus preceding jaundice by months → retained bile\nsalts — the classic opening symptom of chronic\ncholestasis\nALP 640 and GGT 230 out of proportion to the bilirubin\n→ a cholestatic pattern; both are canalicular enzymes\nXanthelasmas → cholestasis raises serum cholesterol —\nit deposits in the skin\nFemale, aged 62 → PBC is overwhelmingly a disease of\nmiddle-aged women\nAlbumin 2 g/dL, PT 15 s, splenomegaly, shifting\ndullness → the cholestasis has already progressed to\ncirrhosis with portal hypertension\n2 What further investigations would you like to perform?\nAnti-mitochondrial antibody (AMA), especially M2 —\nspecific, and present in over 95% of patients\nANA and smooth muscle antibodies may be present but\nare non-specific\nElevated serum alkaline phosphatase is often the\nearliest liver enzyme abnormality\nAminotransferases, GGT and serum cholesterol are\nusually elevated\nAbdominal ultrasonography\n3 What is the treatment of this disease?\nUrsodeoxycholic acid (UDCA) is the treatment of choice\n— it slows disease progression\nObeticholic acid as adjuvant therapy where the\nresponse to UDCA is inadequate\nSupplement fat soluble vitamins and calcium\nPruritus is difficult to treat — cholestyramine and\nnaloxone\nCorticosteroids may relieve symptoms and improve\nbiochemistry and histology, but steroid-induced\nosteoporosis is of great concern\nLiver transplantation for end stage liver disease or\nintractable pruritus", "questions": ["What is the diagnosis, and why?", "What further investigations would you like to perform?", "What is the treatment of this disease?"], "topic": "p9", "sys": "NEPH"}, {"id": "c2", "kw": "Middle-aged woman + pruritus with RUQ pain + ALP 350 out of proportion to the transaminases + AMA 1:1280 + normal ultrasound and normal gall bladder ejection fraction", "dx": "Primary biliary cholangitis", "case": 113, "sheet": "Hepatology · DEPBOOK CASE 119\n• CASE\nA 38-year-old woman presents for further\nevaluation of vague right upper quadrant\npain, pruritus, and abnormal liver test\nresults.\nHer primary care physician has already\nordered a right upper quadrant\nultrasound, which showed no\nabnormality. A quantitative hepatobiliary\niminodiacetic acid scan showed a normal\ngall bladder ejection fraction.\nLABORATORY\n↑ Alkaline phosphatase 350 U/L (40–130)\n↑ AST 65, ALT 72 U/L (< 40)\n+ Antimitochondrial antibody 1:1280\n(ANA 1:20)\nNormal: Albumin 4.0 g/dL, bilirubin 1.2 mg/dL,\nHCV Ab negative, anti-HBc negative, HBsAg\nnegative, anti-HBs positive\n• DIAGNOSTIC KEYWORDS\nMiddle-aged woman + pruritus with\nRUQ pain + ALP 350 out of\nproportion to the transaminases +\nAMA 1:1280 + normal ultrasound\nand normal gall bladder ejection\nfraction\nPRIMARY BILIARY CHOLANGITIS\nDiagnose PBC when there is no extrahepatic\nbiliary obstruction plus at least two of three:\nelevated ALP, positive AMA, histologic\nevidence of PBC.\n• REVISE\nHepatobiliary System & Pancreas →\nPrimary Biliary Cirrhosis\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 113\nA TITRE OF 1:1280 AGAINST MITOCHONDRIA CASE 15\nPBC diagnostic criteria\nInterpreting HBV serology patterns\nBile acid sequestrants for pruritus\nWhat is the diagnosis, and why?\nWHY\n1\nPrimary biliary cholangitis (formerly primary biliary\ncirrhosis)\nShe has no evidence of HCV and is immune by previous\nvaccination to HBV — anti-HBs positive with anti-HBc\nnegative is the vaccination, not the infection, pattern\nPruritus and RUQ pain in a middle-aged woman → the\ntypical PBC presentation — with fatigue, anorexia and\njaundice\nALP 350 with AST 65 and ALT 72 → cholestatic injury\ndominating over hepatocellular\nAMA at a titre of 1:1280 → the specific serological\nmarker; 50% of PBC patients also have a positive ANA\nNormal ultrasound and normal GB ejection fraction →\nno extrahepatic biliary obstruction — a requirement of\nthe diagnostic criteria\nBilirubin only 1.2 with a normal albumin → early\ndisease — caught before decompensation\nMention the drugs that can be used in treatment of pruritus\nin such patients?\n2\nFirst choice — a bile acid sequestrant: cholestyramine\nor colestipol hydrochloride\nUrsodeoxycholic acid (UDCA), with or without\nantihistamines\nOther anti-pruritogenic agents that control itching in\nsome patients: rifampin, naltrexone (an opioid\nantagonist), and sertraline\nPrimary sclerosing cholangitis — male, ulcerative colitis, beading\non MRCP\nAutoimmune hepatitis — hepatitic enzymes, raised IgG, AMA\nnegative\nDrug-induced cholestasis — a recent drug, and AMA negative", "questions": ["What is the diagnosis, and why?", "Mention the drugs that can be used in treatment of pruritus in such patients?"], "topic": "p9", "sys": "NEPH"}, {"id": "c3", "kw": "Ulcerative colitis for 4 years + intermittent right upper quadrant pain with jaundice + gall bladder already removed + no spider nevi, no organomegaly + bowel motions stable and non-bloody", "dx": "Primary sclerosing cholangitis complicating ulcerative colitis", "case": 118, "sheet": "Hepatology · DEPBOOK CASE 124\n• CASE\nA 52-year-old male with a 4 years\nhistory of ulcerative colitis presents for\nhis usual follow up. He complains of\nintermittent abdominal pain, worse in\nthe right upper quadrant. During the last\nepisode of pain, he noticed that his eyes\nlook rather yellow. His bowel motions are\n2–3/d, loose but no blood. He takes\nmesalazine and azathioprine. He\nunderwent cholecystectomy 15 years\nago.\nExamination: jaundiced with no spider\nnevi or palmar erythema. BP 140/85.\nAbdomen shows mild right upper\nquadrant tenderness but no palpable\norganomegaly.\nULCERATIVE\nCOLITIS\n4 years\nGALL\nBLADDER\nRemoved\n15 years\nago\nSPIDER NEVI\nAbsent\n• DIAGNOSTIC KEYWORDS\nUlcerative colitis for 4 years +\nintermittent right upper quadrant\npain with jaundice + gall bladder\nalready removed + no spider nevi, no\norganomegaly + bowel motions\nstable and non-bloody\nPRIMARY SCLEROSING\nCHOLANGITIS COMPLICATING\nULCERATIVE COLITIS\n• REVISE\nHepatobiliary System & Pancreas →\nPrimary Sclerosing Cholangitis\n• ANSWER\nStudy Smarter Hepatology Cases Page 118\nYELLOW EYES IN A MAN WITH ULCERATIVE\nCOLITIS\nCASE 20\nPSC and its link with ulcerative colitis\nMRCP: beading and segmental\ndilatation\nCholangiocarcinoma risk in PSC\nWhat is the diagnosis, and why?\nWHY\n1\nSclerosing cholangitis — jaundice with right\nhypochondrial pain and tenderness in a patient with\nulcerative colitis should raise the suspicion of a\nhepatobiliary complication, and PSC is one of the\nknown extracolonic manifestations of UC\nHe has ulcerative colitis → PSC is the classic\nhepatobiliary association — the bowel disease need not\nbe active\nIntermittent RUQ pain with intermittent jaundice →\nfluctuating biliary obstruction from multifocal strictures\nCholecystectomy 15 years ago → gallstones cannot\nbe the cause — the gall bladder is gone\nNo spider nevi or palmar erythema, no organomegaly\n→ no established chronic liver failure yet\nBowel motions unchanged and non-bloody → the\njaundice is not a marker of a colitis flare\n2 How would you confirm the diagnosis?\nLaboratory studies will show elevated serum markers\nof cholestasis\nMRCP demonstrates the characteristic bile duct changes\n— multifocal strictures with segmental dilatations —\nand also excludes cholangiocarcinoma in high risk\npatients\nERCP confirms the characteristic lesion in the biliary\ntract\nPercutaneous liver biopsy may support PSC but is\nrarely diagnostic. It is required for suspected small duct\nPSC, or if other conditions are suspected — an overlap\nsyndrome with autoimmune hepatitis, or IgG4-\nassociated cholangitis / autoimmune pancreatitis", "questions": ["What is the diagnosis, and why?", "How would you confirm the diagnosis?"], "topic": "p9", "sys": "NEPH"}, {"id": "c4", "kw": "Obese, fertile, female, forty-plus + RUQ pain worse with meals + itching and clay coloured stools + ALP 1000 with GGT 567 and direct hyperbilirubinemia + fever with TLC 14", "dx": "Obstructive jaundice, probably biliary, with cholangitis", "case": 125, "sheet": "Hepatology · DEPBOOK CASE 131\n• CASE\nA 55-year-old obese female presented in\nthe ER with fever and right upper\nquadrant abdominal pain that increases\nwith meals for the last two weeks. There\nwere 2 attacks of vomiting. In the last few\ndays there were itching and clay coloured\nstools. She is a mother of 4 children.\nExamination: conscious, temp 38°C, pulse\n120 bpm, BP 120/80, jaundice with\nscratch marks all over her body.\nAbdomen: right hypochondrial\ntenderness but no organomegaly.\nTEMPERATURE\n38°C\nPULSE\n120 bpm\nSTOOLS\nClay\ncoloured\nLABORATORY\n↑ Alkaline phosphatase 1000 U/L, GGT\n567 (40–130 / < 50)\n↑ Bilirubin 3.5, direct 3.0 mg/dL (< 1.2)\n↑ TLC 14 × 10⁹/L (4–11)\n• DIAGNOSTIC KEYWORDS\nObese, fertile, female, forty-plus +\nRUQ pain worse with meals +\nitching and clay coloured stools +\nALP 1000 with GGT 567 and direct\nhyperbilirubinemia + fever with TLC\n14\nOBSTRUCTIVE JAUNDICE,\nPROBABLY BILIARY, WITH\nCHOLANGITIS\n• REVISE\nHepatobiliary System & Pancreas → Gall\nBladder Diseases / Jaundice\n• ANSWER\nStudy Smarter Hepatology Cases Page 125\nCLAY STOOLS AND AN ALKALINE PHOSPHATASE\nOF A THOUSAND\nCASE 27\nObstructive jaundice: the clinical triad\nCanalicular enzymes ALP and GGT\nERCP versus MRCP\nWhat is the diagnosis, and why?\nWHY\n1\nObstructive jaundice. This obese fertile female had\njaundice, itching and clay-coloured stools, all pointing\nto obstruction; the right hypochondrial pain and\ntenderness make the gall bladder the most likely site of\npathology\nClay coloured stools → no bile is reaching the gut — the\nduct is blocked\nItching with scratch marks → retained bile salts in the\nskin\nDirect hyperbilirubinemia with ALP 1000 and GGT 567\n→ both are canalicular enzymes — a post-hepatic\nblock, not hepatocellular\nPain worse with meals → fatty food triggers gall\nbladder contraction against an obstruction\nFever 38°C with TLC 14 → infection above an\nobstructed duct — cholangitis\n2 What is your interpretation of the laboratory tests?\nDirect hyperbilirubinemia, with elevation of alkaline\nphosphatase and GGT — both canalicular enzymes,\nwhich supports a biliary cause of the direct\nhyperbilirubinemia\nThe elevated TLC should raise the possibility of\ncholangitis complicating the condition\n3 What further investigations would you do?\nAbdominal US is the first step in the diagnosis\nERCP when contrast-enhanced fluoroscopic ductal\nvisualization is needed — particularly for subtle\nintraductal lesions, tissue sampling, and differentiating\nbenign from malignant strictures\nMRCP is a sensitive, non-invasive method of particular\nvalue when ultrasound or CT shows bile duct dilatation,\nwhen the etiology is unclear, or where ERCP is\ncontraindicated or high risk", "questions": ["What is the diagnosis, and why?", "What is your interpretation of the laboratory tests?", "What further investigations would you do?"], "topic": "p7", "sys": "NEPH"}, {"id": "c5", "kw": "Young woman + acute RUQ pain, jaundice and ascites + tender hepatomegaly + two consecutive abortions + mild thrombocytopenia + normal liver enzymes", "dx": "Budd-Chiari syndrome (hepatic venous outflow obstruction)", "case": 115, "sheet": "Hepatology · DEPBOOK CASE 121\n• CASE\nA 25-year-old lady presented with acute\nonset of right hypochondrial pain,\njaundice and increase of abdominal\ngirth. She was married since 4 years and\ngave history of two consecutive\nabortions. There was no history of\nalopecia, photosensitivity or skin rash.\nExamination: BP 110/70, pulse 90/min\nregular. She was jaundiced with an\nenlarged tender liver and ascites by\nshifting dullness.\nLABORATORY\n↓ Platelets 110,000/dL (150–400 × 10⁹)\n↑ Bilirubin 3 mg/dL — biphasic (< 1.2)\nNormal: Liver enzymes\n• DIAGNOSTIC KEYWORDS\nYoung woman + acute RUQ pain,\njaundice and ascites + tender\nhepatomegaly + two consecutive\nabortions + mild thrombocytopenia\n+ normal liver enzymes\nBUDD-CHIARI SYNDROME\n(HEPATIC VENOUS OUTFLOW\nOBSTRUCTION)\n• REVISE\nHepatobiliary System & Pancreas →\nVascular Diseases of the Liver\n• ANSWER\nStudy Smarter Hepatology Cases Page 115\nASCITES AND JAUNDICE IN A WOMAN WITH TWO\nMISCARRIAGES\nCASE 17\nAntiphospholipid syndrome criteria\nBudd-Chiari: stepwise treatment\nAnticoagulation in thrombophilia\nWhat is the diagnosis, and why?\nWHY\n1\nBudd-Chiari syndrome — the classic triad of acute\nabdominal pain, ascites and hepatomegaly suggests\nhepatic venous outflow tract obstruction\nAcute pain with a tender enlarged liver and new\nascites → rapid hepatic congestion, the Budd-Chiari\ntriad\nTwo consecutive abortions → recurrent fetal loss is a\nclinical criterion of the antiphospholipid syndrome\nThrombocytopenia → another feature of\nantiphospholipid syndrome, not only of hypersplenism\nNormal liver enzymes despite jaundice → congestion\nrather than hepatocyte necrosis\nNo alopecia, photosensitivity or rash → argues\nagainst underlying lupus — so the antiphospholipid\nsyndrome here is likely primary\n2 Mention the possible cause for this patient's condition?\nThe previous history of 2 consecutive abortions makes\nantiphospholipid syndrome the likely cause\nIt is a prothrombotic condition that occurs primary\n(idiopathic) or secondary to autoimmune disease such\nas systemic lupus erythematosus\n3 Mention lines of treatment?\nTreatment aims to prevent clot propagation, restore\npatency, decompress the congested liver and prevent or\nmanage complications. A stepwise approach is followed:\nTreat the underlying condition where possible\nAnticoagulation (warfarin) in all patients, continued\nindefinitely unless a major contraindication or a\ncomplication occurs\nThrombolytic therapy in acute Budd-Chiari (within 3–4\nweeks) with a well-defined clot, absent contraindications\nAngioplasty ± stenting for acute or subacute disease\nwith segmental hepatic vein stenosis\nChronic disease — decompress the liver: TIPS, surgical\nshunts, or transplantation\nUpper endoscopy to screen for varices, with non-selective beta blocker or band ligation if present", "questions": ["What is the diagnosis, and why?", "Mention the possible cause for this patient's condition?", "Mention lines of treatment?"], "topic": "p8", "sys": "NEPH"}, {"id": "c6", "kw": "Anorexia, nausea, weight loss, pruritus + creatinine 9, BUN 100 + anemia, hypocalcemia, hyperphosphatemia + untreated hypertension", "dx": "End stage renal failure on a background of chronic kidney disease", "case": 223, "sheet": "Nephrology · DEPBOOK CASE 229\n• CASE\nA 50-year-old female with long\nstanding hypertension on irregular\ntreatment, presented with fatigue\nover 6 months, and over the last 2\nmonths nausea with vomiting,\nweight loss and itching. BP\n170/110, pale with scratch marks,\ndry skin, systolic murmur.\nBLOOD\nPRESSURE\n170/110\nSKIN\nDry,\nscratch\nmarks\nDURATION\n6\nmonths\nLABORATORY\n↑ Creatinine 9 mg/dL, BUN 100\nmg/dL\n↑ Potassium 5.8, phosphate 6.5\nmg/dL\n↓ Calcium 7.5 mg/dL, Hb 8 g/dL\nNormal: Sodium 135, WBC 4.7, platelets\n190 × 10³/mm³\n• DIAGNOSTIC KEYWORDS\nAnorexia, nausea, weight\nloss, pruritus + creatinine 9,\nBUN 100 + anemia,\nhypocalcemia,\nhyperphosphatemia +\nuntreated hypertension\nEND STAGE RENAL FAILURE\nON A BACKGROUND OF\nCHRONIC KIDNEY DISEASE\n• REVISE\nNephrology → Chronic Kidney\nDisease\n• ANSWER\nStudy Smarter Nephrology Cases Page 223\nSIX MONTHS OF FATIGUE WITH A CREATININE OF\nNINE\nCASE 1\nAcute versus chronic renal failure\nAnemia of CKD: EPO and iron\nTiming of dialysis access\nWhat is the diagnosis, and why?\nWHY\n1\nEnd stage renal failure — the typical symptoms are all here:\nanorexia, nausea, weight loss, fatigue and pruritus. The urea\nand creatinine confirm renal failure, while the anemia,\nhypocalcemia, hyperphosphatemia and dry skin indicate its\nchronic nature\nAnemia with hypocalcemia and hyperphosphatemia → these\nmake it CHRONIC — an acute injury has not had time to\nproduce them\nPruritus, scratch marks, dry skin, with untreated hypertension\n→ uremic skin changes, which take months — on the likely\ncause, still uncontrolled\n2 What further investigation would you like to perform?\nUltrasonography — shrunken kidneys with reduced\nechogenicity, or an obvious cause such as polycystic kidney\ndisease or obstruction with bilateral hydronephrosis.\nAsymmetrically sized kidneys suggest reflux nephropathy or\nrenovascular disease\nPTH level — elevated in the secondary hyperparathyroidism of\nCKD\n3 How can you manage her anemia?\nCBC with RBC indices, reticulocyte count and iron study (iron,\nTIBC, ferritin) to establish the type. Target Hb in CKD is 10–\n11.5 g/dL\nIf normochromic normocytic, it is predominantly erythropoietin\ndeficiency — EPO injection is needed. If iron stores are\ninadequate (ferritin < 500 ng/mL, transferrin saturation < 30%),\nreplace iron orally, or IV — the preferred route on dialysis\nHIF stabilizers (roxadustat) stimulate endogenous EPO and\nimprove iron metabolism. Transfusion below Hb 7 g/dL, or\nhigher with cardiovascular comorbidity\n4 Discuss treatment strategies for this patient?\nSymptomatic with raised chemistry, shrunken kidneys and no\ncorrectable factor (dehydration, infection, obstruction) — so\nrenal replacement therapy, hemodialysis or peritoneal dialysis,\nor transplantation. For hemodialysis an AV fistula is\nconstructed — it should have been done at CKD stage 4 (GFR\n30–15)\nTransplantation needs a compatible donor; it resumes normal\nfunction but requires lifelong immunosuppression", "questions": ["What is the diagnosis, and why?", "What further investigation would you like to perform?", "How can you manage her anemia?", "Discuss treatment strategies for this patient?"], "topic": "n4", "sys": "NEPH"}, {"id": "c7", "kw": "Three days of diarrhea in a man living alone, too weak to drink + BP 90/60 with dry mucous membranes + creatinine 6, urea 200 + Hb NORMAL + urine analysis unremarkable", "dx": "Prerenal acute kidney injury progressing to acute tubular necrosis", "case": 224, "sheet": "Nephrology · DEPBOOK CASE 230\n• CASE\nA 70-year-old male living alone\ndeveloped diarrhea persisting for 3\ndays before coming to hospital. He\ncomplained of reduced urine output\nand marked weakness, and was too\nweak even to bring himself a glass of\nwater. No past history of medical\nimportance.\nExamination: BP 90/60, dry mucous\nmembranes and skin turgor showing\nevident dehydration.\nBLOOD\nPRESSURE\n90/60\nHYDRATION\nEvidently\ndehydrated\nURINE\nANALYSIS\nUnremarkable\nLABORATORY\n↑ Creatinine 6 mg/dL, urea 200 mg/dL\nNormal: Hb 12 g/dL; urine analysis\n• DIAGNOSTIC KEYWORDS\nThree days of diarrhea in a man\nliving alone, too weak to drink +\nBP 90/60 with dry mucous\nmembranes + creatinine 6, urea\n200 + Hb NORMAL + urine\nanalysis unremarkable\nPRERENAL ACUTE KIDNEY\nINJURY PROGRESSING TO ACUTE\nTUBULAR NECROSIS\n• REVISE\nNephrology → Acute Kidney Injury\n• ANSWER\nStudy Smarter Nephrology Cases Page 224\nTHREE DAYS OF DIARRHOEA AND ALMOST NO\nURINE\nCASE 2\nFractional excretion of sodium\nPrerenal versus ATN urinary sediment\nEmergency management of\nhyperkalemia\nWhat is the diagnosis, and why?\nWHY\n1\nPrerenal acute kidney injury / acute tubular necrosis\n(AKI/ATN) — ATN develops with prolongation of the\nprerenal condition\nNormal Hb with no anemia → this is what makes it\nACUTE — chronic renal failure would have anemia,\nhypocalcemia and hyperphosphatemia\nUnable to drink for three days while losing fluid → intake\nstopped while output continued — profound volume\ndepletion\nBP 90/60 with dry membranes and poor turgor → renal\nhypoperfusion, the mechanism of the injury\nUrine analysis unremarkable → a bland sediment fits\nthe prerenal phase; once ATN is established you expect\ntubular cells and pigmented casts\n2 How would you confirm the diagnosis?\nUrine analysis and calculation of the fractional excretion\nof sodium (FENa) — FENa = urine Na / serum Na. This\ndistinguishes:\nPrerenal — FENa < 1% with an inactive urinary sediment\nATN — FENa > 1%, with sediment often containing renal\ntubular epithelial cells and brownish pigmented cellular\ncasts\n3 What other tests are needed?\nAbdominal ultrasonography to exclude post-renal\ncauses, especially prostatic enlargement. An active urine\nsediment may point to an intrinsic renal cause\nSerum Na, K, Ca, P, uric acid and blood gases for further\nmanagement\nWhat is the first line of management to be done in this\npatient?\n4\nReplace fluid losses with IV saline, preferably under CVP\nguidance and urine output\nIn the presence of hyperkalemia, first line is IV calcium\ngluconate, glucose-insulin and sodium bicarbonate", "questions": ["What is the diagnosis, and why?", "How would you confirm the diagnosis?", "What other tests are needed?", "What is the first line of management to be done in this patient?"], "topic": "n3", "sys": "NEPH"}, {"id": "c8", "kw": "Three nephrotoxic exposures in one month — gentamicin, NSAID, radiocontrast + anuria for 10 hours + 61-year-old diabetic man + on a diuretic", "dx": "Acute kidney injury presenting as anuria", "case": 232, "sheet": "Nephrology · DEPBOOK CASE 238\n• CASE\nA 61-year-old retired male, heavy\nsmoker, with long standing\ndiabetes on premixed insulin and\nhypertension on captopril and\nhydrochlorothiazide. He was\nprescribed an NSAID for neck pain.\nOne month ago, dysuria, frequency\nand urgency treated with a one\nweek course of gentamicin, from\nwhich he recovered completely.\nThree days ago he underwent\ncoronary angiography and was\nprescribed isosorbide mononitrate\nand aspirin. He now complains that\nhe has not passed urine for the\nlast 10 hours.\nANGIOGRAPHY\n3 days\nago\nANURIA\n10 hours\nNEPHROTOXINS\nContrast,\ngentamicin,\nNSAID\n• DIAGNOSTIC KEYWORDS\nThree nephrotoxic exposures\nin one month — gentamicin,\nNSAID, radiocontrast + anuria\nfor 10 hours + 61-year-old\ndiabetic man + on a diuretic\nACUTE KIDNEY INJURY\nPRESENTING AS ANURIA\n• REVISE\nNephrology → Acute Kidney Injury\n• ANSWER\nStudy Smarter Nephrology Cases Page 232\nNO URINE FOR TEN HOURS AFTER CORONARY\nANGIOGRAPHY\nCASE 10\nFENa versus FEurea\nContrast nephropathy prevention\nPost-renal obstruction in\ndiabetics\nWhat is the diagnosis, and why?\nWHY\n1\nAcute kidney injury presenting as anuria, in a diabetic man\nwho has had three separate nephrotoxic exposures within a\nmonth — gentamicin, an NSAID, and radiocontrast three\ndays ago\nAnuria beginning 3 days after a procedure → the timing\nmatters — work out what was given, and when\nGentamicin and an NSAID within the same month → each is\nnephrotoxic by a different mechanism, and they are additive\nDiabetic, aged 61 → pre-existing diabetic kidney disease\nraises the risk, and his age raises other possibilities entirely\nOn a thiazide diuretic → which matters when you come to\ninterpret the urinary indices\n2 What is the differential diagnosis of his condition?\nAcute kidney injury — acute papillary necrosis, acute\ninterstitial nephritis, or ATN — due to radiocontrast,\ngentamicin or NSAIDs\nBeing a 61-year-old diabetic, acute urine retention from\nprostatic enlargement or diabetic neuropathy is another\npossibility\n3 What is the first step to be done to reach a diagnosis?\nPelvic ultrasound — in acute urine retention the urinary\nbladder is seen distended\nIs there a place for doing FENa or FEurea? Which of the two do\nyou prefer in this case?\n4\nBoth can differentiate pre-renal (hypovolemia) from intrarenal\n(ATN) causes\nFEurea is preferred here, because in AKI patients receiving\ndiuretics FENa is not reliable\nIf the case is related to radiocontrast, how can we manage it? And\nhow can it be avoided?\n5\nFluid restricted according to fluid balance; diet — restrict\nprotein; electrolytes — restrict sodium and phosphate, give\ncalcium freely, correct hyperkalemia; correct acidosis; follow\nkidney function; dialysis is considered\nAvoided by — good hydration, sodium bicarbonate, N-acetylcysteine, stopping the ACE inhibitor, the diuretic and the\nNSAID, and using non-ionic contrast media", "questions": ["What is the diagnosis, and why?", "What is the differential diagnosis of his condition?", "What is the first step to be done to reach a diagnosis?", "Is there a place for doing FENa or FEurea? Which of the two do you prefer in this case?", "If the case is related to radiocontrast, how can we manage it? And how can it be avoided?"], "topic": "n3", "sys": "NEPH"}, {"id": "c9", "kw": "Proteinuria +++ with edema and cholesterol 319 + hematuria 20–30 RBC + no diabetes, no hypertension + serology negative, complement NOT consumed + creatinine 1.5", "dx": "Nephrotic syndrome", "case": 225, "sheet": "Nephrology · DEPBOOK CASE 231\n• CASE\nA 37-year-old male presented with\nlower limb edema and puffiness of the\neyelids. No previous history of\ndiabetes or hypertension. BP 140/80,\nedema restricted to the ankles. Chest,\nheart and abdomen unremarkable.\nHepatitis markers, ANA and anti-DNA\nwere negative. C3 and C4 were not\nconsumed. Renal biopsy was done.\nBLOOD\nPRESSURE\n140/80\nCOMPLEMENT\nC3, C4 not\nconsumed\nSEROLOGY\nAll\nnegative\nLABORATORY\n+ Urine albumin +++, RBC 20–30/mm³\n(WBC 5–10)\n↑ Cholesterol 319, LDL 240,\ntriglycerides 225 mg/dL (HDL 48)\n↑ Creatinine 1.5 mg/dL (0.6–1.2)\nNormal: Hb 12 g/dL; hepatitis markers, ANA,\nanti-DNA\n• DIAGNOSTIC KEYWORDS\nProteinuria +++ with edema and\ncholesterol 319 + hematuria 20–\n30 RBC + no diabetes, no\nhypertension + serology negative,\ncomplement NOT consumed +\ncreatinine 1.5\nNEPHROTIC SYNDROME\n• REVISE\nNephrology → Glomerular Disease →\nNephrotic Syndrome\n• ANSWER\nStudy Smarter Nephrology Cases Page 225\nPUFFY EYELIDS WITH CHOLESTEROL OF 319 CASE 3\nPrimary versus secondary nephrotic\nsyndrome\nAntiproteinuric measures\nPathologic types and hematuria\nWhat is the diagnosis, and why?\nWHY\n1\nNephrotic syndrome — proteinuria, edema and\nhypercholesterolemia; though 24-hour urinary protein\nand serum albumin are needed to confirm the diagnosis\nHeavy proteinuria with edema and hypercholesterolemia\n→ the defining triad — protein loss drops oncotic pressure\nand the liver compensates with lipids\nC3 and C4 NOT consumed → this single line argues\nagainst post-streptococcal GN and lupus nephritis, both\nof which consume complement\nHepatitis markers, ANA and anti-DNA negative →\nexcludes hepatitis-related and collagen disease\nHematuria present → narrows the likely pathology — it is\nuncommon in membranous and minimal change disease\n2 What is the most likely underlying etiology?\nNegative hepatitis markers, ANA and anti-DNA exclude\nhepatitis and collagen diseases\nANCA is also needed to exclude vasculitis, which usually\nhas a more stormy presentation\nASOT and CRP for post-streptococcal GN, which is more\nof a nephritic presentation and has reduced C3\nNo history of diabetes, confirmable by lab test. So\nprobably primary (idiopathic) nephrotic syndrome\n3 Discuss possible measures to reduce proteinuria.\nReduce BP to less than 130/80 mmHg; ACE inhibitors or\nARBs, with or without a non-dihydropyridine calcium\nchannel blocker\nSGLT2 inhibitors (empagliflozin) reduce proteinuria by 25–\n35%, especially in diabetics. Immunosuppression of the\nprimary nephrotic syndrome, depending on the pathologic\ntype\n4 Discuss possible pathologic findings.\nMesangiocapillary (membranoproliferative, MPGN), focal\nsegmental glomerulosclerosis (FSGS), or\nmesan
