e done?\nAbdominal ultrasound to confirm ascites\nDiagnostic paracentesis to analyse the ascitic fluid —\nan ascitic PMN count > 250 cells/mm³ is diagnostic for\nSBP. Gram staining and culture are needed to assess\nthe effect of covering antibiotic therapy\nRenal function to exclude hepatorenal syndrome\nCT abdomen if secondary peritonitis is suspected or the\npresentation is atypical\n3 What is the cause of shifting dullness and fever?\nAccumulation of free fluid in the abdomen (ascites) is\nthe cause of the shifting dullness\nSBP is the cause of the fever — but sepsis from other\nsources (urinary tract, chest) and hepatocellular\ncarcinoma should also be considered", "questions": ["What is the diagnosis, and why?", "What further investigations should be done?", "What is the cause of shifting dullness and fever?"], "topic": "p3", "sys": "HEP"}, {"id": "c8", "kw": "Known cirrhosis + two days of fever and abdominal discomfort + ascites with shifting dullness + ascitic PMN count 500 cells/mm³ + Na 130 with albumin 2.5", "dx": "Spontaneous bacterial peritonitis", "case": 121, "sheet": "Hepatology · DEPBOOK CASE 127\n• CASE\nA 48-year-old man with HCV and\nalcohol-related cirrhosis hospitalized\nwith a two-day history of fever and\nabdominal discomfort. His temperature is\n38°C.\nHe has abdominal distension with\nshifting dullness and a small, reducible\numbilical hernia is noted.\nTEMPERATURE\n38°C\nASCITIC PMN\n500\ncells/mm³\nUMBILICAL\nHERNIA\nSmall,\nreducible\nLABORATORY\n↓ Sodium 130 mEq/L (135–145)\n↓ Albumin 2.5 g/dL (3.5–5.2)\n↑ ALT 75 U/L (< 40)\n↓ Ascitic albumin 1 g/dL (SAAG 1.5 —\nportal hypertensive)\n• DIAGNOSTIC KEYWORDS\nKnown cirrhosis + two days of fever\nand abdominal discomfort + ascites\nwith shifting dullness + ascitic PMN\ncount 500 cells/mm³ + Na 130 with\nalbumin 2.5\nSPONTANEOUS BACTERIAL\nPERITONITIS\n• REVISE\nHepatobiliary System & Pancreas → Ascites\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 121\nFIVE HUNDRED NEUTROPHILS IN THE ASCITIC\nFLUID\nCASE 23\nSBP: diagnosis, treatment, prophylaxis\nAlbumin infusion to protect the kidney\nSAAG in ascitic fluid\nWhat is the diagnosis, and why?\nWHY\n1\nSpontaneous bacterial peritonitis (SBP) — confirmed\nby an ascitic PMN count ≥ 250/mm³ in the absence of a\nsurgical infection and in the presence of cirrhosis\nAscitic PMN 500, twice the threshold → the diagnosis\nis made on the fluid, not on the fever\nFever with abdominal discomfort in a known cirrhotic\n→ the classic, and often the only, clinical clue\nNo surgical source — no perforation, no abscess →\nthis is spontaneous, not secondary, peritonitis\nSerum albumin 2.5 with ascitic albumin 1 → a SAAG\nof 1.5 confirms the ascites is portal hypertensive\nSodium 130 → dilutional hyponatremia of advanced\ncirrhosis — a marker of poor prognosis\nWhich are the most appropriate next steps in managing\nthis patient?\n2\nBegin empirical IV antibiotics immediately — typically\ncefotaxime 2 g IV every 8 hours or ceftriaxone. Oral\nfluoroquinolones (e.g. ofloxacin) can be used in stable\npatients without renal dysfunction or vomiting\nAlbumin infusion — 1.5 g/kg on day 1 and 1 g/kg on\nday 3 — is indicated to prevent renal impairment\nRecurrence of SBP is common, so long term antibiotic\nprophylaxis is recommended — norfloxacin or\nciprofloxacin\nHernia repair should be delayed until the ascites is\ncontrolled\nSecondary peritonitis — multiple organisms, low glucose, high\nLDH; needs CT\nHepatorenal syndrome — no fever, no raised PMN count\nStrangulated umbilical hernia — irreducible and tender — his\nreduces", "questions": ["What is the diagnosis, and why?", "Which are the most appropriate next steps in managing this patient?"], "topic": "p3", "sys": "HEP"}, {"id": "c9", "kw": "HCV cirrhosis with refractory ascites and oliguria + creatinine climbing 1.5 → 1.8 over 6 weeks + no fever, no infection, no bleeding + ascitic neutrophils only 120", "dx": "Hepatorenal syndrome", "case": 122, "sheet": "Hepatology · DEPBOOK CASE 128\n• CASE\nA 45-year-old man with HCV related\nliver cirrhosis is admitted with refractory\nascites, oliguria, and failure to thrive. No\nfever, jaundice, edema or\nencephalopathy.\nBlood and urine cultures are negative.\nNasogastric lavage is negative for blood.\nASCITIC\nNEUTROPHILS\n120 /mm³\nCULTURES\nNegative\nNG LAVAGE\nNo blood\nLABORATORY\n↑ BUN 18 → 25 mg/dL over 6 weeks (7–\n20)\n↑ Creatinine 1.5 → 1.8 mg/dL (0.6–1.2)\n• DIAGNOSTIC KEYWORDS\nHCV cirrhosis with refractory ascites\nand oliguria + creatinine climbing\n1.5 → 1.8 over 6 weeks + no fever,\nno infection, no bleeding + ascitic\nneutrophils only 120\nHEPATORENAL SYNDROME\n• REVISE\nHepatobiliary System & Pancreas →\nHepatorenal Syndrome\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 122\nCREATININE CREEPING UP WITH REFRACTORY\nASCITES\nCASE 24\nHRS diagnostic criteria\nTerlipressin, midodrine and octreotide\nTransplantation as definitive therapy\nWhat is the diagnosis, and why?\nWHY\n1\nHepatorenal syndrome (HRS) — a functional renal\nfailure in patients with advanced liver disease\nDiagnostic criteria: cirrhosis with ascites; rising serum\ncreatinine with no improvement after plasma\nexpansion and diuretic withdrawal for 2 consecutive\ndays; absence of shock or nephrotoxins; and absence\nof structural kidney disease\nCirrhosis with refractory ascites → the setting in which\nHRS arises — extreme splanchnic vasodilatation\nCreatinine rising progressively over 6 weeks → a\nsteady functional decline, not an acute insult\nAscitic neutrophils 120, below 250, cultures negative\n→ SBP is excluded — infection is the commonest\nprecipitant and must be ruled out\nNG lavage negative for blood → no GI bleed causing\npre-renal failure\nNo shock, no nephrotoxic drugs → acute tubular\nnecrosis is excluded — the kidneys are structurally\nnormal\n2 What is the best next step in managing this patient?\nStart vasopressor therapy — terlipressin, or midodrine\nand octreotide\nExpand the intravascular volume with IV albumin for 2\ndays\nRenal replacement therapy may be needed in refractory\ncases as a bridge to transplantation\nFor refractory HRS, liver transplant referral is\nrecommended — it treats the liver, and the kidney\nfollows\nPrerenal azotemia — creatinine falls once volume is expanded\nAcute tubular necrosis — muddy brown casts, recent shock or\nnephrotoxin\nGlomerulonephritis — proteinuria, haematuria and casts", "questions": ["What is the diagnosis, and why?", "What is the best next step in managing this patient?"], "topic": "p3", "sys": "HEP"}, {"id": "c10", "kw": "30 paracetamol tablets a day for 3 days + jaundice with a tender liver + ALT 3,440 + bilirubin 24.5 + normal albumin with INR 1.4", "dx": "Acetaminophen-induced liver injury", "case": 108, "sheet": "Hepatology · DEPBOOK CASE 114\n• CASE\nA 28-year-old male comes complaining of\n5 days of nausea, vomiting, diffuse\nabdominal pain, muscle aches, anorexia\nand fever up to 38°C. He has no\nsignificant past or family history and\ndenies drug abuse. He takes no\nmedications routinely, but he has been\ntaking acetaminophen, approximately 30\ntablets per day for 3 days for tennis\nelbow.\nExamination: temperature 37.8°C, pulse 98\nbpm, BP 120/75. He has jaundice. Chest\nand heart are clear. The liver is slightly\ntender. No abdominal distention or\nperipheral edema.\nLABORATORY\n↑ ALT 3,440, AST 2,705 U/L (< 40)\n↑ Bilirubin 24.5, direct 18.2 mg/dL (< 1.2)\n↑ Alkaline phosphatase 349 IU/L (40–129)\n↑ INR 1.4 (< 1.2)\nNormal: CBC, creatinine 1.1 mg/dL, serum\nalbumin 4.0 g/dL\n• DIAGNOSTIC KEYWORDS\n30 paracetamol tablets a day for 3\ndays + jaundice with a tender liver +\nALT 3,440 + bilirubin 24.5 + normal\nalbumin with INR 1.4\nACETAMINOPHEN-INDUCED LIVER\nINJURY\n• REVISE\nHepatobiliary System & Pancreas → Drug\nInduced Liver Injury\n• ANSWER\nStudy Smarter Hepatology Cases Page 108\nTHIRTY PARACETAMOL TABLETS A DAY FOR\nTENNIS ELBOW\nCASE 10\nParacetamol toxicity and NAC\nCauses of ALT above 1,000\nKing's College criteria\nWhat is the diagnosis, and why?\nWHY\n1\nDrug induced liver injury (DILI), mostly due to\nacetaminophen\nThe degree and pattern of transaminase elevation gives\nthe clue. Levels above 1,000 IU/L are seen in conditions\nproducing extensive hepatic necrosis — drug induced\nliver injury, acute hepatitis A, ischemia (shock liver),\nautoimmune hepatitis and Wilson's disease\n30 tablets a day for 3 days → far above the maximum\ndaily dose — a staggered supratherapeutic ingestion\nALT 3,440 → massive hepatocellular necrosis, not a\ncholestatic or infiltrative picture\nNormal albumin with only mildly raised INR → the\ninjury is acute — albumin has a long half-life and has\nnot had time to fall\nJaundice with a tender liver and no ascites or edema\n→ acute hepatocyte injury without established chronic\ndisease\nTaken for pain, not in overdose intent → therapeutic\nmisadventure causes as much damage as deliberate\noverdose\n2 What is the most important immediate diagnostic test?\nSerum acetaminophen level.\nThe markedly elevated transaminases and bilirubin with\na normal albumin are consistent with acute viral\nhepatitis or acute drug induced liver injury\nObtaining the serum acetaminophen level and knowing\nthe time of his last ingestion together establish\nacetaminophen-related liver damage and the possible\nneed for N-acetylcysteine, which acts as an effective\nantidote", "questions": ["What is the diagnosis, and why?", "What is the most important immediate diagnostic test?"], "topic": "p5", "sys": "HEP"}, {"id": "c11", "kw": "Young woman + jaundice with confusion and flapping tremor + ALT 3,565 with INR 2.3 + ANA 1:160 + viral markers, copper studies and paracetamol level all negative", "dx": "Acute liver failure due to autoimmune hepatitis", "case": 116, "sheet": "Hepatology · DEPBOOK CASE 122\n• CASE\nA 22-year-old female presents with\njaundice, abdominal pain and confusion.\nShe was unable to give any further history\nbut her parents denied any previous ill\nhealth, medications or depression.\nExamination: afebrile, pulse 95 bpm, BP\n100/50, chest clear. She was jaundiced;\nabdomen revealed 5 cm tender\nhepatomegaly and ascites. Flapping\ntremors were present and her Glasgow\ncoma scale was 13/15.\nGLASGOW\nCOMA SCALE\n13/15\nFLAPPING\nTREMOR\nPresent\nTEMPERATURE\nAfebrile\nLABORATORY\n↑ ALT 3,565 U/L, ALP 410 (< 40 / 40–130)\n↑ INR 2.3 (< 1.2)\n↑ ESR > 100 mm/h (< 20)\n+ ANA 1:160\nNormal: Hb 10 g/dL, WCC 11, platelets 186 ×\n10⁹/L; viral markers, AMA and ASMA negative;\nceruloplasmin and urinary copper normal;\nparacetamol undetectable\n• DIAGNOSTIC KEYWORDS\nYoung woman + jaundice with\nconfusion and flapping tremor +\nALT 3,565 with INR 2.3 + ANA 1:160\n+ viral markers, copper studies and\nparacetamol level all negative\nACUTE LIVER FAILURE DUE TO\nAUTOIMMUNE HEPATITIS\n• REVISE\nHepatobiliary System & Pancreas → Acute\n(Fulminant) Hepatic Failure\n• ANSWER\nStudy Smarter Hepatology Cases Page 116\nCONFUSION AND FLAPPING WITH AN INR OF 2.3 CASE 18\nAcute liver failure: definition and causes\nHepatic encephalopathy grading\nTransjugular liver biopsy\nWhat is the diagnosis, and why?\nWHY\n1\nAcute liver failure — clinical encephalopathy and\nlaboratory coagulopathy without pre-existing liver\ndisease — and the most likely cause is autoimmune\nhepatitis (AIH)\nCauses of acute liver failure to work through: acute viral\nhepatitis, drug-induced liver injury (paracetamol, INH),\nautoimmune hepatitis, Wilson's disease, and Budd-Chiari syndrome\nConfirm with other serologic markers of AIH, an elevated\nserum IgG, and liver biopsy — postponed until the\ncoagulopathy is corrected, or done by the transjugular\napproach if urgent. Histology shows interface hepatitis\nand a predominantly lymphoplasmacytic infiltrate\nFlapping tremor with GCS 13/15 → hepatic\nencephalopathy — the clinical half of acute liver failure\nINR 2.3 → coagulopathy — the laboratory half; clotting\nfactors are made in the liver\nNo previous ill health or medication → no pre-existing\nliver disease — so this is acute failure, not\ndecompensated chronic\nALT 3,565 with ANA 1:160 → massive necrosis with an\nautoimmune marker\nCeruloplasmin and urinary copper normal → Wilson's\ndisease excluded\nParacetamol undetectable, viral markers negative →\nthe negatives are what make the diagnosis here", "questions": ["What is the diagnosis, and why?"], "topic": "p5", "sys": "HEP"}, {"id": "c12", "kw": "HCV antibodies found incidentally on blood donation + completely normal liver enzymes and synthetic function + PCR 20,800 IU/mL, genotype 4 + normal ultrasound + HBsAg negative", "dx": "Chronic HCV infection, genotype 4, no cirrhosis — treatment naive", "case": 99, "sheet": "Hepatology · DEPBOOK CASE 105\n• CASE\nA 44-year-old Egyptian male patient\ndiscovered accidentally to have HCV\nantibodies during blood donation.\nAbdominal ultrasound was normal.\nHCV PCR\n20,800\nIU/mL\nGENOTYPE\n4\nHBSAG\nNegative\nLABORATORY\nNormal: ALT 17, AST 15 U/L, bilirubin 0.9 (direct\n0.3) mg/dL, albumin 4.5 g/dL, PC 100% (INR 1),\nCBC, creatinine, ultrasound\n• DIAGNOSTIC KEYWORDS\nHCV antibodies found incidentally on\nblood donation + completely normal\nliver enzymes and synthetic function\n+ PCR 20,800 IU/mL, genotype 4 +\nnormal ultrasound + HBsAg negative\nCHRONIC HCV INFECTION,\nGENOTYPE 4, NO CIRRHOSIS —\nTREATMENT NAIVE\n• REVISE\nHepatobiliary System & Pancreas → Chronic\nHepatitis\n• ANSWER\nStudy Smarter Hepatology Cases Page 99\nHCV ANTIBODIES FOUND WHILE DONATING\nBLOOD\nCASE 1\nChronic HCV: genotypes and DAA\nregimens\nSVR12 and the endpoint of therapy\nWho needs post-SVR surveillance\nWhat is the diagnosis, and why?\nWHY\n1\nChronic HCV infection, genotype 4, treatment naive,\nwith no evidence of cirrhosis\nAntibody positive and PCR 20,800 IU/mL → a\ndetectable viral load means ongoing infection —\nantibody alone cannot separate current from cleared\ninfection\nALT 17 and AST 15 are normal → normal enzymes do\nnot exclude chronic HCV, and they are not a reason to\nwithhold treatment\nAlbumin 4.5, PC 100%, normal ultrasound → synthetic\nfunction preserved and no coarse texture or\nsplenomegaly — no cirrhosis\nHBsAg negative → no co-infection to change the\nregimen\n2 Is this patient candidate for treatment?\nYes — all patients with HCV infection must be\nconsidered for therapy, including treatment-naive\npatients and those who failed to achieve SVR previously\nWhat are the goals and endpoints for treatment?\nGOAL — CURE THE INFECTION\nENDPOINT\n3\nPrevent the complications of HCV-related liver and\nextra-hepatic disease: necro-inflammation, fibrosis,\ncirrhosis, decompensation, HCC; improve quality of life;\nprevent transmission\nUndetectable HCV RNA by a sensitive assay (detection\nlimit ≤ 15 IU/mL) at 12 weeks (SVR12) or 24 weeks\n(SVR24) after the end of treatment\n4 What is the recommended drug regimen for this patient?\nFor genotype 4, treatment naive, no cirrhosis or\ncompensated Child-Pugh A:\nSofosbuvir 400 + velpatasvir 100 mg — one tablet daily\nGlecaprevir 300 + pibrentasvir 120 mg — three tablets\ndaily with food\nSofosbuvir 400 + ledipasvir 90 mg — one tablet daily\nGrazoprevir 100 + elbasvir 50 mg — one tablet daily", "questions": ["What is the diagnosis, and why?", "Is this patient candidate for treatment?", "What are the goals and endpoints for treatment?", "What is the recommended drug regimen for this patient?"], "topic": "p6", "sys": "HEP"}, {"id": "c13", "kw": "Young woman with vitiligo and hypothyroidism + jaundice and arthralgia + ALT 480 with IgG 2,200 + viral serology negative", "dx": "Autoimmune hepatitis", "case": 101, "sheet": "Hepatology · DEPBOOK CASE 107\n• CASE\nA 30-year-old female with vitiligo and\nhypothyroidism presents with jaundice,\narthralgia, and elevated IgG (2,200\nmg/dL).\nShe presented to the hepatology clinic for\nelevated liver enzymes with ALT 480 U/L\nand negative viral serology.\nLABORATORY\n↑ ALT 480 U/L (< 40)\n↑ IgG 2,200 mg/dL (700–1,600)\nNormal: Viral serology — negative\n• DIAGNOSTIC KEYWORDS\nYoung woman with vitiligo and\nhypothyroidism + jaundice and\narthralgia + ALT 480 with IgG 2,200\n+ viral serology negative\nAUTOIMMUNE HEPATITIS\n• REVISE\nHepatobiliary System & Pancreas → Chronic\nHepatitis\n• ANSWER\nStudy Smarter Hepatology Cases Page 101\nJAUNDICE AND A HIGH IGG IN A WOMAN WITH\nVITILIGO\nCASE 3\nAutoimmune hepatitis: antibodies and\nhistology\nInterface hepatitis\nSteroid and azathioprine regimens\nWhat is the diagnosis, and why?\nWHY\n1\nAutoimmune hepatitis (AIH)\nVitiligo and hypothyroidism already present → an\nautoimmune diathesis — these diseases cluster\nIgG 2,200 mg/dL with ALT 480 and jaundice →\npolyclonal hypergammaglobulinemia with a hepatitic,\nnot cholestatic, injury\nNegative viral serology, no recent drugs, no pruritus →\nexcludes viral hepatitis, and argues against drug injury\nand PBC\n2 What is your differential diagnosis?\nAutoimmune hepatitis (AIH), drug-induced liver injury,\nand primary biliary cholangitis\nElevated IgG and the autoimmune disease history\nstrongly favour AIH\nNegative viral serology excludes viral hepatitis; no\nrecent drugs argues against DILI\nNo pruritus and AMA negativity make PBC unlikely\n3 What are the confirmatory tests for diagnosis?\nANA / ASMA — positive in 80% of AIH; also anti-LKM\nand anti-SLA/LP\nLiver biopsy shows interface hepatitis — inflammatory\ncells at the portal-parenchymal junction —\npathognomonic for AIH\nWhat are the possible complications and initial treatment\nlines?\nCOMPLICATIONS\nINITIAL TREATMENT\n4\nOf the disease — cirrhosis or HCC. Of the treatment —\nsteroid-induced osteoporosis; bone density monitoring\nand calcium / vitamin D mitigate it\nPrednisone 40–60 mg/day by body weight, then 20\nmg/day maintenance\nAzathioprine to maintain the steroid effect and allow\nearly withdrawal\nBudesonide may replace prednisone, combined with\nazathioprine\nContinue despite normal liver function; monitor for\nrelapse", "questions": ["What is the diagnosis, and why?", "What is your differential diagnosis?", "What are the confirmatory tests for diagnosis?", "What are the possible complications and initial treatment lines?"], "topic": "p6", "sys": "HEP"}, {"id": "c14", "kw": "HCV cured two years ago + palpable purpura of both legs + facial puffiness, edema and oliguria + creatinine 2.4 + no ascites, no liver cell failure", "dx": "HCV-associated cryoglobulinemia with renal involvement", "case": 102, "sheet": "Hepatology · DEPBOOK CASE 108\n• CASE\nA 54-year-old female, known to have\nchronic HCV, was treated with direct\nacting anti-virals and achieved sustained\nviral response (SVR) two years ago.\nShe complained of progressive palpable\npurpura of both lower limbs along with\nlower limb edema, facial puffiness and\noliguria. BP is 150/95. Chest and cardiac\nexaminations were normal. There was no\nclinical evidence of ascites or\nmanifestation of liver cell failure.\nBLOOD\nPRESSURE\n150/95\nSKIN\nPalpable\npurpura\nURINE\nOliguria\nLABORATORY\n↓ Hb 10 g/dL (12–15)\n↑ Creatinine 2.4 mg/dL, urea 85 (0.6–1.2 /\n15–40)\n↑ INR 1.4 (< 1.2)\nNormal: Serum albumin 3.5 g/dL, chest and\ncardiac examination\n• DIAGNOSTIC KEYWORDS\nHCV cured two years ago +\npalpable purpura of both legs +\nfacial puffiness, edema and oliguria\n+ creatinine 2.4 + no ascites, no\nliver cell failure\nHCV-ASSOCIATED\nCRYOGLOBULINEMIA WITH RENAL\nINVOLVEMENT\n• REVISE\nHepatobiliary System & Pancreas → Chronic\nHepatitis\n• ANSWER\nStudy Smarter Hepatology Cases Page 102\nPURPURA AND RENAL FAILURE TWO YEARS\nAFTER HCV CURE\nCASE 4\nExtrahepatic manifestations of HCV\nMixed cryoglobulinemia and MPGN\nRituximab and plasma exchange\nWhat is the diagnosis, and why?\nWHY\n1\nRenal affection secondary to HCV with\ncryoglobulinemia — one of the extra-hepatic\nmanifestations of HCV infection\nPalpable purpura, not a flat rash → a small vessel\nvasculitis — immune complexes in the vessel wall\nFacial puffiness, leg edema and oliguria with creatinine\n2.4 → a nephritic picture — the kidney is the second\nvasculitic target\nKnown HCV → HCV drives mixed cryoglobulinemia\nand membranoproliferative glomerulonephritis\nNo ascites and no liver cell failure → this is not\nhepatorenal syndrome — the liver is not failing\nSVR achieved two years ago → extrahepatic\nmanifestations usually need a positive PCR, but a few\ncases are reported after SVR\nHow to approach this case and how to treat?\nHCV CAN DRIVE THESE AUTOIMMUNE DISEASES\nAPPROACH TO DIAGNOSIS\nTREATMENT\n2\nMixed cryoglobulinemia; membranoproliferative\nglomerulonephritis; autoimmune thyroiditis;\nlymphoproliferative disorders\nUrine analysis, albumin/creatinine ratio\nRaised rheumatoid factor with low complement C4 —\nclassic\nRepeat HCV PCR to confirm the SVR still holds\nAbdominal ultrasound for liver texture, ascites, and both\nkidneys\nRenal biopsy — cryoglobulinemic glomerulonephritis\nAntiviral therapy if the PCR is raised, with\ncorticosteroids and immunosuppression\nPlasma exchange and rituximab, a monoclonal\nantibody binding CD20 on B cells", "questions": ["What is the diagnosis, and why?", "How to approach this case and how to treat?"], "topic": "p6", "sys": "HEP"}, {"id": "c15", "kw": "Five days of fatigue, anorexia and dark urine + tender enlarged liver + ALT 278 with direct hyperbilirubinemia + leucopenia with relative lymphocytosis + HBsAg positive", "dx": "Acute viral hepatitis", "case": 103, "sheet": "Hepatology · DEPBOOK CASE 109\n• CASE\nA 33-year-old male presents with\ngeneralized fatigue, anorexia, dull\naching right hypochondrial pain and\ndark urine for 5 days. There is no past or\nfamily history of liver disease and no\ndrug intake during the last 6 months.\nOn examination he is fully conscious with\na tinge of jaundice; the liver was tender\nand felt 4 fingers below the costal\nmargin. Abdominal ultrasound was\nnormal apart from mild\nhepatosplenomegaly.\nLABORATORY\n↑ ALT 278, AST 211 U/L (< 40)\n↑ Bilirubin 2.3, direct 1.9 mg/dL (< 1.2)\n↓ WBC 3.2 — relative lymphocytosis (4–\n11)\n+ Hepatitis B sAg positive\nNormal: ALP, GGT, albumin, creatinine, INR,\nfasting blood sugar, lipid profile\n• DIAGNOSTIC KEYWORDS\nFive days of fatigue, anorexia and\ndark urine + tender enlarged liver +\nALT 278 with direct\nhyperbilirubinemia + leucopenia\nwith relative lymphocytosis +\nHBsAg positive\nACUTE VIRAL HEPATITIS\n• REVISE\nHepatobiliary System & Pancreas → Acute\nViral Hepatitis\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 103\nFIVE DAYS OF DARK URINE WITH A TENDER\nLIVER\nCASE 5\nHepatitis B serology and its windows\nAcute versus chronic HBV\nWhen acute HBV needs antivirals\nWhat is the diagnosis, and why?\nWHY\n1\nAcute viral hepatitis\nShort 5-day prodrome of fatigue, anorexia and dark\nurine → an acute insult, not chronic disease\nTender hepatomegaly → the acutely inflamed, stretched\nliver capsule — chronic disease is not tender\nDirect hyperbilirubinemia with dark urine →\nconjugated bilirubin is water soluble and spills into urine\nLeucopenia with relative lymphocytosis → the\nhaematological pattern of a viral illness\nNormal INR and albumin → synthetic function is still\nintact — this is not acute liver failure\nHBsAg positive with no drug history → points to\nhepatitis B, though HBsAg alone cannot date the\ninfection\n2 What further investigations do you recommend?\nHepatitis markers — HAV IgM, HBeAg, HBc Ab IgM,\nHBeAb, HBV PCR, HCV PCR, EBV IgM and CMV IgM\nIf HAV IgM, HCV PCR, EBV IgM and CMV IgM are\nnegative while HBsAg, HBeAg, HBc Ab IgM and HBV\nPCR are positive, the diagnosis of acute hepatitis B is\nconfirmed\n3 Is this patient candidate for starting antiviral therapy?\nNo — not routinely. More than 95% of adults with acute\nHBV hepatitis require no specific treatment because they\nrecover fully and spontaneously\nAntivirals are recommended in high risk cases — acute\nliver failure (ence       <div class="dots">${dots}</div>
    </header>
    <article class="q">${question}
      ${input}
      ${shown ? "" : `<div class="btns"><button class="btn primary" id="reveal">Reveal answer</button></div>`}
    </article>
    ${answer}
    <nav class="nav">
      <button class="btn" id="prev" ${S.pos === 0 ? "disabled" : ""}>Previous</button>
      <button class="btn ghost" id="exit">Exam menu</button>
      <button class="btn ${m !== undefined ? "primary" : ""}" id="next">${last ? "Finish " + P.label : "Next"}</button>
    </nav>`;

  const boxes = [...app.querySelectorAll("textarea[data-k]")];
  boxes.forEach(box => {
    box.addEventListener("input", () => { S.ans[box.dataset.k] = box.value; save(); });
    box.addEventListener("keydown", ev => { if (!shown && ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); reveal(); } });
  });
  const rv = document.getElementById("reveal"); if (rv) rv.addEventListener("click", reveal);
  function reveal() {
    boxes.forEach(b => { S.ans[b.dataset.k] = b.value; });
    S.shown[it.id] = true; save(); renderQ();
    document.querySelector(".answer").scrollIntoView({block: "start", behavior: "smooth"});
  }
  app.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => { S.mark[it.id] = +b.dataset.m; save(); renderQ(); document.getElementById("next").focus({preventScroll: true}); }));
  app.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { S.pos = +b.dataset.go; save(); renderQ(); window.scrollTo(0, 0); }));
  document.getElementById("prev").addEventListener("click", () => { S.pos--; save(); renderQ(); window.scrollTo(0, 0); });
  document.getElementById("exit").addEventListener("click", () => { S.view = "start"; save(); render(); window.scrollTo(0, 0); });
  document.getElementById("next").addEventListener("click", () => {
    if (last) { S.done[p] = true; S.view = "partEnd"; } else S.pos++;
    save(); render(); window.scrollTo(0, 0);
  });
  if (!shown && boxes[0] && !("ontouchstart" in window)) boxes[0].focus({preventScroll: true});
  if (shown) renderChat(it);
}

/* ---------- Ask Claude about the revealed question ----------
   Runs on the viewer's own Claude account through the page's `sample` capability.
   Absent (signed out, declined, standalone file) -> the chat never shows. */
let sampleFn = null, chatOff = false;
// why the chat is or isn't available in this view: loading | ready | nofile | unavailable | declined | disabled
let chatState = "loading";
const CHAT_NOTE = {
  loading: "Connecting the Ask-Claude chat…",
  nofile: "Ask-Claude chat works only when this page is opened from its claude.ai link, not as a downloaded file or a link preview.",
  unavailable: "Ask-Claude chat isn't available here. Open the link in a browser where you're signed in to claude.ai, or in the Claude app.",
  declined: "Ask-Claude chat is off because this page wasn't allowed to use Claude. Reload the page to be asked again.",
  disabled: "Ask-Claude chat is turned off for this Claude account.",
};
const chats = {};
const chatOf = id => { const k = DAY.day + ":" + id; return chats[k] || (chats[k] = {turns: [], draft: "", pending: null, ctl: null, err: ""}); };
// The hosted website version has its own chat server (Gemini); the claude.ai version leaves this empty.
const CHAT_URL = "";
const AI_NAME = CHAT_URL ? "Gemini" : "Claude";
if (CHAT_URL) chatState = "ready";
else (async () => {
  // give the viewer a moment to provide window.claude before deciding the page is a plain file
  for (let i = 0; i < 20 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 150));
  if (!(window.claude && window.claude.use)) chatState = "nofile";
  else {
    try { sampleFn = await window.claude.use("sample"); } catch (e) { sampleFn = null; }
    if (chatState === "loading") chatState = sampleFn ? "ready" : "unavailable";
  }
  if (PAGE === "day" && S.view === "q") { const it = itemAt(S.part, S.pos); if (S.shown[it.id]) renderChat(it); }
})();

function rulesFor(it) {
  const head = "You are helping a final-year medical student revise for the Internal Medicine final (Egypt). "
    + "They have just answered the exam question below and revealed the answer from their own revision material. "
    + "Answer their follow-up question using that material as the main source. Be short and exam-focused: plain sentences "
    + "or short '- ' bullet lists, no headings, no tables, no emoji. If you add anything that is NOT in the material below, "
    + "start that sentence with 'Beyond the board:'. Do not contradict the material; if you think it is wrong, say so plainly. "
    + "If the question is unrelated to medicine, say you can only help with this exam question.\n\n";
  if (PARTS[S.part].kind === "essay") {
    return head + "EXAM ESSAY QUESTION: " + it.q + "\n\nTHE STUDENT'S ANSWER:\n" + (S.ans[it.id] || "(left blank)")
      + "\n\nTHE BOARD ANSWER (their revision boards):\n" + it.text;
  }
  return head + "CASE KEYWORDS SHOWN: " + it.kw + "\n\nTHE CASES BOOK'S QUESTIONS AND THE STUDENT'S ANSWERS:\n"
    + it.questions.map((q, k) => (k + 1) + ". " + q + "\n   Student: " + (S.ans[it.id + "_" + k] || "(left blank)")).join("\n")
    + "\n\nTHE BOOK DIAGNOSIS: " + it.dx
    + "\n\nTHE FULL CASE SHEET FROM THEIR CASES BOOK (page P" + it.case + "; text extracted from a PDF, so the order of some lines may be jumbled):\n" + it.sheet;
}

// A shorter copy of the same material for the links that open a new chat in another app,
// kept to about 3,000 characters so the link stays within what those sites accept.
function clip(s, n) {
  s = String(s || "").replace(/[ \t]+/g, " ").replace(/\n\s*\n+/g, "\n").trim();
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}
function askPrompt(it) {
  const head = "I'm revising for my Internal Medicine final exam. Help me with this question, using my revision material below as the main source. "
    + "Be short and exam-focused. Start any sentence that is not based on the material with 'Beyond the board:'. "
    + "First, tell me in a few lines what my answer missed or got wrong compared with the material. Then wait for my follow-up questions.\n\n";
  if (PARTS[S.part].kind === "essay") {
    const base = head + "EXAM QUESTION: " + it.q + "\n\nMY ANSWER: " + clip(S.ans[it.id] || "(left blank)", 500)
      + "\n\nBOARD ANSWER (" + it.src + "):\n";
    return base + clip(it.text, Math.max(600, 3000 - base.length));
  }
  const qa = it.questions.map((q, k) => (k + 1) + ". " + q + "\n   My answer: " + clip(S.ans[it.id + "_" + k] || "(left blank)", 250)).join("\n");
  const base = head + "CASE KEYWORDS: " + it.kw + "\n\nTHE CASES BOOK'S QUESTIONS AND MY ANSWERS:\n" + qa
    + "\n\nBOOK DIAGNOSIS: " + it.dx + "\n\nCASES BOOK SHEET (P" + it.case + ", text taken from a PDF, so some lines may be out of order):\n";
  return base + clip(it.sheet, Math.max(500, 3200 - base.length));
}

function fmtReply(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/Beyond the board:/g, '<span class="beyond">Beyond the board:</span>');
}

function chatErr(code) {
  return ({
    rate_limited: "Too many questions right now, or your Claude usage limit was reached. Try again in a little while.",
    session_expired: "Your Claude sign-in expired. Sign in to claude.ai again, then ask.",
    refused: "Claude would not answer that. Try asking it differently.",
    empty_completion: "No answer came back. Try rephrasing the question.",
    prompt_too_large: "This chat got too long. Start a new chat.",
  })[code] || "The answer was interrupted. Try again.";
}

function renderChat(it) {
  const box = document.getElementById("chatBox");
  if (!box) return;
  if (chatState !== "ready") {
    // the in-page chat can't run here: open a new chat in Claude or ChatGPT with the material already in it
    const q = encodeURIComponent(askPrompt(it)), src = PARTS[S.part].kind === "essay" ? "board" : "cases book";
    box.hidden = false;
    box.innerHTML = `<div class="chat">
        <div class="chathead"><span class="pill">Ask AI about this question</span></div>
        <p class="aicap">Opens a new chat with this question, your answer and the ${src} answer already in it.</p>
        <div class="btns">
          <a class="btn primary" href="https://claude.ai/new?q=${q}" target="_blank" rel="noopener noreferrer">Ask Claude ↗</a>
          <a class="btn primary" href="https://chatgpt.com/?q=${q}" target="_blank" rel="noopener noreferrer">Ask ChatGPT ↗</a>
          <button class="btn" id="copyAI" type="button">Copy</button>
        </div>
        <textarea id="aiText" class="short" readonly hidden aria-label="Text to paste into an AI app"></textarea>
        <p class="aicap" id="aiMsg">Claude needs a free claude.ai account · ChatGPT usually works without one · Copy is for any other app.</p>
      </div>`;
    document.getElementById("copyAI").addEventListener("click", () => {
      const text = rulesFor(it) + "\n\nMY QUESTION: ", out = document.getElementById("aiText"), msg = document.getElementById("aiMsg");
      // show the text at once (some app views never answer a clipboard request), then try copying it
      out.value = text; out.hidden = false; out.focus(); out.select();
      msg.textContent = "If it didn't copy by itself, select all the text in the box and copy it. Then paste it into your AI app and type your question at the end.";
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(
          () => { msg.textContent = "Copied. Open your AI app, paste, and type your question at the end."; }, () => {});
        else document.execCommand && document.execCommand("copy");
      } catch (e) {}
    });
    return;
  }
  const c = chatOf(it.id), busy = !!c.ctl;
  const bubbles = c.turns.map(t => `<div class="msg ${t.role === "user" ? "you" : "claude"}">${t.role === "user" ? esc(t.content) : fmtReply(t.content)}</div>`).join("")
    + (c.pending ? `<div class="msg claude${c.pending.text ? "" : " wait"}" id="pending">${c.pending.text ? fmtReply(c.pending.text) : "Thinking…"}</div>` : "");
  box.hidden = false;
  box.innerHTML = `<div class="chat">
      <div class="chathead"><span class="pill">Ask about this question</span>${c.turns.length && !busy ? `<button class="btn" id="newChat" type="button">New chat</button>` : ""}</div>
      ${bubbles ? `<div class="msgs">${bubbles}</div>` : ""}
      ${c.err ? `<p class="chaterr">${esc(c.err)}</p>` : ""}
      <form class="ask" id="askForm">
        <textarea id="askInput" rows="2" aria-label="Your question to Claude" placeholder="${PARTS[S.part].kind === "essay" ? "e.g. What did my answer miss?" : "e.g. Why this and not the other options?"}" ${busy ? "disabled" : ""}>${esc(c.draft)}</textarea>
        ${busy ? `<button class="btn" id="stopChat" type="button">Stop</button>` : `<button class="btn primary" type="submit">Ask</button>`}
      </form>
      <p class="aicap">Answers are written by ${AI_NAME} from the material above. <span class="beyond">Beyond the board</span> marks anything not taken from it.</p>
    </div>`;
  const input = document.getElementById("askInput");
  input.addEventListener("input", () => { c.draft = input.value; });
  input.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(it); } });
  document.getElementById("askForm").addEventListener("submit", ev => { ev.preventDefault(); send(it); });
  const stop = document.getElementById("stopChat"); if (stop) stop.addEventListener("click", () => c.ctl && c.ctl.abort());
  const nc = document.getElementById("newChat"); if (nc) nc.addEventListener("click", () => { c.turns = []; c.err = ""; renderChat(it); });
}

async function send(it) {
  const c = chatOf(it.id), q = c.draft.trim();
  if (!q || c.ctl || !(sampleFn || CHAT_URL)) return;
  c.turns.push({role: "user", content: q}); c.draft = ""; c.err = ""; c.pending = {text: ""}; c.ctl = new AbortController();
  const day = DAY.day, here = () => PAGE === "day" && DAY.day === day && S.view === "q" && itemAt(S.part, S.pos).id === it.id;
  renderChat(it);
  if (CHAT_URL) return sendRemote(it, c, here);
  try {
    const turns = [{role: "user", content: rulesFor(it)}, ...c.turns.slice(-10)];
    const r = await sampleFn(turns, {cache: false, signal: c.ctl.signal, onText: ({text}) => {
      c.pending.text = text; const el = document.getElementById("pending");
      if (el && here()) { el.classList.remove("wait"); el.innerHTML = fmtReply(text); }
    }});
    c.turns.push({role: "assistant", content: r.text});
    if (r.truncated) c.err = "The answer was cut short. Ask for less at a time.";
  } catch (e) {
    const code = e && e.code;
    if (e && e.text && code !== "refused") c.turns.push({role: "assistant", content: e.text});
    if (code === "not_granted") chatState = "declined";
    else if (["sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) chatState = "disabled";
    else if (code !== "cancelled") c.err = chatErr(code);
  } finally {
    c.pending = null; c.ctl = null;
    if (here()) renderChat(it);
  }
}

async function sendRemote(it, c, here) {
  try {
    const r = await fetch(CHAT_URL, {method: "POST", headers: {"Content-Type": "application/json"}, signal: c.ctl.signal,
      body: JSON.stringify({material: rulesFor(it), turns: c.turns.slice(-10)})});
    const data = await r.json().catch(() => ({}));
    if (r.ok && data.text) c.turns.push({role: "assistant", content: data.text});
    else c.err = data.error === "rate_limited" ? "Too many questions right now. Wait a minute, then ask again."
      : data.error === "too_long" ? "This chat got too long. Start a new chat." : "The answer didn't come through. Try again.";
  } catch (e) {
    if (!(e && e.name === "AbortError")) c.err = "No connection to the chat. Check your internet and try again.";
  } finally {
    c.pending = null; c.ctl = null;
    if (here()) renderChat(it);
  }
}

function renderPartEnd() {
  const p = S.part, P = PARTS[p], other = p === 1 ? 2 : 1, n = P.items.length, unmarked = n - markedOf(p);
  app.innerHTML = `<section class="intro"><div class="titlepill">${P.label.toUpperCase()} DONE</div></section>
    <div class="card" style="justify-items:center;text-align:center">
      <div class="score ${grade(p)}">${scoreOf(p)} / ${n}</div>
      <p>${P.name} · ${fmt(S.used[p])} used of ${S.limit[p]}:00${unmarked ? ` · ${unmarked} not marked` : ""}</p>
      <div class="btns" style="justify-content:center">
        ${S.done[other] ? `<button class="btn primary" id="res">See results</button>` : `<button class="btn primary" id="go">Start ${PARTS[other].label}</button>`}
        <button class="btn" id="rev">Review ${P.label}</button>
      </div>
    </div>`;
  const go = document.getElementById("go");

  const res = document.getElementById("res"); if (res) res.addEventListener("click", () => { S.view = "results"; save(); render(); });
  document.getElementById("rev").addEventListener("click", () => { S.pos = 0; S.view = "q"; save(); render(); });
}

function renderResults() {
  const rows = [];
  DAY.essays.forEach((it, i) => { const m = S.mark[it.id]; if (m !== 1) rows.push({p: 1, i, tag: m === 0.5 ? "part" : "bad", t: m === 0.5 ? "Partly" : m === 0 ? "Missed" : "Not marked", text: it.q, where: it.src}); });
  DAY.cases.forEach((it, i) => { const m = S.mark[it.id]; if (m !== 1) rows.push({p: 2, i, tag: m === 0.5 ? "part" : "bad", t: m === 0.5 ? "Partly" : m === 0 ? "Missed" : "Not marked", text: it.dx, where: "P" + it.case}); });
  const list = p => rows.filter(r => r.p === p).map(r => `<li><span class="tag ${r.tag}">${r.t}</span><span>${esc(r.text)}</span><span class="where2">${esc(r.where)}</span></li>`).join("");
  const total = scoreOf(1) + scoreOf(2), max = DAY.essays.length + DAY.cases.length;
  const tile = p => `<div class="card"><span class="pill">${PARTS[p].label} · ${PARTS[p].name}</span>
      <div class="score ${grade(p)}">${scoreOf(p)} / ${PARTS[p].items.length}</div>
      <p class="muted">${fmt(S.used[p])} used of ${S.limit[p]}:00</p></div>`;
  const miss1 = rows.some(r => r.p === 1), miss2 = rows.some(r => r.p === 2);
  app.innerHTML = `${topnav("day")}<section class="intro"><div class="titlepill">DAY ${DAY.day} RESULTS</div>
      <p class="topics">${total} / ${max} · ${Math.round(100 * total / max)}%</p></section>
    <div class="scores">${tile(1)}${tile(2)}</div>
    ${miss1 ? `<h2 class="sec">Essays to revise</h2><ul class="revise">${list(1)}</ul>` : ""}
    ${miss2 ? `<h2 class="sec">Cases to revise</h2><ul class="revise">${list(2)}</ul>` : ""}
    <div class="nav">
      ${miss1 ? `<button class="btn primary" data-retry="1">Retry missed essays</button>` : ""}
      ${miss2 ? `<button class="btn primary" data-retry="2">Retry missed cases</button>` : ""}
      <button class="btn" id="menu">Exam menu</button>
    </div>`;
  app.querySelectorAll("[data-retry]").forEach(b => b.addEventListener("click", () => {
    const p = +b.dataset.retry, idx = rows.filter(r => r.p === p).map(r => r.i);
    idx.forEach(i => {
      const id = PARTS[p].items[i].id;
      Object.keys(S.ans).forEach(k => { if (k === id || k.startsWith(id + "_")) delete S.ans[k]; });
      delete S.mark[id]; delete S.shown[id];
    });
    S.queue[p] = idx; S.done[p] = false; S.used[p] = 0; S.limit[p] = Math.max(1, idx.length * PARTS[p].perItem);
    S.part = p; S.pos = 0; S.view = "q"; save(); render(); window.scrollTo(0, 0);
  }));
  document.getElementById("menu").addEventListener("click", () => { S.view = "start"; save(); render(); });
  wireNav();
}

/* ---------- camp home · my progress · backup ---------- */
const campDay = n => CAMP.days.find(d => d.n === n);
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDate(iso) { const [y, m, d] = iso.split("-").map(Number); return DOW[new Date(y, m - 1, d).getDay()] + " " + d + " " + MON[m - 1]; }
function todayISO() { const t = new Date(); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); }
const pct = (s, m) => m ? Math.round(100 * s / m) : null;
const gradeOf = r => r === null ? "" : r >= 75 ? "good" : r >= 50 ? "part" : "bad";

function topnav(active) {
  const t = (id, label) => `<button class="tab" data-nav="${id}" aria-current="${active === id ? "page" : "false"}">${label}</button>`;
  return `<nav class="tabs">${t("home", "Camp days")}${t("progress", "My progress")}${active === "day" ? `<span class="tab here" aria-current="page">Day ${DAY.day}</span>` : ""}<span class="navend">${themeBtn()}</span></nav>`;
}
function wireNav() { app.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => go(b.dataset.nav))); }

function statsOf(n) {
  const ex = EXAMS[n], st = readState(n);
  if (!ex || !st) return null;
  const part = items => { const m = items.filter(it => st.mark[it.id] !== undefined); return {n: items.length, marked: m.length, score: m.reduce((t, it) => t + st.mark[it.id], 0)}; };
  const e = part(ex.essays), c = part(ex.cases);
  return {n, st, ex, e, c, marked: e.marked + c.marked, score: e.score + c.score, total: e.n + c.n,
    started: e.marked + c.marked > 0 || st.used[1] > 0 || st.used[2] > 0, finished: !!(st.done[1] && st.done[2])};
}

function renderHome() {
  const today = todayISO(), td = CAMP.days.find(d => d.date === today);
  const row = d => {
    const s = d.ready ? statsOf(d.n) : null, r = s ? pct(s.score, s.marked) : null;
    const state = !d.ready ? `<span class="state soon">Opens soon</span>`
      : s && s.finished ? `<span class="state ${gradeOf(r)}">Done · ${r}%</span>`
      : s && s.started ? `<span class="state prog">${s.marked} / ${s.total} marked</span>`
      : `<span class="state open">Start</span>`;
    return `<li><button class="dayrow${d.date === today ? " today" : ""}" ${d.ready ? `data-day="${d.n}"` : "disabled"}>
      <span class="dn">Day ${d.n}</span><span class="dd">${fmtDate(d.date)}</span><span class="dl">${esc(d.label)}</span>${state}</button></li>`;
  };
  const rounds = [["1", "Round 1"], ["2", "Round 2"], ["3", "Round 3"], ["4", "Round 4"], ["final", "Last day"]];
  const groups = rounds.map(([k, name]) => {
    const ds = CAMP.days.filter(d => d.round === k);
    if (!ds.length) return "";
    const span = fmtDate(ds[0].date) + (ds.length > 1 ? " – " + fmtDate(ds[ds.length - 1].date) : "");
    return `<section><h2 class="sec">${name} <span class="muted small">${span}</span></h2><ul class="days">${ds.map(row).join("")}</ul></section>`;
  }).join("");
  const banner = td
    ? `<div class="todaybar"><span>Today is <b>Day ${td.n}</b> · ${esc(td.label)}</span>${td.ready ? `<button class="btn primary" data-day="${td.n}">Open Day ${td.n}</button>` : `<span class="muted">Opens soon</span>`}</div>`
    : today < CAMP.start ? `<div class="todaybar"><span>The camp starts ${fmtDate(CAMP.start)}</span></div>` : "";
  app.innerHTML = `${topnav("home")}
    <section class="intro"><div class="titlepill">IM CAMP EXAMS</div>
      <p class="topics">${fmtDate(CAMP.start)} – ${fmtDate(CAMP.days[CAMP.days.length - 1].date)} · final exam ${fmtDate(CAMP.exam)}</p></section>
    ${banner}${groups}`;
  wireNav();
  app.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => go("day", +b.dataset.day)));
}

function chartSVG(points) {  // points: [{label, v (0–100) or null}]
  const bw = 34, gap = 16, h = 140, top = 22, left = 34, W = left + points.length * (bw + gap) + 4, H = top + h + 30;
  const y = v => top + h * (1 - v / 100);
  let s = "";
  for (const g of [0, 50, 75, 100]) s += `<line class="grid" x1="${left - 4}" x2="${W}" y1="${y(g)}" y2="${y(g)}"/><text class="ax" x="${left - 8}" y="${y(g) + 4}" text-anchor="end">${g}</text>`;
  points.forEach((p, i) => {
    const x = left + i * (bw + gap) + gap / 2;
    if (p.v !== null) s += `<rect class="b ${gradeOf(p.v)}" x="${x}" y="${y(p.v)}" width="${bw}" height="${Math.max(1, h * p.v / 100)}" rx="4"/>`
      + `<text class="val" x="${x + bw / 2}" y="${y(p.v) - 6}" text-anchor="middle">${p.v}%</text>`;
    s += `<text class="ax" x="${x + bw / 2}" y="${top + h + 18}" text-anchor="middle">${esc(p.label)}</text>`;
  });
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Score per day">${s}</svg></div>`;
}

function breakdown(all, keyOfItem, nameOf) {
  const acc = {};
  all.forEach(s => [...s.ex.essays, ...s.ex.cases].forEach(it => {
    const m = s.st.mark[it.id]; if (m === undefined) return;
    const k = keyOfItem(it); (acc[k] = acc[k] || {score: 0, n: 0}); acc[k].score += m; acc[k].n++;
  }));
  return Object.entries(acc).map(([k, v]) => ({name: nameOf(k), ...v, r: pct(v.score, v.n)})).sort((a, b) => a.r - b.r);
}

function renderProgress() {
  const all = CAMP.days.filter(d => d.ready).map(d => statsOf(d.n)).filter(s => s && s.started);
  const sum = (f) => all.reduce((t, s) => t + f(s), 0);
  const marked = sum(s => s.marked), score = sum(s => s.score);
  const eM = sum(s => s.e.marked), eS = sum(s => s.e.score), cM = sum(s => s.c.marked), cS = sum(s => s.c.score);
  const finished = all.filter(s => s.finished).length, ready = CAMP.days.filter(d => d.ready).length;
  const tile = (label, big, sub, cls) => `<div class="card tile"><span class="pill">${label}</span><div class="score ${cls || ""}">${big}</div><p class="muted">${sub}</p></div>`;
  const R = pct(score, marked), rE = pct(eS, eM), rC = pct(cS, cM);
  const today = CAMP.days.find(d => d.date === todayISO() && d.ready) || CAMP.days.find(d => d.ready);
  let body;
  if (!marked) {
    body = `<div class="card empty"><h2>No marked answers yet</h2>
      <p>Your scores, weak topics and revise list appear here as you mark your answers in each day's exam.</p>
      <div class="btns"><button class="btn primary" data-day="${today.n}">Open Day ${today.n}</button></div></div>`;
  } else {
    const days = CAMP.days.filter(d => d.ready).map(d => { const s = statsOf(d.n); return {label: "Day " + d.n, v: s && s.marked ? pct(s.score, s.marked) : null}; });
    const bars = rows => `<ul class="bk">${rows.map(r => `<li><span class="bkname">${esc(r.name)}</span>
        <span class="bkbar"><span class="${gradeOf(r.r)}" style="width:${r.r}%"></span></span><span class="bknum">${r.r}% <span class="muted">· ${r.score} / ${r.n}</span></span></li>`).join("")}</ul>`;
    const topics = breakdown(all, it => it.topic, k => CAMP.topics[k] || k);
    const systems = breakdown(all, it => it.sys, k => CAMP.systems[k] || k);
    const rev = all.map(s => {
      const items = [...s.ex.essays.map(it => ({it, t: it.q, w: it.src})), ...s.ex.cases.map(it => ({it, t: it.dx, w: "P" + it.case}))]
        .filter(x => s.st.mark[x.it.id] === 0 || s.st.mark[x.it.id] === 0.5);
      if (!items.length) return "";
      return `<h3 class="revday">Day ${s.n} <span class="muted small">${fmtDate(campDay(s.n).date)}</span></h3><ul class="revise">${items.map(x => {
        const m = s.st.mark[x.it.id];
        return `<li><span class="tag ${m === 0.5 ? "part" : "bad"}">${m === 0.5 ? "Partly" : "Missed"}</span><span>${esc(x.t)}</span><span class="where2">${esc(x.w)}</span></li>`;
      }).join("")}</ul>`;
    }).join("");
    body = `<div class="tiles">
        ${tile("Overall", R + "%", `${score} / ${marked} points`, gradeOf(R))}
        ${tile("Essays", rE === null ? "–" : rE + "%", `${eS} / ${eM} points`, gradeOf(rE))}
        ${tile("Cases", rC === null ? "–" : rC + "%", `${cS} / ${cM} points`, gradeOf(rC))}
        ${tile("Days finished", `${finished} / ${CAMP.days.length}`, `${ready} open so far`)}
      </div>
      <h2 class="sec">Score per day</h2>${chartSVG(days)}
      <h2 class="sec">By topic <span class="muted small">weakest first</span></h2>${bars(topics)}
      ${systems.length > 1 ? `<h2 class="sec">By system <span class="muted small">weakest first</span></h2>${bars(systems)}` : ""}
      ${rev ? `<h2 class="sec">To revise</h2>${rev}` : ""}`;
  }
  app.innerHTML = `${topnav("progress")}
    <section class="intro"><div class="titlepill">MY PROGRESS</div><p class="topics">Saved in this browser · private to you</p></section>
    ${body}
    <section class="card backup">
      <h2>Move to another device</h2>
      <p>Copy your progress here, then paste it under Restore on the other device.</p>
      <div class="btns"><button class="btn primary" id="copyCode">Copy my progress</button></div>
      <textarea id="codeOut" class="short" readonly hidden aria-label="Your progress code"></textarea>
      <p class="muted" id="copyMsg"></p>
      <label class="lbl" for="codeIn">Restore from a code</label>
      <textarea id="codeIn" class="short" placeholder="Paste a progress code"></textarea>
      <div class="btns" id="restoreBox"><button class="btn" id="restore">Restore</button></div>
      <p id="restoreMsg"></p>
    </section>`;
  wireNav();
  app.querySelectorAll("[data-day]").forEach(b => b.addEventListener("click", () => go("day", +b.dataset.day)));
  document.getElementById("copyCode").addEventListener("click", () => {
    const code = backupCode(), out = document.getElementById("codeOut"), msg = document.getElementById("copyMsg");
    out.value = code; out.hidden = false;
    const fallback = () => { out.focus(); out.select(); msg.textContent = "Select the code above and copy it."; };
    try { navigator.clipboard.writeText(code).then(() => { msg.textContent = "Copied. Paste it under Restore on your other device."; }, fallback); } catch (e) { fallback(); }
  });
  document.getElementById("restore").addEventListener("click", () => {
    const code = document.getElementById("codeIn").value, msg = document.getElementById("restoreMsg");
    if (!code.trim()) { msg.textContent = "Paste a progress code first."; return; }
    const box = document.getElementById("restoreBox");
    box.innerHTML = `<div class="confirm"><span>This replaces the progress on this device.</span>
      <button class="btn" id="restoreYes">Restore</button><button class="btn ghost" id="restoreNo">Cancel</button></div>`;
    document.getElementById("restoreNo").addEventListener("click", renderProgress);
    document.getElementById("restoreYes").addEventListener("click", () => {
      try { const n = restoreCode(code); go("progress"); document.getElementById("restoreMsg").textContent = `Restored ${n} day${n === 1 ? "" : "s"}.`; }
      catch (e) { renderProgress(); document.getElementById("restoreMsg").textContent = "That code didn't work. Copy the whole code again and paste it here."; }
    });
  });
}

function backupCode() {
  const days = {};
  CAMP.days.forEach(d => { try { const raw = localStorage.getItem(keyOf(d.n)); if (raw) days[d.n] = JSON.parse(raw); } catch (e) {} });
  return "IMCAMP1-" + btoa(unescape(encodeURIComponent(JSON.stringify({v: 1, days}))));
}
function restoreCode(code) {
  const m = code.trim().match(/^IMCAMP1-([A-Za-z0-9+/=\s]+)$/);
  if (!m) throw new Error("not a progress code");
  const obj = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/\s+/g, "")))));
  if (!obj || obj.v !== 1 || typeof obj.days !== "object") throw new Error("not a progress code");
  let n = 0;
  Object.entries(obj.days).forEach(([d, st]) => { if (EXAMS[d] && st && st.ans) { localStorage.setItem(keyOf(d), JSON.stringify(st)); n++; } });
  return n;
}

let tick = 0;
setInterval(() => {
  if (PAGE !== "day" || S.view !== "q" || S.done[S.part] || document.hidden) return;
  S.used[S.part]++;
  const t = document.getElementById("timer");
  if (t) t.outerHTML = timerHTML();
  if (++tick % 5 === 0) save();
}, 1000);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

render();
</script>
