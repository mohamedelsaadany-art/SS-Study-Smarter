 its extent\nCardiac enzymes — troponin T and I rise 2–4 hours\nafter infarction; CPK rises within 4–8 hours; CPK-MB is\nmore specific as it is found in cardiac muscle\nEchocardiography — global and regional cardiac\nfunction, ejection fraction, systolic and diastolic function\nLipid profile, blood glucose — risk factors for myocardial\ninfarction\nCBC, blood urea, serum creatinine — preparatory\nbefore coronary angiography\nOutline your management strategy.\nIN ER, BEFORE CCU\nAFTER ADMISSION TO CCU\nAFTER PCI\n3\nPain relief with morphine, loading aspirin and\nclopidogrel or ticagrelor, LMWH, oxygen if SO₂ <90%\nAvoid beta-blockers — our patient has bradycardia\nRecanalization — primary PTCA or thrombolytic\ntherapy according to availability, location, resources and\ntime to PTCA\nUnfractionated heparin or LMWH, high intensity statin,\nnitroglycerin, ACE inhibitor, antiplatelets, nitrates\nAspirin 81 mg/d, ticagrelor 180 mg/d or clopidogrel 75\nmg/d, ACE inhibitor and statin", "questions": ["What is the diagnosis, and why?", "Further investigations?", "Outline your management strategy."], "topic": "c3", "sys": "CARD"}, {"id": "c13", "kw": "On digoxin + nausea, vomiting, confusion and blurred vision + AF with MR, TR and congestive heart failure in a 75-year-old with angina", "dx": "Ischemic cardiomyopathy with congestive heart failure, complicated by digoxin toxicity", "case": 19, "sheet": "Cardiology · DEPBOOK CASE 25\n• CASE\nA 75-year-old female presented to the ER\ncomplaining of nausea, vomiting,\ndizziness, confusion and blurred vision\nfor 5 days. She has history of\nhypertension and angina. Last month she\nwas admitted in the ICU with dyspnea\nthat awakened her from sleep and rapid\nirregular palpitations. She was discharged\non digoxin, lisinopril, furosemide and\nwarfarin.\nExamination: the patient is confused. BP\n135/95, pulse 100 bpm irregular. Elevated\njugular venous pressure with systolic\nexpansion, variable intensity of S1,\npansystolic murmur and S3 over the\napex and tricuspid area. Tender\nepigastrium. Chest: bibasilar end\ninspiratory fine crackles.\nBLOOD\nPRESSURE\n135/95\nPULSE\n100 bpm,\nirregular\nDRUGS\nDigoxin,\nlisinopril,\nfurosemide,\nwarfarin\n• DIAGNOSTIC KEYWORDS\nOn digoxin + nausea, vomiting,\nconfusion and blurred vision + AF\nwith MR, TR and congestive heart\nfailure in a 75-year-old with angina\nISCHEMIC CARDIOMYOPATHY\nWITH CONGESTIVE HEART\nFAILURE, COMPLICATED BY\nDIGOXIN TOXICITY\n• REVISE\nCardiovascular System → Heart Failure ·\nDisorders of Cardiac Rhythm\n• ANSWER\nStudy Smarter Cardiology Cases Page 19\nNAUSEA, CONFUSION AND BLURRED VISION ON\nDIGOXIN\nCASE 19\nDigoxin toxicity\nAtrial fibrillation in heart failure\nIschemic cardiomyopathy\nWhat is the diagnosis, and why?\nWHY\n1\nIschemic cardiomyopathy — with digoxin toxicity on\ntop\n75 years with angina, hypertension, MR, TR, AF and\ncongestive heart failure → ischemic cardiomyopathy\nOn digoxin with nausea, vomiting, confusion and\nblurred vision → digoxin toxicity must be considered\nIrregular pulse with variable intensity of S1 → atrial\nfibrillation\nRaised JVP with systolic expansion + pansystolic\nmurmur → tricuspid and mitral regurgitation\nManagement during admission and after discharge?\nA — HOSPITAL MANAGEMENT\nB — LONG TERM\n2\nECG, digoxin level, serum potassium, magnesium,\ncreatinine and creatinine clearance — hypokalaemia\nand renal impairment are risk factors for digoxin toxicity\nPT, PC and INR to adjust the warfarin dose · TSH to\nexclude hyperthyroidism as a cause of AF\nIV loop diuretic (furosemide) for the congestive heart\nfailure\nStop digoxin and monitor digoxin levels; continue the\nrest of the medications\nVentricular irritability from digitalis toxicity → phenytoin\nand lidocaine, which depress the enhanced ventricular\nautomaticity without significantly slowing AV\nconduction. Phenytoin is the antiarrhythmic of choice in\ndigitalis toxicity for both ventricular and supraventricular\narrhythmia\nCorrect hypokalaemia or hypomagnesaemia if present\nStart a PPI and anti-emetics to relieve symptoms\nMonitor digoxin levels regularly and adjust the dose\nguided by creatinine clearance\nMay continue the same medications, or shift to\namiodarone or dronedarone", "questions": ["What is the diagnosis, and why?", "Management during admission and after discharge?"], "topic": "c2", "sys": "CARD"}, {"id": "c14", "kw": "Diabetic with epigastric pain not relieved by antacids + nausea, vomiting, sweating + no chest pain + equal limb pulses", "dx": "Inferior myocardial infarction presenting atypically", "case": 20, "sheet": "Cardiology · DEPBOOK CASE 26\n• CASE\nA 65 year old male with hypertension,\ntype 2 diabetes and coronary artery\ndisease presented to the ER with acute\nepigastric pain and heart burn which\nstarted 4 hours ago and did not respond\nto antacids; the pain was associated with\nnausea, vomiting and sweating. No\nchest pain or shortness of breath.\nExamination: temperature 37.5°C,\nrespiratory rate 22/min, pulse 110 bpm, BP\n210/100 mmHg. Accentuated A2 over the\naortic area and S4 over the apex.\nAbdomen normal. Upper and lower limb\npulsations are bilaterally felt and equal.\nTEMPERATURE\n37.5°C\nPULSE\n110 bpm\nBLOOD PRESSURE\n210/100\nRANDOM GLUCOSE\n230 mg/dL\n• DIAGNOSTIC KEYWORDS\nDiabetic with epigastric pain not\nrelieved by antacids + nausea,\nvomiting, sweating + no chest pain\n+ equal limb pulses\nINFERIOR MYOCARDIAL\nINFARCTION PRESENTING\nATYPICALLY\n• REVISE\nCardiovascular System → Ischemic Heart\nDisease\n• ANSWER\nStudy Smarter Cardiology Cases Page 20\nACUTE EPIGASTRIC PAIN + SWEATING IN A\nDIABETIC\nCASE 20\nAtypical presentation of MI\nDifferential of epigastric pain\nSecondary prevention after MI\nWhat is the diagnosis, and why?\nWHY\n1\nInferior myocardial infarction\nAcute epigastric pain resistant to antacids + nausea,\nvomiting, sweating → an inferior MI must be considered\nHe is diabetic → autonomic neuropathy masks the\ntypical chest pain\nAccentuated A2 + S4 over the apex → hypertensive\nheart with a stiff left ventricle\nUpper and lower limb pulses equal → argues against\naortic dissection\n2 What is the differential diagnosis?\nDissecting aortic aneurysm — upper and lower limb\npulsations are bilaterally felt and equal\nPeptic ulcer — there was no improvement with\nantacids\nPancreatitis — no tenderness or rigidity\nAcute cholecystitis — no tenderness or rigidity, pain not\nreferred to the right scapula\nDiabetic ketoacidosis — no acidotic breathing or\nacetone odour in the breath\nShort and long term management?\nSHORT TERM\nLONG TERM\n3\nECG, cardiac enzymes for the myocardial infarction\nUrine for ketones and glucose, ABGs; serum amylase\n(exclude pancreatitis); abdominal sonar (exclude acute\ncholecystitis)\nAdmit to CCU — morphia, aspirin, oxygen\nConsider thrombolytic therapy or primary PCI (balloon\nangioplasty / stents)\nAntiplatelets, ACE inhibitors (reduce risk of heart\nfailure), beta-blockers\nHigh intensity statin aiming LDL <70 mg/dL; if not\nattained add ezetimibe 10 mg/d, then a PCSK9 inhibitor\nDiabetes control with agents of cardiovascular benefit\n— SGLT2 inhibitors (dapagliflozin, empagliflozin)\nModify weight, hypertension, smoking. Consider\ncoronary angiography", "questions": ["What is the diagnosis, and why?", "What is the differential diagnosis?", "Short and long term management?"], "topic": "c3", "sys": "CARD"}, {"id": "c15", "kw": "Crushing central chest pain at rest to jaw and both arms + ST elevation V1–V5 with high troponin + new apical pansystolic murmur + S3 and basal crepitations", "dx": "Anterior STEMI complicated by papillary muscle rupture and acute mitral regurgitation", "case": 21, "sheet": "Cardiology · DEPBOOK CASE 27\n• CASE\nA 50-year-old man with diabetes,\nhypertension, dyslipidaemia and a recent\nhistory of crescendo chest pains on\nexertion called for an ambulance when he\ndeveloped severe crushing central chest\npain at rest 30 minutes before its arrival.\nThe pain radiated into his jaw and down\nboth arms.\nExamination: BP 100/60 mmHg, pulse\n110/min regular, the patient was\northopneic. Cardiac examination showed\nS3 gallop with recent pansystolic\nmurmur over the apex with bilateral fine\nbasal crepitations. ECG revealed ST\nelevation from V1–V5 with reciprocal\ninversion of T waves in inferior leads.\nTroponin was significantly high.\nBLOOD\nPRESSURE\n100/60\nPULSE\n110/min,\nregular\nECG\nST\nelevation\nV1–V5\n• DIAGNOSTIC KEYWORDS\nCrushing central chest pain at rest to\njaw and both arms + ST elevation\nV1–V5 with high troponin + new\napical pansystolic murmur + S3 and\nbasal crepitations\nANTERIOR STEMI COMPLICATED\nBY PAPILLARY MUSCLE RUPTURE\nAND ACUTE MITRAL\nREGURGITATION\n• REVISE\nCardiovascular System → Ischemic Heart\nDisease\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Cardiology Cases Page 21\nCRUSHING CHEST PAIN + NEW PANSYSTOLIC\nMURMUR\nCASE 21\nSTEMI — diagnosis and reperfusion\nMechanical complications of MI\nAcute mitral regurgitation\nWhat is the diagnosis, and why?\nWHY\n1\nST elevation myocardial infarction, complicated by\ncardiac decompensation due to papillary muscle\nrupture and acute mitral regurge\nCrushing central pain at rest radiating to jaw and both\narms → acute myocardial infarction\nST elevation V1–V5 with reciprocal inferior T inversion\n+ high troponin → anterior STEMI\nA recent pansystolic murmur over the apex → acute\nmitral regurgitation from papillary muscle rupture\nS3 gallop + orthopnea + basal crepitations + BP\n100/60 → cardiac decompensation\nProper management after arrival to hospital?\nAT ER, BEFORE ADMISSION TO CCU\nTHEN\n2\nPain relief with morphine\nLoading aspirin and clopidogrel or ticagrelor, LMWH\nOxygen if SO₂ is less than 90%\nSend the patient to cardiac catheterization (PCI) for\nangiography, angioplasty and placing stents\n3 One complication already present on examination?\nPapillary muscle rupture, complicated by heart failure\nVentricular septal rupture — murmur is at the left sternal border,\nnot the apex\nFree wall rupture — tamponade and electromechanical\ndissociation\nAcute pericarditis — ST elevation in all leads, friction rub", "questions": ["What is the diagnosis, and why?", "Proper management after arrival to hospital?", "One complication already present on examination?"], "topic": "c3", "sys": "CARD"}, {"id": "c16", "kw": "BP 210/130 + creatinine 4.5 and BUN 143 that were normal 2 months ago + papilledema with flame haemorrhages and soft exudates", "dx": "Hypertensive emergency — malignant hypertension with acute kidney injury", "case": 26, "sheet": "Cardiology · DEPBOOK CASE 32\n• CASE\nA 54 year old man came with generalized\nedema and oliguria. He had been\nreceiving oral therapy for hypertension for\nmore than 10 years — nifedipine 40 mg/d\nand losartan 50 mg/d. His drug regimen\nhad not been altered recently.\nOn admission blood pressure 210/130,\nheart rate 100/min, generalized edema, S4\nover the apex, normal respiratory sounds.\nFunduscopy: flame-shaped retinal\nhaemorrhages, soft exudates and\npapilledema. Serum creatinine 4.5 mg/dl,\nBUN 143 mg/dl; the previous kidney\nfunction was normal within the last two\nmonths.\nBLOOD\nPRESSURE\n210/130\nHEART RATE\n100/min\nURINE\nOUTPUT\nOliguria\nLABORATORY\n↑ Serum creatinine 4.5 mg/dL\n↑ BUN 143 mg/dL\nNormal: Kidney function was normal 2 months\nago\n• DIAGNOSTIC KEYWORDS\nBP 210/130 + creatinine 4.5 and\nBUN 143 that were normal 2 months\nago + papilledema with flame\nhaemorrhages and soft exudates\nHYPERTENSIVE EMERGENCY —\nMALIGNANT HYPERTENSION WITH\nACUTE KIDNEY INJURY\n• REVISE\nCardiovascular System → Hypertension\n• ANSWER\nStudy Smarter Cardiology Cases Page 26\nGENERALIZED EDEMA + OLIGURIA WITH BP\n210/130\nCASE 26\nHypertensive emergency vs urgency\nMalignant hypertension\nParenteral antihypertensives\nWhat is the diagnosis, and why?\nWHY\n1\nHypertensive emergency — and because there is\npapilledema, this is malignant hypertension\nBP 210/130 → severe hypertension, above the 180/120\nthreshold\nCreatinine 4.5 and BUN 143, normal 2 months ago →\nongoing end organ damage = acute kidney injury\nPapilledema on funduscopy → upgrades it to\nmalignant hypertension\nRegimen unchanged recently → this is acceleration, not\nnon-adherence\n2 Three possible causes of the raised kidney function?\nAKI is an abrupt decline in renal filtration, marked by a\nrise in creatinine or azotemia. Oliguria = urine volume\n<400 mL/d\nPrerenal — e.g. volume depletion\nIntrinsic — vascular, e.g. malignant hypertension;\nglomerular, e.g. glomerulonephritis\nPostrenal — e.g. obstructive nephropathy\nInitial therapy, and 3 parenteral drugs for hypertensive\nemergency?\nINITIAL THERAPY\nPARENTERAL DRUGS\n3\nAdmit to ICU for continuous monitoring of BP and target\norgan damage, and for parenteral medication\nReduce the SBP by a maximum of 25% within the first\nhour\nThen, if clinically stable, lower to 160/100–110 mmHg\nover the next 2–6 hours\nThen cautiously to normal over the following 24–48\nhours\nNitroprusside IV infusion, works in 5 min, 0.1–0.3\nµg/kg/min — thiocyanate/cyanide toxicity in renal and\nliver insufficiency\nNitroglycerine IV infusion, works after 1–2 min, 5–250\nµg/min — headache, tolerance with prolonged use\nLabetalol, works in 5–10 min, IV bolus 20–80 mg q5–10\nmin up to 300 mg, or infusion 0.5–2 mg/min —\nbronchospasm, heart failure, heart block", "questions": ["What is the diagnosis, and why?", "Three possible causes of the raised kidney function?", "Initial therapy, and 3 parenteral drugs for hypertensive emergency?"], "topic": "c1", "sys": "CARD"}, {"id": "c17", "kw": "BP repeatedly >160/95 on a thiazide + no secondary cause + previous CABG = established coronary artery disease", "dx": "Uncontrolled hypertension with established coronary artery disease", "case": 28, "sheet": "Cardiology · DEPBOOK CASE 34\n• CASE\nA 50 year old man is hypertensive with\nrepeated blood pressure recordings of\n>160/95 mmHg. He is already taking a\nthiazide diuretic as well as aspirin and a\nstatin.\nThere are no apparent secondary causes\nof hypertension. He has previously\nundergone CABG.\nBLOOD\nPRESSURE\n>160/95\nrepeatedly\nCURRENT\nTHERAPY\nThiazide +\naspirin +\nstatin\nHISTORY\nPrevious\nCABG\n• DIAGNOSTIC KEYWORDS\nBP repeatedly >160/95 on a thiazide\n+ no secondary cause + previous\nCABG = established coronary artery\ndisease\nUNCONTROLLED HYPERTENSION\nWITH ESTABLISHED CORONARY\nARTERY DISEASE\n• REVISE\nCardiovascular System → Hypertension ·\nIschemic Heart Disease\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 28\nUNCONTROLLED HYPERTENSION AFTER CABG CASE 28\nBP targets in coronary disease\nBeta-blockers in CAD\nLipid targets\nSecondary hypertension — explicitly\nexcluded in this case\nWhite-coat hypertension — readings\nare repeatedly high\nWhat is the diagnosis, and why?\nWHY\n1\nUncontrolled essential hypertension in a patient with\nestablished coronary artery disease\nBP repeatedly >160/95 on a thiazide → uncontrolled on\ncurrent therapy\nNo apparent secondary causes → essential\nhypertension\nPrevious CABG → established coronary disease — this\ndrives both the target and the drug choice\nAlready on aspirin and a statin → secondary\nprevention already started\n2 What is the blood pressure target in this patient?\nBP treatment target is <130/80 mmHg, to decrease\nadverse cardiovascular events\n3 Most appropriate add-on drug, and why?\nBeta-blockers\nThey reduce resting heart rate, contractility and blood\npressure, so they reduce the demand for oxygen and\nincrease diastolic coronary perfusion time\nThey have been proven to reduce the incidence of heart\nattacks and sudden death in people with coronary\nartery disease\n4 Continue aspirin and statin? What are the lipid targets?\nYes — he must continue both\nAspirin benefits nearly all with clinical coronary disease\n— evolving or recovered MI, unstable or stable angina,\nand after CABG or angioplasty\nStatins block HMG-CoA reductase. High intensity:\natorvastatin 40–80 mg/d or rosuvastatin 20–40 mg/d\nTargets: LDL cholesterol <70 mg/dL · triglycerides\n<130 mg/dL\nIf the LDL goal is not attained add ezetimibe 10 mg/d,\nand if that fails a PCSK9 inhibitor", "questions": ["What is the diagnosis, and why?", "What is the blood pressure target in this patient?", "Most appropriate add-on drug, and why?", "Continue aspirin and statin? What are the lipid targets?"], "topic": "c1", "sys": "CARD"}, {"id": "c18", "kw": "Peripheral oedema + ascites + raised JVP + no orthopnea or PND + distended hepatic veins on ultrasound", "dx": "Systemic venous congestion from right ventricular failure", "case": 32, "sheet": "Cardiology · DEPBOOK CASE 38\n• CASE\nA male patient 48 years old is\ncomplaining of peripheral edema one\nmonth ago and increasing abdominal\ndistension. There was exertional dyspnea\nand easy fatigability. There was no\northopnea or paroxysmal nocturnal\ndyspnea.\nOn examination he was afebrile, a raised\nJVP, mild crackles at the bases of both\nlungs and ascites. ECG: atrial fibrillation.\nAbdominal ultrasound showed distended\nhepatic veins consistent with right\nventricular cardiac failure.\nECG\nAtrial\nfibrillation\nJVP\nRaised\nABDOMEN\nAscites\n• DIAGNOSTIC KEYWORDS\nPeripheral oedema + ascites + raised\nJVP + no orthopnea or PND +\ndistended hepatic veins on ultrasound\nSYSTEMIC VENOUS CONGESTION\nFROM RIGHT VENTRICULAR\nFAILURE\n• REVISE\nCardiovascular System → Heart Failure ·\nPericardial Diseases\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 32\nPERIPHERAL EDEMA + ASCITES WITH ATRIAL\nFIBRILLATION\nCASE 32\nRight sided heart failure\nConstrictive pericarditis\nCauses of systemic venous congestion\nConstrictive pericarditis — pericardial\nknock, no cardiomegaly, equal diastolic\npressures\nCirrhosis with portal hypertension —\nJVP would not be raised\nAdvanced nephropathy — venous\ncongestion is not specific to heart failure\nWhat is the diagnosis, and why?\nWHY\n1\nRight ventricular failure causing systemic venous\ncongestion\nPeripheral oedema, ascites, raised JVP → systemic\nvenous congestion\nDistended hepatic veins on ultrasound → the\ncongestion is backward from the right ventricle\nNo orthopnea or PND → the left side is not congested\n— not simple left heart failure\nExertional dyspnea and easy fatigability → low output\nrather than pulmonary congestion\nWhat is the cause of systemic venous congestion here?\nCONSTRICTIVE PERICARDITIS MUST BE CONSIDERED\n2\nRight ventricular failure leads to increased hydrostatic\ncapillary pressure in systemic capillaries, resulting in\nperipheral or generalized edema, ascites and\ncongestive hepato-splenomegaly\nThe most common cause of right-sided heart failure is\nleft-sided heart failure — due to ischemic heart disease,\ncardiomyopathies, congenital, valvular and hypertensive\nheart disease\nBut note — systemic venous congestion is not specific\nfor heart failure; it occurs in various states of end-stage\norgan dysfunction, such as advanced nephropathy\nThe thickened, non-compliant pericardial sac acts as a\nconstraint around the heart, preventing diastolic filling\nThis equalizes the pressures in the four chambers\nduring diastole — a subtle sign identified by\nechocardiography\nImpaired filling causes venous back pressure and failure\nof outflow\nIn the majority the cause is unknown. Common causes:\ntuberculosis, following open heart surgery, radiation,\ndirect trauma, and following viral infection\nSymptoms and signs are variable and often attributed to\nright sided heart failure or cirrhosis\nInvestigations often prove vital — echocardiography, CT,\nMRI and cardiac catheterization", "questions": ["What is the diagnosis, and why?", "What is the cause of systemic venous congestion here?"], "topic": "c2", "sys": "CARD"}, {"id": "c19", "kw": "BP 210/140 with flash pulmonary oedema + abdominal bruit + unequal kidney size + woman of child bearing age", "dx": "Hypertensive emergency with flash pulmonary oedema from renal artery stenosis", "case": 36, "sheet": "Cardiology · DEPBOOK CASE 42\n• CASE\nA female patient 42 years old presented\nto the ER with dyspnea and frothy\nexpectorations with a history of\npersistent headache of one day duration,\nnot relieved by analgesics.\nOn examination pulse 120 bpm, afebrile,\nblood pressure 210/140, bilateral mid-zonal inspiratory crepitations and an\naudible abdominal bruit, hypoxic and\nhypocapnic. She was rapidly kept on non\ninvasive mechanical ventilation. All\nlaboratory investigations were within\nnormal ranges. Abdominal ultrasound\nrevealed unequal kidney size;\nechocardiography showed mild concentric\nLVH with normal contractility.\nBLOOD PRESSURE\n210/140\nPULSE\n120 bpm\nGASES\nHypoxic,\nhypocapnic\nULTRASOUND\nUnequal kidney\nsize\n• DIAGNOSTIC KEYWORDS\nBP 210/140 with flash pulmonary\noedema + abdominal bruit +\nunequal kidney size + woman of\nchild bearing age\nHYPERTENSIVE EMERGENCY WITH\nFLASH PULMONARY OEDEMA\nFROM RENAL ARTERY STENOSIS\n• REVISE\nCardiovascular System → Hypertension ·\nVascular Diseases\n• ANSWER\nStudy Smarter Cardiology Cases Page 36\nFLASH PULMONARY OEDEMA + ABDOMINAL\nBRUIT\nCASE 36\nSecondary hypertension\nRenal artery stenosis\nHypertensive emergency treatment\nWhat is the diagnosis, and why?\nWHY\n1\nHypertensive emergency complicated by pulmonary\ncongestion — accelerated hypertension and flash\npulmonary oedema secondary to renal artery stenosis\nBeing a female in the child bearing period may point to\nfibromuscular dysplasia as the cause of the renal artery\nstenosis\nBP 210/140 with acute pulmonary congestion →\nhypertensive emergency\nAudible abdominal bruit → turbulent flow through a\nstenosed renal artery\nUnequal kidney size on ultrasound → supports renal\nartery stenosis\nNormal laboratory investigations, normal contractility\n→ the lungs flooded from afterload, not from pump\nfailure\nWhat other investigations?\nRADIOLOGICAL\nLABORATORY\n2\nRenal vessel duplex — direct evidence (stenotic segment\nwith increased velocity, aorto-renal ratio in peak systolic\nvelocity more than 3.5) or indirect evidence (low\nintrarenal resistivity index)\nMultislice CT renal angiography if kidney function is\nnormal, or MR angiography\nConventional angiography — diagnostic and may be\ntherapeutic in the same setting\nKidney functions, ESR; and if imaging is inconclusive,\nexclude other secondary causes — cortisol, thyroid and\nlipid profile\n3 Discuss other lines of management.\nHypertensive emergency treatment — IV nitrates to\nimprove afterload, diuretics, morphia; then weaning\nfrom mechanical ventilation\nStart oral antihypertensives — ACE inhibitor, ARB or\nCCB, as she has a unilateral lesion. ACEi and ARBs are\ncontraindicated in bilateral stenosis or a single kidney\nRenal angioplasty — balloon dilatation ± stenting.\nFollow up the hypertension, which may resolve after\nintervention", "questions": ["What is the diagnosis, and why?", "What other investigations?", "Discuss other lines of management."], "topic": "c1", "sys": "CARD"}, {"id": "c20", "kw": "Recurrent crescendo chest pain + AF at 140 with ST depression + staring, sweaty, fine tremor, BMI 19 + solitary thyroid nodule + BP 170/50 — a very wide pulse pressure", "dx": "Acute coronary syndrome precipitated by thyrotoxic atrial fibrillation", "case": 161, "sheet": "Endocrinology · DEPBOOK CASE 167\n• CASE\nA 56-year-old male presented with\nchest pain of one hour duration,\nwith similar episodes over the\npast 6 months, increasing in\nfrequency and severity.\nExamination: BMI 19, apprehensive,\nstaring, flushed and sweaty, with\nbilateral fine tremors. Radial pulse\n140 bpm, irregular, BP 170/50,\ntemperature 37.5°C. Neck showed\ncongested pulsating neck veins\nwith systolic expansion and an\nolive-size smooth swelling to the\nright of the trachea moving with\ndeglutition. ECG showed AF with\nST depression in V3–V6.\nPULSE\n140,\nirregular\nBLOOD\nPRESSURE\n170/50\nECG\nAF, ST\ndepression\nV3–V6\n• DIAGNOSTIC KEYWORDS\nRecurrent crescendo chest\npain + AF at 140 with ST\ndepression + staring, sweaty,\nfine tremor, BMI 19 + solitary\nthyroid nodule + BP 170/50\n— a very wide pulse pressure\nACUTE CORONARY\nSYNDROME PRECIPITATED\nBY THYROTOXIC ATRIAL\nFIBRILLATION\n• REVISE\nEndocrine System → Thyroid Gland\n• ANSWER\nStudy Smarter Endocrinology Cases Page 161\nCHEST PAIN IN ATRIAL FIBRILLATION WITH A\nTHYROID NODULE\nCASE 11\nThyrotoxic atrial fibrillation\nToxic solitary nodule versus\nGraves'\nThyroid scintiscan\nWhat is the diagnosis, and why?\nWHY\n1\nAcute coronary syndrome — myocardial infarction or\nunstable angina — with thyrotoxicosis and atrial fibrillation\nRecurrent chest pain increasing in severity and duration →\ncrescendo angina — an acute coronary syndrome\nRadial pulse rapid and markedly irregular, with a pulse deficit\n> 10 and systolic expansion of the neck veins → atrial\nfibrillation — the absent a wave is the giveaway\nBP 170/50 → a wide pulse pressure from the hyperkinetic\nstate — high stroke volume with peripheral vasodilatation\nStaring, flushed, sweaty, fine tremor, BMI 19 → sympathetic\noveractivity and weight loss of thyrotoxicosis\nAn olive-size smooth nodule moving with deglutition → a\nsolitary thyroid lesion — so the thyrotoxicosis is nodular, not\nGraves'\n2 What would you expect to see on examination of his eyes?\nExophthalmos, staring look and lid lag — signs of\nsympathetic overactivity in thyrotoxicosis\nOther signs of Graves' ophthalmopathy are not present,\nbecause the patient has either a toxic solitary nodule or a\ndominant nodule of a toxic nodular goiter — not Graves'\n3 What investigations would you require to confirm your diagnosis?\nFollow-up ECG and cardiac enzymes — serum troponin, CK-MB; urgent echocardiography\nTSH, free T4, free T3, and thyroid ultrasound\nDescribe your immediate and subsequent treatment plans for this\ncase?\nIMMEDIATE\nSUBSEQUENT\n4\nAdmission to CCU for treatment of the acute coronary\nsyndrome and the atrial fibrillation\nAnti-thyroid drugs — carbimazole or propylthiouracil\nFor the ACS — beta blocker, nitrate, ACE inhibitor, aspirin plus\nclopidogrel, with or without warfarin\nThyroid scintiscan to define the cause — solitary toxic nodule\nversus dominant nodule of a toxic nodular goiter\nRadioactive iodine treatment, with follow up of thyroid function", "questions": ["What is the diagnosis, and why?", "What would you expect to see on examination of his eyes?", "What investigations would you require to confirm your diagnosis?", "Describe your immediate and subsequent treatment plans for this case?"], "topic": "c3", "sys": "CARD"}, {"id": "c21", "kw": "Hypertension at 26, normal three months ago + paroxysms of headache, palpitation, diaphoresis and flushing + abrupt onset, lasting 10–15 minutes", "dx": "Pheochromocytoma", "case": 169, "sheet": "Endocrinology · DEPBOOK CASE 175\n• CASE\nA 26-year-old man presented with\nelevated blood pressure (180/110\nseated). Three months ago his\nblood pressure was normal.\nHe was admitted twice in the last\nmonth with apprehension, severe\nheadache, palpitation, diaphoresis\nand flushing. These episodes had\nan abrupt onset and lasted 10–15\nminutes.\nBLOOD\nPRESSURE\n180/110\nTHREE\nMONTHS\nAGO\nNormal\nBP\nEPISODES\nAbrupt,\n10–15\nmin\n• DIAGNOSTIC KEYWORDS\nHypertension at 26, normal\nthree months ago +\nparoxysms of headache,\npalpitation, diaphoresis and\nflushing + abrupt onset,\nlasting 10–15 minutes\nPHEOCHROMOCYTOMA\n• REVISE\nEndocrine System → Suprarenal\nGlands\n• ANSWER\nStudy Smarter Endocrinology Cases Page 169\nEPISODES OF HEADACHE, PALPITATION AND\nSWEATING\nCASE 19\nPheochromocytoma:\nbiochemistry before imaging\nParaganglioma and extra-adrenal sites\nHereditary syndromes: MEN 2,\nVHL, NF\nWhat is the diagnosis, and why?\nWHY\n1\nThe primary problem is recent onset of markedly elevated\nblood pressure in a 26-year-old with attacks of headache,\npalpitation and diaphoresis — findings consistent with excess\ncatecholamines and episodes of their secretion, so the likely\ndiagnosis is pheochromocytoma\nA rare catecholamine-secreting tumour of chromaffin cells,\narising in the adrenal medulla or outside it. About 15–20% are\nextra-adrenal, termed paraganglioma, arising in sympathetic\nparaganglion tissue anywhere from the skull base to the\nbladder but mostly intra-abdominal. Catecholamines secreted,\nintermittently or continuously, include norepinephrine and\nepinephrine\nHypertension at 26 that was absent three months ago →\nessential hypertension does not appear this fast at this age — a\nsecondary cause must be found\nParoxysms with abrupt onset lasting 10–15 minutes →\nepisodic release of catecholamines from a tumour, not steady\nhypertension\nHeadache, palpitation and diaphoresis together → the classic\ntriad of pheochromocytoma\nApprehension and flushing during the attacks → the\nadrenergic surge felt systemically\nWhat laboratory tests and imaging would you order to evaluate\nthis patient?\n2\nPlasma free metanephrines — sensitivity 99%\n24-hour urinary total metanephrines\nImaging is done only after the diagnosis is confirmed\nbiochemically — MRI is preferred over CT, with a reported\nsensitivity up to 100% for adrenal lesions and superior to CT for\nextra-adrenal tumours\nMIBG radionuclide scan, now largely replaced by the gallium\ndotatate scan\nPheochromocytoma may be sporadic or hereditary, with up to\na quarter of sporadic cases carrying a known gene mutation.\nHereditary forms occur with neurofibromatosis, MEN 1 and 2,\nvon Hippel-Lindau and familial paraganglioma syndromes", "questions": ["What is the diagnosis, and why?", "What laboratory tests and imaging would you order to evaluate this patient?"], "topic": "c1", "sys": "CARD"}, {"id": "c22", "kw": "Resistant hypertension on three drugs at age 34 + fatigue and muscle cramps + potassium 2.9 + high aldosterone with LOW renin + elevated aldosterone-to-renin ratio", "dx": "Primary hyperaldosteronism (Conn's syndrome)", "case": 190, "sheet": "Endocrinology · DEPBOOK CASE 196\n• CASE\nA 34-year-old man presents with resistant\nhypertension despite taking 3\nantihypertensives. He also complains of\nfatigue and muscle cramps.\nBlood pressure 170/100 mmHg.\nBLOOD\nPRESSURE\n170/100\nANTIHYPERTENSIVES\nThree\nALDOSTERONE\n: RENIN\nElevated\nLABORATORY\n↓ Serum potassium 2.9 mmol/L (3.5–5.0)\n↑ Plasma aldosterone high, renin LOW\n(ARR elevated)\n• DIAGNOSTIC KEYWORDS\nResistant hypertension on three drugs\nat age 34 + fatigue and muscle cramps\n+ potassium 2.9 + high aldosterone\nwith LOW renin + elevated\naldosterone-to-renin ratio\nPRIMARY HYPERALDOSTERONISM\n(CONN'S SYNDROME)\n• REVISE\nEndocrine System → Suprarenal Glands\n• ANSWER\nStudy Smarter Endocrinology Cases Page 190\nRESISTANT HYPERTENSION WITH POTASSIUM OF\n2.9\nCASE 40\nPrimary aldosteronism: ARR screening\nSecondary causes of hypertension\nAdrenal vein sampling\nWhat is the diagnosis, and why?\nWHY\n1\nConn's syndrome (primary hyperaldosteronism) —\nautonomous aldosterone secretion, presenting with\nresistant hypertension and hypokalemia\nAldosterone high while renin is LOW → this is the\ncrux — autonomous aldosterone suppresses renin,\nwhereas every secondary cause has renin HIGH\nPotassium 2.9 → aldosterone drives renal potassium\nwasting\nFatigue and muscle cramps → the clinical expression\nof that hypokalemia\nResistant hypertension at 34 → young age with\nresistance to three drugs demands a search for a\nsecondary cause\nWhat is the differential diagnosis of hypertension with\nhypokalemia?\n2\nEssential hypertension with diuretic use\nRenal artery stenosis\nVarious causes of secondary aldosteronism — in\nwhich renin is elevated\nDeoxycorticosterone (DOC)-secreting adrenal\ntumours\nRenin-secreting tumour\nExcessive licorice intake\nCushing syndrome\n3 What imaging is recommended to localize the lesion?\nCT scan of the adrenal glands, to detect an adenoma\nor hyperplasia", "questions": ["What is the diagnosis, and why?", "What is the differential diagnosis of hypertension with hypokalemia?", "What imaging is recommended to localize the lesion?"], "topic": "c1", "sys": "CARD"}, {"id": "c23", "kw": "2.7 g proteinuria, creatinine 1.9 + arteriolar narrowing + potassium 5.6 on lisinopril 40 mg + raised JVP + BP uncontrolled on four drugs", "dx": "Diabetic kidney disease with uncontrolled hypertension", "case": 234, "sheet": "Nephrology · DEPBOOK CASE 240\n• CASE\nA 60-year-old gentleman with type 2\ndiabetes for 6 years and hypertension\nfor 8 years came for increasing lower\nlimb edema, on atenolol,\nhydrochlorothiazide, lisinopril 40 mg,\ninsulin and metformin. BMI 32, JVP\nelevated, fundi show arteriolar\nnarrowing, no bruits. Echo: diastolic\ndysfunction.\nBLOOD\nPRESSURE\n175–\n180/95–\n105\nBMI\n32\nECHO\nDiastolic\ndysfunction\nLABORATORY\n↑ Potassium 5.6 mEq/L, creatinine 1.9\nmg/dL\n↑ HbA1c ≥ 8%, 24-hour urine protein\n2.7 g\n↑ Cholesterol 280, LDL 165,\ntriglycerides 255 (HDL 30)\nNormal: Urine otherwise unremarkable\n• DIAGNOSTIC KEYWORDS\n2.7 g proteinuria, creatinine 1.9 +\narteriolar narrowing + potassium\n5.6 on lisinopril 40 mg + raised\nJVP + BP uncontrolled on four\ndrugs\nDIABETIC KIDNEY DISEASE WITH\nUNCONTROLLED HYPERTENSION\n• REVISE\nNephrology → Diabetic Kidney Disease\n• ANSWER\nStudy Smarter Nephrology Cases Page 234\nSWELLING LEGS ON LISINOPRIL WITH\nPOTASSIUM 5.6\nCASE 12\nSGLT2 inhibitors in DKD\nWhen to start RAS blockade in\ndiabetes\nManagement of hyperkalemia\nWhat is the diagnosis, and why?\nWHY\n1\nDiabetic kidney disease — overt proteinuria with\nimpaired function in long-standing diabetes and\nhypertension, with hyperkalemia on RAS blockade\n2.7 g proteinuria with retinal arteriolar narrowing →\nmicrovascular disease in two beds — the kidney lesion is\ndiabetic\nPotassium 5.6 on lisinopril 40 mg → RAS blockade,\nfalling GFR and diabetic hyporeninemic\nhypoaldosteronism all raise it\nFor control of his diabetic state, what modification do you\nsuggest in therapy?\n2\nAdd an SGLT2 inhibitor (dapagliflozin) — good at eGFR >\n20, slows progression, reduces albuminuria, cardio-protective. Increase insulin or add a DPP-4 inhibitor.\nMetformin is contraindicated at eGFR < 30, and\nglitazones are not safe here\nWhen are we supposed to start RAS blockade in type 2\ndiabetic patients?\n3\nIndicated when a type 2 diabetic develops systemic\nhypertension, to reduce the development of micro-albuminuria, and in micro-albuminuric patients to slow\nprogression to overt proteinuria. Follow up of kidney\nfunction and potassium is mandatory\nWhat are the possible causes of increasing lower limb edema\nin this patient, and what investigations support the\ndiagnosis?\n4\nRenal — diabetic nephropathy, especially with proteinuria\n(ultrasound, fundus, renal biopsy). Cardiac — heart\nfailure, shown by the raised JVP (ultrasound for congestive\nhepatomegaly, echocardiography for function)\nWhat are other suggested lines of treatment, and how do you\nmanage the hyperkalemia?\n5\nTreat the hypercholesterolemia and hypertriglyceridemia,\nadjust the hypertension, control body weight.\nHyperkalemia — dietary restriction; furosemide if\noverloaded; potassium binders such as patiromer or\nsodium zirconium cyclosilicate\nIn severe hyperkalemia (K > 6.5 or ECG changes) —\ncalcium gluconate 10%, then insulin and glucose, beta-2\nagonist, bicarbonate; dialysis if refractory", "questions": ["What is the diagnosis, and why?", "For control of his diabetic state, what modification do you suggest in therapy?", "When are we supposed to start RAS blockade in type 2 diabetic patients?", "What are the possible causes of increasing lower limb edema in this patient, and what investigations support the diagnosis?", "What are other suggested lines of treatment, and how do you manage the hyperkalemia?"], "topic": "c1", "sys": "CARD"}, {"id": "c24", "kw": "Chest pain > 45 minutes with diaphoresis + ST elevation II, III, aVF + reciprocal depression I and aVL + troponin and CK-MB raised + inferior wall hypokinesia", "dx": "Inferior wall ST-elevation myocardial infarction", "case": 281, "sheet": "Acute Internal Medicine · DEPBOOK CASE 287\n• CASE\nA 62-year-old man presents with central chest\npain radiating to the left arm, lasting over 45\nminutes, associated with diaphoresis and\nnausea. He has a history of hypertension and\nsmoking.\nOn examination he has cool clammy skin. ECG\nshows ST-segment elevation in leads II, III, and\naVF with reciprocal changes in I and aVL.\nEchocardiogram reveals inferior wall\nhypokinesia with preserved ejection fraction.\nBP\n140/90 mmHg\nHR\n104 bpm\nRR\n22 /min\nSKIN\nCool, clammy\nLABORATORY\n↑ Troponin I 3.2 ng/mL\n↑ CK-MB 48 U/L\n• DIAGNOSTIC KEYWORDS\nChest pain > 45 minutes with diaphoresis\n+ ST elevation II, III, aVF + reciprocal\ndepression I and aVL + troponin and CK-MB raised + inferior wall hypokinesia\nINFERIOR WALL ST-ELEVATION\nMYOCARDIAL INFARCTION\n• REVISE\nCardiology → Acute Coronary Syndromes (ACS)\n• ANSWER\nStudy Smarter Acute Internal Medicine Cases Page 281\nST ELEVATION IN II, III AND AVF CASE 11\nPrimary PCI versus fibrinolysis windows\nReciprocal change and its meaning\nComplications of inferior MI\nWhat is the diagnosis, and why?\nWHY\n1\nST-elevation myocardial infarction (STEMI)\nLocalization — inferior wall MI, identified by ST\nelevation in II, III and aVF with reciprocal\ndepression in I and aVL, plus elevated troponin\nand CK-MB and inferior wall hypokinesia on\nechocardiography\nST elevation in II, III and aVF → the inferior leads\n— they localise the infarct to the inferior wall\nReciprocal depression in I and aVL → confirms\ntrue infarction rather than a mimic such as\npericarditis\nEcho hypokinesia in the same territory →\nregional wall motion matching the ECG closes the\nloop\nWhat is the recommended urgent initial\nmanagement?\n2\nImmediate reperfusion therapy\nPrimary percutaneous coronary intervention\n(PCI) within 90–120 minutes is preferred\nIf PCI is unavailable, fibrinolysis (e.g.\nalteplase, tenecteplase, urokinase) should be\ngiven within 30 minutes of arrival\nOther measures — aspirin + a P2Y12 inhibitor\n(e.g. clopidogrel), heparin, oxygen if hypoxic,\nnitrates if not hypotensive, and pain control (e.g.\nmorphine)\nWhat are the clinical and the investigative poor\nprognostic indicators?\n3\nProlonged chest pain (> 45 minutes) → greater\nmyocardial injury\nHigh troponin and CK-MB → larger infarct size\nST elevation with reciprocal changes → more\nsevere ischemia\nInferior MI may involve the right ventricle or the\nconduction system, increasing the risk of\nbradyarrhythmias and hypotension", "questions": ["What is the diagnosis, and why?", "What is the recommended urgent initial management?", "What are the clinical and the investigative poor prognostic indicators?"], "topic": "c3", "sys": "CARD"}, {"id": "c25", "kw": "BP 240/120 + coma without lateralization + basal crepitations + retinal hemorrhage, exudates, cotton wool spots, papilledema + creatinine 1.7", "dx": "Hypertensive emergency with multi-organ damage", "case": 285, "sheet": "Acute Internal Medicine · DEPBOOK CASE 291\n• CASE\nA 60 years old man presented with\naltered level of consciousness,\npreceded by increased breathlessness\nfew days ago according to his\ndaughter.\nCardiac examination revealed\naccentuated S2 over aortic area,\naudible S4, no murmurs. Pulmonary:\nbilateral fine basal crepitations.\nNeurologic: Glasgow coma scale 9 with\nno signs of lateralization. Fundus\nexamination revealed retinal\nhemorrhage, exudates, cotton wool\nspots and papilledema.\nBP\n240/120 mmHg\nPULSE\n80 bpm\nRR\n27 /min\nTEMP\n37.5 °C\nGCS\n9\nLABORATORY\n↑ Serum creatinine 1.7 mg/dL (0.6–1.2)\n• DIAGNOSTIC KEYWORDS\nBP 240/120 + coma without\nlateralization + basal crepitations\n+ retinal hemorrhage, exudates,\ncotton wool spots, papilledema +\ncreatinine 1.7\nHYPERTENSIVE EMERGENCY\nWITH MULTI-ORGAN DAMAGE\n• REVISE\nCardiology → Hypertensive Emergency\n• ANSWER\nStudy Smarter Acute Internal Medicine Cases Page 285\nBLOOD PRESSURE 240/120 WITH PAPILLEDEMA CASE 15\nEmergency versus urgency\nWhy BP must not be dropped too\nfast\nHypertension-mediated organ\ndamage\nWhat is the diagnosis, and why?\nWHY\n1\nHypertensive emergency — marked elevation of blood\npressure [SBP/DBP > 180/110–120 mmHg] with evidence\nof hypertension-mediated (target) organ damage\nNeurologic — altered conscious level without lateralization,\nprobably hypertensive encephalopathy / posterior\nreversible encephalopathy syndrome (PRES). Cardiac —\nleft-sided heart failure and pulmonary edema (bilateral fine\nbasal crepitations). Retina — hypertensive retinopathy\nPapilledema with hemorrhages, exudates and cotton\nwool spots → target organ damage visible directly — it is\nwhat makes this an emergency rather than urgency\nComa with NO lateralizing signs → points away from a\nfocal stroke and towards encephalopathy — but CT is\nstill needed to exclude hemorrhage\nBasal crepitations with an audible S4 → a stiff\nhypertensive ventricle now failing\n2 How to manage this patient?\nReduce mean arterial blood pressure by 15–20% in the\nfirst hour, by continuous intravenous infusion of either\nlabetalol, nicardipine, sodium nitroprusside or\nnitroglycerin\nFollowed by more gradual control over 48–72 hours by\noral medications, after consciousness is regained\n3 Further investigations workup.\nCT brain to rule out intracerebral hemorrhage\nECG — left ventricular hypertrophy ± strain pattern, left\naxis deviation, and whether there is ischemia or an\nongoing acute coronary syndrome\nEchocardiography — global systolic function by ejection\nfraction [55–75%]; regional wall motion abnormalities\n(RWMA) may indicate coronary heart disease; left\nventricular hypertrophy in long-standing hypertension;\nand diastolic dysfunction (transmitral Doppler spectral\ntracing E/A ratio)\nLaboratory — raised brain natriuretic peptide (surrogate\nmarker for heart failure); raised troponin I (recent\nmyocardial infarction, especially with ongoing BP\nelevation). Renal — urine analysis, albumin creatinine\nratio, sodium, potassium, uric acid, follow-up urea and\ncreatinine; pelvi-abdominal ultrasound for bilateral kidney\nsize, cortico-medullary differentiation and echogenicity", "questions": ["What is the diagnosis, and why?", "How to manage this patient?", "Further investigations workup."], "topic": "c1", "sys": "CARD"}], "bundle": "days/d1.json"}, "2": {"day": 2, "topics": "Aortic dissection · Syncope · AF & tachycardia · Cardiac arrest · Rheumatic fever · Valves · Endocarditis · Pericarditis · Tamponade · Cardiomyopathy", "essays": [{"id": "e1", "q": "Treatment of AF", "years": "Kasr 2002 · Kasr 2011 · Oct 2012 · 2012–May 2015 · Nov 2015", "src": "Cardio P18–19", "recent": false, "topic": "c6", "sys": "CARD", "answer": "<h3>How do you manage atrial fibrillation? <span class=\"src\">Cardio P18<\/span><\/h3><div class=\"pillrow\"><span class=\"pill num\">1. Treat the underlying cause or precipitant<\/span><\/div><ul><li>Hyperthyroidism · hypertension · heart failure · alcohol toxicity · chest infection · valvular disease · COPD<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">2. Acute management<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>State<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>Haemodynamically unstable<\/td><td>Cardiogenic shock · pulmonary oedema · severe chest pain · disturbed conscious level → IMMEDIATE SYNCHRONISED DC CARDIOVERSION<\/td><\/tr><tr><td>Haemodynamically stable<\/td><td>Choose RATE or RHYTHM control. Rate control: β-blocker · verapamil / diltiazem · digoxin. Rhythm control: DC or drug cardioversion — no structural heart disease → flecainide / propafenone; structural heart disease → amiodarone / sotalol<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill\">Anticoagulation around cardioversion<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Situation<\/th><th>Cover<\/th><\/tr><\/thead><tbody><tr><td>AF &gt;48 h or unknown duration<\/td><td>≥3 weeks before · during · ≥4 weeks after cardioversion<\/td><\/tr><tr><td>Alternative<\/td><td>TEE to exclude left atrial thrombus → early cardioversion<\/td><\/tr><tr><td>AF &lt;48 h<\/td><td>Cardioversion may proceed without prior anticoagulation<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill num\">3. Long-term management<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Strategy<\/th><th>Consider when<\/th><\/tr><\/thead><tbody><tr><td>Rate control<\/td><td>Permanent AF with mild symptoms · age &gt;65 with recurrent arrhythmia · failed cardioversion with persistent tachyarrhythmia · no HF or LV dysfunction. Agents: digoxin · β-blocker · verapamil / diltiazem<\/td><\/tr><tr><td>Rhythm control<\/td><td>Symptomatic despite rate control · young patient · first episode. Options: antiarrhythmic drugs · cardioversion<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">Non-pharmacological options: radiofrequency catheter ablation with pulmonary vein isolation · AV-node ablation + permanent pacemaker · surgical Maze procedure.<\/p><h3>What are the indications for long-term anticoagulation in AF? <span class=\"src\">Cardio P19<\/span><\/h3><ol><li>Mechanical heart valve<\/li><li>Moderate or severe mitral stenosis<\/li><li>CHA₂DS₂-VASc score ≥2<\/li><\/ol>", "text": "How do you manage atrial fibrillation? (Cardio P18)\n1. TREAT THE UNDERLYING CAUSE OR PRECIPITANT\n- Hyperthyroidism · hypertension · heart failure · alcohol toxicity · chest infection · valvular disease · COPD\n2. ACUTE MANAGEMENT\nState | What to do\nHaemodynamically unstable | Cardiogenic shock · pulmonary oedema · severe chest pain · disturbed conscious level → IMMEDIATE SYNCHRONISED DC CARDIOVERSION\nHaemodynamically stable | Choose RATE or RHYTHM control. Rate control: β-blocker · verapamil / diltiazem · digoxin. Rhythm control: DC or drug cardioversion — no structural heart disease → flecainide / propafenone; structural heart disease → amiodarone / sotalol\nANTICOAGULATION AROUND CARDIOVERSION\nSituation | Cover\nAF >48 h or unknown duration | ≥3 weeks before · during · ≥4 weeks after cardioversion\nAlternative | TEE to exclude left atrial thrombus → early cardioversion\nAF <48 h | Cardioversion may proceed without prior anticoagulation\n3. LONG-TERM MANAGEMENT\nStrategy | Consider when\nRate control | Permanent AF with mild symptoms · age >65 with recurrent arrhythmia · failed cardioversion with persistent tachyarrhythmia · no HF or LV dysfunction. Agents: digoxin · β-blocker · verapamil / diltiazem\nRhythm control | Symptomatic despite rate control · young patient · first episode. Options: antiarrhythmic drugs · cardioversion\nNon-pharmacological options: radiofrequency catheter ablation with pulmonary vein isolation · AV-node ablation + permanent pacemaker · surgical Maze procedure.\n\nWhat are the indications for long-term anticoagulation in AF? (Cardio P19)\n1. Mechanical heart valve\n2. Moderate or severe mitral stenosis\n3. CHA₂DS₂-VASc score ≥2"}, {"id": "e2", "q": "Diagnosis criteria of infective endocarditis", "years": "Kasr 2011 · 2012–May 2015 · Nov 2023 · 2024 · 2025", "src": "Cardio P24", "recent": false, "topic": "c8", "sys": "CARD", "answer": "<h3>What are the modified Duke criteria? <span class=\"src\">Cardio P24<\/span><\/h3><div class=\"strip\">2 MAJOR · OR 1 MAJOR + 3 MINOR · OR 5 MINOR<\/div><div class=\"pillrow\"><span class=\"pill\">Major 1 — positive blood culture<\/span><\/div><ul><li>Typical organisms: S. viridans, S. bovis, HACEK, S. aureus, enterococci<\/li><li>2 separate positive cultures<\/li><li>OR 2 positive cultures &gt;12 h apart<\/li><li>OR 3, or a majority of 4, cultures with the first and last ≥1 h apart<\/li><li>OR a single positive culture for Coxiella burnetii, or phase-1 IgG &gt;1:800<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Major 2 — positive echocardiography<\/span><\/div><ul><li>Vegetation<\/li><li>Abscess<\/li><li>New partial dehiscence of a prosthetic valve<\/li><li>New valvular regurgitation<\/li><\/ul><p class=\"note\">TEE is more sensitive than TTE, especially for detecting an abscess.<\/p><div class=\"pillrow\"><span class=\"pill\">Minor criteria — P · F · V · I · M<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th><\/th><th>Criterion<\/th><\/tr><\/thead><tbody><tr><td>P<\/td><td>Predisposition — cardiac lesion or IV drug use<\/td><\/tr><tr><td>F<\/td><td>Fever — temperature &gt;38 °C<\/td><\/tr><tr><td>V<\/td><td>Vascular — emboli · septic pulmonary infarcts · mycotic aneurysm · intracranial or conjunctival haemorrhage · Janeway lesions · organ infarction<\/td><\/tr><tr><td>I<\/td><td>Immunologic — glomerulonephritis · Osler nodes · Roth spots · rheumatoid factor · splinter haemorrhages or petechiae<\/td><\/tr><tr><td>M<\/td><td>Microbiology — positive culture or serology compatible with IE that does not fulfil a major criterion<\/td><\/tr><\/tbody><\/table><\/div><div class=\"strip\">JANEWAY — painless · palms and soles · vascular / embolic.   OSLER — painful · finger pulps · immunologic · Osler = Ouch.<\/div>", "text": "What are the modified Duke criteria? (Cardio P24)\n2 MAJOR · OR 1 MAJOR + 3 MINOR · OR 5 MINOR\nMAJOR 1 — POSITIVE BLOOD CULTURE\n- Typical organisms: S. viridans, S. bovis, HACEK, S. aureus, enterococci\n- 2 separate positive cultures\n- OR 2 positive cultures >12 h apart\n- OR 3, or a majority of 4, cultures with the first and last ≥1 h apart\n- OR a single positive culture for Coxiella burnetii, or phase-1 IgG >1:800\nMAJOR 2 — POSITIVE ECHOCARDIOGRAPHY\n- Vegetation\n- Abscess\n- New partial dehiscence of a prosthetic valve\n- New valvular regurgitation\nTEE is more sensitive than TTE, especially for detecting an abscess.\nMINOR CRITERIA — P · F · V · I · M\n | Criterion\nP | Predisposition — cardiac lesion or IV drug use\nF | Fever — temperature >38 °C\nV | Vascular — emboli · septic pulmonary infarcts · mycotic aneurysm · intracranial or conjunctival haemorrhage · Janeway lesions · organ infarction\nI | Immunologic — glomerulonephritis · Osler nodes · Roth spots · rheumatoid factor · splinter haemorrhages or petechiae\nM | Microbiology — positive culture or serology compatible with IE that does not fulfil a major criterion\nJANEWAY — painless · palms and soles · vascular / embolic.   OSLER — painful · finger pulps · immunologic · Osler = Ouch."}, {"id": "e3", "q": "Prophylaxis of infective endocarditis (indications, drugs)", "years": "Kasr 2006 · Kasr 2012 · Nov 2017 · June 2022 · Nov 2023", "src": "Cardio P24", "recent": false, "topic": "c8", "sys": "CARD", "answer": "<h3>How is infective endocarditis prevented? <span class=\"src\">Cardio P24<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th><\/th><th>Answer<\/th><\/tr><\/thead><tbody><tr><td>Who?<\/td><td>Prosthetic cardiac valve or prosthetic material used for valve repair · previous infective endocarditis · selected CHD: cyanotic CHD, repaired with prosthetic material for 6 months, lifelong if a residual shunt or regurgitation remains<\/td><\/tr><tr><td>When?<\/td><td>Dental procedures involving gingival manipulation, the periapical region, or perforation of the oral mucosa. Not routinely for bronchoscopy, intubation, gastroscopy, colonoscopy or cystoscopy unless active infection is present<\/td><\/tr><tr><td>What?<\/td><td>Single dose 30–60 min before the procedure. No penicillin / ampicillin allergy → amoxicillin or ampicillin. Penicillin / ampicillin allergy → clindamycin<\/td><\/tr><\/tbody><\/table><\/div><div class=\"strip\">Antibiotic prophylaxis is not routinely recommended for ordinary rheumatic valve disease, mitral valve prolapse or ASD.<\/div><p class=\"note\">General preventive measures: meticulous oral and skin hygiene · careful handling of intravascular catheters · prompt treatment of dental and skin sepsis.<\/p>", "text": "How is infective endocarditis prevented? (Cardio P24)\n | Answer\nWho? | Prosthetic cardiac valve or prosthetic material used for valve repair · previous infective endocarditis · selected CHD: cyanotic CHD, repaired with prosthetic material for 6 months, lifelong if a residual shunt or regurgitation remains\nWhen? | Dental procedures involving gingival manipulation, the periapical region, or perforation of the oral mucosa. Not routinely for bronchoscopy, intubation, gastroscopy, colonoscopy or cystoscopy unless active infection is present\nWhat? | Single dose 30–60 min before the procedure. No penicillin / ampicillin allergy → amoxicillin or ampicillin. Penicillin / ampicillin allergy → clindamycin\nAntibiotic prophylaxis is not routinely recommended for ordinary rheumatic valve disease, mitral valve prolapse or ASD.\nGeneral preventive measures: meticulous oral and skin hygiene · careful handling of intravascular catheters · prompt treatment of dental and skin sepsis."}, {"id": "e4", "q": "Definition and causes of syncope", "years": "8 times, including 2023 and 2024", "src": "Cardio P17 · Symptomatology P14–18", "recent": false, "topic": "c5", "sys": "CARD", "answer": "<h3>Define syncope, prodrome, presyncope and orthostatic hypotension <span class=\"src\">Cardio P17<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Term<\/th><th>Definition<\/th><\/tr><\/thead><tbody><tr><td>Syncope<\/td><td>A transient loss of consciousness with inability to maintain postural tone, due to transient cerebral hypoperfusion. Usually 8–10 sec, rarely &gt;1–2 min, spontaneously self-limited, with complete recovery<\/td><\/tr><tr><td>Prodrome<\/td><td>Symptoms preceding loss of consciousness: light-headedness · nausea · diaphoresis · visual disturbance<\/td><\/tr><tr><td>Presyncope<\/td><td>Prodrome without subsequent loss of consciousness<\/td><\/tr><tr><td>Orthostatic hypotension<\/td><td>On assuming the upright posture: ↓ SBP ≥20 mmHg OR ↓ DBP ≥10 mmHg<\/td><\/tr><\/tbody><\/table><\/div><h3>What are the causes of syncope? <span class=\"src\">Cardio P17<\/span><\/h3><div class=\"pillrow\"><span class=\"pill\">Reflex / neurocardiogenic<\/span><\/div><ul><li>Vasovagal: fright · anxiety or phobia · pain · prolonged standing. Mechanism: vasodilatation → venous pooling → ↓ filling → reflex vasodilatation ± bradycardia<\/li><li>Situational: micturition · defecation · violent cough · swallowing · exercise or post-exercise<\/li><li>Carotid sinus: neck turning · tight collar · shaving → vasodilatation + bradycardia<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Cardiovascular<\/span><\/div><ul><li>Arrhythmias: ventricular tachycardia or bigeminy · rapid supraventricular tachycardia · sinus node disease · AV block, including Stokes–Adams syndrome, typically complete heart block during the attack · pacemaker failure · long-QT syndrome · Brugada syndrome<\/li><li>Obstruction and other: aortic or pulmonary stenosis · hypertrophic obstructive cardiomyopathy · tetralogy of Fallot · pulmonary hypertension or pulmonary embolism · atrial myxoma or thrombus · defective prosthetic valve · cardiac tamponade · cardiomyopathy · bradycardia · acute MI<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Orthostatic<\/span><\/div><ul><li>Volume depletion: dehydration · haemorrhage · diuretics<\/li><li>Autonomic failure: diabetes · Parkinson disease · other neurological disease<\/li><li>Drugs: antihypertensives · nitrates · α-blockers · antidepressants · alcohol<\/li><li>Elderly: inadequate reflex vasoconstriction on standing<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Neurological and psychiatric<\/span><\/div><ul><li>Usually accompanied by focal neurological deficits: TIA · stroke · vertebrobasilar ischaemia → dizziness, vertigo, drop attacks<\/li><li>Major depression · anxiety disorders · usually younger patients · may have perioral or finger paraesthesia<\/li><\/ul><div class=\"strip\">Cardiac syncope red flags — exertional syncope · supine syncope · palpitations immediately before · family history of sudden cardiac death · structural heart disease · abnormal ECG<\/div>", "text": "Define syncope, prodrome, presyncope and orthostatic hypotension (Cardio P17)\nTerm | Definition\nSyncope | A transient loss of consciousness with inability to maintain postural tone, due to transient cerebral hypoperfusion. Usually 8–10 sec, rarely >1–2 min, spontaneously self-limited, with complete recovery\nProdrome | Symptoms preceding loss of consciousness: light-headedness · nausea · diaphoresis · visual disturbance\nPresyncope | Prodrome without subsequent loss of consciousness\nOrthostatic hypotension | On assuming the upright posture: ↓ SBP ≥20 mmHg OR ↓ DBP ≥10 mmHg\n\nWhat are the causes of syncope? (Cardio P17)\nREFLEX / NEUROCARDIOGENIC\n- Vasovagal: fright · anxiety or phobia · pain · prolonged standing. Mechanism: vasodilatation → venous pooling → ↓ filling → reflex vasodilatation ± bradycardia\n- Situational: micturition · defecation · violent cough · swallowing · exercise or post-exercise\n- Carotid sinus: neck turning · tight collar · shaving → vasodilatation + bradycardia\nCARDIOVASCULAR\n- Arrhythmias: ventricular tachycardia or bigeminy · rapid supraventricular tachycardia · sinus node disease · AV block, including Stokes–Adams syndrome, typically complete heart block during the attack · pacemaker failure · long-QT syndrome · Brugada syndrome\n- Obstruction and other: aortic or pulmonary stenosis · hypertrophic obstructive cardiomyopathy · tetralogy of Fallot · pulmonary hypertension or pulmonary embolism · atrial myxoma or thrombus · defective prosthetic valve · cardiac tamponade · cardiomyopathy · bradycardia · acute MI\nORTHOSTATIC\n- Volume depletion: dehydration · haemorrhage · diuretics\n- Autonomic failure: diabetes · Parkinson disease · other neurological disease\n- Drugs: antihypertensives · nitrates · α-blockers · antidepressants · alcohol\n- Elderly: inadequate reflex vasoconstriction on standing\nNEUROLOGICAL AND PSYCHIATRIC\n- Usually accompanied by focal neurological deficits: TIA · stroke · vertebrobasilar ischaemia → dizziness, vertigo, drop attacks\n- Major depression · anxiety disorders · usually younger patients · may have perioral or finger paraesthesia\nCardiac syncope red flags — exertional syncope · supine syncope · palpitations immediately before · family history of sudden cardiac death · structural heart disease · abnormal ECG"}, {"id": "e5", "q": "Causes and investigations for AF", "years": "May 2019 · July 2020 · June 2021", "src": "Cardio P18", "recent": false, "topic": "c6", "sys": "CARD", "answer": "<h3>What are the causes and investigations of atrial fibrillation? <span class=\"src\">Cardio P18<\/span><\/h3><div class=\"pillrow\"><span class=\"pill\">Cardiac causes<\/span><\/div><ul><li>Primary SA-node dysfunction<\/li><li>Lone AF: AF without structural heart disease; echo needed to exclude underlying myocardial disease<\/li><li>Sick sinus syndrome: bradycardia alternating with AF or atrial tachycardia → tachy–brady syndrome<\/li><li>Rheumatic heart disease — especially mitral stenosis<\/li><li>Hypertension · ischaemic heart disease · cardiomyopathy<\/li><li>Pericarditis · myocarditis<\/li><li>Heart failure · valvular heart disease · post-cardiac surgery<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Associated factors<\/span><\/div><ul><li>Thyrotoxicosis · pulmonary embolism · COPD or pulmonary disease<\/li><li>Increasing age · obesity · diabetes<\/li><li>Alcohol — holiday heart · obstructive sleep apnoea<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Investigations<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Test<\/th><th>Findings<\/th><\/tr><\/thead><tbody><tr><td>ECG — diagnostic<\/td><td>No P waves · fibrillatory f waves 400–600/min · irregularly irregular QRS · usually narrow QRS unless BBB or pre-excitation · rate may be 120–200/min if uncontrolled<\/td><\/tr><tr><td>Echocardiography<\/td><td>Valve disease, especially MS · atrial size · LV function · left atrial thrombus · structural heart disease<\/td><\/tr><tr><td>Other tests<\/td><td>TFTs · K⁺ / Mg²⁺ · FBC · renal and liver function · Holter if paroxysmal · CXR for a pulmonary cause · troponin if ischaemia suspected<\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">Signs: the pulse is completely irregular and usually fast, with the irregularity increasing on exertion; the JVP loses its a wave.<\/p><p class=\"note\">Classification: first diagnosed · paroxysmal (&lt;48 h usually, up to 7 d) · persistent (&gt;7 d or needs cardioversion) · long-standing persistent (&gt;1 y) · permanent.<\/p><p class=\"note\">Complications: systemic embolisation or stroke · tachycardia-induced cardiomyopathy · worsening HF · coronary ischaemia · pulmonary oedema.<\/p>", "text": "What are the causes and investigations of atrial fibrillation? (Cardio P18)\nCARDIAC CAUSES\n- Primary SA-node dysfunction\n- Lone AF: AF without structural heart disease; echo needed to exclude underlying myocardial disease\n- Sick sinus syndrome: bradycardia alternating with AF or atrial tachycardia → tachy–brady syndrome\n- Rheumatic heart disease — especially mitral stenosis\n- Hypertension · ischaemic heart disease · cardiomyopathy\n- Pericarditis · myocarditis\n- Heart failure · valvular heart disease · post-cardiac surgery\nASSOCIATED FACTORS\n- Thyrotoxicosis · pulmonary embolism · COPD or pulmonary disease\n- Increasing age · obesity · diabetes\n- Alcohol — holiday heart · obstructive sleep apnoea\nINVESTIGATIONS\nTest | Findings\nECG — diagnostic | No P waves · fibrillatory f waves 400–600/min · irregularly irregular QRS · usually narrow QRS unless BBB or pre-excitation · rate may be 120–200/min if uncontrolled\nEchocardiography | Valve disease, especially MS · atrial size · LV function · left atrial thrombus · structural heart disease\nOther tests | TFTs · K⁺ / Mg²⁺ · FBC · renal and liver function · Holter if paroxysmal · CXR for a pulmonary cause · troponin if ischaemia suspected\nSigns: the pulse is completely irregular and usually fast, with the irregularity increasing on exertion; the JVP loses its a wave.\nClassification: first diagnosed · paroxysmal (<48 h usually, up to 7 d) · persistent (>7 d or needs cardioversion) · long-standing persistent (>1 y) · permanent.\nComplications: systemic embolisation or stroke · tachycardia-induced cardiomyopathy · worsening HF · coronary ischaemia · pulmonary oedema."}, {"id": "e6", "q": "Diagnostic criteria of rheumatic fever (major/minor)", "years": "2012–May 2015 · May 2016 · 2024", "src": "Cardio P21", "recent": false, "topic": "c7", "sys": "CARD", "answer": "<h3>What are the Jones criteria for rheumatic fever? <span class=\"src\">Cardio P21<\/span><\/h3><div class=\"strip\">Initial attack: 2 major OR 1 major + 2 minor + evidence of recent streptococcal infection. Recurrent attack: 3 minor criteria + evidence of recent streptococcal infection are also sufficient.<\/div><div class=\"strip\">J♥NES — Joints: arthritis · Carditis · subcutaneous Nodules · Erythema marginatum · Sydenham chorea<\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th><\/th><th>Criteria<\/th><\/tr><\/thead><tbody><tr><td>Major<\/td><td>Monoarthritis OR polyarthritis OR polyarthralgia · carditis, clinical or subclinical · Sydenham chorea · erythema marginatum · subcutaneous nodules<\/td><\/tr><tr><td>Minor<\/td><td>Monoarthralgia · fever ≥38 °C · ESR ≥30 mm/h and/or CRP ≥3 mg/dL · prolonged PR interval<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill\">Evidence of recent streptococcal infection<\/span><\/div><ul><li>Scarlet fever<\/li><li>Positive throat culture for group A β-haemolytic streptococci<\/li><li>Positive rapid streptococcal antigen test<\/li><li>Elevated or rising ASO, anti-DNase B, antistreptokinase or antihyaluronidase<\/li><\/ul><p class=\"note\">A rising titre counts for more than a single value. In Egypt, an ASO of about 250–400 IU/mL or more is considered positive.<\/p><div class=\"pillrow\"><span class=\"pill\">Counting rules<\/span><\/div><ul><li>Do not count arthralgia if arthritis is already major<\/li><li>Do not count a prolonged PR interval if carditis is already major<\/li><li>ESR + CRP + leucocytosis together = one inflammatory minor criterion<\/li><li>Subclinical carditis on echo = major<\/li><li>Recent streptococcal evidence is required except in isolated chorea<\/li><\/ul>", "text": "What are the Jones criteria for rheumatic fever? (Cardio P21)\nInitial attack: 2 major OR 1 major + 2 minor + evidence of recent streptococcal infection. Recurrent attack: 3 minor criteria + evidence of recent streptococcal infection are also sufficient.\nJ♥NES — Joints: arthritis · Carditis · subcutaneous Nodules · Erythema marginatum · Sydenham chorea\n | Criteria\nMajor | Monoarthritis OR polyarthritis OR polyarthralgia · carditis, clinical or subclinical · Sydenham chorea · erythema marginatum · subcutaneous nodules\nMinor | Monoarthralgia · fever ≥38 °C · ESR ≥30 mm/h and/or CRP ≥3 mg/dL · prolonged PR interval\nEVIDENCE OF RECENT STREPTOCOCCAL INFECTION\n- Scarlet fever\n- Positive throat culture for group A β-haemolytic streptococci\n- Positive rapid streptococcal antigen test\n- Elevated or rising ASO, anti-DNase B, antistreptokinase or antihyaluronidase\nA rising titre counts for more than a single value. In Egypt, an ASO of about 250–400 IU/mL or more is considered positive.\nCOUNTING RULES\n- Do not count arthralgia if arthritis is already major\n- Do not count a prolonged PR interval if carditis is already major\n- ESR + CRP + leucocytosis together = one inflammatory minor criterion\n- Subclinical carditis on echo = major\n- Recent streptococcal evidence is required except in isolated chorea"}, {"id": "e7", "q": "Causes of sinus tachycardia", "years": "Kasr 2011 · 2012–May 2015 · 2022", "src": "Cardio P19", "recent": false, "topic": "c6", "sys": "CARD", "answer": "<h3>What are the causes of sinus tachycardia? <span class=\"src\">Cardio P19<\/span><\/h3><p>Rate 100–160/min. It usually reflects an underlying physiological or pathological stress → treat the cause rather than the heart rate itself.<\/p><div class=\"tree\"><span class=\"node\">CAUSES<\/span><div class=\"branches\"><div class=\"grp\"><span class=\"pill\">Physiological<\/span><ul><li>Exercise · fever<\/li><li>Stress, flight, fright, anger<\/li><li>Pain · pregnancy<\/li><\/ul><\/div><div class=\"grp\"><span class=\"pill\">Cardiac<\/span><ul><li>Congestive heart failure<\/li><li>Acute coronary ischaemia / MI<\/li><li>Myocarditis · rheumatic activity<\/li><li>Pulmonary embolism<\/li><\/ul><\/div><div class=\"grp\"><span class=\"pill\">Systemic<\/span><ul><li>Thyrotoxicosis<\/li><li>Chronic pulmonary disease · hypoxia<\/li><li>Hypovolaemia · anaemia · shock<\/li><li>Infection / sepsis<\/li><\/ul><\/div><div class=\"grp\"><span class=\"pill\">Drugs<\/span><ul><li>Sympathomimetics · parasympatholytics (atropine)<\/li><li>Alcohol · caffeine · nicotine<\/li><li>Withdrawal states<\/li><\/ul><\/div><\/div><\/div><p class=\"note\">Causes of a regular tachycardia: 1) sinus tachycardia · 2) supraventricular tachycardia — atrial or junctional · 3) atrial flutter with regular block · 4) ventricular tachycardia.<\/p>", "text": "What are the causes of sinus tachycardia? (Cardio P19)\nRate 100–160/min. It usually reflects an underlying physiological or pathological stress → treat the cause rather than the heart rate itself.\nCAUSES\nPHYSIOLOGICAL\n- Exercise · fever\n- Stress, flight, fright, anger\n- Pain · pregnancy\nCARDIAC\n- Congestive heart failure\n- Acute coronary ischaemia / MI\n- Myocarditis · rheumatic activity\n- Pulmonary embolism\nSYSTEMIC\n- Thyrotoxicosis\n- Chronic pulmonary disease · hypoxia\n- Hypovolaemia · anaemia · shock\n- Infection / sepsis\nDRUGS\n- Sympathomimetics · parasympatholytics (atropine)\n- Alcohol · caffeine · nicotine\n- Withdrawal states\nCauses of a regular tachycardia: 1) sinus tachycardia · 2) supraventricular tachycardia — atrial or junctional · 3) atrial flutter with regular block · 4) ventricular tachycardia."}, {"id": "e8", "q": "Complications of infective endocarditis", "years": "Nov 2023 — first time", "src": "Cardio P25", "recent": true, "topic": "c8", "sys": "CARD", "answer": "<h3>What are the complications of infective endocarditis? <span class=\"src\">Cardio P25<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Group<\/th><th>Complications<\/th><\/tr><\/thead><tbody><tr><td>Cardiac<\/td><td>Heart failure — the commonest, usually from valvular insufficiency; NYHA III–IV → urgent surgery. Perivalvular abscess → may extend into conduction tissue → heart block<\/td><\/tr><tr><td>Neurological / embolic<\/td><td>Stroke · encephalopathy · retinal emboli · mycotic aneurysm · brain abscess · systemic and septic embolisation. Metastatic infection: vertebral osteomyelitis · septic arthritis · metastatic abscess<\/td><\/tr><tr><td>Renal<\/td><td>Renal infarction · renal abscess · immune-mediated glomerulonephritis<\/td><\/tr><tr><td>Right-sided IE<\/td><td>Embolisation from the tricuspid or pulmonary valve → pulmonary infection · pulmonary abscess<\/td><\/tr><tr><td>Treatment-related<\/td><td>Drug fever · adverse effects of prolonged parenteral antimicrobials · surgical complications<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What are the complications of infective endocarditis? (Cardio P25)\nGroup | Complications\nCardiac | Heart failure — the commonest, usually from valvular insufficiency; NYHA III–IV → urgent surgery. Perivalvular abscess → may extend into conduction tissue → heart block\nNeurological / embolic | Stroke · encephalopathy · retinal emboli · mycotic aneurysm · brain abscess · systemic and septic embolisation. Metastatic infection: vertebral osteomyelitis · septic arthritis · metastatic abscess\nRenal | Renal infarction · renal abscess · immune-mediated glomerulonephritis\nRight-sided IE | Embolisation from the tricuspid or pulmonary valve → pulmonary infection · pulmonary abscess\nTreatment-related | Drug fever · adverse effects of prolonged parenteral antimicrobials · surgical complications"}], "cases": [{"id": "c1", "kw": "Sudden excruciating central chest pain to the back + BP 170/90 right vs 110/70 left + faint left carotid + normal ECG and enzymes", "dx": "Aortic dissection", "case": 33, "sheet": "Cardiology · DEPBOOK CASE 39\n• CASE\nA 60-year-old man with long standing\nhypertension presented to the ER with a\nsudden onset of severe excruciating\ncentral chest pain referred to the back.\nOn examination BP was 170/90 right arm\nand 110/70 left arm with unequal pulses.\nCarotid pulsations were faint on the left\nside. ECG and cardiac enzymes were\nnormal. Chest X-ray showed mild left\nsided pleural effusion.\nBP RIGHT ARM\n170/90\nBP LEFT ARM\n110/70\nLEFT CAROTID\nFaint\nECG / ENZYMES\nNormal\n• DIAGNOSTIC KEYWORDS\nSudden excruciating central chest\npain to the back + BP 170/90 right\nvs 110/70 left + faint left carotid +\nnormal ECG and enzymes\nAORTIC DISSECTION\n• REVISE\nCardiovascular System → Vascular Diseases\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 33\nEXCRUCIATING CHEST PAIN + UNEQUAL ARM\nBLOOD PRESSURE\nCASE 33\nAortic dissection\nCT angiography\nComplications of dissection\nMyocardial infarction — ECG and\nenzymes are normal, pulses equal\nPulmonary embolism — no unequal\npulses\nAcute pericarditis — ST elevation in all\nleads, friction rub\nWhat is the diagnosis, and why?\nWHY\n1\nAortic dissection in a male with long standing\nhypertension\nA tearing in the intimal layer of the aortic wall creating a\nfalse lumen that can compromise blood flow to vital\norgans; may lead to aortic rupture, cardiac tamponade\nor organ ischemia\nSudden severe pain referred to the back → the classic\ndissection pain\nBP 170/90 right vs 110/70 left with faint left carotid →\nthe dissection involves the left common carotid and left\nsubclavian, after the brachiocephalic origin\nECG and cardiac enzymes normal → argues against\nmyocardial infarction\nLeft sided pleural effusion → a possible leak from the\naorta\n2 Examination of choice to prove your diagnosis?\nComputed tomography angiography (CTA) is the first-line imaging modality in most cases — high sensitivity\nand specificity, widespread availability and rapid\nacquisition\nIt shows the intimal flap, true and false lumens, aortic\ndilation, haematoma, and complications such as\ncontrast leak (indicating rupture) and branch vessel\ninvolvement\n3 Two complications already present?\nDissection involving the left subclavian and carotid\narteries — ischemia to the affected area, shown by the\nunequal pressures and faint left carotid\nLeft sided pleural effusion — points to a possible leak\nfrom the aorta", "questions": ["What is the diagnosis, and why?", "Examination of choice to prove your diagnosis?", "Two complications already present?"], "topic": "c10", "sys": "CARD"}, {"id": "c2", "kw": "Chest pain to the back + BP 180/120 right vs 100/70 left + wide mediastinum + damped monophasic left arm flow", "dx": "Aortic dissection of the ascending aorta or arch", "case": 34, "sheet": "Cardiology · DEPBOOK CASE 40\n• CASE\nA 69-year-old male presented to ER with\nchest pain referred to the back and mild\ndyspnea starting few hours ago. He is a\nchronic heavy smoker and hypertensive\nfor more than 20 years, non compliant to\ntreatment.\nOn examination BP 180/120 right arm\nand 100/70 left, mild tachypnea with no\nhypoxia, afebrile. Increased second heart\nsound over the aortic area. ECG showed\nleft ventricular hypertrophy; chest X-ray\nshowed wide mediastinum. Doppler of\nthe left upper limb showed monophasic\ndamped flow, the right showed normal\ntriphasic waveform.\nBP RIGHT ARM\n180/120\nBP LEFT ARM\n100/70\nCHEST X-RAY\nWide mediastinum\nLEFT ARM DOPPLER\nMonophasic\ndamped\n• DIAGNOSTIC KEYWORDS\nChest pain to the back + BP 180/120\nright vs 100/70 left + wide\nmediastinum + damped monophasic\nleft arm flow\nAORTIC DISSECTION OF THE\nASCENDING AORTA OR ARCH\n• REVISE\nCardiovascular System → Vascular Diseases\n· Hypertension\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 34\nCHEST PAIN TO THE BACK + WIDE MEDIASTINUM CASE 34\nAortic dissection — imaging\nBlood pressure control in dissection\nTEVAR and open repair\nMyocardial infarction — no unequal\npulses or wide mediastinum\nPulmonary embolism — hypoxia\nexpected; none here\nWhat is the diagnosis, and why?\nWHY\n1\nAortic dissection, mostly located at the ascending\naorta or aortic arch, before the origin of the left\nsubclavian artery, and it may include the aortic valve\n— due to chronic hypertension not compliant to\ntreatment\nChest pain referred to the back → dissection pain\nBP 180/120 right vs 100/70 left, damped left arm flow\n→ the left subclavian is involved, so the tear is proximal\nto it\nWide mediastinum on chest X-ray → the dilated,\ndissected aorta\n20 years of uncontrolled hypertension with LVH → the\nsubstrate for dissection\n2 What other investigations?\nMultislice CT angiography — the extent of dissection\nand whether the renal arteries are included\nLaboratory — exclude renal affection, and preoperative\npreparation for urgent surgery\nDiscuss the lines of management.\nBLOOD PRESSURE\nINTERVENTION\nLONG TERM\n3\nLower SBP to below 120 mmHg during the first hour\nPreferred: narcotic analgesia (morphine sulfate) with\nlabetalol, nicardipine, nitroprusside and a beta-blocker\n(esmolol)\nBeta blockade should precede vasodilator\nadministration, to prevent reflex tachycardia or an\ninotropic effect\nCCBs (verapamil, diltiazem) are an alternative to beta\nblockers\nTEVAR — thoracic endovascular aortic repair places a\nstent-graft to seal the entry tear and exclude the false\nlumen; significantly lower morbidity and mortality than\nopen repair\nOpen surgery is reserved for cases where TEVAR is not\nfeasible or with severe complications\nAntihypertensive treatment with tight control; cessation\nof smoking with treatment of COPD if present", "questions": ["What is the diagnosis, and why?", "What other investigations?", "Discuss the lines of management."], "topic": "c10", "sys": "CARD"}, {"id": "c3", "kw": "Palpitations since last evening with similar episodes for months + ECG atrial fibrillation at 114/min + age 65 with dyslipidemia", "dx": "Paroxysmal atrial fibrillation", "case": 38, "sheet": "Cardiology · DEPBOOK CASE 44\n• CASE\nA 65 year old female with a history of\ndyslipidemia presents to your office with\ncomplaints of palpitations that started\nlast evening. No other past medical\nhistory.\nShe admits to similar episodes on and off\nfor the last few months. ECG showed\natrial fibrillation with ventricular rate of\n114/minute.\nECG\nAtrial\nfibrillation\nVENTRICULAR\nRATE\n114/min\nONSET\nLast\nevening\n• DIAGNOSTIC KEYWORDS\nPalpitations since last evening with\nsimilar episodes for months + ECG\natrial fibrillation at 114/min + age 65\nwith dyslipidemia\nPAROXYSMAL ATRIAL\nFIBRILLATION\n• REVISE\nCardiovascular System → Disorders of\nCardiac Rhythm\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 38\nNEW PALPITATIONS + ATRIAL FIBRILLATION ON\nECG\nCASE 38\nAtrial fibrillation management\nCHA₂DS₂-VASc score\nDirect oral anticoagulants\nAtrial flutter — regular, saw-tooth\nwaves\nParoxysmal SVT — regular and narrow\nwith abrupt onset\nThyrotoxicosis — a cause to exclude,\nnot a differential\nWhat is the diagnosis, and why?\nWHY\n1\nAtrial fibrillation — recurrent (paroxysmal), with a\ncontrolled-to-rapid ventricular rate\nThe cornerstones of AF management are rate control,\nrhythm control and anticoagulation\nECG shows atrial fibrillation at 114/min → the rhythm,\nwith a ventricular rate still uncontrolled\nSimilar episodes on and off for months → recurrent\nand self-terminating — paroxysmal, not new\nOnset last evening, under 48 hours → cardioversion\nneed not wait 3 weeks of anticoagulation\nAge 65 and female → 1 CHA₂DS₂-VASc point each;\ndyslipidemia scores none\nWhat is your general management plan?\nRHYTHM CONTROL\nRATE CONTROL\nANTICOAGULATION\n2\nElectrical cardioversion is preferred — greater efficacy\nand rapidity. Immediate if haemodynamically unstable\nAF lasting >48 h → at least 3 weeks of anticoagulation,\nor imaging to rule out thrombus, before elective\ncardioversion, and 4 weeks after\nPharmacological — IV amiodarone (8–12 h);\ndronedarone, flecainide or propafenone in the absence\nof heart disease\nCatheter ablation — for recurrent symptomatic AF\ndespite drugs, without left atrial enlargement\nFavoured with age >65, less symptomatic, hypertension,\nrecurrent AF, previous drug failure, enlarged left atrium\nBeta-blocker or calcium-channel blocker (verapamil,\ndiltiazem). Digoxin not first-line\nCHA₂DS₂-VASc ≥2 in men or ≥3 in women → oral\nanticoagulants\nDOACs (dabigatran, rivaroxaban, apixaban, edoxaban)\nover warfarin — except moderate-severe mitral\nstenosis, mechanical valve or antiphospholipid\nsyndrome, where warfarin is used, target INR 2–3", "questions": ["What is the diagnosis, and why?", "What is your general management plan?"], "topic": "c6", "sys": "CARD"}, {"id": "c4", "kw": "Palpitation with BP 220/110 + radial 130 but apical 150 = a pulse deficit of 20 + irregular rhythm", "dx": "Atrial fibrillation", "case": 39, "sheet": "Cardiology · DEPBOOK CASE 45\n• CASE\nA 56-year-old known hypertensive male\npatient presented with an attack of\npalpitation.\nBy examination he was conscious lying\nflat in bed, blood pressure 220/110,\nradial pulse 130/min and apical pulse\n150/min, irregular. His past medical\nhistory, apart from hypertension, was\nunremarkable.\nBLOOD PRESSURE\n220/110\n
