gioproliferative GN\nHematuria is not a common occurrence with\nmembranous or minimal change GN", "questions": ["What is the diagnosis, and why?", "What is the most likely underlying etiology?", "Discuss possible measures to reduce proteinuria.", "Discuss possible pathologic findings."], "topic": "n2", "sys": "NEPH"}, {"id": "c10", "kw": "Proteinuria 4.5 g with albumin 2.1 + normal BP and creatinine + neck veins NOT congested + potassium 3.2", "dx": "Nephrotic syndrome", "case": 235, "sheet": "Nephrology · DEPBOOK CASE 241\n• CASE\nA 15-year-old boy presenting with\nmorning puffiness of eyelids and\nlower limb edema, associated with\nabdominal and scrotal swelling.\nExamination: BP 120/75, neck\nveins not congested, edema up to\nmid thigh, moderate ascites and\nscrotal edema.\nBLOOD\nPRESSURE\n120/75\nNECK\nVEINS\nNot\ncongested\nOEDEMA\nTo mid\nthigh,\nscrotal\nLABORATORY\n↓ Albumin 2.1 g/dL, sodium 129,\npotassium 3.2 mEq/L\n+ Urine albumin ++++, 24-hour\nprotein 4.5 g/day\n+ Hyaline casts 2–3, waxy casts\n0–1/HPF (RBC 2–4)\nNormal: Creatinine 0.75 mg/dL, urea 23\nmg/dL; WBC 1–3/HPF\n• DIAGNOSTIC KEYWORDS\nProteinuria 4.5 g with\nalbumin 2.1 + normal BP and\ncreatinine + neck veins NOT\ncongested + potassium 3.2\nNEPHROTIC SYNDROME\n• REVISE\nNephrology → Glomerular Disease →\nNephrotic Syndrome\n• ANSWER\nStudy Smarter Nephrology Cases Page 235\nA BOY OF FIFTEEN WITH SCROTAL OEDEMA CASE 13\nMCNS in the under-18s\nIndications for renal biopsy\nComplications of nephrotic\nsyndrome\nWhat is the diagnosis, and why?\nWHY\n1\nNephrotic syndrome — edema with nephrotic range\nproteinuria and hypoalbuminemia\nNeck veins not congested with a normal BP → this separates\na nephrotic from a cardiac or nephritic cause of generalized\nedema\nCreatinine 0.75 → function entirely preserved despite 4.5 g of\nprotein\nSodium 129 with potassium 3.2 → dilutional hyponatremia\nand secondary hyperaldosteronism\nOnly 2–4 RBC/HPF → bland sediment — not a proliferative\nnephritis\n2 What is the most likely pathologic diagnosis in this case?\nMinimal change nephrotic syndrome (MCNS). In patients\nbelow 18 years of age, MCNS is the etiology of nephrotic\nsyndrome in 70–90% of cases\n3 What are the causes of abdominal distension in this patient?\nAscites, and flatulent intestinal distension secondary to\nhypokalemia\nWhat are additional laboratory findings that can be encountered\nin this patient?\n4\nHypercholesterolemia, hypocalcemia and secondary\nhyperaldosteronism\n5 What is the indication of renal biopsy in this case?\nRenal biopsy should NOT be done initially in a patient below\n18, as MCNS is the probable cause in 70–90%\nBiopsy is indicated if there is resistance to a 4–6 week course\nof oral prednisone 40–60 mg daily, or if the patient has non-selective proteinuria\nWhat is the further management in this case, and what\ncomplications can be encountered?\n6\nSalt restriction; a loop diuretic plus a potassium retaining\ndiuretic; prednisolone 40–60 mg daily empirically for 4–6\nweeks\nComplications — DVT, peritonitis, chest infection, premature\natherosclerosis, acute kidney injury, bone disease from\nhypocalcemia, anemia", "questions": ["What is the diagnosis, and why?", "What is the most likely pathologic diagnosis in this case?", "What are the causes of abdominal distension in this patient?", "What are additional laboratory findings that can be encountered in this patient?", "What is the indication of renal biopsy in this case?", "What is the further management in this case, and what complications can be encountered?"], "topic": "n2", "sys": "NEPH"}, {"id": "c11", "kw": "Onset at age 5, always steroid sensitive + protein 7 g/day, albumin 2 + creatinine 0.7, clearance over 100", "dx": "Minimal change glomerulonephritis with multiple relapses", "case": 230, "sheet": "Nephrology · DEPBOOK CASE 236\n• CASE\nA 17-year-old schoolboy developed ankle\nand periorbital swelling spreading rapidly to\nlegs and abdomen, with weight increased\nby 10 kg. He first presented at age 5 with\ngeneralized edema and proteinuria, treated\nwith prednisolone which induced a prompt\nremission.\nFrequent relapses led to\ncyclophosphamide, after which proteinuria\nabated for 4 years. Then yearly relapses,\nusually beginning in springtime, each\nsteroid sensitive. Now marked edema with\nascites and bilateral pleural effusions.\nWEIGHT GAIN\n10 kg\nAGE AT\nONSET\n5\nSTEROID\nRESPONSE\nAlways\nsensitive\nLABORATORY\n↓ Plasma albumin 2 g/dL (3.5–5.0)\n↑ 24-hour urine protein 7 g\n↑ ESR 70 mm/hour\nNormal: Hb 13.3 g/dL, creatinine 0.7 mg/dL,\ncreatinine clearance > 100 mL/min, collagen screen\n• DIAGNOSTIC KEYWORDS\nOnset at age 5, always steroid\nsensitive + protein 7 g/day, albumin 2\n+ creatinine 0.7, clearance over 100\nMINIMAL CHANGE\nGLOMERULONEPHRITIS WITH\nMULTIPLE RELAPSES\n• REVISE\nNephrology → Glomerular Disease → Minimal\nChange\n• ANSWER\nStudy Smarter Nephrology Cases Page 230\nYEARLY SPRINGTIME RELAPSES SINCE THE AGE\nOF FIVE\nCASE 8\nMinimal change: light, IF and EM\nFrequently relapsing and steroid\ndependent\nSteroid-sparing agents\nWhat is the diagnosis, and why?\nWHY\n1\nMinimal change GN with multiple relapses\nNormal creatinine and a clearance above 100\ndespite 7 g of protein → massive proteinuria with\nperfectly preserved function is the signature — a\nscarring lesion would have damaged the GFR by\nnow\nSteroid sensitive on every occasion, over 12 years →\nminimal change disease is the steroid-responsive\none\nOnset at age 5, relapses each springtime → the peak\nage for minimal change disease, with the allergic or\ninfective trigger often described in it\nWhat are the characteristic findings of the renal biopsy\non optical and electron microscopy and\nimmunofluorescence?\n2\nLight microscopy revealed only a mild increase in\nmesangial cells and matrix, with no other abnormality\nexcept global sclerosis of one of the 25 glomeruli\nexamined. Immunofluorescence was negative\nElectron microscopy showed no electron dense\ndeposits but fusion of the foot processes (podocytes)\nof the epithelial cells lining the urinary space\nThese are typical of minimal change nephropathy;\nlight microscopy is usually normal or at most shows\nslight mesangial proliferation and matrix expansion\n3 What is the usual treatment regimen employed?\nFrequently relapsing MCD is two or more relapses\nper 6 months, or four per 12. Infrequent relapses get\nglucocorticoids alone. For frequently relapsing or\nsteroid dependent disease the choice follows\npreference, side effects and cost, as evidence does\nnot favour one class over another\nPrednisolone 1 mg/kg/day (max 60–80 mg) or 2\nmg/kg alternate days until remission, then tapered by\n5–10 mg/week; cyclophosphamide 2–2.5 mg/kg/day\nfor 8–12 weeks\nCalcineurin inhibitors — cyclosporine 3–5 or\ntacrolimus 0.05–0.1 mg/kg/day for 1–2 years;\nrituximab 375 mg/m² weekly × 1–4, or 1 g every 2\nweeks × 2", "questions": ["What is the diagnosis, and why?", "What are the characteristic findings of the renal biopsy on optical and electron microscopy and immunofluorescence?", "What is the usual treatment regimen employed?"], "topic": "n2", "sys": "NEPH"}, {"id": "c12", "kw": "Abrupt proteinuria 8.5 g, albumin 2.3 + NO blood in urine + segmental sclerosis in SOME glomeruli + IF negative + DIFFUSE foot process effacement", "dx": "Primary focal segmental glomerulosclerosis", "case": 245, "sheet": "Nephrology · DEPBOOK CASE 251\n• CASE\nA 32-year-old male with no chronic\nillness, treated for a presumed viral\nillness 3 months ago, with an uncle\nwith kidney failure in his 40s, presents\nwith progressive swelling of legs and\nface over the past month and foamy\nurine, denying dysuria, hematuria or\nback pain.\nBP 150/90, BMI 31, periorbital\npuffiness, bilateral pitting edema to\nthe knee. No rash, joint swelling or\nneurological deficit.\nBLOOD\nPRESSURE\n150/90\nBMI\n31\nEM\nFoot\nprocess\neffacement\nLABORATORY\n+ 4+ protein, NEGATIVE for blood;\nprotein/creatinine 8.5 g/day\n↓ Albumin 2.3 g/dL (3.5–5.0)\n↑ Cholesterol 280 mg/dL, creatinine\n1.9 mg/dL\nNormal: ANA, ANCA, anti-dsDNA, C3, C4,\nHIV, hepatitis B and C all negative or normal\n• DIAGNOSTIC KEYWORDS\nAbrupt proteinuria 8.5 g, albumin\n2.3 + NO blood in urine +\nsegmental sclerosis in SOME\nglomeruli + IF negative +\nDIFFUSE foot process effacement\nPRIMARY FOCAL SEGMENTAL\nGLOMERULOSCLEROSIS\n• REVISE\nNephrology → Glomerular Disease →\nFSGS\n• ANSWER\nStudy Smarter Nephrology Cases Page 245\nFOAMY URINE AND PODOCYTES WIPED FLAT CASE 23\nPrimary versus secondary FSGS\nFoot process effacement patterns\nSteroid resistance and CNIs\nWhat is the diagnosis, and why?\nWHY\n1\nPrimary focal segmental glomerulosclerosis (FSGS), with\nthe collapsing variant ruled out\nFSGS is scarring in parts of some glomeruli, commonly\npresenting with nephrotic syndrome. The mechanism is\npodocyte injury — likely a circulating permeability factor\nin primary FSGS — which disrupts the filtration barrier,\ncausing protein loss and segmental sclerosis. The low\nserum albumin reduces oncotic pressure, causing edema,\nwhile the liver compensates with increased lipid\nproduction\nFocal and segmental — some glomeruli involved, others\nnormal → the name is the diagnosis; a sampling error can\nmiss it\nDIFFUSE foot process effacement → this is what makes\nit PRIMARY — secondary FSGS shows only segmental\neffacement\nAbrupt heavy proteinuria with hypoalbuminemia, IF\nnegative → the primary pattern, with no immune\ncomplexes\nDifferentiate and outline the key diagnostic features that\nsupport the diagnosis in this case.\n2\nFSGS is primary, from a presumed circulating factor, or\nsecondary to obesity, hypertension, infection or toxins\nPrimary FSGS presents with sudden heavy proteinuria,\nhypoalbuminemia and edema, diffuse foot process\neffacement on EM, and often responds to\nimmunosuppression. Secondary FSGS involves sub-nephrotic proteinuria, normal albumin, segmental\neffacement, with limited response\nHere the abrupt onset, marked proteinuria,\nhypoalbuminemia, absence of secondary causes and\ndiffuse podocyte effacement confirm primary FSGS\nDescribe the treatment goals and challenges in managing the\ncase, and explain why close monitoring is essential.\n3\nTreatment aims to reduce proteinuria, preserve kidney\nfunction and prevent complications. High-dose\ncorticosteroids are first line, with about 50–60%\nresponding; adjuncts are ACE inhibitors or ARBs, statins,\ndiuretics and dietary modification\nManagement is complicated by steroid resistance; steroid-sparing calcineurin inhibitors may be considered", "questions": ["What is the diagnosis, and why?", "Differentiate and outline the key diagnostic features that support the diagnosis in this case.", "Describe the treatment goals and challenges in managing the case, and explain why close monitoring is essential."], "topic": "n2", "sys": "NEPH"}, {"id": "c13", "kw": "Asymptomatic proteinuria found on screening + protein/creatinine 5.7 with NO cells + normal creatinine + thickened GBM with SUBEPITHELIAL deposits", "dx": "Membranous nephropathy", "case": 238, "sheet": "Nephrology · DEPBOOK CASE 244\n• CASE\nDuring a routine pre-employment\ncheck up, an asymptomatic 49-\nyear-old male was found to have\nproteinuria. BP 145/100, pulse 92,\nBMI 33, mild bilateral painless\npitting lower limb edema.\nKidney biopsy showed thickening\nof the glomerular basement\nmembrane, and electron\nmicroscopy showed subepithelial\ndeposits.\nBLOOD\nPRESSURE\n145/100\nBMI\n33\nEM\nSubepithelial\ndeposits\nLABORATORY\n+ Urine protein 4+,\nprotein/creatinine ratio 5.7\nmg/mg (no cells)\n↑ Cholesterol 270 mg/dL (< 200)\nNormal: Creatinine 1 mg/dL; no\nleucocytes or RBCs in urine\n• DIAGNOSTIC KEYWORDS\nAsymptomatic proteinuria\nfound on screening +\nprotein/creatinine 5.7 with NO\ncells + normal creatinine +\nthickened GBM with\nSUBEPITHELIAL deposits\nMEMBRANOUS\nNEPHROPATHY\n• REVISE\nNephrology → Glomerular Disease →\nMembranous\n• ANSWER\nStudy Smarter Nephrology Cases Page 238\nPROTEINURIA FOUND AT A PRE-EMPLOYMENT\nCHECK\nCASE 16\nAnti-PLA2R antibodies\nPrimary versus secondary MN\nRisk-stratified treatment\nWhat is the diagnosis, and why?\nWHY\n1\nMembranous nephropathy (MN)\nSubepithelial deposits with a thickened GBM → the location\nof the deposits is the diagnosis — subepithelial is\nmembranous, subendothelial is lupus or MPGN, mesangial is\nIgA\nHeavy proteinuria with a completely bland sediment → no\ncells, no casts — a non-proliferative lesion\nNormal creatinine and only mild hypertension →\nhypertension and raised creatinine are relatively uncommon\nat presentation in MN\nFound on screening while asymptomatic → about 30% of MN\npatients present this way\n2 What are the possible causes of this condition?\nPrimary in 75% of cases, or secondary in 25% — SLE, solid\norgan tumours, hematological malignancies, HBV or HCV\ninfection, penicillamine therapy\nAbout 30% are asymptomatic on presentation like this\npatient; the rest usually present with nephrotic syndrome, with\nhypertension and raised creatinine relatively uncommon\nAnti-phospholipase A2 receptor (anti-PLA2R) antibodies are\npositive in about 80% of primary MN\n3 What are the lines of treatment?\nTreatment depends on the risk of progression — proteinuria,\nkidney function, anti-PLA2R titres — and on whether MN is\nprimary or secondary. This patient is moderate risk:\nproteinuria 4–8 g/day with stable function; monitor and\nconsider immunosuppression if no improvement\nACE inhibitors for proteinuria and hypertension, plus a statin.\nAnticoagulation in severe nephrotic syndrome (albumin <\n2.5 g/dL) for thromboembolic risk\nRituximab, an anti-CD20 monoclonal antibody — first line\n(375 mg/m² weekly × 4, or 1 g on days 1 and 15); reduces anti-PLA2R, remission in 60–80%\nCyclical regimen — corticosteroids alternating with\ncyclophosphamide or chlorambucil for 6 months; effective but\nmore toxic. Cyclosporine or tacrolimus for those intolerant of\nrituximab or cyclophosphamide, with monitoring for\nnephrotoxicity", "questions": ["What is the diagnosis, and why?", "What are the possible causes of this condition?", "What are the lines of treatment?"], "topic": "n2", "sys": "NEPH"}, {"id": "c14", "kw": "Sore throat 10 days before + oliguria, edema, raised JVP + BP 150/95 + blood AND protein on dipstick + a LATENT period, not a concurrent infection", "dx": "Acute nephritic syndrome — post-streptococcal glomerulonephritis", "case": 227, "sheet": "Nephrology · DEPBOOK CASE 233\n• CASE\nA 13-year-old schoolgirl was noticed to\nhave periorbital swelling. Ten days\nearlier she had a sore throat and\nreceived a one week course of\npenicillin. On direct questioning she\nadmitted to passing only small\nquantities of urine during the previous\n48 hours.\nExamination: periorbital edema, raised\njugular venous pressure, BP 150/95.\nDipstick revealed blood and protein.\nBLOOD\nPRESSURE\n150/95\nJVP\nRaised\nLATENT\nPERIOD\n10 days\nLABORATORY\n+ Dipstick blood and protein\n↓ Oliguria for 48 hours\n• DIAGNOSTIC KEYWORDS\nSore throat 10 days before +\noliguria, edema, raised JVP + BP\n150/95 + blood AND protein on\ndipstick + a LATENT period, not a\nconcurrent infection\nACUTE NEPHRITIC SYNDROME —\nPOST-STREPTOCOCCAL\nGLOMERULONEPHRITIS\n• REVISE\nNephrology → Glomerular Disease →\nNephritic Syndrome\n• ANSWER\nStudy Smarter Nephrology Cases Page 227\nPERIORBITAL SWELLING TEN DAYS AFTER A\nSORE THROAT\nCASE 5\nNephritic versus nephrotic syndrome\nASO titre, anti-DNase B and C3\nSubepithelial humps on EM\nWhat is the diagnosis, and why?\nWHY\n1\nAn acute nephritic syndrome — a clinical diagnosis. A\nsore throat treated with penicillin suggests beta\nhaemolytic streptococcal infection, with oliguria, fluid\nretention, edema, raised blood pressure and evidence of\ncirculatory overload. It is post-streptococcal\nglomerulonephritis\nUrine analysis shows hematuria and proteinuria;\nmicroscopy reveals granular and red cell casts in the\ndeposit\nTen days between the sore throat and the nephritis →\nthe LATENT period is the discriminator — hematuria\nwithin hours or days of an upper respiratory infection is\nmore suggestive of IgA nephropathy\nRaised JVP with hypertension and edema → circulatory\noverload from salt and water retention\nBlood AND protein together with oliguria → a nephritic,\nnot nephrotic, picture\nAge 13, after a streptococcal throat → the classic setting\n2 How may this be confirmed?\nSerological confirmation (streptozyme panel) — a raised\nantistreptolysin O (ASO) titre and anti-DNase B titre\nThere is also a frequent finding of a low serum C3\nThroat or skin culture for group A streptococcus may be\npositive if still active\n3 What is the most likely pathological diagnosis?\nIn the acute phase, diffuse proliferative GN — all\nglomeruli show increased mesangial cells and matrix with\nendothelial cell proliferation and infiltration by\nneutrophils of both capillaries and mesangium.\nOccasionally epithelial crescents\nThe characteristic immunofluorescent pattern is IgG and\nC3 deposition in a granular fashion along the glomerular\nbasement membrane and in the mesangium\nThe hallmark of this lesion is subepithelial humps on\nelectron microscopy", "questions": ["What is the diagnosis, and why?", "How may this be confirmed?", "What is the most likely pathological diagnosis?"], "topic": "n2", "sys": "NEPH"}, {"id": "c15", "kw": "Creatinine 1.0 to 3.9 in two weeks + red cell casts + anti-MPO positive, anti-GBM negative + complement NORMAL + pulmonary infiltrates", "dx": "Rapidly progressive glomerulonephritis due to microscopic polyangiitis", "case": 244, "sheet": "Nephrology · DEPBOOK CASE 250\n• CASE\nA 45-year-old male with hypertension\nand no known autoimmune disease,\npresents with fatigue, hematuria and\nreduced urine output over the past\nweek, mild shortness of breath and\nmorning joint stiffness, no recent\ninfection. BP 160/100, bibasilar\ncrackles, no rash or oral ulcers. CXR:\ndiffuse interstitial infiltrates.\nBLOOD\nPRESSURE\n160/100\nCHEST\nBibasilar\ncrackles\nCREATININE\n1.0 → 3.9\nin 2\nweeks\nLABORATORY\n↑ Creatinine 3.9 mg/dL, BUN 68 mg/dL\n(baseline 1.0)\n+ 3+ blood, 2+ protein, RED CELL\nCASTS\n+ ANCA (anti-MPO) POSITIVE\n↓ Haemoglobin 9.4 g/dL\nNormal: ANA, anti-dsDNA, anti-GBM\nnegative; C3 and C4 normal; WBC 7.2,\nplatelets 220,000\n• DIAGNOSTIC KEYWORDS\nCreatinine 1.0 to 3.9 in two weeks\n+ red cell casts + anti-MPO\npositive, anti-GBM negative +\ncomplement NORMAL +\npulmonary infiltrates\nRAPIDLY PROGRESSIVE\nGLOMERULONEPHRITIS DUE TO\nMICROSCOPIC POLYANGIITIS\n• REVISE\nNephrology → Rapidly Progressive GN\n• ANSWER\nStudy Smarter Nephrology Cases Page 244\nCRESCENTS IN HALF THE GLOMERULI WITH NO\nDEPOSITS\nCASE 22\nThe three types of RPGN\nANCA serology and its meaning\nInduction and maintenance in AAV\nWhat is the diagnosis, and why?\nWHY\n1\nRapidly progressive glomerulonephritis (RPGN) due to\nANCA-associated vasculitis — microscopic polyangiitis\nRPGN is a rapid decline in kidney function over days to\nweeks, with crescent formation from severe capillary wall\ninjury. Fibrin and inflammatory cells leak into Bowman's\nspace, forming crescents that compress and destroy the\nglomerular tuft, causing irreversible failure if untreated. It\nis classified as Type I (anti-GBM), Type II (immune\ncomplex) and Type III (pauci-immune, ANCA-associated);\nthis is Type III\nNormal C3 and C4 → a pauci-immune process\nconsumes no complement — immune-complex nephritis\nwould lower it\nAnti-MPO positive, anti-GBM negative, with crackles,\ninfiltrates and red cell casts → Type III rather than Type I,\npresenting as a pulmonary-renal syndrome\nDiscuss the diagnostic approach and interpret the findings in\nthis case.\n2\nRecognise fatigue, hematuria, oliguria and systemic\nsymptoms alongside rapidly rising creatinine, red cell\ncasts and positive autoimmune markers. Here anti-MPO\nANCA, normal complement and absence of lupus\nmarkers point to pauci-immune vasculitis\nRenal biopsy confirming crescent formation without\nimmune complex deposition establishes Type III RPGN;\npulmonary infiltrates further suggest a pulmonary-renal\nsyndrome, giving the final diagnosis of microscopic\npolyangiitis presenting as RPGN\n3 Describe the treatment strategy.\nUrgent immunosuppression — high-dose corticosteroids\nwith either rituximab or cyclophosphamide to induce\nremission, rituximab often preferred for lower toxicity\nPlasmapheresis in severe cases — pulmonary\nhemorrhage or dialysis-dependent renal failure\nOnce in remission, maintenance with azathioprine or low-dose rituximab and gradual steroid taper\nSupportive care — dialysis when necessary, blood\npressure control, infection prevention and regular\nmonitoring", "questions": ["What is the diagnosis, and why?", "Discuss the diagnostic approach and interpret the findings in this case.", "Describe the treatment strategy."], "topic": "n2", "sys": "NEPH"}, {"id": "c16", "kw": "Microscopic hematuria with proteinuria 1.2 g + hypertension, creatinine 2 + isolated GGT 221 in an alcoholic + no deafness, no family history + normal kidneys on ultrasound", "dx": "IgA nephropathy associated with alcoholic liver disease", "case": 231, "sheet": "Nephrology · DEPBOOK CASE 237\n• CASE\nA 50-year-old man is referred for\nmicroscopic hematuria, first detected\nsix months ago and confirmed on two\noccasions. Never had macroscopic\nhematuria, no urinary symptoms,\notherwise in excellent health. No visual\nproblem or deafness. No family history\nof renal disease. He is alcoholic and\nsmokes 30 cigarettes per day.\nBP 145/100; chest, heart, abdomen and\nneurological examination unremarkable.\nKidneys normal by ultrasound.\nBLOOD\nPRESSURE\n145/100\nKIDNEYS\nON US\nNormal\nALCOHOL\nHeavy\nLABORATORY\n+ Urine RBC > 100, protein present\n↑ 24-hour urinary protein 1.2 g\n↑ Creatinine 2 mg/dL, GGT 221 U/L\nNormal: Hb 13.6 g/dL, WBC 4.2, platelets 213,\nalbumin 3.8 g/dL, AST 33, ALP 72 U/L\n• DIAGNOSTIC KEYWORDS\nMicroscopic hematuria with\nproteinuria 1.2 g + hypertension,\ncreatinine 2 + isolated GGT 221 in\nan alcoholic + no deafness, no\nfamily history + normal kidneys on\nultrasound\nIGA NEPHROPATHY ASSOCIATED\nWITH ALCOHOLIC LIVER\nDISEASE\n• REVISE\nNephrology → Glomerular Disease → IgA\nNephropathy\n• ANSWER\nStudy Smarter Nephrology Cases Page 231\nMICROSCOPIC HAEMATURIA IN A MAN WHO\nDRINKS\nCASE 9\nCauses of microscopic hematuria\nWhy creatinine rises late\nImmunosuppression thresholds in IgA\nWhat is the diagnosis, and why?\nWHY\n1\nSignificant proteinuria, hypertension and renal\nimpairment alongside the hematuria suggest a chronic\nglomerulonephritis; the high GGT fits liver disease from\nalcohol. This man has IgA nephropathy with alcoholic\nliver disease\nThe commonest causes of microscopic hematuria are IgA\nnephropathy, Alport syndrome and thin basement\nmembrane disease. IgA nephropathy has diffuse\nmesangial IgA deposits and often macroscopic hematuria\nconcurrent with a respiratory infection; it is associated\nwith Henoch-Schönlein purpura and alcoholic cirrhosis,\nand 20% reach end-stage renal failure in 20 years\nNo deafness, no visual problem, no family history →\nargues against Alport syndrome and thin basement\nmembrane disease\nIsolated GGT of 221, with proteinuria and hypertension\n→ the one abnormal liver enzyme points to alcohol — a\nrecognised association of IgA nephropathy — and the\nproteinuria makes this glomerular, not urological\n2 How would you interpret the creatinine value?\nThe raised creatinine appears modest in terms of the\nactual figure, but serum creatinine does not begin to rise\nuntil the GFR is reduced to 50% of normal, irrespective of\nage\nSo this value indicates a serious loss of renal function, to\napproximately 40% of normal\n3 What further investigations would you organize?\nRenal biopsy to reach a histological diagnosis. As he is\nover 50, urine cytology, PSA and cystoscopy to exclude\nconcurrent bladder and prostatic lesions; liver ultrasound,\nand liver biopsy should be considered\n4 What advice would you give to this patient?\nAbstain from alcohol. Blood pressure control, target\n120/80, with ACE inhibitors or ARBs to reduce proteinuria\nImmunosuppression for high-risk patients — persistent\nproteinuria > 1 g/day despite 3–6 months of optimized\nsupportive care, or rapidly declining function. Regular\nfollow up, as he risks progressing to dialysis and/or\ntransplantation", "questions": ["What is the diagnosis, and why?", "How would you interpret the creatinine value?", "What further investigations would you organize?", "What advice would you give to this patient?"], "topic": "n1", "sys": "NEPH"}, {"id": "c17", "kw": "Hypertension at 35 + painless hematuria WITHOUT proteinuria + bilateral flank fullness + father died of a stroke at 56 + steady decline over 15 years", "dx": "Autosomal dominant polycystic kidney disease", "case": 228, "sheet": "Nephrology · DEPBOOK CASE 234\n• CASE\nA 35-year-old man was noted to\nbe hypertensive with no other\nabnormality. His father died at 56\nfrom a cerebrovascular accident.\nTwo years later, with blood\npressure controlled, he had several\nepisodes of painless hematuria\nunrelated to trauma or infection,\nwith no proteinuria.\nExamination revealed fullness in\nboth flanks. Over the next 15 years\nhis renal function deteriorated at\na steady rate, and he has now\nentered terminal renal failure.\nFLANKS\nFull\nbilaterally\nFATHER\nDied 56,\nCVA\nCOURSE\n15 years\nto ESRD\n• DIAGNOSTIC KEYWORDS\nHypertension at 35 +\npainless hematuria WITHOUT\nproteinuria + bilateral flank\nfullness + father died of a\nstroke at 56 + steady decline\nover 15 years\nAUTOSOMAL DOMINANT\nPOLYCYSTIC KIDNEY\nDISEASE\n• REVISE\nNephrology → Cystic Kidney Disease\n• ANSWER\nStudy Smarter Nephrology Cases Page 228\nPAINLESS HAEMATURIA AND FULLNESS IN BOTH\nFLANKS\nCASE 6\nADPKD: PKD1 and PKD2\nBerry aneurysms and screening\nTolvaptan and cyst growth\nWhat is the diagnosis, and why?\nWHY\n1\nThe adult form of polycystic renal disease, inherited as an\nautosomal dominant condition. ADPKD is caused by\nmutations in PKD1 or PKD2, which encode polycystin 1 or 2\nFullness in BOTH flanks → bilaterally enlarged cystic kidneys\n— the sign that makes the diagnosis\nPainless hematuria with NO proteinuria → bleeding from\ncysts, not a glomerular lesion — glomerular disease leaks\nprotein\nHypertension early, and a father dead of stroke at 56 → cyst\nexpansion activating the renin-angiotensin system, on an\nautosomal dominant background\nWhat anatomical abnormality may have been responsible for the\ncerebrovascular accident?\n2\nA hemorrhagic CVA could have been associated with an\nincreased incidence of berry aneurysms of the Circle of Willis,\nwhich is reported in adult polycystic disease\n3 What investigation is needed to prove the condition?\nImaging — ultrasonography, CT or MRI — identifies variable\nsized cysts in both kidneys and is usually sufficient, with age-specific cyst counts in the criteria. Genetic testing for PKD1 or\nPKD2 mutations\n4 What are the implications of this disease for his children?\nThe offspring of an affected parent have a 50% chance of\nbeing affected\nThey should have their BP checked and later be screened by\nultrasound. In the late teens and early 20s ultrasound usually\nindicates involvement or not, and by age 30, 90% of ADPKD\npatients will have cysts detected\n5 What is the management of this disease at its earlier stages?\nLifestyle — low sodium diet, hydration, avoiding smoking and\nexcessive caffeine; blood pressure control, commonly with ACE\ninhibitors\nTolvaptan, a vasopressin V2 receptor antagonist, may slow\ncyst growth. Manage complications — kidney stones,\ninfection, pain", "questions": ["What is the diagnosis, and why?", "What anatomical abnormality may have been responsible for the cerebrovascular accident?", "What investigation is needed to prove the condition?", "What are the implications of this disease for his children?", "What is the management of this disease at its earlier stages?"], "topic": "n4", "sys": "NEPH"}, {"id": "c18", "kw": "Hypertensive, proteinuric, eGFR 34 with anemia + acute fever, vomiting and diarrhea + bicarbonate 11 + two problems at once", "dx": "Chronic kidney disease with an acute gastroenteritis", "case": 233, "sheet": "Nephrology · DEPBOOK CASE 239\n• CASE\nA 45-year-old male from Banha\npresenting with pyrexia, repeated\nvomiting and diarrhea.\nExamination: normal mental\nfunctions, toxic pale facies,\ntemperature 38.1°C, BP 155/95,\ndiffuse mild tenderness in all\nabdominal quadrants with\nincreased intestinal sounds.\nTEMPERATURE\n38.1°C\nBLOOD\nPRESSURE\n155/95\nEGFR\n34\nmL/min\nLABORATORY\n↑ Creatinine 2.4 mg/dL, urea 97\nmg/dL\n↓ Bicarbonate 11 mmol/L (22–26)\n+ Urine protein +++, 24-hour\nprotein 1.95 g\n↓ Hb 10.4 g/dL, hematocrit 31%\nNormal: Uric acid 8 mg/dL is mildly\nraised\n• DIAGNOSTIC KEYWORDS\nHypertensive, proteinuric,\neGFR 34 with anemia + acute\nfever, vomiting and diarrhea\n+ bicarbonate 11 + two\nproblems at once\nCHRONIC KIDNEY DISEASE\nWITH AN ACUTE\nGASTROENTERITIS\n• REVISE\nNephrology → Chronic Kidney\nDisease\n• ANSWER\nStudy Smarter Nephrology Cases Page 233\nGASTROENTERITIS ON TOP OF CHRONIC KIDNEY\nDISEASE\nCASE 11\nWhen RAS blockade is unsafe\nCKD-MBD targets\nBicarbonate replacement in CKD\nWhat is the diagnosis, and why?\nWHY\n1\nChronic kidney disease — hypertensive, proteinuric, with\nimpaired kidney function — associated with an attack of\ngastroenteritis, shown by the fever, vomiting, diarrhea and\ntender abdomen\nAnemia with proteinuria and hypertension → the anemia\nsays the renal disease is chronic, not the acute illness he\npresents with\nBicarbonate 11 → metabolic acidosis, from the CKD and\naggravated by the diarrhea\nFever, vomiting, diarrhea with tender abdomen and active\nsounds → a superimposed acute gastroenteritis\nNormal mental functions → no uremic encephalopathy yet\nWhat are the other investigations needed to evaluate kidneys in\nthis patient?\n2\nAbdominal ultrasound to show kidney size and echogenicity\nDoppler of the renal arteries to show evidence of renal artery\nstenosis\n3 Do you think this patient deserves other therapeutic interventions?\nYes — vomiting and diarrhea have induced dehydration on a\nbackground of CKD, with metabolic acidosis from the CKD\naggravated by the diarrhea. He needs fluid replacement and\noral sodium bicarbonate to keep serum bicarbonate at 22\nmEq/L, plus levofloxacin 250 mg daily for the gastroenteritis\n4 Which antihypertensive drug do you prefer in this patient?\nA RAS antagonist, as he has proteinuria and CKD; RAS\nblockers decrease urine protein excretion, and proteinuria is\nan important offender aggravating the rate of decline of GFR\nBut NOT while he is dehydrated — ACE inhibitors and ARBs\ncan cause a further fall in kidney function in dehydration\nWhat are the other medications that should be prescribed, and\nwhat are the targets for your treatment?\n5\nOral calcium carbonate as calcium supply and phosphate\nbinder, immediately before meals; active vitamin D; IV iron;\nsubcutaneous erythropoietin\nTargets — BP 130/80; bicarbonate 22–26 mmol/L; phosphorus\n< 4.5 mg/dL; PTH 2–9 × upper limit; ferritin 100–500 ng/mL;\ntransferrin saturation 20–30%; Hb 10–11.5 g/dL", "questions": ["What is the diagnosis, and why?", "What are the other investigations needed to evaluate kidneys in this patient?", "Do you think this patient deserves other therapeutic interventions?", "Which antihypertensive drug do you prefer in this patient?", "What are the other medications that should be prescribed, and what are the targets for your treatment?"], "topic": "n4", "sys": "NEPH"}, {"id": "c19", "kw": "2.7 g proteinuria, creatinine 1.9 + arteriolar narrowing + potassium 5.6 on lisinopril 40 mg + raised JVP + BP uncontrolled on four drugs", "dx": "Diabetic kidney disease with uncontrolled hypertension", "case": 234, "sheet": "Nephrology · DEPBOOK CASE 240\n• CASE\nA 60-year-old gentleman with type 2\ndiabetes for 6 years and hypertension\nfor 8 years came for increasing lower\nlimb edema, on atenolol,\nhydrochlorothiazide, lisinopril 40 mg,\ninsulin and metformin. BMI 32, JVP\nelevated, fundi show arteriolar\nnarrowing, no bruits. Echo: diastolic\ndysfunction.\nBLOOD\nPRESSURE\n175–\n180/95–\n105\nBMI\n32\nECHO\nDiastolic\ndysfunction\nLABORATORY\n↑ Potassium 5.6 mEq/L, creatinine 1.9\nmg/dL\n↑ HbA1c ≥ 8%, 24-hour urine protein\n2.7 g\n↑ Cholesterol 280, LDL 165,\ntriglycerides 255 (HDL 30)\nNormal: Urine otherwise unremarkable\n• DIAGNOSTIC KEYWORDS\n2.7 g proteinuria, creatinine 1.9 +\narteriolar narrowing + potassium\n5.6 on lisinopril 40 mg + raised\nJVP + BP uncontrolled on four\ndrugs\nDIABETIC KIDNEY DISEASE WITH\nUNCONTROLLED HYPERTENSION\n• REVISE\nNephrology → Diabetic Kidney Disease\n• ANSWER\nStudy Smarter Nephrology Cases Page 234\nSWELLING LEGS ON LISINOPRIL WITH\nPOTASSIUM 5.6\nCASE 12\nSGLT2 inhibitors in DKD\nWhen to start RAS blockade in\ndiabetes\nManagement of hyperkalemia\nWhat is the diagnosis, and why?\nWHY\n1\nDiabetic kidney disease — overt proteinuria with\nimpaired function in long-standing diabetes and\nhypertension, with hyperkalemia on RAS blockade\n2.7 g proteinuria with retinal arteriolar narrowing →\nmicrovascular disease in two beds — the kidney lesion is\ndiabetic\nPotassium 5.6 on lisinopril 40 mg → RAS blockade,\nfalling GFR and diabetic hyporeninemic\nhypoaldosteronism all raise it\nFor control of his diabetic state, what modification do you\nsuggest in therapy?\n2\nAdd an SGLT2 inhibitor (dapagliflozin) — good at eGFR >\n20, slows progression, reduces albuminuria, cardio-protective. Increase insulin or add a DPP-4 inhibitor.\nMetformin is contraindicated at eGFR < 30, and\nglitazones are not safe here\nWhen are we supposed to start RAS blockade in type 2\ndiabetic patients?\n3\nIndicated when a type 2 diabetic develops systemic\nhypertension, to reduce the development of micro-albuminuria, and in micro-albuminuric patients to slow\nprogression to overt proteinuria. Follow up of kidney\nfunction and potassium is mandatory\nWhat are the possible causes of increasing lower limb edema\nin this patient, and what investigations support the\ndiagnosis?\n4\nRenal — diabetic nephropathy, especially with proteinuria\n(ultrasound, fundus, renal biopsy). Cardiac — heart\nfailure, shown by the raised JVP (ultrasound for congestive\nhepatomegaly, echocardiography for function)\nWhat are other suggested lines of treatment, and how do you\nmanage the hyperkalemia?\n5\nTreat the hypercholesterolemia and hypertriglyceridemia,\nadjust the hypertension, control body weight.\nHyperkalemia — dietary restriction; furosemide if\noverloaded; potassium binders such as patiromer or\nsodium zirconium cyclosilicate\nIn severe hyperkalemia (K > 6.5 or ECG changes) —\ncalcium gluconate 10%, then insulin and glucose, beta-2\nagonist, bicarbonate; dialysis if refractory", "questions": ["What is the diagnosis, and why?", "For control of his diabetic state, what modification do you suggest in therapy?", "When are we supposed to start RAS blockade in type 2 diabetic patients?", "What are the possible causes of increasing lower limb edema in this patient, and what investigations support the diagnosis?", "What are other suggested lines of treatment, and how do you manage the hyperkalemia?"], "topic": "n4", "sys": "NEPH"}, {"id": "c20", "kw": "Small cell lung carcinoma + Na 121 with serum osm 260 + urine osm 510 and urine Na 45 + EUVOLEMIC — no edema, no dehydration, no diuretic", "dx": "SIADH secondary to small cell lung carcinoma", "case": 280, "sheet": "Acute Internal Medicine · DEPBOOK CASE 286\n• CASE\nA 72-year-old man presented with confusion,\nfatigue and nausea for 2 days. His daughter\nreported he has been more drowsy and more\nforgetful than usual. He had been recently\ndiagnosed with small cell lung carcinoma (SSLC), on\nchemotherapy with no recent medication changes.\nThere was no vomiting, diarrhea, or fluid loss, and\nno history of diuretic use.\nHe is alert but disoriented (GCS 14), neck veins not\ncongested, no lower limb edema and no signs of\ndehydration.\nTEMP\n36.9 °C\nBP\n120/75 mmHg\nHR\n88 bpm\nRR\n18 /min\nLABORATORY\n↓ Na 121 mEq/L (135–145)\n↓ Serum osmolality 260 mOsm/kg (275–295)\n↑ Urine Na 45 mmol/L, urine osmolality 510\nmOsm/kg\nNormal: Random glucose 130 mg/dL; renal, liver and thyroid\nfunctions normal\n• DIAGNOSTIC KEYWORDS\nSmall cell lung carcinoma + Na 121 with serum\nosm 260 + urine osm 510 and urine Na 45 +\nEUVOLEMIC — no edema, no dehydration, no\ndiuretic\nSIADH SECONDARY TO SMALL CELL LUNG\nCARCINOMA\nBook note: the book offers 0.9% saline as initial\ntreatment. When urine osmolality (510) exceeds that of\nthe infusate, isotonic saline can worsen hyponatremia;\nhypertonic saline is usual for symptomatic patients.\nReproduced as printed.\n• REVISE\nNephrology → Hyponatremia → SIADH\n• ANSWER\nStudy Smarter Acute Internal Medicine Cases Page 280\nSODIUM 121 IN SMALL CELL LUNG CANCER CASE 10\nDiagnostic criteria for SIADH\nOsmotic demyelination syndrome\nWhat is the diagnosis, and why?\nWHY\n1\nSIADH (syndrome of inappropriate ADH\nsecretion) secondary to small cell lung\ncarcinoma, which is known to produce\nectopic ADH\nDilute serum but concentrated urine →\nserum osm 260 with urine osm 510 — the\nkidney is holding water when it should be\ndumping it\nEuvolemic: no edema, no dehydration, no\ndiuretics → volume status is the whole\nexamination here — it separates SIADH\nfrom hypovolemic and hypervolemic\nhyponatremia\n2 What are the key criteria for this condition?\nHyponatremia with low serum osmolality (<\n275 mOsm/kg)\nInappropriately concentrated urine → high\nurine osmolality (> 100 mOsm/kg)\nElevated urine sodium (> 30 mmol/L)\nEuvolemia — no signs of dehydration or\nvolume overload\nNormal adrenal, thyroid, renal and cardiac\nfunction\nAbsence of diuretic use\nHow should the patient's condition be\nmanaged?\n3\nFluid restriction\nNormal saline 0.9% NaCl infusion can be an\neffective initial treatment — monitor volume\nstatus and monitor sodium closely to avoid\nrapid correction\nThe increase in serum sodium should not\nexceed 10 mmol/L in 24 hours or 18 mmol/L\nin 48 hours. A rapid rise can precipitate\nosmotic demyelination (central pontine\nmyelinolysis)\nVasopressin receptor antagonists in\nresistant cases — in neoplasm-associated\nSIADH like this patient, until definitive\ntreatment", "questions": ["What is the diagnosis, and why?", "What are the key criteria for this condition?", "How should the patient's condition be managed?"], "topic": "n5", "sys": "NEPH"}, {"id": "c21", "kw": "NORMAL anion gap metabolic acidosis + hypokalemia + multiple radio-opaque stones + short stature + urine pH 6.0 DESPITE the acidosis", "dx": "Type I (distal) renal tubular acidosis", "case": 236, "sheet": "Nephrology · DEPBOOK CASE 242\n• CASE\nA 25-year-old lady from Manial came\nwith bilateral loin pain and recurrent\nattacks of dysuria, frequency, urgency\nand strangury.\nExamination: apart from short stature,\ntemperature 38.4°C, bilateral renal\nangle tenderness. Plain film disclosed\nmultiple radio-opaque stones.\nSTATURE\nShort\nTEMPERATURE\n38.4°C\nPLAIN FILM\nMultiple\nradio-opaque\nstones\nLABORATORY\n↓ Blood pH 7.24, bicarbonate 13\nmmol/L (anion gap 6)\n↓ Potassium 3.1 mEq/L (3.5–5.0)\n↑ Creatinine 1.9 mg/dL, urea 56 mg/dL\n+ Urine pH 6.0, turbid, WBC 60–\n70/HPF (RBC 10–14)\nNormal: Sodium 139 mEq/L; serum calcium,\nphosphate and uric acid\n• DIAGNOSTIC KEYWORDS\nNORMAL anion gap metabolic\nacidosis + hypokalemia +\nmultiple radio-opaque stones +\nshort stature + urine pH 6.0\nDESPITE the acidosis\nTYPE I (DISTAL) RENAL\nTUBULAR ACIDOSIS\n• REVISE\nNephrology → Tubular Disorders\n• ANSWER\nStudy Smarter Nephrology Cases Page 236\nSTONES, SHORT STATURE AND AN ACID BLOOD CASE 14\nTypes of renal tubular acidosis\nUrine pH and titratable acidity\nCitrate therapy\nWhat is the diagnosis, and why?\nWHY\n1\nType I renal tubular acidosis — a normal anion gap\nmetabolic acidosis with hypokalemia, multiple renal\nstones and short stature, with renal impairment also\npresent; all of these support the diagnosis\nType II RTA is less likely to cause nephrolithiasis, and\ntype IV and type V RTA are associated with\nhyperkalemia, not hypokalemia\nUrine pH 6.0 while the blood pH is 7.24 → the distal\ntubule cannot acidify the urine below 5.5 even in the\nface of systemic acidosis — this IS the lesion\nNormal anion gap of 6 → bicarbonate is being lost or acid\nretained, not an added acid\nHypokalemia, not hyperkalemia → distinguishing type I\nfrom type IV\nStones with short stature → chronic acidosis dissolving\nbone buffer — hypercalciuria and growth failure\n2 What are the investigations recommended for this patient?\nUrine culture, sensitivity and bacterial count; urine\noxalate, citrate, calcium and urate excretion rate\nAbdominal ultrasonography and non-contrast spiral CT.\nTo avoid contrast nephrotoxicity in a patient with a high\ncreatinine, IVP should be avoided — non-contrast spiral\nCT is an excellent alternative\nTest for over-saturation of urine with calcium, oxalate or\nurate and decreased urinary citrate. If present,\nhypercalcemia, hyperuricemia and primary\nhyperparathyroidism should be considered as causes of\nrecurrent or multiple nephrolithiasis\n3 What further tests are needed to confirm diagnosis?\nUrine pH and estimation of titratable urine acidity —\nthese two confirm the diagnosis\nIn type I RTA the urine pH is above 5.5 despite the\nmetabolic acidosis, with decreased titratable acidity\n4 What is the best therapeutic treatment of this condition?\nOral sodium citrate, which is better tolerated than sodium\nbicarbonate. Recommended dose 1–3 mmol/kg/day\nPotassium citrate should be given in case of hypokalemia\n— though in this patient potassium citrate might be\nrisky, as she has renal impairment", "questions": ["What is the diagnosis, and why?", "What are the investigations recommended for this patient?", "What further tests are needed to confirm diagnosis?", "What is the best therapeutic treatment of this condition?"], "topic": "n6", "sys": "NEPH"}], "bundle": "days/d5.json"}, "6": {"day": 6, "topics": "Vomiting & dysphagia · GI bleeding · Acute abdomen · Diarrhea & constipation · GERD, H. pylori & peptic ulcer", "essays": [{"id": "e1", "q": "Causes of upper GI bleeding", "years": "GIT bleeding topic · 10 or more times", "src": "GI P4", "recent": false, "topic": "g2", "sys": "GI", "answer": "", "text": "(GI P4)\nUP P ER G I B L E ED IN G\nCauses\nCommon causes Less common\nPresentation\nAssessment and Initial Approach\nFurther treatment depends on the bleeding source and response to endoscopic therapy.\nStudy Smarter GI · Past Papers Page 4\nGastroesophageal varices\nPeptic ulcer\nEsophageal or gastric tumours\nDrug-related: steroids, NSAIDs, aspirin,\nanticoagulants\nStress ulcer\nMallory–Weiss syndrome\nForeign body\nVasculitis\nBlood dyscrasias\nDieulafoy lesion\nTelangiectasia in Osler–Rendu–Weber\nsyndrome\nHematemesis: vomiting fresh blood or altered “coffee￾ground” blood\nMelena: black, altered blood passed per rectum\nMassive upper GI bleeding may cause fresh rectal\nbleeding because of rapid transit\nAssess pulse, blood pressure and signs of shock; protect the airway in severe bleeding or coma. 1\n2 Establish large-bore IV access; consider a central line in severe cases. Give IV fluids and blood when needed.\n3 Ask about drug intake, epigastric pain or heartburn. Examine for cirrhosis and hepatocellular failure.\nCheck hemoglobin/hematocrit, urea and creatinine, liver functions, and blood glucose. 4\nPerform upper GI endoscopy after resuscitation, usually within 24 hours, for diagnosis and treatment. 5"}, {"id": "e2", "q": "Approach to melena", "years": "2025", "src": "GI P4", "recent": false, "topic": "g2", "sys": "GI", "answer": "", "text": "(GI P4)\nUP P ER G I B L E ED IN G\nCauses\nCommon causes Less common\nPresentation\nAssessment and Initial Approach\nFurther treatment depends on the bleeding source and response to endoscopic therapy.\nStudy Smarter GI · Past Papers Page 4\nGastroesophageal varices\nPeptic ulcer\nEsophageal or gastric tumours\nDrug-related: steroids, NSAIDs, aspirin,\nanticoagulants\nStress ulcer\nMallory–Weiss syndrome\nForeign body\nVasculitis\nBlood dyscrasias\nDieulafoy lesion\nTelangiectasia in Osler–Rendu–Weber\nsyndrome\nHematemesis: vomiting fresh blood or altered “coffee￾ground” blood\nMelena: black, altered blood passed per rectum\nMassive upper GI bleeding may cause fresh rectal\nbleeding because of rapid transit\nAssess pulse, blood pressure and signs of shock; protect the airway in severe bleeding or coma. 1\n2 Establish large-bore IV access; consider a central line in severe cases. Give IV fluids and blood when needed.\n3 Ask about drug intake, epigastric pain or heartburn. Examine for cirrhosis and hepatocellular failure.\nCheck hemoglobin/hematocrit, urea and creatinine, liver functions, and blood glucose. 4\nPerform upper GI endoscopy after resuscitation, usually within 24 hours, for diagnosis and treatment. 5"}, {"id": "e3", "q": "Causes of lower GI bleeding", "years": "GIT bleeding topic · 10 or more times", "src": "GI P5", "recent": false, "topic": "g2", "sys": "GI", "answer": "", "text": "(GI P5)\nLOWER G I B L E ED IN G\nCauses\nInflammatory\nInfectious\nMechanical\nNeoplastic\nVascular\nGeneral & miscellaneous\nApproach\nAssess the hemodynamic state and resuscitate when required.\nHemodynamically unstable\nMassive upper GI bleeding may\npresent with hematochezia.\nHemodynamically stable\nIf the source remains obscure\nStudy Smarter GI · Past Papers Page 5\nProctitis\nDiverticulitis\nUlcerative colitis\nCrohn’s disease\nInfectious colitis\nIntussusception\nPolyps\nCancer colon / rectum\nIschemic colitis\nAngiodysplasia\nHemorrhoids\nAnal fissures\nBlood dyscrasias\nSolitary rectal ulcer\nUpper endoscopy first\nThen colonoscopy\nAnoscopy\nThen sigmoidoscopy or full\ncolonoscopy\nBarium follow-through\nEnteroscopy · capsule endoscopy\nLaparotomy with intraoperative\nenteroscopy\nSurgical exploration as a last\nresort"}, {"id": "e4", "q": "Dysphagia – causes & approach", "years": "Dysphagia topic · 5–9 times", "src": "GI P2–3", "recent": false, "topic": "g1", "sys": "GI", "answer": "", "text": "(GI P2)\nD YS P HA G IA : CAUS ES\nA — Oropharyngeal\nNeuromuscular Compression / structural\nOther causes\nB — Esophageal\nStructural\nInfectious / inflammatory\nStrictures\nPropulsive / motility\nTumours\nImportant common causes: cancer · achalasia · eosinophilic esophagitis · post-corrosive stricture\nStudy Smarter GI · Past Papers Page 2\nPseudobulbar & true bulbar palsy\nMotor neuron disease\nGuillain–Barré syndrome\nMyasthenia gravis\nPolymyositis\nMyopathies / muscular\ndystrophies\nZenker’s diverticulum\nCricopharyngeal bar\nCervical spondylosis\nThyroid enlargement\nRetropharyngeal abscess\nIatrogenic: surgery, radiation · Infectious: pharyngitis\nWebs: Plummer–Vinson syndrome\nStrictures: peptic, corrosive, post-radiation\nTumours: carcinoma, sarcoma, lymphoma\nSchatzki ring\nCMV esophagitis\nCandida esophagitis\nEosinophilic esophagitis\nPeptic · corrosive · post￾radiation\nAchalasia\nDiffuse esophageal spasm\nScleroderma\nCarcinoma · sarcoma ·\nlymphoma\nSubepithelial, e.g. leiomyoma\n\n(GI P3)\nA S S ES S IN G D YS P HA G IA · D YS P EP S IA R ED FL A G S\nApproach to Dysphagia\nHistory\nAge Cancer and achalasia in middle or older age\nPost-corrosive dysphagia in younger patients\nType of food Solids only mechanical or structural cause\nSolids and liquids motility disorder\nDuration and course Short or transient inflammation\nProgressive cancer\nIntermittent functional cause\nAssociated symptoms Nasal regurgitation pharyngeal paralysis\nWeight loss cancer\nLongstanding heartburn peptic stricture\nExamination\nDiagnostic procedures\nDyspepsia Red Flags\nRed flags warrant upper endoscopy and further evaluation.\nStudy Smarter GI · Past Papers Page 3\nNeurological examination\nCheck the neck for lymph nodes and thyroid\nenlargement\nUpper GI endoscopy exclude mechanical\nobstruction\nBarium swallow\nEsophageal manometry assess motility disorders\nNew-onset dyspepsia after age 50 Weight loss Dysphagia Persistent or recurrent vomiting\nGI bleeding: hematemesis or melena Anemia Constant or severe pain Failure to respond to treatment"}, {"id": "e5", "q": "Complications of peptic ulcer", "years": "Peptic ulcer topic · 5–9 times", "src": "GI P13", "recent": false, "topic": "g5", "sys": "GI", "answer": "", "text": "(GI P13)\nP EP TIC ULCER D I S EA S E · COMP LICA TION S\nRed flags Alarm features that call for urgent endoscopy and exclusion of malignancy.\nWarning changes\nTreatment\nSurgical indications\nComplications of peptic ulcer\nStudy Smarter GI · Past Papers Page 13\nUnintentional weight loss Progressive dysphagia Overt GI bleeding\nIron-deficiency anemia Recurrent vomiting Family history of upper-GI malignancy\nChange from rhythmic to constant or radiating pain penetration or perforation\nMarked vomiting + weight loss gastric outlet obstruction or gastric malignancy\n1 General measures\nReduce stress · regular balanced meals\nStop smoking and alcohol\nStop ulcerogenic drugs, especially NSAIDs\n2 Acid suppression\nPPI (preferred): omeprazole, pantoprazole, lansoprazole,\nesomeprazole, rabeprazole\nDuration: DU ~4 weeks · GU ~8 weeks\nH2RAs are less effective than PPIs\n3 Mucosal protective agents\nSucralfate · bismuth · misoprostol · rebamipide\nMisoprostol can prevent NSAID-induced ulcers\n4 H. pylori eradication: regimen on Board 12\nComplications\nSuspicion of malignancy\nFailure of medical treatment after excluding persistent H. pylori and\ncontinued ulcerogenic drugs\nHemorrhage (see Upper GI bleeding, Board 4) Perforation Penetration\nGastric outlet obstruction Malignant change"}, {"id": "e6", "q": "Treatment of peptic ulcer, including H. pylori eradication", "years": "Peptic ulcer topic · 5–9 times", "src": "GI P12–13", "recent": false, "topic": "g5", "sys": "GI", "answer": "", "text": "(GI P12)\nH. P Y LOR I IN F ECTION\nDiagnosis\nA — Non-invasive\nSerology: ELISA Fecal antigen Urea breath test\nB — Endoscopic\nClinical sequelae Eradication\nEradication regimen: PPI + clarithromycin + metronidazole\nor amoxicillin.\nStudy Smarter GI · Past Papers Page 12\nSensitivity & specificity > 90%\nA positive result does not necessarily mean\nactive infection\nHigh sensitivity & specificity\nPositive active infection\n13C or\n14C urea\nPositive active infection\nGastric biopsy for urease testing · histology: antrum and body biopsies\nPeptic ulcer (especially duodenal) Chronic H. pylori gastritis\nGastric adenocarcinoma Gastric MALT lymphoma\n\n(GI P13)\nP EP TIC ULCER D I S EA S E · COMP LICA TION S\nRed flags Alarm features that call for urgent endoscopy and exclusion of malignancy.\nWarning changes\nTreatment\nSurgical indications\nComplications of peptic ulcer\nStudy Smarter GI · Past Papers Page 13\nUnintentional weight loss Progressive dysphagia Overt GI bleeding\nIron-deficiency anemia Recurrent vomiting Family history of upper-GI malignancy\nChange from rhythmic to constant or radiating pain penetration or perforation\nMarked vomiting + weight loss gastric outlet obstruction or gastric malignancy\n1 General measures\nReduce stress · regular balanced meals\nStop smoking and alcohol\nStop ulcerogenic drugs, especially NSAIDs\n2 Acid suppression\nPPI (preferred): omeprazole, pantoprazole, lansoprazole,\nesomeprazole, rabeprazole\nDuration: DU ~4 weeks · GU ~8 weeks\nH2RAs are less effective than PPIs\n3 Mucosal protective agents\nSucralfate · bismuth · misoprostol · rebamipide\nMisoprostol can prevent NSAID-induced ulcers\n4 H. pylori eradication: regimen on Board 12\nComplications\nSuspicion of malignancy\nFailure of medical treatment after excluding persistent H. pylori and\ncontinued ulcerogenic drugs\nHemorrhage (see Upper GI bleeding, Board 4) Perforation Penetration\nGastric outlet obstruction Malignant change"}, {"id": "e7", "q": "Pathogenesis of GERD", "years": "GERD topic · 5–9 times", "src": "GI P11", "recent": false, "topic": "g5", "sys": "GI", "answer": "", "text": "(GI P11)\nG ER D\nEtiology & pathophysiology\nGERD develops when one or more of the normal anti￾reflux mechanisms fail.\nOther factors: esophageal hypersensitivity · increased\nintra-abdominal pressure\nTreatment\nA — Active disease\nProton pump inhibitors: main therapy H2-receptor antagonists\nPotassium-competitive acid blockers Antacids\nProkinetics, baclofen and sucralfate are not effective enough for routine GERD control.\nB — Long-term therapy\nLifestyle modification\nAccording to symptom frequency Anti-reflux procedures\nStudy Smarter GI · Past Papers Page 11\n1 Incompetent gastroesophageal junction\nDecreased LES tone · increased transient LES\nrelaxations (TLESR)\nDecreased intra-abdominal part of LES\nIncompetent diaphragmatic crura ± sliding\nhiatus hernia\nImpaired esophageal clearance: ineffective\nperistalsis\n2\n3 Reduced neutralization of refluxed acid by saliva\nImpaired mucosal defense: defective diffusion\nbarrier\n4\n5 Delayed gastric emptying: promotes reflux\nOmeprazole · pantoprazole · lansoprazole\nEsomeprazole · rabeprazole · dexlansoprazole\nLimited role nowadays; may be\nadded for nocturnal symptoms\nFaster onset than PPIs, e.g. vonoprazan Transient symptomatic relief only\nWeight reduction · stop smoking · small frequent meals · proper chewing\nAvoid fatty meals · avoid carbonated drinks · avoid citrus if symptomatic · avoid late meals\nRaise head of bed · sleep on the left side · avoid excessive exercise\nInfrequent intermittent / on-demand therapy\nFrequent long-term therapy or an anti-reflux\nprocedure\nFundoplication\nEndoscopic: TIF, GERx, ARMS,\nStretta"}, {"id": "e8", "q": "Differential diagnosis of acute medical abdominal pain", "years": "2025 — first time", "src": "GI P6", "recent": true, "topic": "g3", "sys": "GI", "answer": "", "text": "(GI P6)\nAB DOMIN A L P A IN & ACUTE AB DOMEN\nMedical causes of acute abdomen\nReferred pain\nRenal\nMetabolic\nVascular\nHematological\nAcute epigastric pain: causes\nGastric / duodenal\nBiliary / inflammatory\nPancreatic Perforated peptic ulcer\nGastric / duodenal pain is typically epigastric; relationship to meals is important.\nAcute epigastric pain: investigations\nStudy Smarter GI · Past Papers Page 6\nPneumonia / pleurisy\nMyocardial infarction\nPelviureteric colic\nAcute pyelonephritis\nDiabetic ketoacidosis\nLead poisoning\nFamilial Mediterranean\nfever\nEmbolic\nAbdominal angina /\natherosclerosis\nVasculitis\nHenoch–Schönlein purpura\nSickle-cell crisis\nPolycythemia vera\nParoxysmal nocturnal\nhemoglobinuria\nPorphyria\nPeptic ulcer disease\nFunctional dyspepsia\nCholecystitis\nBiliary colic\nEpigastric or left\nhypochondrial\nSevere\nRadiating to the back\nor left shoulder\nSudden severe abdominal pain\nIleus\nBoard-like rigidity\nShock / septicemia\n1 Laboratory\nCBC, ESR · liver functions\nSpecial tests according to the suspected\ndisease\nLeukocytosis may suggest penetration or\nperforation\nRaised serum amylase with severe epigastric\npain may suggest penetration into the\npancreas\n2 Plain X-ray: chest and abdomen, erect and supine\nUseful in acute abdomen\nPerforation air under the diaphragm\nAbdominal ultrasound: liver, gallbladder, pancreas,\nother pathology\n3\nUpper GI endoscopy 4\nWhen a gastric or duodenal cause is suspected\nProcedure of choice for diagnosing peptic ulcer\ndisease\nCT abdomen: perforation · gastric outlet\nobstruction · other intra-abdominal pathology\n5"}], "cases": [{"id": "c1", "kw": "Elderly smoker and drinker + 6 weeks of progressive dysphagia to solids only + 6 kg weight loss + painless + normal neurological exam", "dx": "Mechanical (esophageal) dysphagia — exclude carcinoma first", "case": 77, "sheet": "Gastroenterology · DEPBOOK CASE 83\n• CASE\nA 76-year-old man presents with a 6\nweek history of progressive swallowing\ndifficulties, particularly of solids. He had\nlost 6 kg in weight. There has been no\npain associated with dysphagia. He is\nable to drink normally. He occasionally\nreports regurgitation of solids.\nIn the past he had myocardial infarction\n10 years ago, and takes aspirin and\nnitrates for occasional angina. He has\nregularly consumed alcohol for many\nyears and smokes 20 cigarettes per day.\nExamination of the neck reveals no\nabnormality, there is no\nlymphadenopathy, and nervous system,\ncardiovascular system and chest showed\nnormal findings.\nDURATION\n6 weeks,\nprogressive\nWEIGHT\n− 6 kg\nSOLIDS / LIQUIDS\nSolids only\nNECK & NODES\nNormal\n• DIAGNOSTIC KEYWORDS\nElderly smoker and drinker + 6\nweeks of progressive dysphagia to\nsolids only + 6 kg weight loss +\npainless + normal neurological exam\nMECHANICAL (ESOPHAGEAL)\nDYSPHAGIA — EXCLUDE\nCARCINOMA FIRST\n• REVISE\nGastroenterology → Esophageal Diseases\n(Dysphagia)\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 77\nPROGRESSIVE DYSPHAGIA TO SOLIDS IN A\nSMOKER OF 76\nCASE 9\nOropharyngeal versus esophageal\ndysphagia\nCancer esophagus: risk factors and\nstaging\nAchalasia and esophageal manometry\nWhat is the diagnosis, and why?\nWHY\n1\nMechanical esophageal obstruction — in a 76-year-old\nsmoker and drinker with 6 weeks of progressive solid\ndysphagia and 6 kg of weight loss, carcinoma of the\nesophagus must be excluded first\nDysphagia to solids only, drinks normally → a\nmechanical narrowing, not a motility disorder —\nachalasia obstructs solids and liquids together\nProgressive over only 6 weeks → a growing lesion, not\na fixed benign stricture\n6 kg weight loss and no pain → the classic painless\npresentation of esophageal cancer\nSmoking 20/day and long-standing alcohol → the two\nprincipal risk factors for squamous cell carcinoma\nNervous system examination normal → oropharyngeal\n(neurological) dysphagia is effectively excluded\nMention the 2 most common causes for dysphagia in this\npatient?\n1. NEUROLOGICAL (OROPHARYNGEAL)\n2. ESOPHAGEAL\n2\nThe commonest in the elderly — stroke, Parkinson's\ndisease, dementia (e.g. Alzheimer), amyotrophic lateral\nsclerosis and myasthenia gravis\nCancer esophagus\nEsophageal stricture\nAchalasia\nZenker's diverticulum\nMediastinal mass — lymphadenopathy, lung cancer\n3 How would you proceed in such case?\nAfter neurological assessment — free in this case — the\nfirst step is endoscopy to exclude malignancy and other\norganic causes of dysphagia\nChest CT and cervical MRI to exclude chest or neck\nmasses\nBarium study gives an idea about intraluminal causes\nsuch as strictures or achalasia\nEsophageal manometry to assess for achalasia of the\ncardia and to detect its type", "questions": ["What is the diagnosis, and why?", "Mention the 2 most common causes for dysphagia in this patient?", "How would you proceed in such case?"], "topic": "g1", "sys": "GI"}, {"id": "c2", "kw": "Obese smoker + 7 years of heartburn and regurgitation relieved by PPI + new dysphagia to solids + repeated food bolus impaction", "dx": "Peptic esophageal stricture complicating chronic GERD", "case": 70, "sheet": "Gastroenterology · DEPBOOK CASE 76\n• CASE\nA 56-year-old obese male, smoker,\ncomplains of repeated episodes of\nheartburn and regurgitation associated\nwith meals and sleep for more than 7\nyears. He was always prescribed proton\npump inhibitors with improvement.\nIn the last few months, he developed\ndysphagia and repeated bolus impaction\nin the esophagus. Bolus impactions were\nfrequently mobilized using an endoscope.\nREFLUX\nHISTORY\n> 7 years\nRESPONSE\nTO PPI\nGood, until\nnow\nNEW\nSYMPTOM\nDysphagia\n+ bolus\nimpaction\n• DIAGNOSTIC KEYWORDS\nObese smoker + 7 years of\nheartburn and regurgitation relieved\nby PPI + new dysphagia to solids +\nrepeated food bolus impaction\nPEPTIC ESOPHAGEAL STRICTURE\nCOMPLICATING CHRONIC GERD\n• REVISE\nGastroenterology → Esophageal Diseases\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 70\nSEVEN YEARS OF REFLUX, NOW DYSPHAGIA AND\nFOOD IMPACTION\nCASE 2\nGERD: mechanism, complications, P-CABs\nBarrett's esophagus and surveillance\nDysphagia — mechanical versus\nmotility\nEsophageal carcinoma — progressive\nand unrelenting, with weight loss\nEosinophilic esophagitis — younger,\natopic, rings and furrows, eosinophils on\nbiopsy\nAchalasia — dysphagia to solids and\nliquids from the outset\nWhat is the diagnosis, and why?\nWHY\n1\nEsophageal stricture due to chronic gastro-esophageal\nreflux is the most likely explanation\nDysphagia may also be due to esophageal carcinoma\ncomplicating Barrett's esophagus — the replacement of\nnormal squamous epithelium of the lower esophagus by\nmetaplastic columnar epithelium\nSeven years of refluxed gastric acid → chronic\ninflammation and fibrosis\nDysphagia that is new and to solids → a fixed\nnarrowing, not a motility problem\nRepeated bolus impaction needing endoscopic removal\n→ the classical behaviour of a peptic stricture\nReflux symptoms had always answered to PPI → the\nacid was controlled but the scarring it had already\ncaused was not\n2 How do you evaluate this condition?\nUpper endoscopy (EGD) and biopsy is the gold\nstandard — for reflux esophagitis and for GERD's other\ncomplications: mucosal integrity, stricture, Barrett's,\nand to rule out eosinophilic esophagitis\nBarium swallow — delineates the location, length and\ndegree of the stricture\nIf malignancy is suspected, further work up with CT or\nEUS\nWhat is the treatment required at early stage of the\ndisease?\nLIFESTYLE\nACID SUPPRESSION\n3\nReduce weight, stop smoking, small frequent meals,\nelevate the head of the bed\nH₂ receptor antagonists, proton pump inhibitors, or P-CABs\nIn Barrett's esophagus, endoscopic mucosal resection\nmay be needed in selected cases to prevent progression\nto esophageal adenocarcinoma\n4 What are the treatment options for this patient?\nEsophageal stricture is treated by high dose PPI,\nendoscopic dilation, or surgery in refractory cases", "questions": ["What is the diagnosis, and why?", "How do you evaluate this condition?", "What is the treatment required at early stage of the disease?", "What are the treatment options for this patient?"], "topic": "g5", "sys": "GI"}, {"id": "c3", "kw": "Melena for 2 days + epigastric discomfort + no NSAID, no alcohol, no liver disease + shock (90/60, HR 110) + Hb 8.2 with BUN 40 and a normal INR", "dx": "Upper GI bleeding from peptic ulcer disease", "case": 71, "sheet": "Gastroenterology · DEPBOOK CASE 77\n• CASE\nA 54-year-old male presents with a 2-\nday history of black tarry stools,\ndizziness, and mild epigastric discomfort.\nHe has hypertension (on amlodipine) with\nno history of NSAID or alcohol use.\nOn examination: BP 90/60 mmHg, HR 110\nbpm, pallor, melena.\nBLOOD\nPRESSURE\n90/60\nmmHg\nHEART RATE\n110 bpm\nSTOOL\nMelena\nLABORATORY\n↓ Hb 8.2 g/dL (13–17)\n↑ BUN 40 mg/dL (7–20)\nNormal: INR 1.0\n• DIAGNOSTIC KEYWORDS\nMelena for 2 days + epigastric\ndiscomfort + no NSAID, no alcohol,\nno liver disease + shock (90/60, HR\n110) + Hb 8.2 with BUN 40 and a\nnormal INR\nUPPER GI BLEEDING FROM PEPTIC\nULCER DISEASE\n• REVISE\nGastroenterology → Peptic Ulcer Disease\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 71\nMELENA WITH SHOCK AND A RAISED BLOOD\nUREA\nCASE 3\nUpper GI bleeding: resuscitation and\nendoscopy timing\nH. pylori testing and eradication\nGlasgow-Blatchford and Rockall scores\nEsophageal varices — stigmata of\nchronic liver disease, abnormal INR\nMallory-Weiss tear — retching or\nvomiting precedes the blood\nGastric malignancy — weight loss,\nanorexia, longer history\nWhat is the diagnosis, and why?\nWHY\n1\nPeptic ulcer disease — likely from Helicobacter pylori\nor stress-related mucosal injury\nMelena — black, tarry stool → upper GI bleeding,\nproximal to the ligament of Treitz\nEpigastric pain with no NSAID or alcohol use → points\nto an ulcer that is H. pylori driven rather than drug\ninduced\nBUN 40 mg/dL → digested blood in the gut is absorbed\nas urea — a raised urea supports an upper GI source\nNormal INR and no stigmata of chronic liver disease →\nvarices are unlikely\nNo preceding vomiting or retching → Mallory-Weiss\ntear is unlikely\nWhat is the next best step in management?\nRESUSCITATE FIRST\nTHEN LOOK\n2\nIV crystalloids and packed RBC transfusion — a\nrestrictive threshold, transfusing at Hb < 7 g/dL (7–8\ng/dL if there is cardiovascular disease)\nUrgent upper endoscopy within 24 hours to identify the\nsource (ulcer, varices) and apply therapy — clips,\ncoagulation\nH. pylori testing — rapid urease test on the biopsy taken\nat endoscopy, urea breath test, or stool antigen\nSurgery or interventional radiology if endoscopy cannot\ncontrol the bleeding, or the source lies beyond\nendoscopic reach\n3 What scoring system predicts outcomes?\nThe Glasgow-Blatchford Score (GBS)\nPurpose — predicts the need for hospital intervention\n(transfusion, endoscopy, surgery)\nBuilt from vital signs and laboratory values (pulse,\nsystolic BP, Hb, BUN) plus the presence of melena,\nsyncope or comorbidity", "questions": ["What is the diagnosis, and why?", "What is the next best step in management?", "What scoring system predicts outcomes?"], "topic": "g2", "sys": "GI"}, {"id": "c4", "kw": "Diclofenac 50 mg bid for 10 days + vague epigastric pain for 2 days + hematemesis + tachycardia 120 with BP 100/60 + Hb 10.2", "dx": "NSAID-induced gastritis and ulcer with acute GIT bleeding", "case": 72, "sheet": "Gastroenterology · DEPBOOK CASE 78\n• CASE\nA 52-year-old male is admitted to ER\nbecause of vomiting a small cup of\nblood. He had tennis elbow for which he\nwas receiving NSAID (diclofenac) 50 mg\nbid for 10 days. He had been relatively\nstable until about 2 days prior to\nadmission when he noted some\noccasional vague abdominal pain.\nOn examination: Temp 36.8°C, pulse 120\nbpm and regular, RR 16/min, BP 100/60.\nTEMPERATURE\n36.8°C\nPULSE\n120 bpm\nRESP. RATE\n16/min\nBLOOD PRESSURE\n100/60\nLABORATORY\n↓ Hb 10.2 g/dL (13–17)\n↓ HCT 36.4% (40–52)\nNormal: Platelets, WBC\n• DIAGNOSTIC KEYWORDS\nDiclofenac 50 mg bid for 10 days +\nvague epigastric pain for 2 days +\nhematemesis + tachycardia 120\nwith BP 100/60 + Hb 10.2\nNSAID-INDUCED GASTRITIS AND\nULCER WITH ACUTE GIT BLEEDING\n• REVISE\nGastroenterology → Gastritis\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Gastroenterology Cases Page 72\nHEMATEMESIS AFTER TEN DAYS OF DICLOFENAC CASE 4\nGastrointestinal complications of\nNSAIDs\nPeptic ulcer disease and its\ncomplications\nAssessment and resuscitation in acute\nGI bleeding\nWhat is the diagnosis, and why?\nWHY\n1\nDrug induced gastritis, possibly ulcer, complicated by\nacute GIT bleeding\nTen days of a non-selective NSAID → prostaglandin\nsynthesis is blocked → mucus and bicarbonate fall and\nthe gastric mucosal barrier breaks down\nVague abdominal pain for 2 days, then hematemesis\n→ mucosal injury first, erosion into a vessel second\nVomiting frank blood → an upper GI source\nPulse 120 with BP 100/60 → tachycardia precedes\nhypotension — this is acute severe blood loss\nHb 10.2 with normal platelets and WBC → blood loss,\nnot a haematological cause of bleeding\nWhat information would you use to assess the degree of\nthis patient's blood loss?\n2\nVital signs — pulse and blood pressure. Tachycardia\n(120 bpm) with a borderline low BP (100/60) indicates\nacute severe bleeding\nThe drop in hemoglobin indicates the degree of blood\nloss\nWhat is the most important investigation you would\nrecommend for this patient?\n3\nUpper endoscopy is the important investigation to\nconfirm the diagnosis\n4 What are the urgent lines of treatment you recommend?\nIV proton pump inhibitor to decrease the acidity\nClose follow up of the amount of bleeding — melena,\nvital signs, BUN and Hb level\nPlasma expanders and blood transfusion if marked\nblood loss leads to hypovolemic shock\nEndoscopic intervention — adrenaline injection or clips\n— may be needed in severe cases\nEsophageal varices — no liver disease here; would need\nterlipressin\nMallory-Weiss tear — repeated retching before the blood\nappears\nGastric cancer — weight loss and anorexia over months", "questions": ["What is the diagnosis, and why?", "What information would you use to assess the degree of this patient's blood loss?", "What is the most important investigation you would recommend for this patient?", "What are the urgent lines of treatment you recommend?"], "topic": "g2", "sys": "GI"}, {"id": "c5", "kw": "Melena then hematemesis + one week after primary PCI for an AMI + vague epigastric pain + BP 90/60 with pulse 95 + no re-infarction on ECG or biomarkers", "dx": "Acute upper GI bleeding after PCI", "case": 271, "sheet": "Acute Internal Medicine · DEPBOOK CASE 277\n• CASE\nA 66 years old man was\nhospitalized for one week by an\nacute myocardial infarction (AMI),\nfor which he was immediately\nreferred to the cardiac\ncatheterization for primary\nPercutaneous Coronary\nIntervention. Later on, he\ndeveloped vague epigastric pain;\nwith no evidence of myocardial re-infarction by ECG or cardiac\nbiomarkers.\nSeveral hours later, he felt dizzy\nand passed a large amount of\nblack stools. Shortly thereafter, he\nvomited blood. He was transferred\nto the ICU for further management.\nBP\n90/60\nmmHg\nPULSE\n95 /min\nAGE\n66 years\n• DIAGNOSTIC KEYWORDS\nMelena then hematemesis +\none week after primary PCI\nfor an AMI + vague epigastric\npain + BP 90/60 with pulse\n95 + no re-infarction on ECG\nor biomarkers\nACUTE UPPER GI BLEEDING\nAFTER PCI\n• REVISE\nGIT → Peptic Ulcer Disease →\nHematemesis\n• ANSWER\nStudy Smarter Acute Internal Medicine Cases Page 271\nBLACK STOOLS A WEEK AFTER A PRIMARY PCI CASE 1\nABCD priorities in GI bleeding\nEndoscopic stigmata of recent\nhemorrhage\nAntiplatelet therapy before and\nafter PCI\nWhat is the diagnosis, and why?\nWHY\n1\nAcute upper gastrointestinal hemorrhage — most likely a\nstress ulcer, gastritis or a pre-existing peptic ulcer bleeding\nunder antiplatelet therapy given for the recent AMI and PCI\nMelena followed by hematemesis → a bleed above the\nligament of Treitz, brisk enough to be vomited\nEpigastric pain with no ECG or biomarker change → the pain\nis gastric, not a second infarct — the negative cardiac\nworkup is the clue, not a reassurance\nBP 90/60 with pulse 95 → shock on admission, itself one of\nthe adverse-outcome predictors\n2 What are your management priorities?\nABCD. Secure the Airway and ensure Breathing if the patient\nis unconscious\nMaintain adequate Circulating blood volume and achieve\nDefinitive hemorrhage control\nThis includes potential transfusion of crystalloids, packed red\ncells, platelets and fresh-frozen plasma to correct any\ncoagulation defects\nOnce hemodynamically stable, prepare him for upper GI\nendoscopy to diagnose and definitively manage the source of\nbleeding\n3 What are the risk factors for this patient's condition?\nRecent myocardial infarction, which could precipitate stress\nulcers or gastritis\nAntiplatelet therapy given before PCI (loading) and after PCI\n(usually dual antiplatelet therapy), aggravating the risk of\nbleeding from stress ulcers, gastritis or a previous peptic ulcer\nWhat are the predictors of adverse outcome for his current\ncondition?\n4\nClinical — fulfilled in this patient: upper GI hemorrhage\npresenting with shock on admission, comorbid illness [AMI],\nand age > 65 years\nClinical — not stated here: prior bleeding requiring transfusion,\nadmission Hb < 8 g/dL, transfusion requirement > 5 units of\nPRBCs, and nasogastric aspirate not clearing with lavage\nEndoscopic: visible vessel in the ulcer base (50% chance of\nrebleeding), active bleeding from the base, adherent clot, ulcer\ndiameter > 2 cm, and site — worse on the posterior lesser\ncurvature of the stomach or posterior duodenal bulb", "questions": ["What is the diagnosis, and why?", "What are your management priorities?", "What are the risk factors for this patient's condition?", "What are the predictors of adverse outcome for his current condition?"], "topic": "g2", "sys": "GI"}, {"id": "c6", "kw": "Child C cirrhosis + bleeding already stopped + cold mottled skin + MAP 50 after 1 L saline + passive leg raise lifts the MAP", "dx": "Fluid-responsive circulatory failure after controlled variceal bleeding", "case": 69, "sheet": "Gastroenterology · DEPBOOK CASE 75\n• CASE\nA 60-year-old male with CHILD C liver\ncirrhosis is admitted to the ICU following a\nvariceal bleeding. He feels cold\nextremities and has mottled skin. He is\nhypotensive and tachycardic. Exam\nrevealed ascites and bilateral lower limb\nedema. Lactate level is 14 mmol/L.\nOne liter of IV saline was given.\nTerlipressin was initiated. Although the\nbleeding was stopped after variceal\nband ligation; he is still hypotensive\n80/35 mmHg (MAP 50 mmHg). Lactate\nlevel dropped only to 10 mmol/L. When\napplying a passive leg raise, his BP rose\nto 90/40 (MAP 59 mmHg).\nBLOOD\nPRESSURE\n80/35\n(MAP 50)\nAFTER LEG\nRAISE\n90/40\n(MAP 59)\nPERIPHERY\nCold,\nmottled\nLABORATORY\n↑ Lactate 10 mmol/L (from 14 — normal < 2)\n• DIAGNOSTIC KEYWORDS\nCHILD C cirrhosis + bleeding already\nstopped + cold mottled skin + MAP\n50 after 1 L saline + passive leg\nraise lifts the MAP\nFLUID-RESPONSIVE CIRCULATORY\nFAILURE AFTER CONTROLLED\nVARICEAL BLEEDING\n• REVISE\nHepatobiliary System & Pancreas → Portal\nHypertension\n• ANSWER\nStudy Smarter Gastroenterology Cases Page 69\nSTILL HYPOTENSIVE AFTER THE VARICES WERE\nBANDED\nCASE 1\nVariceal bleeding: terlipressin, banding,\nantibiotics\nLiver cirrhosis and CHILD-Pugh class\nAscites — why the circulation is\nunderfilled\nWhat is the diagnosis, and why?\nWHY\n1\nPersistent hypovolemic shock that is still fluid\nresponsive — the bleeding has been stopped, the\ncirculation has not been restored\nCold extremities, mottled skin → vasoconstricted low-output state, not the warm periphery of sepsis\nMAP 50 after 1 L saline and successful banding → the\ndeficit was never replaced — ongoing bleeding is not the\nexplanation\nPassive leg raise lifts MAP from 50 to 59 → a reversible\nauto-transfusion of leg venous blood raises stroke\nvolume → he sits on the steep part of the Frank-Starling\ncurve\nAscites and leg edema alongside all this → in cirrhosis\ntotal body water is high while the effective circulating\nvolume is low\nWould you prescribe an additional fluid bolus to this\npatient?\n2\nYes. Hypotension with a positive passive leg raising test\nand cold mottled skin means unresolved functional\nhypovolemia — this patient is fluid responsive\nCirrhotics can be intravascularly depleted while\nshowing edema and ascites\nBut re-assess after every bolus — too much fluid\naggravates ascites, edema and cardiac dysfunction,\nraises portal pressure and can restart the bleeding\n3 What type of fluid is preferred in this situation?\nBalanced crystalloids and albumin\nAvoid hypotonic and hypertonic fluids, and avoid\nexcessive volume that expands the circulation\nAvoid starches — they worsen the coagulopathy\n4 What is your comment on the lactate level in this patient?\nLactate is cleared by the liver. In liver cell failure it is not\nthe best marker of the haemodynamic state — a high\nvalue may reflect failed clearance rather than\nhypoperfusion\nIts dynamic change is what counts in a critical hepatic\npatient with bleeding varices\nThe drop from 14 to 10 mmol/L is a beneficial response\nto fluid and to terlipressin", "questions": ["What is the diagnosis, and why?", "Would you prescribe an additional fluid bolus to this patient?", "What type of fluid is preferred in this situation?", "What is your comment on the lactate level in this patient?"], "topic": "g2", "sys": "GI"}, {"id": "c7", "kw": "Age 82 + four admissions in one year with anemia + occult blood positive every time + Hb 7 with serum iron 5 + no organomegaly, no lymphadenopathy", "dx": "Chronic occult GI blood loss — GIT malignancy until excluded", "case": 86, "sheet": "Gastroenterology · DEPBOOK CASE 92\n• CASE\nAn 82-year-old male had been admitted\n4 times in the previous year with malaise,\nlethargy and extreme pallor. On each\noccasion he was found to be anemic but\napart from the invariable finding of\npositive occult blood in stools; no\ndefinite diagnosis was made.\nOn examination: He was pale, with no\norganomegaly or lymphadenopathy.\nLABORATORY\n↓ Hb 7 g/dL (13–17)\n↓ Serum iron 5 µg/dL (60–170)\n+ Stool occult blood positive (on every\nadmission)\n• DIAGNOSTIC KEYWORDS\nAge 82 + four admissions in one\nyear with anemia + occult blood\npositive every time + Hb 7 with\nserum iron 5 + no organomegaly, no\nlymphadenopathy\nCHRONIC OCCULT GI BLOOD LOSS\n— GIT MALIGNANCY UNTIL\nEXCLUDED\n• REVISE\nGastroenterology → Gastrointestinal\nNeoplasms\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Gastroenterology Cases Page 86\nFOUR ADMISSIONS IN A YEAR FOR ANEMIA WITH\nOCCULT BLOOD\nCASE 18\nGIT bleeding: overt, occult and obscure\nIron deficiency anemia as a\npresentation of cancer\nAngiodysplasia and small bowel\nsources\nWhat is the diagnosis, and why?\nWHY\n1\nGIT malignancy (gastric or colonic) is the first\npossibility — an elderly patient with evidence of GI\nbleeding shown by low serum iron and hemoglobin\nwith positive occult blood\nOther causes of GI bleeding must still be considered —\nesophageal varices, gastritis or peptic ulcer, polyps,\nangiodysplasia. All of these are aggravated by oral\nanticoagulant or antiplatelet therapy taken for\ncomorbid conditions\nOccult blood positive on every admission → the\nbleeding is continuous and slow, not a single acute\nevent\nSerum iron 5 with Hb 7 → iron stores exhausted by\nchronic loss — the marrow cannot keep up\nAge 82 → malignancy has the highest prior probability\nin this age group\nFour admissions and no diagnosis made → the source\nwas never looked for properly — a transfusion is not a\nwork up\nNo organomegaly or lymphadenopathy → no evidence\nyet of disseminated disease, and haematological causes\nare less likely\nWhat further investigations would you like to do to reach\nthe diagnosis?\n2\nUpper endoscopy and colonoscopy. If a suspicious\nmalignant lesion is seen, a biopsy should be taken\nAbdominal ultrasonography — searching for\nmalignancy or liver deposits\nTumor markers — CEA\nAngiodysplasia — commonest obscure source in the elderly;\nneeds capsule or angiography\nPeptic ulcer / gastritis — epigastric pain, NSAID use, seen at EGD\nColonic polyps — found and removed at colonoscopy", "questions": ["What is the diagnosis, and why?", "What further investigations would you like to do to reach the diagnosis?"], "topic": "g2", "sys": "GI"}, {"id": "c8", "kw": "Three days of worsening left lower quadrant pain + fever 38°C + rebound tenderness localised to the LLQ + no free air, occult blood negative", "dx": "Acute sigmoid diverticulitis, complicated by localized peritonitis", "case": 85, "sheet": "Gastroenterology · DEPBOOK CASE 91\n• CASE\nA 61-year-old man came to the\nemergency room complaining of 3 days\nhistory of worsening left lower quadrant\nabdominal pain with nausea but no\nvomiting. He had mild diarrhea at the\nbeginning of his illness, but bowel\nevacuation became difficult thereafter.\nExamination: BP 110/70, no pallor or\njaundice; abdomen mildly distended with\nhypoactive bowel sounds and marked left\nlower quadrant tenderness with rebound\ntenderness. Plain film showed no\npneumoperitoneum and a nonspecific\nbowel gas pattern.\nTEMPERATURE\n38°C\nPULSE\n98 bpm\nOCCULT\nBLOOD\nNegative\nLABORATORY\n↑ WBC 11,800/mm³ (74% polymorphs, 22%\nlymphocytes)\nNormal: Hemoglobin, hematocrit\n• DIAGNOSTI
