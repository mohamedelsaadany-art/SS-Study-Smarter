<title>IM Camp Exams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Kalam:wght@400;700&amp;display=swap">
<style>
/* Layout: one column (max 780px). Camp home (30 days) · My progress · a day's exam with a sticky bar
   (part, progress dots, countdown).
   Look: the user's HY board style — blue question pills, pink pills, mauve table heads. */
:root{
  --bg:#FFFFFF; --surface:#FBF7FA; --ink:#22252A; --muted:#5E5867;
  --blue-ink:#12406F; --blue-fill:#C3DDF4; --blue-edge:#93BEE3;
  --mauve-ink:#8B2A63; --mauve-fill:#E6AECF; --mauve-line:#C2478E; --pill:#F7CCE4;
  --rule:#D9A9C6; --pink:#FBD7E5;
  --good:#1F6B43; --good-fill:#D3EEDD; --warn:#875A00; --warn-fill:#F8E7BD; --bad:#A3213A; --bad-fill:#F7D3DA;
  --hand:"Patrick Hand","Kalam","Comic Neue","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17161B; --surface:#201E25; --ink:#ECE8EF; --muted:#B0A8B8;
  --blue-ink:#CDE2F6; --blue-fill:#1F3651; --blue-edge:#355B82;
  --mauve-ink:#F2B6D8; --mauve-fill:#4D2643; --mauve-line:#E37DB6; --pill:#43233B;
  --rule:#5B3B54; --pink:#3A2334;
  --good:#8CDAAA; --good-fill:#173A27; --warn:#F0C873; --warn-fill:#3D2F12; --bad:#F4A0B1; --bad-fill:#45202A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161B; --surface:#201E25; --ink:#ECE8EF; --muted:#B0A8B8;
  --blue-ink:#CDE2F6; --blue-fill:#1F3651; --blue-edge:#355B82;
  --mauve-ink:#F2B6D8; --mauve-fill:#4D2643; --mauve-line:#E37DB6; --pill:#43233B;
  --rule:#5B3B54; --pink:#3A2334;
  --good:#8CDAAA; --good-fill:#173A27; --warn:#F0C873; --warn-fill:#3D2F12; --bad:#F4A0B1; --bad-fill:#45202A;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--hand);font-size:18px;line-height:1.35}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mauve-line);outline-offset:2px}

.titlepill{display:inline-block;font-weight:700;font-size:2rem;line-height:1;letter-spacing:.1em;color:var(--blue-ink);
  background:var(--blue-fill);border:2px solid var(--blue-edge);border-radius:13px;padding:.3em .9em .38em}
.pill{display:inline-block;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mauve-ink);background:var(--pill);border-radius:8px;padding:.15em .6em .25em}
.pill.num{background:var(--mauve-line);color:var(--bg)}
.chip{display:inline-block;font-size:.8rem;letter-spacing:.04em;border-radius:999px;padding:.12em .65em .2em;
  border:1.5px solid var(--mauve-line);color:var(--mauve-ink)}
.muted{color:var(--muted)}

/* start + results */
.intro{display:grid;gap:14px;text-align:center;justify-items:center;margin-block:8px 22px}
.topics{margin:0;color:var(--mauve-ink)}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.card h2{margin:0;font-size:1.45rem;line-height:1.15;color:var(--blue-ink);text-wrap:balance}
.card p{margin:0}
.limit{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.limit input{width:4.2em;padding:.2em .4em;border:1.5px solid var(--rule);border-radius:8px;background:var(--bg);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{cursor:pointer;border-radius:10px;padding:.35em 1em .45em;border:2px solid var(--rule);background:var(--bg);font-weight:700}
.btn.primary{background:var(--blue-fill);border-color:var(--blue-edge);color:var(--blue-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mauve-ink);text-decoration:underline;padding-inline:.3em}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--blue-ink)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}

/* sticky exam bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1.5px solid var(--rule);
  margin-inline:-16px;padding:10px 16px 8px;display:grid;gap:8px}
.barrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.barrow .where{font-weight:700;color:var(--blue-ink)}
.barrow .count{color:var(--muted);font-variant-numeric:tabular-nums}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue-ink);background:var(--blue-fill);
  border-radius:9px;padding:.1em .6em .18em}
.timer.over{color:var(--bad);background:var(--bad-fill)}
.timer.stopped{color:var(--muted);background:var(--surface)}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--rule);background:var(--bg);cursor:pointer;padding:0;
  font-size:.7rem;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
.dot.good{background:var(--good-fill);border-color:var(--good);color:var(--good)}
.dot.part{background:var(--warn-fill);border-color:var(--warn);color:var(--warn)}
.dot.bad{background:var(--bad-fill);border-color:var(--bad);color:var(--bad)}
.dot.cur{outline:2.5px solid var(--blue-ink);outline-offset:1px}

/* question */
.q{display:grid;gap:12px;margin-top:18px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtext{margin:0;font-size:1.6rem;line-height:1.2;color:var(--blue-ink);background:var(--blue-fill);border-radius:12px;padding:.45em .7em .55em;text-wrap:balance}
.kw{margin:0;font-size:1.25rem;line-height:1.35;background:var(--surface);border:1.5px solid var(--rule);border-radius:12px;padding:.6em .8em}
.years{margin:0;color:var(--mauve-ink);font-size:.95rem}
label.lbl{font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
textarea,input.ans{width:100%;border:1.5px solid var(--rule);border-radius:12px;background:var(--bg);padding:.6em .75em;line-height:1.35}
textarea{min-height:11em;resize:vertical}
textarea[readonly],input.ans[readonly]{background:var(--surface)}
textarea.short{min-height:4.2em}

.board h3:first-child{margin-top:0}

.board ul{list-style:none;padding-left:1.1em}

.board ol li::marker{color:var(--mauve-line);font-weight:700}
.board li{margin:.12em 0}

& chronic hepatitis", "p7": "Jaundice", "p8": "Hepatomegaly & melena", "p9": "LFTs, ALP, biopsy & PBC", "n1": "Hematuria, proteinuria & urine output", "n2": "Glomerular & interstitial disease", "n3": "AKI & dialysis", "n4": "Chronic kidney disease", "n5": "Electrolytes", "n6": "Acid–base & ABG", "g1": "Vomiting & dysphagia", "g2": "GI bleeding", "g3": "Acute abdomen", "g4": "Diarrhea & constipation", "g5": "GERD, H. pylori & peptic ulcer", "g6": "Malabsorption & IBS", "g7": "Intestinal ischemia", "g8": "Inflammatory bowel disease", "g9": "Acute pancreatitis", "i1": "Fever & FUO", "i2": "Sepsis & septic shock", "i3": "Pneumonia", "i4": "Lung abscess", "i5": "Tuberculosis", "i6": "Leprosy", "i7": "Infection-associated arthritis", "i8": "Heat disorders", "x1": "Asthma", "x2": "COPD", "x3": "Pulmonary embolism & anticoagulants", "x4": "Pulmonary hypertension & cor pulmonale", "x5": "Interstitial lung disease", "x6": "Bronchiectasis", "x7": "Pleural effusion", "x8": "Pneumothorax", "x9": "Sarcoidosis", "x10": "Dyspnea, cough, hemoptysis & clubbing", "r1": "SLE & lupus nephritis", "r2": "Rheumatoid arthritis", "r3": "Gout", "r4": "Systemic sclerosis", "r5": "Osteoarthritis", "r6": "Osteoporosis & osteomalacia", "r7": "Polymyositis & dermatomyositis", "r8": "Joint & back pain", "r9": "Raynaud's phenomenon", "r10": "Ankylosing spondylitis", "r11": "Autoantibodies", "u1": "Stroke & TIA", "u2": "Paraplegia & the cord", "u3": "Ataxia & parkinsonism", "u4": "Cranial nerve palsies", "u5": "Neuropathy & myopathy", "u6": "Myasthenia gravis", "u7": "MS & Guillain–Barré", "u8": "Seizures & status epilepticus", "u9": "Vertigo, tremor, aphasia & dysarthria", "u10": "Headache", "u11": "Coma", "e1": "Diabetes & its drugs", "e2": "Diabetic ketoacidosis", "e3": "Coma in a diabetic", "e4": "Thyrotoxicosis", "e5": "Thyroid storm", "e6": "Hypothyroidism", "e7": "Myxedema coma", "e8": "Cushing & steroids", "e9": "Adrenal insufficiency", "e10": "Adrenal crisis", "e11": "Calcium & parathyroid", "e12": "Pituitary", "e13": "Hirsutism, gynecomastia & puberty"}, "systems": {"CARD": "Cardiology", "HEMA": "Hematology", "HEP": "Hepatology", "NEPH": "Nephrology", "GI": "Gastroenterology", "INF": "Infections", "CHEST": "Chest", "RHEUM": "Rheumatology", "NEURO": "Neurology", "ENDO": "Endocrinology"}}, "exams": {"1": {"day": 1, "topics": "Hypertension · Heart failure · Ischemic heart disease & ACS · Chest pain", "essays": [{"id": "e1", "q": "Investigations for secondary hypertension / hypertension in a young patient", "years": "Kasr 2009 · Kasr 2012 · 2012–2015 · Nov 2014 · Nov 2017 · May 2019 · July 2020", "src": "Cardio P1", "recent": false, "topic": "c1", "sys": "CARD", "answer": "<h3>What are the investigations of hypertension? <span class=\"src\">Cardio P1<\/span><\/h3><div class=\"pillrow\"><span class=\"pill num\">1. Baseline investigations<\/span><\/div><ul><li>Urinalysis: blood, protein, glucose<\/li><li>Blood: urea and serum creatinine, electrolytes, blood glucose, lipid profile<\/li><li>ECG: left ventricular hypertrophy, coronary artery disease<\/li><li>Fundoscopy: hypertensive retinopathy<\/li><li>24-hour ambulatory BP: white-coat or labile hypertension<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">2. If a secondary cause is suspected<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Suspicion<\/th><th>Test<\/th><\/tr><\/thead><tbody><tr><td>Phaeochromocytoma<\/td><td>Urinary catecholamines / free metanephrines<\/td><\/tr><tr><td>Cushing syndrome<\/td><td>Urinary cortisol + dexamethasone suppression test<\/td><\/tr><tr><td>Primary aldosteronism<\/td><td>Plasma renin : aldosterone ratio<\/td><\/tr><tr><td>Thyroid disease<\/td><td>TSH<\/td><\/tr><tr><td>Coarctation<\/td><td>CXR, echocardiography, CT/MR angiography<\/td><\/tr><tr><td>Renal artery stenosis<\/td><td>Renal duplex, CT/MR angiography, renal angiography<\/td><\/tr><tr><td>Renal parenchymal / polycystic disease<\/td><td>Abdominal ultrasound<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What are the investigations of hypertension? (Cardio P1)\n1. BASELINE INVESTIGATIONS\n- Urinalysis: blood, protein, glucose\n- Blood: urea and serum creatinine, electrolytes, blood glucose, lipid profile\n- ECG: left ventricular hypertrophy, coronary artery disease\n- Fundoscopy: hypertensive retinopathy\n- 24-hour ambulatory BP: white-coat or labile hypertension\n2. IF A SECONDARY CAUSE IS SUSPECTED\nSuspicion | Test\nPhaeochromocytoma | Urinary catecholamines / free metanephrines\nCushing syndrome | Urinary cortisol + dexamethasone suppression test\nPrimary aldosteronism | Plasma renin : aldosterone ratio\nThyroid disease | TSH\nCoarctation | CXR, echocardiography, CT/MR angiography\nRenal artery stenosis | Renal duplex, CT/MR angiography, renal angiography\nRenal parenchymal / polycystic disease | Abdominal ultrasound"}, {"id": "e2", "q": "Causes of secondary hypertension / hypertension in young", "years": "Kasr 2008 · Oct 2011 · 2015 · May 2019 · July 2020 · Nov 2023", "src": "Cardio P1", "recent": false, "topic": "c1", "sys": "CARD", "answer": "<h3>What are the causes of secondary hypertension? <span class=\"src\">Cardio P1<\/span><\/h3><div class=\"strip\">RED VP — Renal · Endocrine · Drugs · Vascular · Pregnancy<\/div><div class=\"tree\"><span class=\"node\">RED VP<\/span><div class=\"branches\"><div class=\"grp\"><span class=\"pill\">Renal<\/span><ul><li>Parenchymal: chronic glomerulonephritis, diabetic nephropathy, adult polycystic kidney disease, chronic tubulointerstitial nephritis<\/li><li>Renovascular: renal artery stenosis<\/li><\/ul><\/div><div class=\"grp\"><span class=\"pill\">Endocrine<\/span><ul><li>Hypo- or hyperthyroidism<\/li><li>Cushing syndrome, primary aldosteronism, phaeochromocytoma<\/li><li>Hyperparathyroidism, acromegaly<\/li><\/ul><\/div><div class=\"grp\"><span class=\"pill\">Vascular · Drugs · Pregnancy<\/span><ul><li>Vascular: coarctation of the aorta, vasculitis<\/li><li>Drugs and toxins: glucocorticoids, oral contraceptives, cocaine, cyclosporine, erythropoietin, NSAIDs<\/li><li>Pregnancy: pregnancy-induced hypertension<\/li><\/ul><\/div><\/div><\/div><h3>Which clinical clues point to a secondary cause? <span class=\"src\">Cardio P1<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Clue<\/th><th>Suggests<\/th><\/tr><\/thead><tbody><tr><td>Onset before 30 or after 50 years<\/td><td>A secondary cause in general<\/td><\/tr><tr><td>Radio-femoral delay<\/td><td>Coarctation of the aorta<\/td><\/tr><tr><td>Abdominal bruit<\/td><td>Renal artery stenosis<\/td><\/tr><tr><td>Enlarged kidneys<\/td><td>Polycystic kidney disease<\/td><\/tr><tr><td>Moon face with truncal obesity<\/td><td>Cushing syndrome<\/td><\/tr><tr><td>Headache, palpitation, sweating<\/td><td>Phaeochromocytoma<\/td><\/tr><tr><td>Weakness, polyuria, cramps with hypokalaemia<\/td><td>Primary aldosteronism<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What are the causes of secondary hypertension? (Cardio P1)\nRED VP — Renal · Endocrine · Drugs · Vascular · Pregnancy\nRED VP\nRENAL\n- Parenchymal: chronic glomerulonephritis, diabetic nephropathy, adult polycystic kidney disease, chronic tubulointerstitial nephritis\n- Renovascular: renal artery stenosis\nENDOCRINE\n- Hypo- or hyperthyroidism\n- Cushing syndrome, primary aldosteronism, phaeochromocytoma\n- Hyperparathyroidism, acromegaly\nVASCULAR · DRUGS · PREGNANCY\n- Vascular: coarctation of the aorta, vasculitis\n- Drugs and toxins: glucocorticoids, oral contraceptives, cocaine, cyclosporine, erythropoietin, NSAIDs\n- Pregnancy: pregnancy-induced hypertension\n\nWhich clinical clues point to a secondary cause? (Cardio P1)\nClue | Suggests\nOnset before 30 or after 50 years | A secondary cause in general\nRadio-femoral delay | Coarctation of the aorta\nAbdominal bruit | Renal artery stenosis\nEnlarged kidneys | Polycystic kidney disease\nMoon face with truncal obesity | Cushing syndrome\nHeadache, palpitation, sweating | Phaeochromocytoma\nWeakness, polyuria, cramps with hypokalaemia | Primary aldosteronism"}, {"id": "e3", "q": "Drugs for hypertension (groups, examples, side effects)", "years": "Oct 2011 · Nov 2016 · Nov 2021 · Nov 2022 · 2024 · 2025", "src": "Cardio P2", "recent": false, "topic": "c1", "sys": "CARD", "answer": "<h3>What are the antihypertensive drug groups? <span class=\"src\">Cardio P2<\/span><\/h3><div class=\"pillrow\"><span class=\"pill\">Thiazide diuretics<\/span><\/div><ul><li>Hydrochlorothiazide, chlortalidone, indapamide<\/li><li>↓ Na⁺ and water reabsorption in the distal convoluted tubule, with mild vasodilation<\/li><li>Preferred in the elderly and in osteoporosis<\/li><li>Hypokalaemia, hypercalcaemia, hyperglycaemia, hyperuricaemia, postural hypotension; avoid in gout<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">ACE inhibitors<\/span><\/div><ul><li>Captopril, enalapril, lisinopril, ramipril<\/li><li>Block angiotensin I → II and block bradykinin breakdown → ↓ vasoconstriction, ↓ aldosterone<\/li><li>Preferred in HFrEF, diabetic nephropathy or proteinuria, post-MI, CKD<\/li><li>Dry cough, angio-oedema, hyperkalaemia, first-dose hypotension, ↑ creatinine; contraindicated in bilateral renal artery stenosis<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">ARBs<\/span><\/div><ul><li>Losartan, valsartan, candesartan, irbesartan<\/li><li>Selective blockade of the angiotensin II AT1 receptor<\/li><li>Same indications as ACEI, especially after ACEI-induced cough<\/li><li>Hyperkalaemia, renal impairment, hypotension; no cough, rare angio-oedema<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Calcium channel blockers<\/span><\/div><ul><li>DHP: amlodipine, nifedipine, felodipine. Non-DHP: verapamil, diltiazem<\/li><li>Block calcium entry → arteriolar dilatation; non-DHPs also ↓ contractility and AV conduction<\/li><li>Preferred in angina or ischaemic heart disease, the elderly, African or Caribbean origin, AF rate control (non-DHP)<\/li><li>DHP: ankle oedema, headache, flushing, palpitation, reflex tachycardia. Non-DHP: bradycardia, AV block, constipation. Do not combine verapamil with a β-blocker<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">β-blockers<\/span><\/div><ul><li>Atenolol, metoprolol, bisoprolol, propranolol, carvedilol, labetalol<\/li><li>Attenuate the sympathetic and renin–angiotensin systems → ↓ HR, ↓ cardiac output, ↓ renin<\/li><li>Not first-line for uncomplicated hypertension; CAD or post-MI, HFrEF, arrhythmia, pregnancy (labetalol)<\/li><li>Bradycardia, bronchospasm, fatigue, cold extremities, bad dreams or hallucinations, impotence, ↓ insulin sensitivity, masked hypoglycaemia; never withdraw abruptly<\/li><\/ul><h3>Which other agents are used? <span class=\"src\">Cardio P2<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Agent<\/th><th>Use and caution<\/th><\/tr><\/thead><tbody><tr><td>Loop diuretics<\/td><td>Furosemide — volume overload, heart failure, eGFR &lt;30; not routine in essential hypertension<\/td><\/tr><tr><td>α-blockers<\/td><td>Doxazosin, prazosin, terazosin — useful with BPH; postural hypotension<\/td><\/tr><tr><td>MRAs<\/td><td>Spironolactone, eplerenone — resistant hypertension, primary aldosteronism; hyperkalaemia, gynaecomastia<\/td><\/tr><tr><td>Central α2 agonists<\/td><td>Methyldopa, clonidine — methyldopa in pregnancy; hepatic and haematological side effects<\/td><\/tr><tr><td>Direct vasodilators<\/td><td>Hydralazine, minoxidil — resistant hypertension, usually with a β-blocker. Hydralazine: SLE-like syndrome, reflex tachycardia, fluid retention. Minoxidil: severe oedema, hirsutism<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What are the antihypertensive drug groups? (Cardio P2)\nTHIAZIDE DIURETICS\n- Hydrochlorothiazide, chlortalidone, indapamide\n- ↓ Na⁺ and water reabsorption in the distal convoluted tubule, with mild vasodilation\n- Preferred in the elderly and in osteoporosis\n- Hypokalaemia, hypercalcaemia, hyperglycaemia, hyperuricaemia, postural hypotension; avoid in gout\nACE INHIBITORS\n- Captopril, enalapril, lisinopril, ramipril\n- Block angiotensin I → II and block bradykinin breakdown → ↓ vasoconstriction, ↓ aldosterone\n- Preferred in HFrEF, diabetic nephropathy or proteinuria, post-MI, CKD\n- Dry cough, angio-oedema, hyperkalaemia, first-dose hypotension, ↑ creatinine; contraindicated in bilateral renal artery stenosis\nARBS\n- Losartan, valsartan, candesartan, irbesartan\n- Selective blockade of the angiotensin II AT1 receptor\n- Same indications as ACEI, especially after ACEI-induced cough\n- Hyperkalaemia, renal impairment, hypotension; no cough, rare angio-oedema\nCALCIUM CHANNEL BLOCKERS\n- DHP: amlodipine, nifedipine, felodipine. Non-DHP: verapamil, diltiazem\n- Block calcium entry → arteriolar dilatation; non-DHPs also ↓ contractility and AV conduction\n- Preferred in angina or ischaemic heart disease, the elderly, African or Caribbean origin, AF rate control (non-DHP)\n- DHP: ankle oedema, headache, flushing, palpitation, reflex tachycardia. Non-DHP: bradycardia, AV block, constipation. Do not combine verapamil with a β-blocker\nΒ-BLOCKERS\n- Atenolol, metoprolol, bisoprolol, propranolol, carvedilol, labetalol\n- Attenuate the sympathetic and renin–angiotensin systems → ↓ HR, ↓ cardiac output, ↓ renin\n- Not first-line for uncomplicated hypertension; CAD or post-MI, HFrEF, arrhythmia, pregnancy (labetalol)\n- Bradycardia, bronchospasm, fatigue, cold extremities, bad dreams or hallucinations, impotence, ↓ insulin sensitivity, masked hypoglycaemia; never withdraw abruptly\n\nWhich other agents are used? (Cardio P2)\nAgent | Use and caution\nLoop diuretics | Furosemide — volume overload, heart failure, eGFR <30; not routine in essential hypertension\nα-blockers | Doxazosin, prazosin, terazosin — useful with BPH; postural hypotension\nMRAs | Spironolactone, eplerenone — resistant hypertension, primary aldosteronism; hyperkalaemia, gynaecomastia\nCentral α2 agonists | Methyldopa, clonidine — methyldopa in pregnancy; hepatic and haematological side effects\nDirect vasodilators | Hydralazine, minoxidil — resistant hypertension, usually with a β-blocker. Hydralazine: SLE-like syndrome, reflex tachycardia, fluid retention. Minoxidil: severe oedema, hirsutism"}, {"id": "e4", "q": "Complications of myocardial infarction", "years": "Oct 2012 · May 2015 · May 2016 · Nov 2023 · 2024", "src": "Cardio P15", "recent": false, "topic": "c3", "sys": "CARD", "answer": "<h3>What are the early complications of myocardial infarction? <span class=\"src\">Cardio P15<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Complication<\/th><th>Detail<\/th><\/tr><\/thead><tbody><tr><td>Arrhythmias<\/td><td>VT / VF within 24 h — the major early sudden-death risk; DC defibrillation or IV amiodarone. Ventricular premature beats — usually no treatment. Sinus bradycardia — IV atropine. Heart block — IV atropine, temporary pacing if atropine fails<\/td><\/tr><tr><td>Acute heart failure<\/td><td>Loss of contractility + ventricular remodelling; may progress to acute pulmonary oedema. Early HF detected on echo when EF &lt;40%<\/td><\/tr><tr><td>Early pericarditis<\/td><td>1–4 days: pleuritic chest pain, pericardial friction rub. Anticoagulation may increase the risk of tamponade<\/td><\/tr><tr><td>Hypovolaemia<\/td><td>Vomiting, sweating, reduced intake, morphine → hypotension. Correct with IV fluids<\/td><\/tr><tr><td>Cardiogenic shock<\/td><td>Extensive infarction — more than 40% of the LV wall. Severe LV pump failure with marked hypotension<\/td><\/tr><tr><td>Sudden cardiac death<\/td><td>Usually due to a fatal ventricular arrhythmia<\/td><\/tr><\/tbody><\/table><\/div><h3>What are the mechanical complications? <span class=\"src\">Cardio P15<\/span><\/h3><p>Usually 3–14 days.<\/p><div class=\"tree\"><span class=\"node\">RUPTURE<\/span><div class=\"branches\"><div class=\"grp\"><span class=\"pill\">Papillary muscle<\/span><ul><li>Acute mitral regurgitation<\/li><li>New pansystolic murmur radiating to the axilla<\/li><li>Flash pulmonary oedema<\/li><\/ul><\/div><div class=\"grp\"><span class=\"pill\">Ventricular septum<\/span><ul><li>Acquired VSD<\/li><li>New pansystolic murmur at the left sternal border<\/li><\/ul><\/div><div class=\"grp\"><span class=\"pill\">LV free wall<\/span><ul><li>Cardiac tamponade · sudden death<\/li><li>A pseudoaneurysm carries a high rupture risk<\/li><\/ul><\/div><\/div><\/div><h3>What are the late complications? <span class=\"src\">Cardio P15<\/span><\/h3><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Complication<\/th><th>Detail<\/th><\/tr><\/thead><tbody><tr><td>Dressler syndrome<\/td><td>2–10 weeks: immune-mediated pericarditis with fever, pleuritic chest pain and a friction rub. Treatment: NSAIDs — indomethacin; corticosteroids if severe<\/td><\/tr><tr><td>Ventricular aneurysm<\/td><td>Expansion of scar tissue; persistent ST elevation; heart failure, arrhythmias, mural thrombus or embolism. Detected by echo<\/td><\/tr><tr><td>Thromboembolism<\/td><td>Arterial: cerebral embolism → stroke or hemiparesis. Venous: DVT → pulmonary embolism. Warfarin for 3–6 months<\/td><\/tr><tr><td>Other<\/td><td>Chronic heart failure · late arrhythmias · re-infarction, which may occur at any time<\/td><\/tr><\/tbody><\/table><\/div><div class=\"strip\">Recurrent chest pain: post-infarction ischaemia · infarct extension · pericarditis<\/div><div class=\"strip\">Right ventricular infarction: usually an extension of an inferior MI → hypotension + congestion with clear lungs. Give fluids and avoid nitrates.<\/div>", "text": "What are the early complications of myocardial infarction? (Cardio P15)\nComplication | Detail\nArrhythmias | VT / VF within 24 h — the major early sudden-death risk; DC defibrillation or IV amiodarone. Ventricular premature beats — usually no treatment. Sinus bradycardia — IV atropine. Heart block — IV atropine, temporary pacing if atropine fails\nAcute heart failure | Loss of contractility + ventricular remodelling; may progress to acute pulmonary oedema. Early HF detected on echo when EF <40%\nEarly pericarditis | 1–4 days: pleuritic chest pain, pericardial friction rub. Anticoagulation may increase the risk of tamponade\nHypovolaemia | Vomiting, sweating, reduced intake, morphine → hypotension. Correct with IV fluids\nCardiogenic shock | Extensive infarction — more than 40% of the LV wall. Severe LV pump failure with marked hypotension\nSudden cardiac death | Usually due to a fatal ventricular arrhythmia\n\nWhat are the mechanical complications? (Cardio P15)\nUsually 3–14 days.\nRUPTURE\nPAPILLARY MUSCLE\n- Acute mitral regurgitation\n- New pansystolic murmur radiating to the axilla\n- Flash pulmonary oedema\nVENTRICULAR SEPTUM\n- Acquired VSD\n- New pansystolic murmur at the left sternal border\nLV FREE WALL\n- Cardiac tamponade · sudden death\n- A pseudoaneurysm carries a high rupture risk\n\nWhat are the late complications? (Cardio P15)\nComplication | Detail\nDressler syndrome | 2–10 weeks: immune-mediated pericarditis with fever, pleuritic chest pain and a friction rub. Treatment: NSAIDs — indomethacin; corticosteroids if severe\nVentricular aneurysm | Expansion of scar tissue; persistent ST elevation; heart failure, arrhythmias, mural thrombus or embolism. Detected by echo\nThromboembolism | Arterial: cerebral embolism → stroke or hemiparesis. Venous: DVT → pulmonary embolism. Warfarin for 3–6 months\nOther | Chronic heart failure · late arrhythmias · re-infarction, which may occur at any time\nRecurrent chest pain: post-infarction ischaemia · infarct extension · pericarditis\nRight ventricular infarction: usually an extension of an inferior MI → hypotension + congestion with clear lungs. Give fluids and avoid nitrates."}, {"id": "e5", "q": "Causes and investigations of acute chest pain", "years": "More than 10 times in variable formats", "src": "Cardio P10–11 · Symptomatology P6–13", "recent": false, "topic": "c4", "sys": "CARD", "answer": "<h3>What are the causes of acute chest pain? <span class=\"src\">Cardio P10<\/span><\/h3><div class=\"strip\">Life-threatening — PET-MAC: Pulmonary embolism · Esophageal rupture · Tension pneumothorax · Myocardial infarction / ACS · Aortic dissection · Cardiac tamponade<\/div><div class=\"pillrow\"><span class=\"pill\">Cardiac — ischaemic<\/span><\/div><ul><li>Stable angina · unstable angina · NSTEMI · STEMI<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Other cardiac causes<\/span><\/div><ul><li>Prinzmetal angina: rest pain · transient ST elevation · typically early morning · relieved by GTN · treat with CCBs · avoid β-blockers<\/li><li>Microvascular angina / cardiac syndrome X<\/li><li>Pericarditis · myocarditis<\/li><li>Mitral valve prolapse — left submammary stabbing pain<\/li><li>Aortic stenosis · hypertrophic cardiomyopathy<\/li><li>Aortic aneurysm or dissection<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Non-cardiac<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Group<\/th><th>Causes<\/th><\/tr><\/thead><tbody><tr><td>Respiratory<\/td><td>Pulmonary embolism · pneumothorax · pneumonia or pleurisy · pleural effusion · asthma or COPD exacerbation · pulmonary hypertension<\/td><\/tr><tr><td>Gastrointestinal<\/td><td>GORD · oesophageal spasm · oesophagitis · Boerhaave syndrome · peptic ulcer or gastritis · biliary colic or acute cholecystitis · acute pancreatitis<\/td><\/tr><tr><td>Musculoskeletal<\/td><td>Costochondritis: localised, reproducible on palpation, normal ECG and troponin · muscle strain · rib fracture · intercostal muscle spasm · cervical or thoracic spine disease<\/td><\/tr><tr><td>Psychiatric / misc.<\/td><td>Panic attack · anxiety or somatic symptom disorder · herpes zoster, pre-eruptive · cocaine-induced chest pain · sickle-cell acute chest syndrome<\/td><\/tr><\/tbody><\/table><\/div><h3>What investigations do you request in acute chest pain? <span class=\"src\">Cardio P11<\/span><\/h3><div class=\"pillrow\"><span class=\"pill\">First line — at presentation<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Test<\/th><th>What it shows<\/th><\/tr><\/thead><tbody><tr><td>12-lead ECG<\/td><td>Ischaemia, infarction and arrhythmia; repeat serially<\/td><\/tr><tr><td>Cardiac troponin I / T<\/td><td>Myocardial injury; measure on arrival, repeat when required<\/td><\/tr><tr><td>Chest X-ray<\/td><td>Pneumothorax · pneumonia · widened mediastinum · heart size · pulmonary oedema<\/td><\/tr><tr><td>Bedside assessment<\/td><td>Oxygen saturation · BP in both arms · capillary blood glucose<\/td><\/tr><\/tbody><\/table><\/div><div class=\"pillrow\"><span class=\"pill\">Blood tests<\/span><\/div><ul><li>FBC — anaemia or infection<\/li><li>Renal function + electrolytes — before contrast; correct K⁺ abnormalities in arrhythmia<\/li><li>Lipid profile — cardiovascular risk<\/li><li>D-dimer — a negative result helps exclude PE in low or intermediate probability<\/li><li>CK-MB<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Targeted imaging<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Question<\/th><th>Test<\/th><\/tr><\/thead><tbody><tr><td>General cardiac<\/td><td>Echocardiography — regional wall-motion abnormality · pericardial effusion or tamponade · valve disease · aortic-root dilatation<\/td><\/tr><tr><td>Pulmonary embolism<\/td><td>CT pulmonary angiography — the gold standard<\/td><\/tr><tr><td>Aortic dissection<\/td><td>CT / MR aortic angiography — confirms or excludes dissection and defines the extent. If unstable → TEE<\/td><\/tr><tr><td>Coronary disease<\/td><td>CT coronary angiography — non-invasive definition. Invasive coronary angiography — definitive; guides revascularisation<\/td><\/tr><tr><td>Oesophageal rupture<\/td><td>Contrast oesophagography or CT chest<\/td><\/tr><\/tbody><\/table><\/div>", "text": "What are the causes of acute chest pain? (Cardio P10)\nLife-threatening — PET-MAC: Pulmonary embolism · Esophageal rupture · Tension pneumothorax · Myocardial infarction / ACS · Aortic dissection · Cardiac tamponade\nCARDIAC — ISCHAEMIC\n- Stable angina · unstable angina · NSTEMI · STEMI\nOTHER CARDIAC CAUSES\n- Prinzmetal angina: rest pain · transient ST elevation · typically early morning · relieved by GTN · treat with CCBs · avoid β-blockers\n- Microvascular angina / cardiac syndrome X\n- Pericarditis · myocarditis\n- Mitral valve prolapse — left submammary stabbing pain\n- Aortic stenosis · hypertrophic cardiomyopathy\n- Aortic aneurysm or dissection\nNON-CARDIAC\nGroup | Causes\nRespiratory | Pulmonary embolism · pneumothorax · pneumonia or pleurisy · pleural effusion · asthma or COPD exacerbation · pulmonary hypertension\nGastrointestinal | GORD · oesophageal spasm · oesophagitis · Boerhaave syndrome · peptic ulcer or gastritis · biliary colic or acute cholecystitis · acute pancreatitis\nMusculoskeletal | Costochondritis: localised, reproducible on palpation, normal ECG and troponin · muscle strain · rib fracture · intercostal muscle spasm · cervical or thoracic spine disease\nPsychiatric / misc. | Panic attack · anxiety or somatic symptom disorder · herpes zoster, pre-eruptive · cocaine-induced chest pain · sickle-cell acute chest syndrome\n\nWhat investigations do you request in acute chest pain? (Cardio P11)\nFIRST LINE — AT PRESENTATION\nTest | What it shows\n12-lead ECG | Ischaemia, infarction and arrhythmia; repeat serially\nCardiac troponin I / T | Myocardial injury; measure on arrival, repeat when required\nChest X-ray | Pneumothorax · pneumonia · widened mediastinum · heart size · pulmonary oedema\nBedside assessment | Oxygen saturation · BP in both arms · capillary blood glucose\nBLOOD TESTS\n- FBC — anaemia or infection\n- Renal function + electrolytes — before contrast; correct K⁺ abnormalities in arrhythmia\n- Lipid profile — cardiovascular risk\n- D-dimer — a negative result helps exclude PE in low or intermediate probability\n- CK-MB\nTARGETED IMAGING\nQuestion | Test\nGeneral cardiac | Echocardiography — regional wall-motion abnormality · pericardial effusion or tamponade · valve disease · aortic-root dilatation\nPulmonary embolism | CT pulmonary angiography — the gold standard\nAortic dissection | CT / MR aortic angiography — confirms or excludes dissection and defines the extent. If unstable → TEE\nCoronary disease | CT coronary angiography — non-invasive definition. Invasive coronary angiography — definitive; guides revascularisation\nOesophageal rupture | Contrast oesophagography or CT chest"}, {"id": "e6", "q": "Outline treatment of angina pectoris", "years": "Kasr 2004 · Kasr 2011 · May 2015", "src": "Cardio P12", "recent": false, "topic": "c3", "sys": "CARD", "answer": "<h3>What is the treatment of stable angina? <span class=\"src\">Cardio P12<\/span><\/h3><div class=\"pillrow\"><span class=\"pill\">Risk-factor control<\/span><\/div><ul><li>Stop smoking · weight reduction · regular aerobic exercise<\/li><li>Treat hypertension, diabetes, anaemia, infection, CKD<\/li><li>LDL cholesterol &lt;70 mg/dL<\/li><\/ul><div class=\"pillrow\"><span class=\"pill\">Drugs<\/span><\/div><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Drug<\/th><th>Detail<\/th><\/tr><\/thead><tbody><tr><td>Nitrates<\/td><td>Venodilation → ↓ wall tension and O₂ demand; dilate epicardial and collateral vessels. Attack: sublingual GTN 0.6 mg. Prevention: isosorbide dinitrate 10–60 mg/day or patch, with ≥8 h/day nitrate-free against tolerance. Side effect: headache<\/td><\/tr><tr><td>β-blockers<\/td><td>↓ HR, BP and contractility. The only anti-anginal drugs that prevent infarction and reduce mortality. Aim for resting HR 55–60. Atenolol 50–100 mg/day<\/td><\/tr><tr><td>CCBs<\/td><td>Amlodipine, diltiazem, verapamil — coronary vasodilators, ↓ O₂ demand. Used when β-blockers are contraindicated (asthma, PVD) or not tolerated (impotence, depression). Do not combine verapamil with a β-blocker<\/td><\/tr><tr><td>Antiplatelets<\/td><td>Aspirin 75–160 mg/day — COX-1 inhibitor. Clopidogrel 75 mg/day — ADP inhibitor, synergistic with aspirin<\/td><\/tr><tr><td>Statins<\/td><td>↓ death, recurrent MI, unstable angina and stroke; LDL-C &lt;70<\/td><\/tr><\/tbody><\/table><\/div><h3>When is PCI or CABG indicated? <span class=\"src\">Cardio P12<\/span><\/h3><p>The choice depends on the number and site of diseased vessels · age · comorbidities · diabetes · character of the lesion · patient preference.<\/p><div class=\"tablewrap\"><table class=\"keyed\"><thead><tr><th>Procedure<\/th><th>Indications<\/th><\/tr><\/thead><tbody><tr><td>PCI (PTCA + stent)<\/td><td>Angina limiting lifestyle despite maximal medical therapy · high-risk criteria on non-invasive testing · unstable angina with ischaemia on exercise test · native-vessel or graft stenosis with recurrent angina after CABG · recent total occlusion with severe angina<\/td><\/tr><tr><td>CABG<\/td><td>Left main stenosis or left-main equivalent (≥70% proximal LAD + proximal LCX) · three-vessel disease · diabetic with 2- or 3-vessel disease · disabling angina despite maximal therapy<\/td><\/tr><\/tbody><\/table><\/div><div class=\"strip\">PCI complications: dissection or thrombosis with vessel occlusion · uncontrolled ischaemia · ventricular failure<\/div>", "text": "What is the treatment of stable angina? (Cardio P12)\nRISK-FACTOR CONTROL\n- Stop smoking · weight reduction · regular aerobic exercise\n- Treat hypertension, diabetes, anaemia, infection, CKD\n- LDL cholesterol <70 mg/dL\nDRUGS\nDrug | Detail\nNitrates | Venodilation → ↓ wall tension and O₂ demand; dilate epicardial and collateral vessels. Attack: sublingual GTN 0.6 mg. Prevention: isosorbide dinitrate 10–60 mg/day or patch, with ≥8 h/day nitrate-free against tolerance. Side effect: headache\nβ-blockers | ↓ HR, BP and contractility. The only anti-anginal drugs that prevent infarction and reduce mortality. Aim for resting HR 55–60. Atenolol 50–100 mg/day\nCCBs | Amlodipine, diltiazem, verapamil — coronary vasodilators, ↓ O₂ demand. Used when β-blockers are contraindicated (asthma, PVD) or not tolerated (impotence, depression). Do not combine verapamil with a β-blocker\nAntiplatelets | Aspirin 75–160 mg/day — COX-1 inhibitor. Clopidogrel 75 mg/day — ADP inhibitor, synergistic with aspirin\nStatins | ↓ death, recurrent MI, unstable angina and stroke; LDL-C <70\n\nWhen is PCI or CABG indicated? (Cardio P12)\nThe choice depends on the number and site of diseased vessels · age · comorbidities · diabetes · character of the lesion · patient preference.\nProcedure | Indications\nPCI (PTCA + stent) | Angina limiting lifestyle despite maximal medical therapy · high-risk criteria on non-invasive testing · unstable angina with ischaemia on exercise test · native-vessel or graft stenosis with recurrent angina after CABG · recent total occlusion with severe angina\nCABG | Left main stenosis or left-main equivalent (≥70% proximal LAD + proximal LCX) · three-vessel disease · diabetic with 2- or 3-vessel disease · disabling angina despite maximal therapy\nPCI complications: dissection or thrombosis with vessel occlusion · uncontrolled ischaemia · ventricular failure"}, {"id": "e7", "q": "Outline treatment of acute pulmonary edema", "years": "Oct 2011 · Kasr 2012 · May 2015", "src": "Cardio P9", "recent": false, "topic": "c2", "sys": "CARD", "answer": "<h3>What is the treatment of acute cardiogenic pulmonary oedema? <span class=\"src\">Cardio P9<\/span><\/h3><div class=\"strip\">Sit upright → Oxygen → Nitrate → Furosemide → Morphine → Inotrope if required → Treat the cause<\/div><div class=\"pillrow\"><span class=\"pill num\">1. Position and monitor<\/span><\/div><ul><li>Sit upright with the legs dependent; absolute rest; IV access<\/li><li>Monitor rhythm, BP, SpO₂ and urine output; take bloods<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">2. Oxygenate<\/span><\/div><ul><li>High-flow oxygen by mask, aiming SpO₂ &gt;94%<\/li><li>If hypoxaemia or respiratory distress persists → CPAP or non-invasive ventilation<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">3. IV nitrate<\/span><\/div><ul><li>Glyceryl trinitrate infusion → ↓ preload and afterload; titrate to response<\/li><li>Stop increasing if the SBP falls below about 110 mmHg; avoid if the SBP is &lt;90 mmHg<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">4. IV loop diuretic<\/span><\/div><ul><li>Furosemide bolus; use a larger dose if already on chronic diuretics<\/li><li>Repeat or switch to an infusion if the response is inadequate<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">5. Morphine<\/span><\/div><ul><li>IV morphine slowly with an antiemetic for severe distress<\/li><li>Use cautiously: respiratory depression may worsen hypoxaemia, especially in the elderly<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">6. If hypotensive or hypoperfused<\/span><\/div><ul><li>Dobutamine infusion; if the BP remains critically low with poor perfusion, add noradrenaline<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">7. Refractory cases<\/span><\/div><ul><li>Mechanical support: intra-aortic balloon pump · ventricular assist device · extracorporeal ultrafiltration<\/li><\/ul><div class=\"pillrow\"><span class=\"pill num\">8. Treat the cause<\/span><\/div><ul><li>MI → urgent PCI or thrombolysis · arrhythmia → cardioversion, pacing or rate control · severe hypertension → IV nitrate, labetalol or nitroprusside · acute valve lesion → emergency surgery<\/li><\/ul><p class=\"note\">After stabilisation, treat the underlying cause and start or optimise long-term heart-failure treatment.<\/p>", "text": "What is the treatment of acute cardiogenic pulmonary oedema? (Cardio P9)\nSit upright → Oxygen → Nitrate → Furosemide → Morphine → Inotrope if required → Treat the cause\n1. POSITION AND MONITOR\n- Sit upright with the legs dependent; absolute rest; IV access\n- Monitor rhythm, BP, SpO₂ and urine output; take bloods\n2. OXYGENATE\n- High-flow oxygen by mask, aiming SpO₂ >94%\n- If hypoxaemia or respiratory distress persists → CPAP or non-invasive ventilation\n3. IV NITRATE\n- Glyceryl trinitrate infusion → ↓ preload and afterload; titrate to response\n- Stop increasing if the SBP falls below about 110 mmHg; avoid if the SBP is <90 mmHg\n4. IV LOOP DIURETIC\n- Furosemide bolus; use a larger dose if already on chronic diuretics\n- Repeat or switch to an infusion if the response is inadequate\n5. MORPHINE\n- IV morphine slowly with an antiemetic for severe distress\n- Use cautiously: respiratory depression may worsen hypoxaemia, especially in the elderly\n6. IF HYPOTENSIVE OR HYPOPERFUSED\n- Dobutamine infusion; if the BP remains critically low with poor perfusion, add noradrenaline\n7. REFRACTORY CASES\n- Mechanical support: intra-aortic balloon pump · ventricular assist device · extracorporeal ultrafiltration\n8. TREAT THE CAUSE\n- MI → urgent PCI or thrombolysis · arrhythmia → cardioversion, pacing or rate control · severe hypertension → IV nitrate, labetalol or nitroprusside · acute valve lesion → emergency surgery\nAfter stabilisation, treat the underlying cause and start or optimise long-term heart-failure treatment."}, {"id": "e8", "q": "Management of secondary hypertension", "years": "2024 — first time", "src": "Cardio P1", "recent": true, "topic": "c1", "sys": "CARD", "answer": "<h3>How is secondary hypertension managed? <span class=\"src\">Cardio P1<\/span><\/h3><p>Suspect it from the above clues → confirm with targeted investigations → treat the specific cause.<\/p><ul><li>Renal artery stenosis → angioplasty ± stenting, or surgery<\/li><li>Primary aldosteronism → adrenalectomy if adenoma; otherwise spironolactone or eplerenone<\/li><li>Phaeochromocytoma → surgical resection after α-blockade<\/li><li>Cushing syndrome → surgery or radiation to pituitary / adrenal tumour<\/li><li>Coarctation of the aorta → surgical repair or balloon angioplasty<\/li><li>Drug-induced hypertension → stop the offending drug<\/li><li>Thyroid disease → treat hyper- or hypothyroidism<\/li><li>Renal hypertension in CKD → treat if ≥140/90; target &lt;130/80 · ACEI/ARB first-line · add CCB + diuretic · loop diuretic if eGFR &lt;30<\/li><\/ul><div class=\"strip\">Phaeochromocytoma: α-blockade must precede β-blockade.<\/div>", "text": "How is secondary hypertension managed? (Cardio P1)\nSuspect it from the above clues → confirm with targeted investigations → treat the specific cause.\n- Renal artery stenosis → angioplasty ± stenting, or surgery\n- Primary aldosteronism → adrenalectomy if adenoma; otherwise spironolactone or eplerenone\n- Phaeochromocytoma → surgical resection after α-blockade\n- Cushing syndrome → surgery or radiation to pituitary / adrenal tumour\n- Coarctation of the aorta → surgical repair or balloon angioplasty\n- Drug-induced hypertension → stop the offending drug\n- Thyroid disease → treat hyper- or hypothyroidism\n- Renal hypertension in CKD → treat if ≥140/90; target <130/80 · ACEI/ARB first-line · add CCB + diuretic · loop diuretic if eGFR <30\nPhaeochromocytoma: α-blockade must precede β-blockade."}], "cases": [{"id": "c1", "kw": "Regular ACE inhibitor + BP still 150/110–160/95 + obesity + ↑cholesterol + ↑fasting glucose", "dx": "Uncontrolled hypertension on monotherapy → step up drugs + treat total CV risk", "case": 1, "sheet": "Cardiology · DEPBOOK CASE 7\n• CASE\nA 42-year-old male patient with a 5-year\nhistory of hypertension first diagnosed\nduring pre-employment check up. His\nfamily history is positive for\nhypertension. He is complaining of\nheadache and has been taking lisinopril\n20 mg daily. In spite of taking this\nantihypertensive drug regularly, his blood\npressure remained elevated, ranging\nfrom 150/110 to 160/95 mm Hg. Physical\nassessment was unremarkable except for\nthe presence of obesity.\nBLOOD PRESSURE\n150/110 – 160/95\nmmHg\nCURRENT THERAPY\nLisinopril 20\nmg/day\nLABORATORY\n↑ Total cholesterol 268 (<245 mg/dL)\n↑ Fasting glucose 105 (70–100 mg/dL)\nNormal: Na 138 · K 4.1 · BUN 19 · Creatinine 0.9\n· Triglycerides 120\n• DIAGNOSTIC KEYWORDS\nRegular ACE inhibitor + BP still\n150/110–160/95 + obesity +\n↑cholesterol + ↑fasting glucose\nUNCONTROLLED HYPERTENSION\nON MONOTHERAPY → STEP UP\nDRUGS + TREAT TOTAL CV RISK\n• REVISE\nCardiovascular System → Hypertension\n• ANSWER\nStudy Smarter Cardiology Cases Page 1\nUNCONTROLLED HYPERTENSION + HEADACHE CASE 1\nEtiology — essential vs secondary\nInvestigations\nTreatment — steps and drug classes\nComplications — target organ damage\nWhat is the diagnosis, and why?\nWHY\n1\nUncontrolled essential hypertension on monotherapy,\nwith added cardiovascular risk factors\nBP still 150/110–160/95 on regular lisinopril →\nuncontrolled on one drug — needs a second\nTakes the drug regularly → excludes non-adherence as\nthe reason\nNormal K\n+ and normal creatinine → no pointer to a\nsecondary cause\nObesity + ↑cholesterol + ↑fasting glucose → added\ncardiovascular risk to treat\nWhat is the treatment plan for this patient?\nLIFESTYLE MODIFICATION\nBLOOD PRESSURE TARGET\nMODIFICATION OF BP THERAPY\nHIGH CHOLESTEROL\nFURTHER SCREENING\n2\nWeight reduction → lowers blood pressure\nDiet → moderate cut in sodium chloride → small BP drop\nExercise\nHome BP monitoring <135/85 mmHg · clinic <140/90\nmmHg (NICE)\n1st step = RAS blockers | thiazides | CCBs — none\nsuperior if no renal disease\nContinue the ACE inhibitor → add a CCB, amlodipine 5\nmg/day → re-evaluate after 2 weeks\nControl still marginal → add low-dose HCTZ 12.5\nmg/day\nWeight reduction, diet modification and exercise\nAdd a statin if 10-year ASCVD risk >7.5% or LDL-c\n>190 mg/dL — LDL and HDL not given, so risk cannot be\nestimated\nNo aspirin — no clear benefit in primary prevention\nPrediabetes, diabetes and metabolic syndrome are\ncommoner in hypertensives\nHbA1c + repeat fasting glucose + blood glucose after 75\ng oral glucose\nDetect target organ disease — renal damage,\ncongestive heart failure", "questions": ["What is the diagnosis, and why?", "What is the treatment plan for this patient?"], "topic": "c1", "sys": "CARD"}, {"id": "c2", "kw": "Untreated BP 160/105 + chest pain on climbing 3 floors + relieved by rest without drugs", "dx": "Stage 2 hypertension with stable (exertional) angina", "case": 2, "sheet": "Cardiology · DEPBOOK CASE 8\n• CASE\nA 52-year old woman, housewife, has 5\nchildren. Her BP is repeatedly 160/105.\nShe refused to take antihypertensive\ndrugs as she feels fine and has no\ncomplaints.\nFew days ago, she started to complain of\nchest pain when she climbs 3 floors. This\npain disappears without medication.\nBLOOD PRESSURE\n160/105\nrepeatedly\nCURRENT THERAPY\nNone — refused\n• DIAGNOSTIC KEYWORDS\nUntreated BP 160/105 + chest pain\non climbing 3 floors + relieved by rest\nwithout drugs\nSTAGE 2 HYPERTENSION WITH\nSTABLE (EXERTIONAL) ANGINA\n• REVISE\nCardiovascular System → Hypertension ·\nIschemic Heart Disease\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 2\nHIGH BLOOD PRESSURE + EXERTIONAL CHEST\nPAIN\nCASE 2\nClassification of blood pressure levels\nInvestigations for end organ damage\nStepped treatment of hypertension\nStable angina\nUnstable angina — pain at rest or\ncrescendo; here only on exertion\nMyocardial infarction — pain would not\nstop on its own\nHypertensive crisis — needs BP\n>180/120 or organ damage\nWhat is the diagnosis, and why?\nWHY\n1\nStage 2 hypertension with stable (exertional) angina\nStage 1 140–159 / 90–99 · stage 2 ≥160/100 but\n<180/120 (ESC 2024)\nBP repeatedly 160/105, untreated → stage 2\nhypertension\nChest pain only on climbing 3 floors → exertional\n(effort) angina\nPain disappears without medication → stable — not\nunstable angina or infarction\nBP high but no headache, visual or renal symptoms →\nhypertension, not a hypertensive emergency\n2 Important points in the history?\nSmoking, family history, co-morbidities, medications and\nsurgical history, menstrual history\nAnalysis of the chest pain; dyspnea, orthopnea, PND\nDuration of the hypertension and of the new symptoms;\ndoes it interfere with daily life\n3 Essential investigations?\nCardiac — ECG, echocardiography, stress ECG, thallium\nscan, coronary CT angiography or angiography\nLaboratory — blood sugar, lipid profile, creatinine, Na, K,\nurine analysis, micro-albuminuria, estimated GFR\nFundus examination\nDrugs used in treatment?\nLIFESTYLE\nDRUGS\n4\nWeight control; low salt <2 g; DASH diet; potassium-rich\nfoods; omega-3\nModerate aerobic activity, walking 50 min/week\nStage 2 → start with 2 drugs, target <130/80\nHypertension + CAD → beta-blocker + ARB or ACEi;\nadd dihydropyridine CCB, thiazide and/or\nmineralocorticoid antagonist as needed\nAngina: nitrates or nicardipine · statin to keep LDL <70\nmg/dL · aspirin\nAngioplasty, stent or CABG per stress test and coronary\nangiography · follow up monthly", "questions": ["What is the diagnosis, and why?", "Important points in the history?", "Essential investigations?", "Drugs used in treatment?"], "topic": "c1", "sys": "CARD"}, {"id": "c3", "kw": "15 years well-controlled on triple therapy → now 180/110–200/100 + new PND + kidney size discrepancy >1.5 cm", "dx": "Renovascular hypertension — atherosclerotic renal artery stenosis", "case": 3, "sheet": "Cardiology · DEPBOOK CASE 9\n• CASE\nA 64-year-old male presented to the\noutpatient clinic taking antihypertensive\ntherapy for almost 15 years. At that time\nhe was taking hydrochlorothiazide 25 mg\nqd, amlodipine 5 mg bid and bisoprolol 5\nmg qd and his blood pressure was well-controlled. Recently he developed\nexertional dyspnea and paroxysmal\nnocturnal dyspnea. Blood pressure\nmeasurements were consistently\n180/110–200/100 mm Hg and failed to\nrespond to increased dose of amlodipine.\nUltrasonography demonstrated size\ndiscrepancy of greater than 1.5 cm\nbetween both kidneys.\nBLOOD PRESSURE\n180/110 – 200/100\nCURRENT THERAPY\nHCTZ +\namlodipine +\nbisoprolol\nLABORATORY\n↑ Cholesterol 261 · LDL 174\n↓ HDL 40\n• DIAGNOSTIC KEYWORDS\n15 years well-controlled on triple\ntherapy → now 180/110–200/100 +\nnew PND + kidney size discrepancy\n>1.5 cm\nRENOVASCULAR HYPERTENSION\n— ATHEROSCLEROTIC RENAL\nARTERY STENOSIS\n• REVISE\nCardiovascular System → Hypertension ·\nVascular Diseases\n• ANSWER\nStudy Smarter Cardiology Cases Page 3\nACCELERATED HYPERTENSION + UNEQUAL\nKIDNEY SIZE\nCASE 3\nSecondary causes of hypertension\nRenal artery stenosis\nRAAS blockers — cautions\nWhat is the diagnosis, and why?\nWHY\n1\nRenovascular hypertension — atherosclerotic renal\nartery stenosis\nControlled 15 years, now 180/110–200/100 on triple\ntherapy → accelerated — look for a secondary cause\nKidney size discrepancy >1.5 cm → one kidney under-perfused = renal artery stenosis\nMale >50, long-standing HTN, dyslipidaemia →\natherosclerotic type, proximal one third\nNew exertional dyspnea and PND → hypertensive left\nheart failure\n2 Explanation for the accelerated hypertension?\nRenovascular hypertension = BP elevation from partial\nor complete occlusion of one or more renal arteries or\ntheir branches\n80% atherosclerosis — men >50 years, proximal one\nthird of the renal artery\n20% fibromuscular dysplasia — younger, usually\nwomen, distal two thirds and branches\nMost appropriate pharmacological therapy, and why?\nCONFIRM FIRST\nDRUGS OF CHOICE\nINVASIVE OPTIONS\n3\nDuplex ultrasonography · CT angiography if renal\nfunction normal · MR angiography\nRAAS blockers — ACE inhibitors and ARBs, because\nthis hypertension is renin dependent\nCombine with diuretics, calcium channel blockers and\nbeta-blockers\nCaution in severe bilateral stenosis or a solitary kidney\n— creatinine may rise from the drop in glomerular\nfiltration pressure\nStop if creatinine rises >30% above pretreatment value\n— completely reversible on stopping\nAggressive control of other atherosclerosis risk factors,\nhere the dyslipidaemia\nPercutaneous transluminal angioplasty, surgical\nrevascularization or nephrectomy", "questions": ["What is the diagnosis, and why?", "Explanation for the accelerated hypertension?", "Most appropriate pharmacological therapy, and why?"], "topic": "c1", "sys": "CARD"}, {"id": "c4", "kw": "Exertional angina + dyspnea + near-syncope + ESM at upper right sternal border radiating to the carotids + S4", "dx": "Congestive heart failure due to severe aortic stenosis", "case": 4, "sheet": "Cardiology · DEPBOOK CASE 10\n• CASE\nA 45 year-old male came complaining of\nchest pain with exertion, several weeks\nof worsening exertional dyspnea and\nhistory of lightheadedness as if he was\nabout to faint. He has orthopnea with\noccasional paroxysmal nocturnal dyspnea.\nHe does not smoke.\nOn examination the head and neck\nrevealed congested neck veins. Chest:\nbilateral basal inspiratory crackles.\nCardiac: apex is felt in the 5th space,\nrhythm regular with a normal S1 and a\nsplitting second heart sound during\nexpiration, an S4 at the apex. An ejection\nsystolic murmur at the upper right\nsternal border that radiates to his\ncarotids.\nTEMP\n37°C\nPULSE\n104 bpm\nBLOOD PRESSURE\n115/90\nRESP. RATE\n16/min\n• DIAGNOSTIC KEYWORDS\nExertional angina + dyspnea + near-syncope + ESM at upper right\nsternal border radiating to the\ncarotids + S4\nCONGESTIVE HEART FAILURE DUE\nTO SEVERE AORTIC STENOSIS\n• REVISE\nCardiovascular System → Diseases of the\nHeart Valves · Heart Failure\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Cardiology Cases Page 4\nEXERTIONAL CHEST PAIN + EJECTION SYSTOLIC\nMURMUR\nCASE 4\nAortic stenosis — symptoms and signs\nEchocardiography in valve disease\nIndications for valve surgery\nWhat is the diagnosis, and why?\nWHY\n1\nCongestive heart failure, possibly as a result of aortic\nstenosis\nThe three aortic stenosis symptoms: dyspnea · syncope\n(or other low cardiac output symptoms) · angina\nESM at upper right sternal border radiating to the\ncarotids → aortic stenosis\nAngina + dyspnea + near-syncope → the three aortic\nstenosis symptoms, all present\nS4 at the apex → stiff, hypertrophied left ventricle\nCongested neck veins + basal crackles + orthopnea →\ncongestive heart failure\n2 Most appropriate investigation, and why?\nEchocardiography — aortic valve area, state of the left\nventricle and its systolic function, pressure gradient\nacross the valve, stroke volume index\nCardiac CT — anatomy of the aortic root and ascending\naorta, extent and distribution of valve and vascular\ncalcification\nCoronary angiography — essential before surgery, to\ndetermine the need for concomitant revascularization\n3 Indications of surgery?\nFor all symptomatic patients with:\nSevere high-gradient aortic stenosis — mean gradient\n≥40 mmHg, peak velocity ≥4.0 m/s, valve area <1.0 cm²\nSevere low-flow (stroke volume index <35 mL/m²), low-gradient (<40 mmHg) aortic stenosis with reduced\nejection fraction (<50%) and evidence of flow\n(contractile) reserve on low-dose dobutamine stress\nechocardiography\nHypertrophic cardiomyopathy — murmur louder on Valsalva, no\ncarotid radiation\nAortic sclerosis — no gradient, no symptoms\nMitral regurgitation — pansystolic, radiates to the axilla", "questions": ["What is the diagnosis, and why?", "Most appropriate investigation, and why?", "Indications of surgery?"], "topic": "c2", "sys": "CARD"}, {"id": "c5", "kw": "Known RHD + sudden palpitations + irregular HR 130 + pink frothy sputum + malar flush + variable S1 + apical diastolic murmur", "dx": "Mitral stenosis with new atrial fibrillation precipitating acute pulmonary oedema", "case": 5, "sheet": "Cardiology · DEPBOOK CASE 11\n• CASE\nA 26-year-old woman, with known RHD\npresents to the emergency room\ncomplaining of sudden onset of\npalpitations, shortness of breath and\ncoughing of scanty amount of frothy\npink sputum.\nOn examination she is uncomfortable, has\nred cheeks, heart rate 130 bpm, irregular.\nNormal jugular venous pressure. Bilateral\ninspiratory crackles in the lower lung\nfields, but no lower limb edema. Cardiac:\napical impulse is non displaced, rhythm\nirregular with variable intensity of S1 and\nlow-pitched diastolic murmur at the\napex.\nHEART RATE\n130 bpm, irregular\nBLOOD PRESSURE\n90/60\nRESP. RATE\n30/min\nSPO₂\n94% on air\n• DIAGNOSTIC KEYWORDS\nKnown RHD + sudden palpitations +\nirregular HR 130 + pink frothy\nsputum + malar flush + variable S1 +\napical diastolic murmur\nMITRAL STENOSIS WITH NEW\nATRIAL FIBRILLATION\nPRECIPITATING ACUTE\nPULMONARY OEDEMA\n• REVISE\nCardiovascular System → Diseases of the\nHeart Valves · Disorders of Cardiac Rhythm\n• ANSWER\nStudy Smarter Cardiology Cases Page 5\nPALPITATIONS + PINK FROTHY SPUTUM IN\nRHEUMATIC HEART DISEASE\nCASE 5\nMitral stenosis\nAtrial fibrillation — rate and rhythm\ncontrol\nRheumatic fever — secondary\nprophylaxis\nWhat is the diagnosis, and why?\nWHY\n1\nRheumatic heart disease → mitral stenosis, with atrial\nfibrillation and cardiac asthma due to the AF\nLow-pitched apical diastolic murmur + malar flush →\nmitral stenosis\nHR 130 irregular with variable intensity of S1 → atrial\nfibrillation\nPink frothy sputum + basal crackles → acute\npulmonary oedema\nApex not displaced → the valve is the problem, not the\nventricle\nEmergency treatment?\nAF IN A HAEMODYNAMICALLY UNSTABLE PATIENT\nSUPPORTIVE\n2\nVentricular rate control by cardioversion, medical or\nelectrical\nMedical — IV infusion of an anti-arrhythmic, class Ic or a\nclass III agent\nElectrical — DC shock\nOxygen to maintain PO₂ >94%\nIV furosemide for pulmonary congestion — the cardiac\nasthma settles once the AF is controlled\n3 Long term management plan?\nA. Mitral stenosis — echo for valve area, left atrial size,\npulmonary pressure. Consider percutaneous balloon\nmitral valvotomy; if contraindicated, or pulmonary\npressure raised, or congestion persists despite therapy\n→ mitral valve replacement\nB. Rate and rhythm — chronic rate control (beta-blockers or digoxin); consider long-term rhythm control\n(antiarrhythmics or ablation)\nC. Lifelong anticoagulation if AF persists or recurs\nD. Secondary prophylaxis — benzathine penicillin G 1.2\nmillion units IM every 3–4 weeks, for at least 10 years\nafter the last attack or lifelong with established valve\ndisease\nE. Regular follow-up — echocardiography, INR if on\nwarfarin", "questions": ["What is the diagnosis, and why?", "Emergency treatment?", "Long term management plan?"], "topic": "c2", "sys": "CARD"}, {"id": "c6", "kw": "Previous exertional angina + orthopnea, PND, leg oedema + congested pulsating neck veins + apex displaced out and down + S3", "dx": "Congestive heart failure due to ischemic cardiomyopathy", "case": 8, "sheet": "Cardiology · DEPBOOK CASE 14\n• CASE\nA 58-year-old man presents complaining\nof several weeks of worsening exertional\ndyspnea. He previously had chest pain on\nwalking and on performance of strenuous\nexertion. He gave history of orthopnea\nand paroxysmal nocturnal dyspnea with\nedema of the lower limb. He has a history\nof hypercholesterolemia and smokes 20\ncigarettes per day.\nOn examination the head and neck\nrevealed congested pulsating neck veins.\nChest: bilateral basal inspiratory\ncrepitations. Cardiac: apical impulse\ndisplaced outwards and downwards,\nrhythm regular with a normal S1, and S3\nat the apex.\nTEMP\n37°C\nHEART RATE\n110 bpm\nBLOOD PRESSURE\n120/90\nRESP. RATE\n36/min\n• DIAGNOSTIC KEYWORDS\nPrevious exertional angina +\northopnea, PND, leg oedema +\ncongested pulsating neck veins +\napex displaced out and down + S3\nCONGESTIVE HEART FAILURE DUE\nTO ISCHEMIC CARDIOMYOPATHY\n• REVISE\nCardiovascular System → Heart Failure ·\nIschemic Heart Disease\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Cardiology Cases Page 8\nWORSENING EXERTIONAL DYSPNEA + S3 GALLOP CASE 8\nHeart failure — clinical picture\nIschemic heart disease — risk factors\nInvestigations in heart failure\nWhat is the diagnosis, and why?\nWHY\n1\nCongestive heart failure due to ischemic\ncardiomyopathy\nPrevious chest pain on walking → underlying ischemic\nheart disease\nOrthopnea, PND, leg oedema, congested pulsating\nneck veins → congestive heart failure\nApex displaced outwards and downwards + S3 →\ndilated, volume-overloaded left ventricle\nSmoker with hypercholesterolemia → points the cause\nto ischemia\n2 Risk factors of his condition?\nMale patient · age\nHypercholesterolemia · cigarette smoking\n3 Recommended investigations, and why?\nECG — ST-T changes, arrhythmia and conduction\nabnormalities\nChest X-ray — generalized cardiac enlargement and\nlung congestion\nTwo-dimensional echocardiography — global\ncontractility of the heart and wall motion abnormalities\nCardiac catheterization — to assess the coronary\nvessels\nBlood tests — serum electrolytes to detect and follow Na\nand K, liver function (AST, ALT), CBC, renal function, Pro-BNP, lipid profile, random blood glucose and HbA1c\nNon-ischemic dilated cardiomyopathy — no preceding angina or\nrisk factors\nConstrictive pericarditis — apex not displaced, pericardial knock\nValvular heart disease — there is no murmur here", "questions": ["What is the diagnosis, and why?", "Risk factors of his condition?", "Recommended investigations, and why?"], "topic": "c2", "sys": "CARD"}, {"id": "c7", "kw": "Recurrent epistaxis + BP 170/110 + localized heaving apex + S4 + accentuated S2 + no murmur", "dx": "Systemic hypertension with left ventricular hypertrophy", "case": 9, "sheet": "Cardiology · DEPBOOK CASE 15\n• CASE\nA 43-year-old man presents to the ENT\nclinic complaining of recurrent attacks of\nepistaxis. He was discovered to have\nhypertension. He has a history of smoking\n20 cigarettes per day for the last 25\nyears.\nOn examination heart rate 80 bpm and\nregular, with blood pressure 170/110 mm\nHg. Head and neck: normal jugular venous\npressure, both carotid impulses felt\nequally. Cardiac: non displaced apical\nimpulse, it is localized and heaving in\ncharacter with normal S1, accentuated\nS2, S4 at the apex, no murmurs.\nHEART RATE\n80 bpm,\nregular\nBLOOD\nPRESSURE\n170/110\nRESP. RATE\n24/min\n• DIAGNOSTIC KEYWORDS\nRecurrent epistaxis + BP 170/110 +\nlocalized heaving apex + S4 +\naccentuated S2 + no murmur\nSYSTEMIC HYPERTENSION WITH\nLEFT VENTRICULAR\nHYPERTROPHY\n• REVISE\nCardiovascular System → Hypertension\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 9\nRECURRENT EPISTAXIS + HEAVING APEX CASE 9\nDefinition and diagnosis of\nhypertension\nSigns of end organ damage\nInvestigations in all hypertensives\nAortic stenosis — ejection systolic\nmurmur to the carotids; none here\nHypertrophic cardiomyopathy —\nmurmur, younger, family history\nAortic regurgitation — displaced\nhyperdynamic apex, wide pulse pressure\nWhat is the diagnosis, and why?\nWHY\n1\nSystemic hypertension with left ventricular\nhypertrophy\nBP 170/110 with recurrent epistaxis → established\nhypertension, already causing damage\nLocalized heaving apex, not displaced → left\nventricular hypertrophy from pressure overload\nS4 at the apex → forcible atrial contraction against a\nstiff hypertrophied ventricle\nAccentuated A2 with no murmur → high aortic\npressure, not valve disease\n2 When do you diagnose a case of hypertension?\nNormal — SBP <120 and DBP <80 mmHg\nElevated — SBP 120–129 and DBP <80\nStage 1 — SBP 130–139 or DBP 80–89\nStage 2 — SBP ≥140 or DBP ≥90\nDiagnose after repeated measurement 3 times, a few\nweeks apart\nExcept if markedly elevated — hypertensive crisis SBP\n>180 and/or DBP >120 — or there is end organ damage\n3 Explain the physical findings in this patient.\nLocalized heaving apex → left ventricular hypertrophy\nS4 at the apex → forcible atrial contraction in the face\nof left ventricular hypertrophy\nAccentuated A2 → systemic hypertension — closure of\nthe aortic valve against high pressure in the aorta\nRecommended investigations?\nTO DETECT END ORGAN DAMAGE\nTO DETECT RISK FACTORS\n4\nUrine analysis, blood urea, serum creatinine, serum\nelectrolytes, ECG and echocardiography, abdominal\nultrasound\nBlood glucose, lipid profile and serum uric acid", "questions": ["What is the diagnosis, and why?", "When do you diagnose a case of hypertension?", "Explain the physical findings in this patient.", "Recommended investigations?"], "topic": "c1", "sys": "CARD"}, {"id": "c8", "kw": "Hypertensive on irregular treatment + PND + BP 180/100 + palpable LV heave + loud S2 + S3 and S4 + apical holosystolic murmur to the axilla", "dx": "Left ventricular failure secondary to hypertensive cardiomyopathy", "case": 10, "sheet": "Cardiology · DEPBOOK CASE 16\n• CASE\nA 53-year-old man is admitted from the\nemergency room with shortness of breath\nwhich began about 2 weeks ago and last\nnight he awoke from sleep and had to\nget up to \"get some air\". He denies any\ncough, hemoptysis, chest pain, back pain,\nurinary abnormalities, abdominal pain or\nankle swelling. He is known to be\nhypertensive on irregular treatment.\nExamination: pulse 120/min regular, BP\n180/100. Chest: basal rales about half\nway up bilaterally. Normal JVP. There is a\npalpable LV heave. Auscultation: regular\nrhythm, S2 is loud and there is evidence\nfor an S4 and S3. There is a 2/6\nholosystolic murmur at the apex\nradiating to the left axillary line.\nAbdomen: no organomegaly.\nPULSE\n120/min, regular\nBLOOD PRESSURE\n180/100\n• DIAGNOSTIC KEYWORDS\nHypertensive on irregular treatment\n+ PND + BP 180/100 + palpable LV\nheave + loud S2 + S3 and S4 + apical\nholosystolic murmur to the axilla\nLEFT VENTRICULAR FAILURE\nSECONDARY TO HYPERTENSIVE\nCARDIOMYOPATHY\n• REVISE\nCardiovascular System → Hypertension ·\nHeart Failure\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Cardiology Cases Page 10\nDYSPNEA + PAROXYSMAL NOCTURNAL DYSPNEA CASE 10\nHypertensive heart disease\nAdded heart sounds S3 and S4\nTreatment of left ventricular failure\nWhat is the diagnosis, and why?\nWHY\n1\nLeft ventricular failure secondary to hypertensive\ncardiomyopathy\nPND + basal rales half way up → left ventricular failure\nTachycardia 120/min → may correlate with heart failure\nBP 180/100 + palpable LV heave + loud S2 →\nhypertension is the cause, with pressure overload\nApical holosystolic murmur to the axilla → mitral\nregurgitation\nS3 then S4 → volume overload from the MR, then\ntension overload from the HTN\n2 Most likely precipitating medical cause?\nSystemic hypertension\n3 Investigations?\nChest X-ray — pulmonary congestion, left ventricular\nhypertrophy\n2D and Doppler echocardiography — ventricular\nhypertrophy, global contractility and wall motion\nabnormalities\n4 Main lines of treatment?\nOxygen; control blood pressure, target <130/80\nACE inhibitors / ARBs or ARNI, balanced vasodilators,\ndiuretics for salt and water retention\nSGLT2 inhibitors · antiplatelet drugs\nPersistent symptoms on optimal therapy → add a\nmineralocorticoid antagonist\nA beta-blocker can be added to control heart rate and\nBP\nPrimary mitral regurgitation — here the MR is functional, from\nLV dilatation\nIschemic heart failure — no angina and no ischemic risk factors\ngiven", "questions": ["What is the diagnosis, and why?", "Most likely precipitating medical cause?", "Investigations?", "Main lines of treatment?"], "topic": "c2", "sys": "CARD"}, {"id": "c9", "kw": "3 days after normal vaginal delivery + PND and orthopnea + BP 90/60 + raised JVP + hepatomegaly + diffuse displaced apex + S3 gallop", "dx": "Peripartum (dilated) cardiomyopathy with congestive heart failure", "case": 11, "sheet": "Cardiology · DEPBOOK CASE 17\n• CASE\nA 30 year-old woman is admitted with a\npersistent cough, paroxysmal nocturnal\ndyspnea and orthopnea 3 days after\nnormal vaginal delivery, accompanied by\nedema in both lower limbs and pain in\nthe right hypochondrium.\nExamination: pulse 120 bpm with\noccasional irregularity, blood pressure\n90/60, jugular venous pulsations seen 6\ncm above the angle of Louis at 45°.\nPeripheral edema. Lungs: bibasilar rales.\nAbdomen: hepatomegaly. Cardiac: apex\nshifted down and out, diffuse in\ncharacter, apical high-pitched systolic\nmurmur of 2/6 intensity and S3 gallop.\nPULSE\n120 bpm, irregular\nBLOOD PRESSURE\n90/60\nRESP. RATE\n26/min\nJVP\n6 cm at 45°\n• DIAGNOSTIC KEYWORDS\n3 days after normal vaginal delivery\n+ PND and orthopnea + BP 90/60 +\nraised JVP + hepatomegaly + diffuse\ndisplaced apex + S3 gallop\nPERIPARTUM (DILATED)\nCARDIOMYOPATHY WITH\nCONGESTIVE HEART FAILURE\n• REVISE\nCardiovascular System → Cardiac Muscle\nDisease · Heart Failure\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Cardiology Cases Page 11\nPOSTPARTUM DYSPNEA + ORTHOPNEA CASE 11\nDilated cardiomyopathy\nPeripartum cardiomyopathy\nInvestigations in heart failure\nWhat is the diagnosis, and why?\nWHY\n1\nCongestive heart failure — peripartum\ncardiomyopathy (dilated cardiomyopathy)\nAn idiopathic cardiomyopathy presenting with heart\nfailure secondary to left ventricular systolic dysfunction\ntowards the end of pregnancy or in the first 5 months\nfollowing delivery, where no other cause is found\n3 days after normal vaginal delivery → inside the\nperipartum window\nApex shifted down and out, diffuse, with S3 gallop →\ndilated left ventricle in systolic failure\nRaised JVP + hepatomegaly + leg oedema → right-sided congestion as well\nBP 90/60 → low output — not a hypertensive disease of\npregnancy\n2 Recommended investigations? Justify.\nEchocardiography — ventricular function, valve\nstructure, chamber size and wall motion\nECG — may be normal, show sinus tachycardia or, rarely,\natrial fibrillation if severe; also low voltage, left\nventricular hypertrophy and non-specific ST-segment\nand T-wave abnormalities\nChest X-ray — to detect lung congestion\n3 Mention 3 other causes of that condition.\nPost-infection, probably viral\nAuto-immune diseases — SLE, systemic sclerosis\nToxic — alcohol, cocaine, doxorubicin, cyclophosphamide\nPulmonary embolism — postpartum risk too, but no S3 or\ncardiomegaly\nPre-eclampsia — blood pressure would be high; here 90/60\nAmniotic fluid embolism — collapse at the time of delivery\nPre-existing valve disease — apex would not be newly diffuse", "questions": ["What is the diagnosis, and why?", "Recommended investigations? Justify.", "Mention 3 other causes of that condition."], "topic": "c2", "sys": "CARD"}, {"id": "c10", "kw": "Smoker + severe retrosternal pain to the left arm + partial relief with nitroglycerin + raised CK-MB and troponin + ST depression V1–V4", "dx": "Acute non-ST segment elevation myocardial infarction (NSTEMI)", "case": 12, "sheet": "Cardiology · DEPBOOK CASE 18\n• CASE\nA 45-year-old man, smoker, arrives at the\nemergency department with severe\nretrosternal chest pain with left arm\nradiation, the pain is partially relieved by\nsublingual nitroglycerin.\nPhysical examination: pulse 90 bpm; blood\npressure 130/80. Cardiac: regular rhythm;\nno murmur or extra sounds.\nPULSE\n90 bpm\nBLOOD PRESSURE\n130/80\nLABORATORY\n↑ CK-MB and troponin — moderately\nelevated\nNormal: CBC\n• DIAGNOSTIC KEYWORDS\nSmoker + severe retrosternal pain to\nthe left arm + partial relief with\nnitroglycerin + raised CK-MB and\ntroponin + ST depression V1–V4\nACUTE NON-ST SEGMENT\nELEVATION MYOCARDIAL\nINFARCTION (NSTEMI)\nECG on first day: ST depression of 2 mm in\nV1–V4.\n• REVISE\nCardiovascular System → Ischemic Heart\nDisease\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Cardiology Cases Page 12\nSEVERE RETROSTERNAL CHEST PAIN + ST\nDEPRESSION\nCASE 12\nAcute coronary syndromes\nDual antiplatelet therapy\nRisk stratification and PCI\nWhat is the diagnosis, and why?\nWHY\n1\nAcute non-ST segment elevation myocardial infarction\n(NSTEMI)\nSevere retrosternal pain radiating to the left arm →\ntypical of acute coronary syndrome\nCK-MB and troponin raised → true infarction, not\nunstable angina\nST depression, no elevation → the non-ST elevation\ntype\nOnly partly relieved by nitroglycerin → not simple\nstable angina\nHow would you manage this patient?\nONCE ACS IS SUSPECTED\nTRANSFER TO CCU\nDRUGS TO LIMIT THE INFARCT SIZE\nRISK-BASED\nAFTER PCI\n2\nAspirin 300 mg + ticagrelor 180 mg (or a loading dose\nof clopidogrel 300 mg)\nRestore perfusion, prevent and treat complications, pain\nrelief with morphine\nOxygen if oxygen saturation <90%\nDual antiplatelets if not already given · sublingual or IV\nnitroglycerin · beta-blockers e.g. metoprolol 5 mg IV or\n50–100 mg oral · LMW heparin\nLow risk — continue in-hospital medical treatment;\nstress ECG or thallium myocardial perfusion imaging\nbefore discharge to evaluate the need for PCI\nModerate or high risk — early angioplasty and stenting\n(PCI) with glycoprotein IIb/IIIa inhibitors (abciximab,\neptifibatide) before and up to 24 h after the procedure\nAspirin 81 mg/d, ticagrelor 180 mg/d or clopidogrel 75\nmg/d, beta-blocker, ACEi and statin\nSTEMI — ST elevation, not depression\nUnstable angina — biomarkers would be normal\nAcute pericarditis — ST elevation in all leads, friction rub\nAortic dissection — tearing pain to the back, unequal arm BP", "questions": ["What is the diagnosis, and why?", "How would you manage this patient?"], "topic": "c3", "sys": "CARD"}, {"id": "c11", "kw": "Triple coronary artery disease + MI 7 months ago + angina on five anti-anginal drugs + scheduled for surgery", "dx": "Triple-vessel coronary artery disease for coronary artery bypass grafting", "case": 13, "sheet": "Cardiology · DEPBOOK CASE 19\n• CASE\nA 57-year-old man with triple coronary\nartery disease was scheduled for\ncoronary artery bypass grafting. He had\na myocardial infarction 7 months ago.\nHe was taking nitroglycerin, digoxin,\npropranolol, isosorbide dinitrate and\nnifedipine. His blood pressure was 120/80\nmm Hg and his heart rate 60 beats per\nminute.\nBLOOD\nPRESSURE\n120/80\nHEART RATE\n60 bpm\nLAST MI\n7 months\nago\n• DIAGNOSTIC KEYWORDS\nTriple coronary artery disease + MI 7\nmonths ago + angina on five anti-anginal drugs + scheduled for surgery\nTRIPLE-VESSEL CORONARY\nARTERY DISEASE FOR CORONARY\nARTERY BYPASS GRAFTING\n• REVISE\nCardiovascular System → Ischemic Heart\nDisease\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 13\nMULTIVESSEL CORONARY ARTERY DISEASE +\nPLANNED CABG\nCASE 13\nIndications for revascularization\nPCI versus CABG\nCoronary anatomy\nPCI / PTCA — initial procedure of choice\nin selected obstructive CAD\nCABG — left main >50%, three-vessel\ndisease, poor LV function\nMedical therapy alone — only if angina\nis controlled without unacceptable side\neffects\nWhat is the diagnosis, and why?\nWHY\n1\nTriple-vessel coronary artery disease — the left\nanterior descending, right coronary and circumflex\narteries all have atherosclerotic blockages\nAngina persists on five anti-anginal drugs → medical\ntreatment has reached its ceiling\nHeart rate 60 on propranolol → already fully beta-blocked — no room to escalate\nMyocardial infarction 7 months ago → established\nischemic damage, so viability matters\nRate and blood pressure controlled, yet still\nsymptomatic → the limit is anatomical, not\npharmacological\nIndications for coronary artery bypass grafting?\nPRINCIPLE\nACC / AHA INDICATIONS\n2\nThe need for improvement in the quality or quantity of\nlife\nAngina not controlled by medical treatment, or\nunacceptable side effects → consider revascularization\nPTCA is currently accepted as the initial procedure of\nchoice in selected patients with obstructive coronary\nartery disease\n>50% left main coronary artery stenosis\n>70% stenosis of the proximal LAD and proximal\ncircumflex arteries\n>70% proximal LAD stenosis with either EF <50% or\ndemonstrable ischemia on non-invasive testing\nThree-vessel disease in asymptomatic patients, patients\nwith mild or stable angina, or patients with proximal\nLAD stenosis and poor LV function\nDisabling angina\nOngoing ischemia in a non-STEMI unresponsive to\nmedical therapy\nPoor LV function but with viable, non-functioning\nmyocardium above the anatomic defect that can be\nrevascularized", "questions": ["What is the diagnosis, and why?", "Indications for coronary artery bypass grafting?"], "topic": "c3", "sys": "CARD"}, {"id": "c12", "kw": "2 hours of severe central chest pain + nausea + profuse sweating + pallor + pulse 60 + S4 gallop", "dx": "Acute inferior myocardial infarction with AV block", "case": 14, "sheet": "Cardiology · DEPBOOK CASE 20\n• CASE\nA 68 year old male patient presented to\nthe ER with 2 hour history of severe\ncentral chest pain associated with\nnausea and profuse sweating.\nOn examination: there is pallor, BP 150/80\nmmHg, pulse 60 bpm, S4 gallop over the\napex.\nDURATION\n2 hours\nBLOOD\nPRESSURE\n150/80\nPULSE\n60 bpm\n• DIAGNOSTIC KEYWORDS\n2 hours of severe central chest pain +\nnausea + profuse sweating + pallor +\npulse 60 + S4 gallop\nACUTE INFERIOR MYOCARDIAL\nINFARCTION WITH AV BLOCK\n• REVISE\nCardiovascular System → Ischemic Heart\nDisease · Disorders of Cardiac Rhythm\nDON'T CONFUSE WITH\n• ANSWER\nStudy Smarter Cardiology Cases Page 14\nSEVERE CENTRAL CHEST PAIN + BRADYCARDIA CASE 14\nAcute myocardial infarction\nCardiac enzymes and their timing\nReperfusion therapy\nAV block and pacing\nAnterior MI — no bradycardia; inferior\nMI hits the AV node\nAcute pericarditis — pain eased sitting\nforward, friction rub\nAortic dissection — tearing pain,\nunequal pulses\nWhat is the diagnosis, and why?\nWHY\n1\nAcute inferior myocardial infarction, with bradycardia\ndue to AV block\nThe block may be temporary or permanent,\nnecessitating a cardiac pacemaker\n2 hours of severe central chest pain + nausea +\nsweating + pallor → acute myocardial infarction\nPulse only 60 during an acute MI → AV block, not a\nnormal response\nAV block points to the inferior wall → the inferior wall\nand the AV node share their blood supply\nS4 gallop over the apex → acutely stiff, ischemic left\nventricle\n2 Further investigations?\nECG — to prove the MI and i
