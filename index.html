eous\nLABORATORY\n↓ Hb 7.3 g/dL\n↑ Reticulocytes 5% (0.5–2)\n↑ Total bilirubin 4, direct 1.2 mg/dL\n↑ ESR 23 mm/hour\nNormal: Total WBC 10 × 10³/dL\n• DIAGNOSTIC KEYWORDS\nRecurrent jaundice with bony and\nabdominal pain + severe pain barely\ntouched by opioid + reticulocytes 5%\nwith indirect hyperbilirubinemia +\nconsanguinity with two affected\nsiblings\nSICKLE CELL ANEMIA IN VASO-OCCLUSIVE CRISIS\n• REVISE\nHematology → Hemolytic Anemias → Sickle\nCell\n• ANSWER\nStudy Smarter Hematology Cases Page 207\nBONE PAIN AND JAUNDICE IN A GIRL OF FIFTEEN CASE 5\nHemoglobin electrophoresis patterns\nVaso-occlusive crisis management\nAplastic and acute chest crises\nWhat is the diagnosis, and why?\nWHY\n1\nChronic hemolytic anemia in a 15-year-old with\nsevere bony aches needing pain medication.\nConsanguinity with a similar condition in siblings\nsupports a hereditary autosomal disorder — sickle\ncell anemia, in painful vaso-occlusive crisis\nThe pain is due to repeated infarction of joints, bones\nand growth plates\nConsanguinity with brother and sister affected →\naffected siblings of both sexes with\nconsanguineous parents means autosomal\nrecessive, not X-linked\nBilirubin 4 with direct only 1.2 → predominantly\nindirect — hemolytic, not obstructive jaundice\nSevere bone pain with minimal opioid relief → the\nhallmark of a vaso-occlusive crisis\nReticulocytes 5% → the marrow is responding —\nongoing hemolysis, not marrow failure\n2 How can you confirm your diagnosis?\nPeripheral blood smear for the presence of sickled\nerythrocytes\nEvidence of hemolysis — raised reticulocyte count,\nindirect bilirubin and serum LDH\nHemoglobin electrophoresis establishes the diagnosis\nby showing a single band of Hb S (in Hb SS), or Hb S\nwith another mutant hemoglobin in compound\nheterozygosity (Hb SC, or Hb S-beta+ thalassemia)\nElectrophoretic study of all family members —\nparents and siblings\n3 Mention three complications of this type of anemia.\nAplastic crisis from Parvovirus B19 — worsening\nanemia without deepening jaundice, and a falling\nreticulocyte count\nAcute chest syndrome — chest pain, fever, tachypnea,\nleukocytosis and pulmonary infiltrates\nCNS involvement, the most devastating aspect — the\nseverest manifestation is stroke, with varying degrees\nof neurological deficit", "questions": ["What is the diagnosis, and why?", "How can you confirm your diagnosis?", "Mention three complications of this type of anemia."], "topic": "h2", "sys": "HEMA"}, {"id": "c6", "kw": "Hb 14.7 to 6.6 in four days + dark urine and jaundice + raised LDH, indirect bilirubin and reticulocytes with a low haptoglobin + splenomegaly + woman of 36", "dx": "Autoimmune hemolytic anemia", "case": 208, "sheet": "Hematology · DEPBOOK CASE 214\n• CASE\nA 36-year-old woman developed\nprogressive fatigue over ten days, with\nexertional dyspnea, dark urine and\njaundice.\nOn examination there was\nsplenomegaly.\nSPLEEN\nEnlarged\nURINE\nDark\nONSET\n10 days\nLABORATORY\n↓ Hb fell 14.7 → 6.6 g/dL over 4 days\n↑ LDH, indirect bilirubin, reticulocytes\n— all markedly raised\n↓ Haptoglobin low\n• DIAGNOSTIC KEYWORDS\nHb 14.7 to 6.6 in four days + dark\nurine and jaundice + raised LDH,\nindirect bilirubin and reticulocytes\nwith a low haptoglobin +\nsplenomegaly + woman of 36\nAUTOIMMUNE HEMOLYTIC\nANEMIA\n• REVISE\nHematology → Hemolytic Anemias →\nAutoimmune\n• ANSWER\nStudy Smarter Hematology Cases Page 208\nHAEMOGLOBIN HALVING IN FOUR DAYS CASE 6\nDirect and indirect Coombs test\nWarm versus cold AIHA\nSecondary causes to exclude\nWhat is the diagnosis, and why?\nWHY\n1\nHemolytic anemia, from the laboratory evidence of\nhemolysis. Hemolytic anemia in a woman of this age\ngroup suggests an autoimmune nature\nCauses of autoimmune hemolytic anemia: idiopathic;\nautoimmune collagen disease — SLE, rheumatoid arthritis;\ndrugs — alpha-methyldopa, ampicillin, carbenicillin,\ndiclofenac, procainamide; infections — CMV, EBV, HIV,\nHCV, COVID-19, Mycoplasma pneumoniae (the classic\ntrigger for cold AIHA); and association with lymphoma or\nchronic lymphocytic leukemia\nLow haptoglobin with raised LDH and indirect bilirubin\n→ the full biochemical signature of hemolysis —\nhaptoglobin is consumed mopping up free hemoglobin\nHb halving in four days → far too fast for marrow\nfailure or blood loss without a source — red cells are\nbeing destroyed\nReticulocytes markedly raised → the marrow is intact and\nresponding\nSplenomegaly → the site of extravascular red cell\ndestruction\n2 How can you confirm the type of anemia?\nSerologic evidence of autoantibody — direct and indirect\nCoombs test\nExclude a secondary cause — ANA for SLE, virology\nscreen\nBone marrow biopsy in certain cases, to exclude\nlymphoma\n3 What is the treatment?\nTreatment varies with the underlying cause and severity\nCorticosteroids and immunosuppressive drugs —\nazathioprine, and the monoclonal anti-CD20 rituximab\nFolic acid — active hemolysis consumes folate\nBlood transfusion, and even splenectomy, in severe cases", "questions": ["What is the diagnosis, and why?", "How can you confirm the type of anemia?", "What is the treatment?"], "topic": "h2", "sys": "HEMA"}, {"id": "c7", "kw": "Recurrent multifocal bone pain + normocytic anemia Hb 7.7 + sickled red cells on the film + basophilic red cell inclusions + joints painful but not swollen", "dx": "Sickle cell anemia", "case": 217, "sheet": "Hematology · DEPBOOK CASE 223\n• CASE\nA 31-year-old woman from El Wadi El\nGedid was admitted with diffuse lower\nback pain, and right shoulder and knee\npain. She reports several similar episodes\nin the past.\nExamination: decreased range of motion in\nthe affected joints due to pain, with no\nobvious swelling.\nJOINTS\nPainful, not\nswollen\nEPISODES\nRecurrent\nSPLEEN SCAN\nNearly\nabsent\nuptake\nLABORATORY\n↓ Hb 7.7 g/dL, MCV 85 fL — normocytic\n+ A few sickled RBCs and basophilic RBC\ninclusions\nNormal: White blood cell and platelet counts\n• DIAGNOSTIC KEYWORDS\nRecurrent multifocal bone pain +\nnormocytic anemia Hb 7.7 + sickled\nred cells on the film + basophilic red\ncell inclusions + joints painful but not\nswollen\nSICKLE CELL ANEMIA\n• REVISE\nHematology → Hemoglobinopathies → Sickle\nCell\n• ANSWER\nStudy Smarter Hematology Cases Page 217\nSICKLED CELLS WITH NUCLEAR REMNANTS CASE 15\nElectrophoresis: disease versus trait\nFunctional asplenia and its timing\nVaccination and prophylaxis\nWhat is the diagnosis, and why?\nWHY\n1\nA young woman with multifocal bone pain and a\nmoderately severe normocytic anemia, whose film\nshows the features expected in sickle cell anemia\nSickled red cells on the film → the direct\nmorphological evidence\nBasophilic inclusions alongside them → the film is\ntelling you about the spleen as well as the red cells\n— work out what these inclusions are\nJoints painful but NOT swollen → bone infarction, not\narthritis\nRecurrent identical episodes → a lifelong inherited\ndisorder with repeated crises\n2 What are the recommended investigations?\nConfirmation is by hemoglobin electrophoresis, which\nseparates the types of hemoglobin by electrical\ncharge and identifies abnormal variants such as HbS\nSickle cell disease — HbS 85–95%, HbF raised, often\n5–15%, HbA absent\nSickle cell trait — HbA 50–65%, HbS 35–45%, with\nHbF and HbA2 normal\nWhat do her RBC inclusions refer to? What are its\nmanagement implications?\n3\nThe basophilic inclusions are Howell-Jolly bodies —\nnuclear remnants that are removed by the spleen.\nTheir presence in peripheral blood suggests decreased\nsplenic function\nFunctional asplenia is an early complication of sickle\ncell disease, evident within the first year of life. A\nnuclear medicine spleen and liver scan revealed nearly\nabsent splenic uptake\nOnce diagnosed, patients require vaccination\n(pneumococcal, meningococcal, Hib), antibiotic\nprophylaxis in some cases, and education on\ninfection risk and the early signs of sepsis", "questions": ["What is the diagnosis, and why?", "What are the recommended investigations?", "What do her RBC inclusions refer to? What are its management implications?"], "topic": "h2", "sys": "HEMA"}, {"id": "c8", "kw": "Homozygous SCD + fever with new basal shadowing + Hb 6 + autosplenectomy — the spleen is gone", "dx": "Infection with capsulated organisms in sickle cell disease", "case": 294, "sheet": "Infectious Disease · DEPBOOK CASE 318\n• CASE\nA 15-year-old male, known to be\nhomozygous for sickle cell disease\n(SCD), presents with progressive\nshortness of breath, right sided\npleuritic pain and a dry cough\nover the last 12 hours.\nChest examination demonstrates a\nwidespread expiratory wheeze.\nChest X-ray: new shadowing at\nthe right base.\nTEMP\n38 °C\nRR\n30 /min\nPULSE\n110 /min\nBP\n120/70 mmHg\nSPO2\n90% on air\nLABORATORY\n↓ Hb 6 g/dL (13–17)\n↑ WBC 20 ×10⁹/L, platelets 450\n×10⁹/L\n• DIAGNOSTIC KEYWORDS\nHomozygous SCD + fever\nwith new basal shadowing +\nHb 6 + autosplenectomy —\nthe spleen is gone\nINFECTION WITH\nCAPSULATED ORGANISMS\nIN SICKLE CELL DISEASE\n• REVISE\nHematology → Anemia → Sickle cell\ndisease\n• ANSWER\nStudy Smarter Infectious Disease Cases Page 294\nBREATHLESS WITH A NEW SHADOW IN SICKLE\nCELL DISEASE\nCASE 8\nThe three vaccines after\nsplenectomy\nAcute chest syndrome and its\ntriggers\nWhat is the diagnosis, and why?\nWHY\n1\nPatients with sickle cell disease are susceptible to infection\nwith capsulated organisms — Haemophilus influenzae,\nNeisseria meningitidis and Streptococcus pneumoniae\nAutosplenectomy is present in homozygous SCD, and the\nspleen has an important role in antibody production,\nactivation of the alternative complement pathway, and\nphagocytosis of unopsonized particulate matter\nHomozygous SCD with fever and a new infiltrate → a\nfunctionally absent spleen makes capsulated organisms the\norganisms to cover, before anything else\nHb 6 with a new basal shadow in 12 hours → the setting in\nwhich acute chest syndrome must be considered alongside\ninfection\n2 What are the treatment options?\nEmpirical treatment until cultures are available. Penicillin-susceptible strains can be treated with beta-lactam antibiotics:\npenicillin, a penicillin derivative, or a third-generation\ncephalosporin\n3 What vaccination is needed for this patient?\nPatients with sickle cell anemia or who are splenectomized\nneed three vaccines: pneumococcal, meningococcal and\nHaemophilus influenzae\n4 What other chest complications in sickle cell disease?\nThese complications decreased markedly in the post-hydroxyurea era\nAcute chest syndrome (ACS) — the second most common\ncause of hospital admission (the first is vaso-occlusive crisis).\nThe etiology is often multifactorial: infection is most likely in the\nyoung child, infarction and thromboembolism in older patients\nOutcome depends on immediate recognition and rapid\ntherapy: maintain oxygenation, treat underlying infection, and\nensure adequate hemoglobin delivery. Simple or exchange\ntransfusion is vital to improve delivery and decrease\nhemoglobin S concentration\nRestrictive lung disease from pulmonary fibrosis after repeated\nACS; pulmonary hypertension independent of\nthromboembolism; and pulmonary embolism with\nthromboembolic hypertension", "questions": ["What is the diagnosis, and why?", "What are the treatment options?", "What vaccination is needed for this patient?", "What other chest complications in sickle cell disease?"], "topic": "h2", "sys": "HEMA"}, {"id": "c9", "kw": "Pancytopenia with fever, gum bleeding and purpura + NO organomegaly + reticulocytes 0.2% + hypocellular marrow, no abnormal cells", "dx": "Aplastic anemia", "case": 209, "sheet": "Hematology · DEPBOOK CASE 215\n• CASE\nA 22-year-old man came with\ngeneral fatigue and bleeding from\nthe gums for two months, and\nfever last week. Temperature\n38°C, with purpuric eruptions\ndistributed all over the body.\nAbdominal examination showed no\norganomegaly or\nlymphadenopathy.\nHe started folic acid and ferrous\nsulfate with no improvement.\nBone marrow aspiration and\nbiopsy showed decreased\ncellularity and no abnormal cells.\nTEMPERATURE\n38°C\nORGANOMEGALY\nNone\nMARROW\nHypocellular,\nno\nblasts\nLABORATORY\n↓ Hb 5.4 g/dL, RBC 1.9 × 10⁶/dL\n↓ TLC 2 × 10³/dL, platelets 25 ×\n10³/dL\n↓ Reticulocytes 0.2% (0.5–2)\n• DIAGNOSTIC KEYWORDS\nPancytopenia with fever, gum\nbleeding and purpura + NO\norganomegaly + reticulocytes\n0.2% + hypocellular marrow,\nno abnormal cells\nAPLASTIC ANEMIA\n• REVISE\nHematology → Bone Marrow Failure\n• ANSWER\nStudy Smarter Hematology Cases Page 209\nPANCYTOPENIA WITH AN EMPTY MARROW CASE 7\nCauses of pancytopenia\nImmunosuppression versus\ntransplant\nFebrile neutropenia cover\nWhat is the diagnosis, and why?\nWHY\n1\nAplastic anemia — anemia, infection from leucopenia, and\nbleeding and purpura from thrombocytopenia, with a\nsuppressed marrow shown by the low reticulocyte count and\nhypocellular biopsy\nReticulocytes 0.2% with pancytopenia → a low reticulocyte\ncount is what separates marrow failure from destruction —\nin hemolysis it would be high\nHypocellular marrow with no abnormal cells → the marrow is\nempty, not replaced — so not leukemia or infiltration\nNo organomegaly or lymphadenopathy → argues against\nleukemia, lymphoma and hypersplenism\nNo response to folic acid and iron → this is not a deficiency\nanemia\n2 What are the causes of pancytopenia?\nBone marrow suppression or hypersplenism\nMarrow suppression includes pernicious anemia; autoimmune\ndisease such as SLE; infections — viral (parvovirus B19,\nCOVID) or brucellosis; lymphoma; aplastic anemia;\nmyelodysplastic syndrome; paroxysmal nocturnal\nhemoglobinuria; iatrogenic (drugs such as carbamazepine,\nirradiation, chemotherapy); and myelophthisic anemia from\nmarrow destruction by tumour invasion or granulomas\n3 How do you treat this case?\nBlood and platelet transfusion until the diagnosis is\nestablished and specific therapy instituted — blood products\nmust be irradiated to avoid sensitization against antigens of\npossible donors. Discontinue any offending drug or chemical\nexposure\nTreat infection — the major cause of mortality. Empirical\nantibiotics after cultures, broad based with gram-negative and\nstaphylococcal cover, anti-pseudomonal cover in febrile\nneutropenia, and early antifungals for persistent fever\nG-CSF may help in refractory infection and transiently raise\nneutrophils, but it does not correct the stem cell defect.\nEltrombopag, a thrombopoietin receptor agonist, induces\nmegakaryocyte proliferation\nBone marrow transplantation with an HLA-matched sibling\ndonor, under 40, or over 40 if not responding. Cyclosporine with\nantithymocyte globulin (ATG), combined for better response,\nwhere no matched sibling exists or the patient is transplant\nineligible", "questions": ["What is the diagnosis, and why?", "What are the causes of pancytopenia?", "How do you treat this case?"], "topic": "h3", "sys": "HEMA"}, {"id": "c10", "kw": "Pancytopenia — Hb 7.4, WBC 2.9, platelets 62 + MCV 103 + sore tongue + LDH 810 + age 70", "dx": "Pernicious anemia", "case": 205, "sheet": "Hematology · DEPBOOK CASE 211\n• CASE\nA 70-year-old woman presented with\nprogressive weakness and fatigue\nbeginning about a month earlier. She no\nlonger felt well enough to do housework\nor take her daily walk. Breathing\nnormal at rest, but too short of breath\nto walk more than two or three blocks.\nExamination showed a sore tongue\nand tachycardia at rest.\nTONGUE\nSore\nPULSE\nTachycardia at\nrest\nLABORATORY\n↓ Hb 7.4 g/dL, RBC 2.8 × 10⁶/dL\n↑ MCV 103 fL (80–96)\n↓ WBC 2.9 × 10³/dL, platelets 62 ×\n10³/dL\n↑ LDH 810 U/L (200–480)\nNormal: Differential 48% neutrophils, 43%\nlymphocytes, 8% monocytes, 1% eosinophils\n• DIAGNOSTIC KEYWORDS\nPancytopenia — Hb 7.4, WBC 2.9,\nplatelets 62 + MCV 103 + sore\ntongue + LDH 810 + age 70\nPERNICIOUS ANEMIA\n• REVISE\nHematology → Anemia → Megaloblastic\n• ANSWER\nStudy Smarter Hematology Cases Page 205\nPANCYTOPENIA WITH A SORE TONGUE AT\nSEVENTY\nCASE 3\nMMA and homocysteine\ninterpretation\nReticulocyte count in macrocytosis\nIntrinsic factor antibodies\nWhat is the diagnosis, and why?\nWHY\n1\nThe blood picture shows pancytopenia with\nmegaloblastic change. The diagnosis is most likely\npernicious anemia — a chronic illness caused by\nimpaired absorption of vitamin B12 from lack of intrinsic\nfactor in gastric secretions\nMCV 103 with pancytopenia → megaloblastic marrow\nfailure affects all three lines, not just red cells\nLDH 810 → ineffective hemopoiesis — intramedullary\nhemolysis, cells dying before they ever leave the marrow\nSore tongue → glossitis, a classic B12 sign\nAge 70 → intrinsic factor deficiency rises with age;\nachlorhydria may be the cause here\n2 What is the type of anemia?\nMacrocytic (megaloblastic) anemia, as the MCV is greater\nthan 100 fL\nCommon causes are vitamin B12 or folic acid deficiency.\nLack of intrinsic factor becomes commoner in older\npopulations; here achlorhydria may be the cause of the\nintrinsic factor deficiency\n3 Mention the investigations required for this anemia.\nBlood film — hypersegmented neutrophils and\nanisopoikilocytosis\nA raised LDH and indirect bilirubin with a DECREASED\nreticulocyte count suggest ineffective hemopoiesis, with\nintramedullary hemolysis occurring\nReticulocyte count is very important to separate the\nreticulocytosis of hemolytic anemia from megaloblastic\nanemia, as both are macrocytic\nSerum cobalamin and folate, with methylmalonic acid\n(MMA) and homocysteine: MMA is elevated in B12\ndeficiency but not in folate deficiency; normal MMA with\nraised homocysteine means folate deficiency, not B12\nAutoantibodies to intrinsic factor identify pernicious\nanemia — their specificity is high\nBone marrow — marked erythroid hyperplasia with a\nreversed myeloid-erythroid ratio, megaloblastic erythroid\nprecursors, giant metamyelocytes, and large\nhyperlobulated megakaryocytes", "questions": ["What is the diagnosis, and why?", "What is the type of anemia?", "Mention the investigations required for this anemia."], "topic": "h4", "sys": "HEMA"}, {"id": "c11", "kw": "Platelets < 10 with a normal WBC + mucocutaneous bleeding only + NO splenomegaly, no fever, no weight loss + PT, PTT, LDH and reticulocytes normal + no drug history", "dx": "Immune thrombocytopenia (ITP)", "case": 213, "sheet": "Hematology · DEPBOOK CASE 219\n• CASE\nA 27-year-old woman presents\nwith epistaxis and heavy\nmenstrual bleeding. She denies\ndrug intake and reports no fever\nor weight loss.\nExamination revealed scattered\npetechiae over the whole body,\nbruises on both lower limbs, and\npetechial hemorrhages on the\npalate. There was no\nhepatosplenomegaly.\nSPLEEN\nNot\nenlarged\nPALATE\nPetechiae\nFEVER /\nWEIGHT\nLOSS\nNone\nLABORATORY\n↓ Platelets < 10 × 10³/µL (150–400)\n↓ Hb 9.5 g/dL, MCV 65 fL\nNormal: WBC 4.5 × 10⁹/L, reticulocyte\ncount, LDH, PT and PTT\n• DIAGNOSTIC KEYWORDS\nPlatelets < 10 with a normal\nWBC + mucocutaneous\nbleeding only + NO\nsplenomegaly, no fever, no\nweight loss + PT, PTT, LDH\nand reticulocytes normal +\nno drug history\nIMMUNE\nTHROMBOCYTOPENIA (ITP)\n• REVISE\nHematology → Bleeding Disorders →\nThrombocytopenia\n• ANSWER\nStudy Smarter Hematology Cases Page 213\nPETECHIAE ON THE PALATE WITH A NORMAL\nSPLEEN\nCASE 11\nITP as a diagnosis of exclusion\nTreatment thresholds by platelet\ncount\nSecond-line agents in ITP\nWhat is the diagnosis, and why?\nWHY\n1\nImmune thrombocytopenia (ITP) — no constitutional\nsymptoms, no physical findings and no enlarged spleen, with\nonly mucocutaneous bleeding\nPlatelets alone are low — WBC and reticulocytes normal →\nisolated thrombocytopenia is the hallmark; any other\ncytopenia points elsewhere\nNo splenomegaly; PT, PTT and LDH normal → excludes\nhypersplenism and infiltration, and rules out DIC and\nmicroangiopathy\nMCV 65 → iron deficiency from the bleeding\n2 What is the differential diagnosis?\nOther causes of thrombocytopenia — drugs; viral infection\n(HCV, EBV, HIV); leukemia; bone marrow infiltration;\nmyelodysplastic syndrome; aplastic anemia; and other\nautoimmune disease such as SLE\nDescribe the peripheral blood and bone marrow picture of the\nmost probable diagnosis, and mention the investigations required\nfor her?\n3\nITP is basically a diagnosis of exclusion; on CBC the hallmark is\nisolated thrombocytopenia, and on smear the red cells and\nleukocytes are normal (a microcytic hypochromic anemia may\nbe present secondary to bleeding)\nBone marrow is not mandatory unless the diagnosis is\ndoubtful; it shows normal erythroid and myeloid precursors,\nnormal cellularity, no fibrosis, and normal or increased\nmegakaryocytes with defective budding\nWorkup to exclude secondary causes — ANA, anti-DNA, C3,\nC4, HCV Ab, HBsAg, HBsAb, CMV Ab, EBV Ab, HIV Ab, H.\npylori antigen in stool, abdominal ultrasound\n4 What is the treatment?\nAdults with platelets above 30 × 10³/dL who are\nasymptomatic or have mild mucocutaneous bleeding do not\nrequire treatment. Platelet transfusion for bleeding, platelets\nbelow 10, or before surgery\nFirst line — corticosteroids: prednisone 0.5–2 mg/kg/day or\ndexamethasone 40 mg/day for 4 days; IVIG when a faster\nplatelet response is needed. Second line — thrombopoietin\nreceptor agonists (eltrombopag or romiplostim), rituximab, or\nsplenectomy (delayed at least 1 year after diagnosis)", "questions": ["What is the diagnosis, and why?", "What is the differential diagnosis?", "Describe the peripheral blood and bone marrow picture of the most probable diagnosis, and mention the investigations required for her?", "What is the treatment?"], "topic": "h5", "sys": "HEMA"}, {"id": "c12", "kw": "Fever + confusion + hemolytic anemia + thrombocytopenia + SCHISTOCYTES + PT and PTT NORMAL + three-day onset", "dx": "Acquired thrombotic thrombocytopenic purpura", "case": 214, "sheet": "Hematology · DEPBOOK CASE 220\n• CASE\nA 29-year-old woman presents to the\nemergency department with confusion.\nShe was well until 3 days ago, when\nshe developed fever, dark coloured\nurine and a rash on her legs.\nExamination: GCS 13/15, with\npetechiae over both legs.\nGCS\n13/15\nTEMPERATURE\nFebrile\nONSET\n3 days\nLABORATORY\n↓ Hb 7 g/dL, platelets 10 × 10⁹/L\n+ Schistocytes — fragmented red\ncells on smear\n↑ Reticulocytes, indirect bilirubin and\nLDH\nNormal: MCV 85 fL, WBC 11 × 10³/dL with a\nnormal differential, PT and PTT\n• DIAGNOSTIC KEYWORDS\nFever + confusion + hemolytic\nanemia + thrombocytopenia +\nSCHISTOCYTES + PT and PTT\nNORMAL + three-day onset\nACQUIRED THROMBOTIC\nTHROMBOCYTOPENIC PURPURA\n• REVISE\nHematology → Thrombotic\nMicroangiopathies\n• ANSWER\nStudy Smarter Hematology Cases Page 214\nCONFUSION, FEVER AND FRAGMENTED RED\nCELLS\nCASE 12\nADAMTS13 and the TTP pentad\nTTP versus DIC versus ITP\nPlasma exchange and caplacizumab\nWhat is the diagnosis, and why?\nWHY\n1\nIn the context of a confused patient with fever, hemolytic\nanemia, thrombocytopenia and fragmented red cells,\nacquired thrombotic thrombocytopenic purpura (aTTP) is\nmost likely\nConfirmed by testing ADAMTS13, which is below 10% in\nTTP. Coombs-negative hemolytic anemia with\nthrombocytopenia should raise the suspicion of TTP\nSchistocytes with thrombocytopenia → a\nmicroangiopathy — red cells are being sheared through\nplatelet-rich microthrombi\nPT and PTT normal → this is the line that excludes DIC,\nwhere they would be deranged\nConfusion with fever → microthrombi in the cerebral\ncirculation — the neurological arm of the pentad\nRaised LDH and indirect bilirubin with reticulocytosis →\nactive hemolysis\n2 What is the differential diagnosis?\nITP, but it could not explain the hemolytic anemia\nSepsis and DIC, but there is no suggestive history, and PT\nand PTT are normal\nSLE with lupus cerebritis, immune thrombocytopenia and\nvasculitis is a possibility\n3 What is the main line of treatment of such a case?\nPlasma exchange with fresh frozen plasma, plus\nimmunosuppression — steroids, is the main line of\ntreatment of acquired TTP\nRituximab is also considered part of the first line alongside\nplasma exchange and steroids, prolonging remission with\nbetter response\nCaplacizumab — a humanized anti-von Willebrand factor\nmonoclonal antibody fragment that inhibits the interaction\nbetween von Willebrand factor and platelets", "questions": ["What is the diagnosis, and why?", "What is the differential diagnosis?", "What is the main line of treatment of such a case?"], "topic": "h5", "sys": "HEMA"}, {"id": "c13", "kw": "Schistocytes with a NEGATIVE Coombs + platelets 14,000 + neurologic signs and fever + creatinine 1.4 + NORMAL coagulation profile", "dx": "Acquired thrombotic thrombocytopenic purpura", "case": 286, "sheet": "Acute Internal Medicine · DEPBOOK CASE 292\n• CASE\nA 27 years old woman presented\nwith acute onset of fatigue, easy\nbruising and petechial rash and\nconfusion. Her family reported she\nwas acting normally until 3 days\nago when she started to slur her\nspeech and to behave aberrantly.\nNo recent infection, fever, or\nmedications; no family history of\nbleeding disorders.\nBP\n140/90\nmmHg\nPULSE\n110 bpm\nTEMP\n37.8 °C\nLABORATORY\n↓ Platelets 14,000/µL; Hb 8.1 g/dL\n↑ LDH 980 U/L, reticulocytes\n300,000/µL, bilirubin 4 mg/dL\n→ Smear: schistocytes; direct\nCoomb's negative\nNormal: RBCs 4.2 million/mm³, TLC\n8000/µL, PT and PC, creatinine 1.4\nmg/dL\n• DIAGNOSTIC KEYWORDS\nSchistocytes with a\nNEGATIVE Coombs +\nplatelets 14,000 + neurologic\nsigns and fever + creatinine\n1.4 + NORMAL coagulation\nprofile\nACQUIRED THROMBOTIC\nTHROMBOCYTOPENIC\nPURPURA\n• REVISE\nHematology → Thrombotic\nThrombocytopenic Purpura (TTP)\n• ANSWER\nStudy Smarter Acute Internal Medicine Cases Page 286\nSCHISTOCYTES, PLATELETS 14,000 AND SLURRED\nSPEECH\nCASE 16\nWhy platelets are withheld in\nTTP\nWhat is the diagnosis, and why?\nWHY\n1\nAcquired thrombotic thrombocytopenic purpura (TTP) —\nthrombocytopenia with microangiopathic hemolytic anemia\n(schistocytes, negative direct Coomb's test, ↑LDH,\n↑reticulocytic count, ↑indirect bilirubin), neurologic\nmanifestations (confusion, coma), fever and renal affection\nSchistocytes with a negative Coombs, platelets 14,000,\nNORMAL PT and PC → red cells sheared mechanically\nrather than destroyed by antibody, platelets consumed in\nmicrothrombi rather than in DIC — these pairings separate\nTTP from autoimmune hemolysis and from DIC\n2 What are the important differential diagnoses to be considered?\nHemolytic uremic syndrome (HUS) — after diarrhea [E. coli\nO157:H7], commoner in children. Disseminated intravascular\ncoagulopathy (DIC) — abnormal coagulation profile\nEvans syndrome — autoimmune hemolytic anemia with ITP;\ncharacterized by a positive Coombs test, which induces the\nautoimmune hemolysis\nSystemic lupus erythematosus — thrombocytopenia from\nimmune-mediated platelet destruction, reduced bone marrow\nproduction and antiphospholipid-associated thrombotic\nmicroangiopathy consuming platelets; hematologic features\ncan be the earliest in the disease\n3 What is the key diagnostic test to confirm the diagnosis? Explain.\nADAMTS13 activity level < 10% — ADAMTS13 is the von\nWillebrand factor-cleaving protease; an acquired decrease or\nabsence of activity leads to microthrombi formation with\nsubsequent end-organ ischemia and damage\nWhy is early treatment critical for this patient? What is the\nimmediate treatment?\n4\nMortality of untreated TTP is > 90%; treatment reduces it to <\n10%. Therapeutic plasma exchange (TPE) / plasmapheresis is\nthe gold standard, as soon as possible; plus pulse steroids —\nmethylprednisolone 1 g/day by IV infusion for 3 days\nCaplacizumab (anti-von Willebrand factor) inhibits\nmicrothrombi formation. Rituximab (anti-CD20) for refractory\nor relapsing cases [not FDA approved; off-label, especially with\nneurologic or cardiac symptoms]\nOther — packed RBCs, folate. Platelet transfusion is\ncontraindicated unless hemorrhage is life-threatening;\npostpone thromboprophylaxis until response", "questions": ["What is the diagnosis, and why?", "What are the important differential diagnoses to be considered?", "What is the key diagnostic test to confirm the diagnosis? Explain.", "Why is early treatment critical for this patient? What is the immediate treatment?"], "topic": "h5", "sys": "HEMA"}, {"id": "c14", "kw": "36 weeks pregnant + headache and visual blurring then coma + BP 160/100 with edema + anemia + thrombocytopenia + raised transaminases", "dx": "HELLP syndrome", "case": 282, "sheet": "Acute Internal Medicine · DEPBOOK CASE 288\n• CASE\nA 30 years old woman presented in the\n36th week of her first pregnancy with\ndisturbance of conscious level,\npreceded by severe headache and\nblurring of vision.\nExamination revealed coma without\nlateralization, GCS 10, bilateral lower\nlimb edema, and no jaundice. Initial\nlaboratory data showed anemia,\nthrombocytopenia, elevated AST and\nALT.\nBP\n160/100 mmHg\nPULSE\n110 bpm\nRR\n20 /min\nTEMP\n37.6 °C\nRBG\n100 mg/dL\n• DIAGNOSTIC KEYWORDS\n36 weeks pregnant + headache\nand visual blurring then coma +\nBP 160/100 with edema + anemia\n+ thrombocytopenia + raised\ntransaminases\nHELLP SYNDROME\nBook note: the book states a blood\npressure target of 90/65 mmHg “to\nensure maternal cerebral perfusion”, and\nlists magnesium sulfate as the means of\nBP control — magnesium is standard for\nseizure prophylaxis. Reproduced as\nprinted.\n• REVISE\nHepatology → Liver Diseases with\nPregnancy\n• ANSWER\nStudy Smarter Acute Internal Medicine Cases Page 282\nCOMA AT 36 WEEKS WITH A FALLING PLATELET\nCOUNT\nCASE 12\nHELLP versus acute fatty liver of\npregnancy\nHepatitis E in pregnancy\nDelivery as definitive treatment\nWhat is the diagnosis, and why?\nWHY\n1\nAcute liver failure with pregnancy — most probably\nhypertension-associated acute liver disease in pregnancy\nwith HELLP syndrome, characterized by\nmicroangiopathic hemolytic anemia, hepatic dysfunction\nwith elevated AST and ALT, and thrombocytopenia\nPregnancy-associated acute liver disease includes:\nHELLP (Hemolysis, Elevated Liver enzymes, Low Platelets),\npre-eclampsia / eclampsia ± liver infarction,\nhypertension-associated acute liver disease in pregnancy\n(I + II), and acute fatty liver of pregnancy\nThe HELLP triad in one line of labs → anemia (hemolysis)\n+ elevated liver enzymes + low platelets\nBP 160/100 with edema and visual blurring → the\nhypertensive disorder of pregnancy underlying it, in a\nprimigravida in the third trimester\n2 What is the diagnostic workup?\nCBC — microangiopathic hemolytic anemia (fragmented\nRBCs)\nLDH elevated, haptoglobin low or undetectable\nLiver function tests — AST, ALT, GGT, alkaline\nphosphatase, bilirubin (total and direct), PT, PC, INR\nViral serology to exclude hepatitis E — pregnant women\nare vulnerable to HEV\nAutoimmune markers — ANA, SMA, LKM1 antibodies, to\nexclude autoimmune hepatitis\nLiver ultrasound with Doppler — rule out Budd-Chiari,\ncheck for structural causes\nProtein C, protein S and antithrombin III — deficiency of\nany may aggravate the hypercoagulability of pregnancy\nand precipitate Budd-Chiari\n3 What are the immediate management steps?\nICU admission for maternal stabilization to allow urgent\ndelivery: immediate induction\nBlood pressure control with a target of 90/65 mmHg to\nensure maternal cerebral perfusion [intravenous infusion\nof magnesium sulfate]\nTransfusion of blood products — packed RBCs to treat\nanemia; coagulation factors, e.g. recombinant factor VIIa,\nif there is excessive bleeding; platelet transfusion", "questions": ["What is the diagnosis, and why?", "What is the diagnostic workup?", "What are the immediate management steps?"], "topic": "h5", "sys": "HEMA"}, {"id": "c15", "kw": "Major orthopedic surgery two days ago + unilateral leg pain and swelling + 2 cm calf difference + breakthrough on prophylactic dose enoxaparin + mother and maternal uncle each had a VTE in old age", "dx": "Provoked deep vein thrombosis of the right lower limb", "case": 220, "sheet": "Hematology · DEPBOOK CASE 226\n• CASE\nA 38-year-old man was admitted\nwith a femur fracture. Surgical\nrepair was performed, with\nprophylactic-dose enoxaparin and\noxycodone as needed. Two days\nlater he experienced increasing\npain and swelling in his right leg.\nFamily history: mother had\npulmonary embolism at 66 while\non breast cancer treatment; a\nmaternal uncle had a DVT at 78.\nExamination: vital signs normal,\nright leg 2 cm greater in\ncircumference at mid calf; the\nsurgical site is clean and dry.\nCALF\nDIFFERENCE\n2 cm\nPROPHYLAXIS\nEnoxaparin\nVITAL\nSIGNS\nNormal\n• DIAGNOSTIC KEYWORDS\nMajor orthopedic surgery two\ndays ago + unilateral leg\npain and swelling + 2 cm calf\ndifference + breakthrough on\nprophylactic dose enoxaparin\n+ mother and maternal uncle\neach had a VTE in old age\nPROVOKED DEEP VEIN\nTHROMBOSIS OF THE RIGHT\nLOWER LIMB\n• REVISE\nHematology → Thrombosis and\nAnticoagulation\n• ANSWER\nStudy Smarter Hematology Cases Page 220\nA SWOLLEN CALF TWO DAYS AFTER FEMORAL\nREPAIR\nCASE 18\nProvoked versus unprovoked\nVTE\nWhen to test for thrombophilia\nDuration of anticoagulation\nWhat is the diagnosis, and why?\nWHY\n1\nDeep vein thrombosis of the right lower limb — recent\northopedic surgery is a major risk factor, making this a\nprovoked DVT, with unilateral leg swelling and pain and a 2\ncm difference in circumference\nMajor orthopedic surgery two days before → a major\ntransient risk factor — which makes this a provoked event\n2 cm calf circumference difference → an objective threshold in\nthe clinical probability scores\nClean, dry surgical site → argues against wound infection as\nthe cause of the swelling\nThrombosis despite prophylactic enoxaparin → prophylaxis\nreduces risk but does not abolish it after major orthopedic\nsurgery\n2 What are the recommended investigations?\nCompression duplex ultrasonography — the diagnostic gold\nstandard for proximal DVT\nD-dimer is useful when clinical suspicion is low, but likely not\nneeded here because the probability is high\nCBC to check for thrombocytosis or polycythemia, and a\ncoagulation profile (PT/INR, aPTT) to establish a baseline\nbefore therapeutic anticoagulation\n3 Is this case indicated for inherited thrombophilia screening?\nNo. Thrombophilia testing is not indicated in a patient who\ndevelops venous thromboembolism in the setting of a major\ntransient risk factor — major surgery, trauma or prolonged\nimmobility. The family history is also only weakly positive:\nboth events occurred with malignancy and old age\n4 What is your plan of management?\nEscalate enoxaparin to full therapeutic dose (1 mg/kg SC\nevery 12 hours), or start a direct oral anticoagulant such as\nrivaroxaban or apixaban; if kidney function is impaired use\nunfractionated heparin with aPTT monitoring\nPain and mobility — leg elevation, compression stockings after\nthe acute phase, continue oxycodone as needed. Duration of\nanticoagulation in provoked DVT is 3 months\nFollow up for thrombus resolution, bleeding, and signs of\npulmonary embolism; evaluate for inherited thrombophilia\nonly if unprovoked events occur in future", "questions": ["What is the diagnosis, and why?", "What are the recommended investigations?", "Is this case indicated for inherited thrombophilia screening?", "What is your plan of management?"], "topic": "h6", "sys": "HEMA"}, {"id": "c16", "kw": "Hb 19.5 with plethora + platelets and WBC also raised + ESR 3 + uric acid 8.4 + splenomegaly + previous DVT", "dx": "Polycythemia vera", "case": 215, "sheet": "Hematology · DEPBOOK CASE 221\n• CASE\nA 69-year-old patient presents with\nheadache and peripheral numbness.\nTwo years ago he developed deep\nvenous thrombosis of the right leg\nafter cholecystectomy, treated with\nwarfarin for three months with good\nrecovery.\nExamination: plethoric facies and\nsplenomegaly, with no manifestations\nof chronic liver disease.\nFACIES\nPlethoric\nSPLEEN\nEnlarged\nHISTORY\nDVT after\nsurgery\nLABORATORY\n↑ Hb 19.5 g/dL, numerous RBCs on\nfilm\n↑ WBC 16.6 × 10³/dL, platelets 550 ×\n10³/dL\n↑ Uric acid 8.4 mg/dL\n↓ ESR 3 mm/hour\nNormal: No abnormal or immature cells on\nthe film\n• DIAGNOSTIC KEYWORDS\nHb 19.5 with plethora + platelets\nand WBC also raised + ESR 3 +\nuric acid 8.4 + splenomegaly +\nprevious DVT\nPOLYCYTHEMIA VERA\n• REVISE\nHematology → Myeloproliferative\nNeoplasms\n• ANSWER\nStudy Smarter Hematology Cases Page 215\nPLETHORA, ITCH AND A HAEMOGLOBIN OF 19.5 CASE 13\nJAK2 and erythropoietin levels\nSecondary causes of polycythemia\nVenesection targets and risk groups\nWhat is the diagnosis, and why?\nWHY\n1\nA high haemoglobin with raised platelets, mild\nleukocytosis, a low ESR and raised uric acid indicating\nrapid cell turnover — all suggestive of polycythemia\nPolycythemia vera is a clonal myeloproliferative\nneoplasm in which the marrow produces red cells\nautonomously, independent of erythropoietin — which is\nwhy the erythropoietin level is subnormal rather than high,\nas it would be in a secondary polycythemia\nAll three lines raised, not red cells alone → a pan-myeloid picture means a primary marrow disorder, not\na secondary hypoxic drive\nESR 3 → a thick, hyperviscous blood — red cells barely\nsettle\nSplenomegaly with no chronic liver disease →\nextramedullary haemopoiesis, pointing to a\nmyeloproliferative neoplasm\nUric acid 8.4 → high cell turnover\nPrevious DVT and now headache with numbness →\nhyperviscosity and thrombosis — the danger of the disease\n2 What are the following investigations you can ask for?\nExclude secondary causes of polycythemia — oxygen\nsaturation, chest X-ray and echocardiography\nTo confirm polycythemia vera — serum erythropoietin\nlevel, JAK2 mutation, ± bone marrow biopsy with reticulin\nstain\nIn polycythemia vera there is a high red cell mass with\nnormal oxygen saturation, a subnormal erythropoietin,\nand JAK2 mutation present in 90% of cases\n3 How will you treat this patient?\nCytoreductive therapy — hydroxyurea or interferon alpha\n— as this patient is high risk (age, previous DVT). Low-risk\npatients (under 60, no thrombotic event, JAK2 negative)\nare not candidates for cytoreduction\nPeriodic phlebotomy (venesection) to a target hematocrit\nof < 45% in men, < 42% in women\nLow-dose aspirin to prevent thrombosis", "questions": ["What is the diagnosis, and why?", "What are the following investigations you can ask for?", "How will you treat this patient?"], "topic": "h7", "sys": "HEMA"}, {"id": "c17", "kw": "Massive splenomegaly with early satiety + WBC 80.8 with the FULL range of immature granulocytes + basophilia + platelets 600 + no blast crisis", "dx": "Chronic myeloid leukemia", "case": 212, "sheet": "Hematology · DEPBOOK CASE 218\n• CASE\nA 46-year-old man presents with fever,\nfatigue, early satiety and a feeling of\nfullness in his left side for 4 months.\nNo recent infection or bleeding.\nOn examination there was an enlarged\nspleen.\nSPLEEN\nEnlarged\nDURATION\n4 months\nINFECTION /\nBLEEDING\nNone\nLABORATORY\n↓ Hb 11.5 g/dL\n↑ WBC 80.8 × 10³/dL\n+ Myeloblasts, myelocytes,\nmetamyelocytes and basophilia\n↑ Platelets 600 × 10³/dL\n• DIAGNOSTIC KEYWORDS\nMassive splenomegaly with early\nsatiety + WBC 80.8 with the FULL\nrange of immature granulocytes\n+ basophilia + platelets 600 + no\nblast crisis\nCHRONIC MYELOID LEUKEMIA\n• REVISE\nHematology → Leukemias → Chronic\nMyeloid\n• ANSWER\nStudy Smarter Hematology Cases Page 212\nEARLY SATIETY WITH BASOPHILIA AT FORTY-SIX CASE 10\nPhiladelphia chromosome and BCR-ABL\nTyrosine kinase inhibitors\nPhases of CML\nWhat is the diagnosis, and why?\nWHY\n1\nChronic myeloid leukemia (CML) — splenomegaly with\nthe characteristic CBC. It is a myeloproliferative disorder\nwith increased proliferation of the granulocytic cell line\nwithout loss of the capacity to differentiate\nPeripheral blood shows neutrophilia with immature\nprecursors — early granulocyte forms but not blast cells\nMyelocytes and metamyelocytes present, but not a blast\nexcess → the cells differentiate — that is what makes it\nchronic rather than acute\nBasophilia → characteristic of CML, and not seen in a\nreactive leukocytosis\nEarly satiety and left-sided fullness → a spleen large\nenough to press on the stomach\nPlatelets raised, Hb only mildly low → marrow\noverproduction rather than failure\n2 How to confirm the diagnosis?\nIdentification of the Philadelphia chromosome by\ncytogenetic analysis or FISH; and detection of the BCR-ABL protein by PCR (molecular testing)\nBone marrow examination to evaluate the phase of the\ndisease\nPelvi-abdominal ultrasonography to assess splenomegaly\nSerum electrolytes, uric acid, LDH, liver and kidney\nfunction tests\n3 What is the treatment of choice for this disease?\nMolecular targeted therapy — a tyrosine kinase inhibitor\nsuch as imatinib\nReduce the total leucocytic count with hydroxyurea;\nallopurinol to prevent and treat hyperuricemia\nLeukapheresis in an emergency with severe leukocytosis\nsymptoms, for example priapism\nPegylated interferon may be used in some cases during\npregnancy", "questions": ["What is the diagnosis, and why?", "How to confirm the diagnosis?", "What is the treatment of choice for this disease?"], "topic": "h7", "sys": "HEMA"}, {"id": "c18", "kw": "Platelets 1200 + dusky extremities with paresthesia and headache + pruritus + epistaxis despite a high platelet count + palpable spleen, no anemia of inflammation", "dx": "Essential thrombocythemia", "case": 222, "sheet": "Hematology · DEPBOOK CASE 228\n• CASE\nA 53-year-old man presented with\nlow-grade fever, pruritus,\nheadache and paresthesia over\nthe past few months, with no past\nsignificant medical history.\nRecently he had 3 attacks of\nepistaxis over the last 2 weeks.\nExamination revealed dusky\nextremities and a just palpable\nspleen.\nEXTREMITIES\nDusky\nSPLEEN\nJust\npalpable\nEPISTAXIS\n3\nattacks /\n2 weeks\nLABORATORY\n↑ Platelets 1200 × 10³/dL (150–400)\n↓ Hb 11 g/dL, MCV 78 fL\nNormal: WBC 9 × 10³/dL with a normal\ndifferential (basophils 1%, eosinophils\n1%)\n• DIAGNOSTIC KEYWORDS\nPlatelets 1200 + dusky\nextremities with paresthesia\nand headache + pruritus +\nepistaxis despite a high\nplatelet count + palpable\nspleen, no anemia of\ninflammation\nESSENTIAL\nTHROMBOCYTHEMIA\n• REVISE\nHematology → Myeloproliferative\nNeoplasms\n• ANSWER\nStudy Smarter Hematology Cases Page 222\nPLATELETS OF 1200 WITH DUSKY FINGERS CASE 20\nPrimary versus secondary\nthrombocytosis\nJAK2 and BCR-ABL in the\nworkup\nAcquired von Willebrand disease\nWhat is the diagnosis, and why?\nWHY\n1\nEssential thrombocythemia — the most probable diagnosis,\ngiven the symptoms and splenomegaly with no anemia or\ninflammation\nBoth thrombosis and bleeding at once → dusky digits from\nmicrovascular occlusion while the nose bleeds — extreme\nthrombocytosis causes an acquired von Willebrand defect\nSplenomegaly → a clonal marrow disorder, not a reactive rise\nHb 11 with no inflammatory picture → nothing here to drive a\nreactive platelet rise\nPruritus with headache and paresthesia → the microvascular\nsymptom cluster of a myeloproliferative neoplasm\n2 What is the most probable differential diagnosis?\nThrombocytosis is either primary (essential thrombocythemia)\nor secondary — due to iron deficiency, infection, inflammation\nor malignancy\nWhat would be the diagnostic workup in evaluating this patient's\ncondition?\n3\nPersistent platelet count above 450 × 10³/dL\nIron profile and inflammatory markers such as C-reactive\nprotein\nBone marrow biopsy — megakaryocyte proliferation with\nlarge and mature morphology\nPhiladelphia chromosome and BCR-ABL to rule out chronic\nmyeloid leukemia\nJAK2 mutation, present in 50% of cases of essential\nthrombocythemia\n4 What are the complications of this condition?\nThrombotic events and bleeding — bleeding usually with\nextreme thrombocytosis above 1500 × 10³/dL, due to acquired\nvon Willebrand disease\n5 What is the main line of treatment for this condition?\nManage cardiovascular risk factors\nAspirin 81–100 mg daily, with caution in patients with\nacquired von Willebrand disease\nCytoreduction — hydroxyurea 10–30 mg/kg/day — in high-risk\npatients (age over 60, thrombotic event, JAK2 mutation)", "questions": ["What is the diagnosis, and why?", "What is the most probable differential diagnosis?", "What would be the diagnostic workup in evaluating this patient's condition?", "What are the complications of this condition?", "What is the main line of treatment for this condition?"], "topic": "h8", "sys": "HEMA"}, {"id": "c19", "kw": "Transfusion-dependent since infancy + ferritin 3,500 + Tanner stage II at 18 with low testosterone + systolic murmur + hepatosplenomegaly", "dx": "Beta thalassemia major with transfusional iron overload", "case": 218, "sheet": "Hematology · DEPBOOK CASE 224\n• CASE\nAn 18-year-old male diagnosed at\nage 1 with transfusion-dependent\nbeta thalassemia major, on\nregular transfusion every 3–4\nweeks since infancy. Complaints\nare fatigue, exertional dyspnea,\npalpitations, poor growth, delayed\npuberty and occasional joint pain.\nExamination: pale, mildly\njaundiced, hepatosplenomegaly,\nTanner stage II, systolic murmur.\nTANNER\nSTAGE\nII at age\n18\nTRANSFUSIONS\n3–4\nweekly\nsince\ninfancy\nHEART\nSystolic\nmurmur\nLABORATORY\n↓ Hb 9.2 g/dL post-transfusion\n↑ Ferritin 3,500 ng/mL\n↓ Low testosterone, borderline\nhypothyroidism\n• DIAGNOSTIC KEYWORDS\nTransfusion-dependent since\ninfancy + ferritin 3,500 +\nTanner stage II at 18 with low\ntestosterone + systolic\nmurmur +\nhepatosplenomegaly\nBETA THALASSEMIA MAJOR\nWITH TRANSFUSIONAL\nIRON OVERLOAD\n• REVISE\nHematology → Hemoglobinopathies\n→ Thalassemia\n• ANSWER\nStudy Smarter Hematology Cases Page 218\nEIGHTEEN YEARS OF TRANSFUSION, FERRITIN\n3500\nCASE 16\nIron chelation agents and doses\nMRI T2* for cardiac iron\nLuspatercept and gene therapy\nWhat is the diagnosis, and why?\nWHY\n1\nA classic thalassemia major with complications secondary to\niron overload from repeated transfusion — manifestations of\nchronic hemolytic anemia, delayed puberty and\ncardiomyopathy\nFerritin 3,500 after 17 years of transfusion → each unit\ncarries about 200 mg of iron and the body has no way to\nexcrete it — overload is inevitable without chelation\nTanner stage II at 18 with low testosterone → iron deposition\nin the pituitary and gonads\nSystolic murmur with palpitations and dyspnea → iron-induced cardiomyopathy on top of anemic high output\nBorderline hypothyroidism → iron in the thyroid — one gland\nof several\nPlease explain his presentation. What other complications are\nexpected?\n2\nIron overload affecting: cardiac — early iron-induced\ncardiomyopathy and anemic heart failure; hepatic — risk of\nfibrosis and cirrhosis; endocrine — hypogonadism,\nhypothyroidism, risk of diabetes; skeletal — osteopenia and\njoint pain; and growth delay from chronic anemia and\nendocrine dysfunction\nComplications of repeated transfusion — blood-borne\ninfection (hepatitis B, hepatitis C, HIV), febrile non-hemolytic\nreactions, allergic and hemolytic reactions, alloimmunization;\nand impaired quality of life, physical, psychological and social\n3 Please recommend a further plan of management.\nIron chelation, started when ferritin exceeds 1000 ng/mL —\ndeferasirox oral 20–40 mg/kg/day; deferoxamine, effective but\nSC or IV by infusion pump 20–40 mg/kg/day over 8–12 hours, 5–\n7 days a week; deferiprone oral 25 mg/kg three times daily\nMonitor iron burden — ferritin every 3 months is not\nperfectly reliable alone; always interpret it alongside MRI\niron quantification of liver and heart\nEndocrine support for hypogonadism; cardiac care with\nechocardiogram and follow-up; psychosocial support\nEmerging therapies — luspatercept, which enhances red cell\nmaturation and reduces transfusion need; gene therapy trials;\nand bone marrow transplantation, still curative for some,\nespecially with a matched donor", "questions": ["What is the diagnosis, and why?", "Please explain his presentation. What other complications are expected?", "Please recommend a further plan of management."], "topic": "h8", "sys": "HEMA"}], "bundle": "days/d3.json"}, "4": {"day": 4, "topics": "Cirrhosis · Portal hypertension & varices · SBP & hepatorenal · Hepatic encephalopathy · Acute liver failure · Acute & chronic hepatitis", "essays": [{"id": "e1", "q": "Hepatic encephalopathy – predisposing factors", "years": "2012–2015 · 2021 · 2023", "src": "Hep P11", "recent": false, "topic": "p4", "sys": "HEP", "answer": "", "text": "(Hep P11)\nHEP A TIC ENCEP HA LOP A THY\nHepatic encephalopathy: reversible neuropsychiatric syndrome in which gut-derived toxins, mainly ammonia, bypass a failing or shunted liver.\nPrecipitating factors\nConstipation\nGI hemorrhage\nTrauma & surgery\nSepsis & infection\nExcess dietary protein\nTransfusion of stored blood\nAlkalosis, hypokalemia & dehydration\nOpioids & sedatives\nProgression of liver disease / HCC\nClinical picture\nTypes Covert / minimal HE West Haven grades\nGrade I Grade II Grade III Grade IV\nCharacteristic signs: flapping tremor (asterixis) · fetor hepaticus (sweet, musty breath).\nStudy Smarter Hepatology · Past Papers Page 11\nMore time for intestinal bacteria to produce\nammonia\nBlood protein raised ammonia\nDecreased liver perfusion\nSBP\nUTI\nStored blood is ammonia-rich\nExcess diuretics\nVomiting / diarrhea\nLarge-volume paracentesis\nCNS depressants\nType A: acute liver failure\nType B: portosystemic\nbypass / shunt\nType C: cirrhosis\n(commonest): episodic,\nrecurrent, persistent\nNormal clinical\nexamination\nAbnormal psychometric\ntests\nOccurs in 30–50% of\ncirrhotics\nMay cause accidents\nShort attention\nspan\nEuphoria or anxiety\nPoor calculation\nLethargy\nDisorientation to\ntime\nPersonality change\nSomnolent but\nrousable\nConfused\nGrossly disoriented\nBizarre behavior\nComa"}, {"id": "e2", "q": "Cirrhosis – etiology & complications", "years": "2017 · 2022", "src": "Hep P1, P4", "recent": false, "topic": "p1", "sys": "HEP", "answer": "", "text": "(Hep P1)\nCAUS ES OF CI R R HOS I S & LIVER CE LL FA ILUR E\nCauses of liver cirrhosis\nMain causes\nOther causes (< 2%)\nAutoimmune / cholestatic\nDrugs\nMetabolic Biliary obstruction\nVenous outflow obstruction\nGranulomatous\nCauses of chronic liver cell failure\nStudy Smarter Hepatology · Past Papers Page 1\nHCV HBV NAFLD Alcohol\nAutoimmune hepatitis\nPBC\nPSC\nMethotrexate\nMethyldopa\nAmiodarone\nHemochromatosis\nWilson’s disease\nAlpha-1 antitrypsin deficiency\nGlycogen storage diseases\nPorphyria\nStone, stricture or tumor\nBiliary atresia\nCystic fibrosis\nBudd–Chiari syndrome\nVeno-occlusive disease\nRight heart failure cardiac cirrhosis\nSarcoidosis\nAny cause of cirrhosis: viral hepatitis B/C, NASH, alcohol, autoimmune hepatitis, hemochromatosis,\nWilson’s disease, cardiac cirrhosis, Budd–Chiari syndrome\nMalignant replacement of the liver\n\n(Hep P4)\nCOMP LICA TION S & TR EA TMEN T OF CI R R HOS I S\nComplications of cirrhosis\nPortal hypertension\nHepatocellular\ncarcinoma\nLiver failure\nOthers\nTreatment of cirrhosis / liver cell failure\nNutrition\nTreat complications\nTreat the cause\nAvoid precipitants\nLiver transplantation: treatment of choice in end-stage disease.\nChild–Pugh classification\nParameters Classes\nStudy Smarter Hepatology · Past Papers Page 4\nVarices and bleeding\nAscites ± SBP\nSplenomegaly and\nhypersplenism\n2–8% per year\nCoagulopathy\nHepatic encephalopathy\nHepatorenal syndrome\nHepatopulmonary\nsyndrome\nInfections: SBP, UTI\nHepatogenous diabetes\nNormal calories\nProtein 1–1.2 g/kg/day; 1.5 g/kg/day if\nmalnourished\nSalt restriction if ascites\nAscites & SBP\nVarices\nHepatic encephalopathy\nHepatorenal syndrome\nAntivirals\nStop alcohol\nSteroids: AIH\nChelation: copper in Wilson’s; iron in\nhemochromatosis\nSedatives\nNSAIDs\nAlbumin Bilirubin Coagulation: INR Distension: ascites Encephalopathy A: 5–6 B: 7–9 C: 10–15"}, {"id": "e3", "q": "Hepatic encephalopathy – treatment", "years": "2012–2015 · 2016", "src": "Hep P12", "recent": false, "topic": "p4", "sys": "HEP", "answer": "", "text": "(Hep P12)\nTR EA TMEN T OF HEP A TIC ENCEP HA LOP A THY\nNo response within 72 hours: search for a missed cause or precipitating factor.\nStudy Smarter Hepatology · Past Papers Page 12\n1 Supportive care\nCare of the unconscious patient\nExclude hypoglycemia, uremia, drugs and sepsis\n2 Correct precipitating factors\nStop sedatives & implicated diuretics\nCorrect hypokalemia\nTreat GI bleeding & infection\n3 Lactulose\nAcidifies colon decreased ammonia\nAim for 2–3 soft stools/day\nEnema if severe\nRifaximin 4\n550 mg twice daily\nAdd after a 2nd episode\nAlternatives: metronidazole or vancomycin\n5 Diet\nDo not starve of protein\nProtein 1.2–1.5 g/kg/day\nVegetable protein first\nAdequate carbohydrate\n6 Other measures\nL-ornithine L-aspartate\nZinc\nBranched-chain amino acids\n7 Liver transplantation\nFor recurrent or persistent hepatic encephalopathy"}, {"id": "e4", "q": "Portal hypertension – etiology", "years": "2012–2015 · 2016", "src": "Hep P5", "recent": false, "topic": "p2", "sys": "HEP", "answer": "", "text": "(Hep P5)\nPOR TA L HYP ER TEN S ION\nPortal hypertension: portal pressure 12 mmHg (normal 5–10 mmHg).\nCauses of portal hypertension\nPrehepatic Intrahepatic\nPre-sinusoidal Sinusoidal Post-sinusoidal\nPosthepatic\nClinical picture & complications\nPortosystemic collaterals\nHepatic encephalopathy\nSpleen\nPortal hypertensive gastropathy\nPeritoneum\nKidney & lung\nVarices are present in 40% of Child A and 85% of Child C patients.\nStudy Smarter Hepatology · Past Papers Page 5\nPortal vein thrombosis\nCongenital portal vein stenosis Schistosomiasis\nPBC\nGranulomas\nCirrhosis: commonest\nCongenital hepatic\nfibrosis\nIdiopathic\nBudd–Chiari syndrome\nVeno-occlusive\ndisease\nRight heart failure\nConstrictive pericarditis\nIVC thrombosis\nEsophageal & gastric varices bleeding\nCaput medusae\nSplenomegaly hypersplenism\nDecreased platelets and WBCs, anemia\nMosaic, red-spotted mucosa\nAscites SBP\nHepatorenal syndrome\nHepatopulmonary syndrome\nPortopulmonary syndrome"}, {"id": "e5", "q": "Liver cell failure – clinical picture", "years": "2018 · 2022", "src": "Hep P2", "recent": false, "topic": "p1", "sys": "HEP", "answer": "", "text": "(Hep P2)\nCLIN ICA L P ICTUR E OF CI R R HOS I S\nPresentation\nFeatures of liver cell failure\nGeneral\nSkin\nCirculation\nEndocrine\nHead\nNails\nBlood\nFluid retention\nAbdominal examination\nStudy Smarter Hepatology · Past Papers Page 2\nMay be asymptomatic and discovered during routine examination\nMay present with a complication: ascites, hematemesis, confusion or SBP\nAssociated conditions: gallstones, pancreatitis, parotid swelling, Dupuytren’s contracture and cramps\nFatigue\nWasting\nLow-grade fever < 38 °C\nSpider nevi\nPalmar erythema\nPaper-money skin\nLoss of body hair\nHyperdynamic circulation: warm\nhands, bounding pulse\nCyanosis in hepatopulmonary\nsyndrome\nMales: gynecomastia, testicular\natrophy, impotence\nFemales: amenorrhea, breast atrophy\nDiabetes\nJaundice: usually mild in\ncirrhosis\nFetor hepaticus\nConfusion\nFlapping tremor\nLeukonychia\nClubbing\nBruising and bleeding\nAnemia\nAscites\nLeg edema\nFirm, sharp-edged liver (may shrink\nlate)\nSplenomegaly Ascites Caput medusae Umbilical hernia"}, {"id": "e6", "q": "Etiology of acute fulminant hepatic failure", "years": "2012–2015 · 2017", "src": "Hep P13", "recent": false, "topic": "p5", "sys": "HEP", "answer": "", "text": "(Hep P13)\nACUTE LIVER FA ILUR E : CAUS ES\nAcute liver failure: acute liver injury with encephalopathy and coagulopathy in a patient with no previous liver disease, usually within 1–4 weeks and up to 24 weeks.\nCauses of acute fulminant hepatic failure\nViral Drugs & toxins Autoimmune & vascular\nOther causes\nPregnancy-related &\nmetabolic\nReye’s syndrome\nAcute fatty liver of pregnancy usually occurs in the 3rd trimester and requires immediate delivery.\nStudy Smarter Hepatology · Past Papers Page 13\nHepatitis A\nHepatitis B ± D\nHepatitis E: especially in\npregnancy\nCMV\nEBV\nAcetaminophen /\nparacetamol\nHalothane\nINH\nValproate\nHalohydrocarbons\nAutoimmune hepatitis\nBudd–Chiari syndrome\nSepticemia\nCryptogenic: worst prognosis\nAcute fatty liver of pregnancy\nWilson’s disease\nChild + aspirin + viral illness\nAbout 50% die from cerebral\nedema"}, {"id": "e7", "q": "Causes of acute hepatitis", "years": "2020 · 2022", "src": "Hep P16", "recent": false, "topic": "p6", "sys": "HEP", "answer": "", "text": "(Hep P16)\nACUTE HEP A TITI S · HEP A TITI S A\nCauses of acute hepatitis\nViral Drugs & toxins Autoimmune & metabolic Vascular & other\ninfections\nHepatitis A: etiology & clinical picture\nEtiology Clinical picture\nDiagnosis: IgM anti-HAV.\nStudy Smarter Hepatology · Past Papers Page 16\nHepatitis A–E: HAV commonest, then\nHBV\nEBV\nCMV\nHSV\nYellow fever\nParacetamol\nINH\nHalothane\nValproate\nPhenytoin\nAlcohol\nAutoimmune hepatitis: young\npatients\nWilson’s disease\nAcute fatty liver of pregnancy\nBudd–Chiari syndrome\nIschemic / shock hepatitis\nLeptospirosis\nToxoplasmosis\nRNA virus\nFeco-oral transmission via\ncontaminated food & water\nIncubation: 2–6 weeks\nChildren & young adults; may\noccur in outbreaks\nNo carrier state\nNo chronicity\nOften mild or anicteric in children\nTypical icteric illness in adults\nProlonged cholestasis is more common with HAV\nFulminant failure is rare\nFull recovery usually occurs within 6 months"}, {"id": "e8", "q": "Indications & complications of abdominal paracentesis", "years": "2021 — first time", "src": "Hep P9 · Symptomatology P44–46", "recent": true, "topic": "p3", "sys": "HEP", "answer": "", "text": "(Hep P9)\nP A R ACEN TES I S · S PON TAN EOUS B ACTER IA L P ER ITON ITI S\nAbdominal paracentesis\nIndications\nDiagnostic\nTherapeutic\nPrevention of complications\nComplications\nLocal\nSystemic\nImportant ascitic-fluid findings\nSpontaneous bacterial peritonitis\nDefinition: ascitic-fluid infection without a surgically treatable intra￾abdominal source, in advanced cirrhosis. Gut bacterial translocation: E.\ncoli, Klebsiella.\nWhen to suspect\nPrevention\nDiagnosis\nTreatment\nWho receives prophylaxis?\nPrimary Secondary\nStudy Smarter Hepatology · Past Papers Page 9\nNew-onset ascites\nSuspected SBP: fever, pain,\nworsening ascites, encephalopathy,\nrenal decline\nCirrhotic patient with ascites\nadmitted to hospital\nTense ascites: dyspnea, discomfort,\nearly satiety\nRefractory ascites\nAlbumin 8 g per liter removed\nUltrasound guidance\nPain\nHematoma\nPersistent leak\nInfection\nBowel / bladder puncture\nCirculatory dysfunction\nhypotension / shock\nRenal impairment / HRS\nHyponatremia\nEncephalopathy\nSAAG 1.1 portal hypertension\nPMN > 250/mm³ SBP\nProtein < 1 g/dL SBP risk\nLymphocytes TB / malignancy\nTG > 200 mg% chylous ascites\nRaised amylase pancreatic\nascites\nCytology malignancy\nFever\nAbdominal pain\nHypotension\nEncephalopathy\nNew diuretic resistance\nNorfloxacin 400 mg daily, or\nciprofloxacin 250 mg daily\nParacentesis before antibiotics\nAscitic PMN 250/mm³\nCulture in blood-culture\nbottles at the bedside\nCefotaxime 2 g IV every 8 h, or\nciprofloxacin\nDuration: 5–10 days\nAlbumin: 1.5 g/kg on day 1, then\n1 g/kg on day 3\nAscitic protein < 1 g/dL\n< 1.5 g/dL with renal\nimpairment or Child C\nGI bleeding\nEveryone after an SBP\nepisode"}], "cases": [{"id": "c1", "kw": "HCV for 10 years, complicated by cirrhosis + no hematemesis, no encephalopathy + attends specifically for antiviral treatment", "dx": "HCV-related liver cirrhosis, clinically compensated", "case": 100, "sheet": "Hepatology · DEPBOOK CASE 106\n• CASE\nA 47-year-old married female patient\nknown to be infected with HCV for 10\nyears, which was complicated with liver\ncirrhosis.\nThe patient had no history of\nhematemesis or hepatic encephalopathy.\nShe presented to the hepatology clinic for\nHCV treatment.\nHCV\nDURATION\n10 years\nCIRRHOSIS\nEstablished\nDECOMPENSATION\nNone\nreported\n• DIAGNOSTIC KEYWORDS\nHCV for 10 years, complicated by\ncirrhosis + no hematemesis, no\nencephalopathy + attends\nspecifically for antiviral treatment\nHCV-RELATED LIVER CIRRHOSIS,\nCLINICALLY COMPENSATED\n• REVISE\nHepatobiliary System & Pancreas → Chronic\nHepatitis / Liver Cirrhosis\n• ANSWER\nStudy Smarter Hepatology Cases Page 100\nHCV CIRRHOSIS PRESENTING FOR ANTIVIRAL\nTREATMENT\nCASE 2\nChild-Pugh staging and its components\nDAAs in decompensated cirrhosis\nHCC surveillance after SVR\nWhat is the diagnosis, and why?\nWHY\n1\nHCV-related liver cirrhosis, and on this history clinically\ncompensated\nTen years of HCV with established cirrhosis → the\nexpected natural history of untreated chronic infection\nNo hematemesis → no bleed from varices yet — but\nthat does not mean she has none\nNo hepatic encephalopathy → no clinical\ndecompensation\nShe is here for treatment, not for a complication →\ncirrhosis changes what must be assessed first, and\nwhich drugs are safe\n2 What is the next step?\nAssess the cirrhosis for severity (Child-Pugh stage)\nand for complications:\nClinical — stigmata of liver cell failure\nLaboratory — CBC, liver function, PT and PC, molecular\nassays to confirm and quantify HCV RNA, alpha\nfetoprotein, serum creatinine, and HBsAg to exclude co-infection\nAbdominal ultrasonography and upper endoscopy for\nesophageal varices\n3 Is this patient candidate for HCV treatment?\nYes. The regimens for genotype 4 are the same for\ntreatment-naive patients without cirrhosis and for those\nwith compensated Child-Pugh A cirrhosis —\nsofosbuvir/velpatasvir, glecaprevir/pibrentasvir,\nsofosbuvir/ledipasvir, grazoprevir/elbasvir\nProtease inhibitors are contraindicated in Child-Pugh\nB and C decompensated cirrhosis — drug exposure is\nsubstantially higher and carries toxicity in these patients\nIs there a need for post sustained virologic response (SVR)\nsurveillance?\n4\nYes. Even after SVR, surveillance for HCC by abdominal\nultrasound and AFP must be performed in patients with\nadvanced fibrosis (METAVIR F3) and cirrhosis", "questions": ["What is the diagnosis, and why?", "What is the next step?", "Is this patient candidate for HCV treatment?", "Is there a need for post sustained virologic response (SVR) surveillance?"], "topic": "p1", "sys": "HEP"}, {"id": "c2", "kw": "Six months of tiredness + weight gain from fluid + jaundice, edema and shifting dullness + impalpable liver with big spleen + K 2.5 and Na 129 after frusemide", "dx": "Liver cirrhosis with ascites and diuretic-induced electrolyte loss", "case": 111, "sheet": "Hepatology · DEPBOOK CASE 117\n• CASE\nA 59-year-old retired accountant was\nadmitted with a 6 months history of\nincreasing tiredness and lethargy and 2\nmonths history of poor appetite. His\nweight was increasing in the last few\nweeks. There was no history of chest pain,\ncough or expectoration. He was started\non frusemide 3 weeks ago but this in fact\nhad worsened his tiredness.\nExamination: alert, with jaundice and\nbilateral lower limb pitting edema.\nAbdomen revealed shifting dullness. Liver\nwas not palpable and spleen was\nmoderately enlarged.\nLABORATORY\n↓ K 2.5 mEq/L (3.5–5.0)\n↓ Na 129 mEq/L (135–145)\n↓ Serum albumin 2.5 g/dL (3.5–5.2)\n↑ Bilirubin 2.3, direct 1.1 mg/dL (< 1.2)\n↑ ALT 120, AST 130 U/L (< 40)\n• DIAGNOSTIC KEYWORDS\nSix months of tiredness + weight\ngain from fluid + jaundice, edema\nand shifting dullness + impalpable\nliver with big spleen + K 2.5 and Na\n129 after frusemide\nLIVER CIRRHOSIS WITH ASCITES\nAND DIURETIC-INDUCED\nELECTROLYTE LOSS\n• REVISE\nHepatobiliary System & Pancreas → Liver\nCirrhosis\n• ANSWER\nStudy Smarter Hepatology Cases Page 111\nTIREDNESS THAT WORSENED AFTER STARTING\nFRUSEMIDE\nCASE 13\nCauses of cirrhosis in Egypt\nDiuretics in ascites and their hazards\nWork up for the etiology of cirrhosis\nWhat is the diagnosis, and why?\nWHY\n1\nLiver cirrhosis\nJaundice, ascites and leg edema together →\ndecompensated chronic liver disease\nLiver not palpable but spleen enlarged → a shrunken\nfibrotic liver with portal hypertension — the classic\ncombination in cirrhosis\nAlbumin 2.5 g/dL → failed hepatic protein synthesis —\nand the reason for the oedema\nWeight increasing while appetite is poor → the gain is\nfluid, not nutrition\nTiredness worse after frusemide, with K 2.5 → the\ntreatment caused the deterioration — diuretic-induced\nhypokalemia\n2 List the most important causes of such a disease in Egypt?\nSteatosis and chronic viral hepatitis, especially chronic\nHCV and HBV\nLess common — chronic autoimmune hepatitis,\nWilson's disease, drug induced liver injury and\nhemochromatosis\n3 Explain the laboratory findings in view of your diagnosis?\nHypokalemia and hyponatremia, mostly drug induced\nby the frusemide. Both increased the sense of tiredness\nhe has\nHypoalbuminemia is due to failure of protein synthesis\nin the cirrhotic failing liver\nElevated transaminases mean the process of liver\ndamage is still going on\nHyperbilirubinemia is due to failure of the excretory\nfunction\nWhat investigations would you like to do to define the\netiology of this condition?\n4\nMarkers of HCV and HBV\nAutoimmune antibodies — ANA, ASMA, LKMA, SLA/LP\n24-hour urinary copper excretion, to exclude Wilson's\ndisease\nUltrasonography may help diagnose a vascular etiology\n— Budd-Chiari, veno-occlusive disease", "questions": ["What is the diagnosis, and why?", "List the most important causes of such a disease in Egypt?", "Explain the laboratory findings in view of your diagnosis?", "What investigations would you like to do to define the etiology of this condition?"], "topic": "p1", "sys": "HEP"}, {"id": "c3", "kw": "Untreated chronic HCV for 3 years + jaundice, spider nevi and new ascites + AFP 2,000 + ALP 500 + albumin 2.8 with INR 2", "dx": "HCV cirrhosis complicated by hepatocellular carcinoma", "case": 117, "sheet": "Hepatology · DEPBOOK CASE 123\n• CASE\nA 57-year-old male presents with\nincreasing abdominal girth, abdominal\ndiscomfort and tiredness. He was\ndiagnosed as having chronic HCV\nhepatitis 3 years ago but received only\nsupportive hepatotropic treatment.\nExamination: he is jaundiced with several\nspider nevi. There is no asterixis. Pulse 80\nbpm, BP 135/75. Abdomen reveals mild\ntenderness in the right hypochondrium\nwithout organomegaly but there is\nshifting dullness.\nLABORATORY\n↑ Alpha-fetoprotein 2,000 IU/L (< 10)\n↑ Alkaline phosphatase 500 U/L (40–130)\n↑ Bilirubin 3.5 mg/dL, INR 2 (< 1.2 each)\n↓ Albumin 2.8 g/dL (3.5–5.2)\n• DIAGNOSTIC KEYWORDS\nUntreated chronic HCV for 3 years\n+ jaundice, spider nevi and new\nascites + AFP 2,000 + ALP 500 +\nalbumin 2.8 with INR 2\nHCV CIRRHOSIS COMPLICATED BY\nHEPATOCELLULAR CARCINOMA\n• REVISE\nHepatobiliary System & Pancreas → Liver\nTumors\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 117\nAN ALPHA-FETOPROTEIN OF TWO THOUSAND CASE 19\nHCC: surveillance and AFP\nTriphasic CT — arterial enhancement\nand washout\nDecompensation of cirrhosis\nWhat is the diagnosis, and why?\nWHY\n1\nLiver cirrhosis due to chronic HCV hepatitis, mostly\ncomplicated by hepatocellular carcinoma (HCC)\nSpider nevi, jaundice, ascites, albumin 2.8, INR 2 →\nestablished decompensated cirrhosis\nUntreated HCV for 3 years → the cause — and\nsupportive hepatotropic treatment is not antiviral\ntreatment\nAlpha-fetoprotein 2,000 IU/L → far beyond anything\ncirrhosis alone produces — this is a tumour marker\nAlkaline phosphatase 500 → a very high ALP points to\nan infiltrative process, such as malignancy\nSudden decompensation after 3 stable years → a new\ncomplication has supervened on the cirrhosis\n2 What diagnostic test(s) would confirm the diagnosis?\nImaging studies — abdominal ultrasound and contrast-enhanced triphasic CT. The latter shows increased\nenhancement of the mass in the arterial phase and\nrapid washout in the venous phase\nContrast-enhanced dynamic MRI is an alternative,\nespecially for patients with an allergy to iodinated\ncontrast\nRegenerative nodule — no arterial enhancement, no washout\nLiver metastases — multiple lesions, a known primary, normal\nAFP\nLiver abscess — fever, leucocytosis, cystic on imaging", "questions": ["What is the diagnosis, and why?", "What diagnostic test(s) would confirm the diagnosis?"], "topic": "p1", "sys": "HEP"}, {"id": "c4", "kw": "Boy of 14 + jaundice with abnormal limb movements + sister died of the same illness + ascites and edema + INR 2.5 with albumin 3", "dx": "Wilson's disease", "case": 123, "sheet": "Hepatology · DEPBOOK CASE 129\n• CASE\nA 14-year-old boy presents with\nyellowish sclera, fatigue and abnormal\nupper limb movements.\nFamily history reveals his sister had\nsimilar symptoms and died.\nExamination: jaundiced, mild lower limb\nedema, shifting dullness and abnormal\nlimb movements.\nAGE\n14\nFAMILY\nHISTORY\nSister died,\nsame\nillness\nNEUROLOGY\nAbnormal\nlimb\nmovements\nLABORATORY\n↑ AST 556, ALT 678 U/L (< 40)\n↑ Bilirubin 3.5, direct 2.8 mg/dL (< 1.2)\n↑ INR 2.5 (< 1.2)\n↓ Albumin 3 g/dL (3.5–5.2)\n• DIAGNOSTIC KEYWORDS\nBoy of 14 + jaundice with abnormal\nlimb movements + sister died of the\nsame illness + ascites and edema +\nINR 2.5 with albumin 3\nWILSON'S DISEASE\n• REVISE\nHepatobiliary System & Pancreas →\nWilson's Disease\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 123\nA BOY WITH JAUNDICE AND ABNORMAL LIMB\nMOVEMENTS\nCASE 25\nWilson's disease: hepatic and\nneurological forms\nCeruloplasmin, urinary copper, KF rings\nChelators, zinc and transplantation\nWhat is the diagnosis, and why?\nWHY\n1\nWilson's disease — an autosomal recessive disorder of\ncopper metabolism leading to liver and neurologic\ndamage\nLiver disease and a movement disorder together in one\npatient → copper deposits in both the liver and the\nbasal ganglia\nA sister with the same illness who died → an affected\nsibling — the pattern of autosomal recessive inheritance\nAge 14 → hepatic Wilson's typically presents in\nchildhood and adolescence\nAscites, edema, albumin 3, INR 2.5 → decompensated\nchronic liver disease — at an age where cirrhosis is\notherwise rare\n2 What further investigations should be done?\nSerum ceruloplasmin — low\n24-hour urinary copper — high\nSlit-lamp examination for Kayser-Fleischer rings\nLiver biopsy to measure hepatic copper content — > 250\nmcg/g dry weight\n3 What is the treatment of this condition?\nCopper chelators — D-penicillamine or trientine\nSupportive care for the acute liver dysfunction\nZinc as maintenance therapy\nLiver transplant in fulminant or decompensated cases\nAutoimmune hepatitis — raised IgG, ANA/ASMA positive, no\nmovement disorder\nChronic viral hepatitis — positive HBV or HCV serology\nAlpha-1 antitrypsin deficiency — low A1AT level, lung disease", "questions": ["What is the diagnosis, and why?", "What further investigations should be done?", "What is the treatment of this condition?"], "topic": "p1", "sys": "HEP"}, {"id": "c5", "kw": "Fresh hematemesis with 3 days of melena + 3 previous attacks of jaundice + jaundice and pallor + firm liver with 4-finger splenomegaly + spider nevi", "dx": "Variceal bleeding from portal hypertension in liver cirrhosis", "case": 119, "sheet": "Hepatology · DEPBOOK CASE 125\n• CASE\nA 42-year-old male presents to the ER\nwith one day history of vomiting of fresh\nblood. He also reported passing black\ntarry stools for the last 3 days and\nfeeling generally unwell for the last 6\nweeks. He gives history of previous 3\nattacks of jaundice.\nExamination: jaundiced and pale. Pulse\n110 bpm, BP 110/70. Abdomen showed\npalpable liver 2 cm below the costal\nmargin and firm in consistency, spleen 4\nfingers below the left costal margin, and\nfew spider nevi on the chest and back.\nPULSE\n110 bpm\nBLOOD\nPRESSURE\n110/70\nSPIDER NEVI\nPresent\n• DIAGNOSTIC KEYWORDS\nFresh hematemesis with 3 days of\nmelena + 3 previous attacks of\njaundice + jaundice and pallor +\nfirm liver with 4-finger\nsplenomegaly + spider nevi\nVARICEAL BLEEDING FROM\nPORTAL HYPERTENSION IN LIVER\nCIRRHOSIS\n• REVISE\nHepatobiliary System & Pancreas → Portal\nHypertension\n• ANSWER\nStudy Smarter Hepatology Cases Page 119\nFRESH HEMATEMESIS WITH A FIRM LIVER AND\nBIG SPLEEN\nCASE 21\nVariceal bleeding: banding and\nsclerotherapy\nCauses of upper GI bleeding\nMelena and the ligament of Treitz\nWhat is the diagnosis, and why?\nWHY\n1\nHematemesis and melena due to vascular\ndecompensation of liver cirrhosis — the bleeding is\nmost probably from portal hypertension and variceal\nhemorrhage\nFirm liver with 4-finger splenomegaly and spider nevi\n→ established cirrhosis with portal hypertension\nThree previous attacks of jaundice → repeated hepatic\ninsults over years — the route to cirrhosis\nFresh blood vomited, in volume → a high-pressure\narterial-like bleed, as varices give\nMelena for 3 days preceding it → bleeding had been\ngoing on before it became overt\n2 List 3 common causes of such condition?\nEsophageal and gastric varices; peptic ulcer; gastritis\nsecondary to NSAIDs\nLess common — esophageal or gastric malignancy, and\ntelangiectasia\n3 What is the cause of black tarry stools?\nBlack tarry stool is termed melena and is due to the\npassage of digested blood (acid hematin) in stools\nThe site of bleeding is upper GIT, above the ligament of\nTreitz\nRarely, ileal and right colonic lesions with slow transit\ncan present the same way\n4 What is the priority in the management of this patient?\nManagement of the GI bleeding by resuscitation\nUpper endoscopy is mandatory — it is not only\ndiagnostic but also therapeutic, through sclerotherapy\nand endoscopic band ligation\n5 What investigations would you order for this patient?\nBeside upper endoscopy — abdominal US to confirm\ncirrhosis\nLiver function tests including albumin and INR to\nassess synthetic function\nInvestigations for the etiology (viral markers) and for\ncomplications (alpha-fetoprotein for HCC)", "questions": ["What is the diagnosis, and why?", "List 3 common causes of such condition?", "What is the cause of black tarry stools?", "What is the priority in the management of this patient?", "What investigations would you order for this patient?"], "topic": "p2", "sys": "HEP"}, {"id": "c6", "kw": "Four weeks of progressive abdominal swelling + old blood transfusion + jaundice with shifting dullness + albumin 2.8 with PC 45% + platelets 78 and Na 129", "dx": "Ascites from portal hypertension complicating hepatic cirrhosis", "case": 109, "sheet": "Hepatology · DEPBOOK CASE 115\n• CASE\nA 49-year-old female presents to the ER\nwith a 4 weeks history of progressive\nabdominal swelling and discomfort. She\nhas no other GI symptoms. Medical history\nis significant only for three pregnancies,\none of which was complicated by\nexcessive blood loss, requiring a blood\ntransfusion.\nExamination: temperature 37°C, pulse 88\nbpm, BP 95/60. She has jaundice.\nAbdomen is distended, with mild diffuse\ntenderness, hypoactive bowel sounds\nand shifting dullness. There is mild\nperipheral edema.\nLABORATORY\n↓ Serum Na 129 mEq/L (135–145)\n↓ Albumin 2.8 g/dL, PC 45% (3.5–5.2 / >\n70%)\n↑ Total bilirubin 4 mg/dL (< 1.2)\n↓ Platelets 78 × 10⁹/L (150–400)\nNormal: Hb 12 g/dL, temperature\n• DIAGNOSTIC KEYWORDS\nFour weeks of progressive\nabdominal swelling + old blood\ntransfusion + jaundice with shifting\ndullness + albumin 2.8 with PC 45%\n+ platelets 78 and Na 129\nASCITES FROM PORTAL\nHYPERTENSION COMPLICATING\nHEPATIC CIRRHOSIS\n• REVISE\nHepatobiliary System & Pancreas → Ascites\n• ANSWER\nDON'T CONFUSE WITH\nStudy Smarter Hepatology Cases Page 109\nFOUR WEEKS OF ABDOMINAL SWELLING AFTER\nAN OLD TRANSFUSION\nCASE 11\nAscites: pathogenesis and SAAG\nLiver cirrhosis and hypersplenism\nDiagnostic paracentesis and SBP\nWhat is the diagnosis, and why?\nWHY\n1\nAscites caused by portal hypertension, as a\ncomplication of hepatic cirrhosis\nShifting dullness with a distended abdomen → free\nfluid — ascites\nAlbumin 2.8 and prothrombin concentration 45% →\nboth are synthesised by the liver — failing synthetic\nfunction means chronic disease\nPlatelets 78 → hypersplenism from portal hypertension\n— the spleen sequesters them\nJaundice with bilirubin 4 → a decompensated liver\nfailing its excretory function\nA transfusion during an obstetric haemorrhage → the\nlikely route of viral hepatitis, decades earlier\n2 Explain laboratory findings in this patient?\nLow albumin and low prothrombin concentration refer\nto the chronicity of the liver pathology\nIncreased total bilirubin indicates a decompensated\nliver, which clinically leads to jaundice\nHyponatremia, which may be due to the use of diuretics\nHypokalemia is manifested clinically by the hypoactive\nbowel sounds\nThrombocytopenia is mostly due to hypersplenism\n3 What is your next step?\nAbdominal ultrasonography to confirm the diagnosis\nParacentesis to analyse the ascitic fluid, determine the\npossible etiology and exclude spontaneous bacterial\nperitonitis\nInvestigations to detect the cause of the cirrhosis —\nmarkers for viral hepatitis (HBV and HCV), autoimmune\nprofile (ANA, ASMA, anti-LKM, anti-SLA/LP), and 24-\nhour urinary copper excretion\nCardiac ascites — raised JVP with a positive hepatojugular reflux\nNephrotic syndrome — heavy proteinuria, normal prothrombin\nTuberculous peritonitis — SAAG < 1.1, lymphocytic fluid", "questions": ["What is the diagnosis, and why?", "Explain laboratory findings in this patient?", "What is your next step?"], "topic": "p2", "sys": "HEP"}, {"id": "c7", "kw": "Two months of progressive abdominal distension + fever 38°C with a diffusely tender abdomen + jaundice + leucocytosis 15 with platelets 78 + albumin 2.8 with prolonged PT", "dx": "Cirrhosis with ascites complicated by spontaneous bacterial peritonitis", "case": 120, "sheet": "Hepatology · DEPBOOK CASE 126\n• CASE\nA 40-year-old female presents\ncomplaining of 2 months history of\nprogressive abdominal distension with\nno change in appetite or bowel habits\nand no other GIT symptoms.\nExamination: she was icteric,\ntemperature 38°C, with no lower limb\nedema. Chest and heart showed no\nabnormality. The abdomen was distended\nwith diffuse tenderness and shifting\ndullness.\nTEMPERATURE\n38°C\nABDOMEN\nDiffusely\ntender\nSHIFTING\nDULLNESS\nPresent\nLABORATORY\n↓ Hb 11 g/dL, platelets 78 × 10⁹/L (12–15 /\n150–400)\n↑ TLC 15 × 10⁹/L (4–11)\n↑ Bilirubin 4.0, direct 2.0 mg/dL (< 1.2)\n↓ Albumin 2.8 g/dL, PT 15 s (3.5–5.2 / 11–\n13)\n• DIAGNOSTIC KEYWORDS\nTwo months of progressive\nabdominal distension + fever 38°C\nwith a diffusely tender abdomen +\njaundice + leucocytosis 15 with\nplatelets 78 + albumin 2.8 with\nprolonged PT\nCIRRHOSIS WITH ASCITES\nCOMPLICATED BY SPONTANEOUS\nBACTERIAL PERITONITIS\n• REVISE\nHepatobiliary System & Pancreas → Ascites\n• ANSWER\nStudy Smarter Hepatology Cases Page 120\nFEVER AND A TENDER ABDOMEN IN A CIRRHOTIC\nWITH ASCITES\nCASE 22\nSBP: the 250 PMN rule\nDiagnostic paracentesis technique\nHepatorenal syndrome after SBP\nWhat is the diagnosis, and why?\nWHY\n1\nLiver cirrhosis with ascites, complicated by\nspontaneous bacterial peritonitis (SBP) — because of\nfever and abdominal tenderness in a cirrhotic patient\nAlbumin 2.8 with a prolonged PT and platelets 78 →\nfailing synthesis plus hypersplenism — cirrhosis with\nportal hypertension\nShifting dullness with 2 months of distension →\nascites\nFever 38°C with diffuse abdominal tenderness → the\nascitic fluid has become infected\nTLC 15 → a systemic inflammatory response\nNo lower limb edema despite ascites → the fluid is not\nsimply from hypoalbuminemia — portal hypertension\ndrives it\n2 What further investigations should be
