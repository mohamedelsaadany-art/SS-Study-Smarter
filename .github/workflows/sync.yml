name: Daily artifact sync
on:
  schedule:
    # Hourly 05:00-10:00 Cairo (UTC+3 now; shifts to 04:00-09:00 when Egypt ends DST). Stops for the day after the first update.
    - cron: "0 2-7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Already updated today?
        id: check
        run: |
          today=$(TZ=Africa/Cairo date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && TZ=Africa/Cairo git log -n 50 --date=format-local:%F --format='%cd %s' | grep -q "^$today Auto-update"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Already updated today, skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.skip == 'false'
        run: pip install playwright && playwright install --with-deps chromium
      - name: Fetch artifact
        if: steps.check.outputs.skip == 'false'
        run: xvfb-run -a python scripts/fetch_artifact.py
      - name: Commit if changed
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "mohamedelsaadany-art"
          git config user.email "mohammad.al.saadany818@gmail.com"
          git add index.html
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Auto-update $(TZ=Africa/Cairo date +%F)"
          git push
